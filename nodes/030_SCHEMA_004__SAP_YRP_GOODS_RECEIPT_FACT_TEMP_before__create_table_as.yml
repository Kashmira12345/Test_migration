metadata:
  override:
    create:
      enabled: true
      script: "CREATE OR REPLACE TABLE SCHEMA_004.SAP_YRP_GOODS_RECEIPT_FACT_TEMP_before AS\nSELECT \n\
        MD5(REGEXP_REPLACE(REGEXP_REPLACE(TO_VARCHAR(ARRAY_CONSTRUCT_COMPACT(src.mblnr, src.bukrs, src.mjahr,\
        \ src.zeile, 'SOURCE_SYSTEM_001', 'INSTANCE_001')), ',', '|'), '[][\"]', '')) AS grn_document_nbr_sk\n\
        \t,ssd.source_system_sk AS source_system_sk\n\t,src.mblnr AS grn_doc_item_nbr_id\n\t--,src.journal_entry\
        \ AS journal_entry_nbr_id\n\t,src.blart AS gr_document_type_cd\n\t--,src.bschl AS posting_key_nbr_id\n\
        \t--,src.reference AS reference_document_nbr_id\n\t,src.tcode2 AS transaction_cd\n\t,src.usnam\
        \ AS user_nm\n\t--,src.hkont AS glaccount_nbr_id\n\t--,src.augdt AS clearing_dt\n\t--,src.augbl\
        \ AS clearing_document_nbr_id\n\t--,src.zuonr AS assignment_nbr_id \n\t--,src.pswsl AS local_currency_cd\n\
        \t,srd.source_cd AS source_system_cd\n\t,src.mandt AS client_details_nbr\n\t,src.bukrs AS entity_cd\n\
        \t,src.zeile AS line_item_id\n\t,src.cpudt AS receipt_entry_dt\n\t,src.budat AS receipt_posting_dt\n\
        \t--,NULL AS invoiced_quantity_nbr\n\t,src.bwart AS movement_type_cd\n\t,src.erfmg AS goods_quantity_nbr\n\
        \t,src.bldat AS grn_doc_creation_dt\n\t,src.charg AS item_batch_nbr_id\n\t,src.price_per_unit_amt\
        \ AS price_per_unit_amt\n\t,'N/A' AS quality_status_cd\n\t,src.lifnr AS source_supplier_nbr_id\n\
        \t,src.matnr AS source_item_nbr_id\n\t,src.werks AS source_location_cd\n\t,id.item_nbr_sk AS item_nbr_sk\n\
        \t,sd.supplier_nbr_sk AS supplier_nbr_sk\n\t,ld.location_cd_sk AS location_cd_sk\n\t,ed.entity_sk\
        \ AS entity_sk\n\t,src.butxt AS entity_nm\n\t,src.btext AS movement_type_nm\n\t--,NULL AS quality_status_nm\n\
        \t,src.name1 AS source_location_nm\n\t,src.ltext AS po_cost_center_nm\n\t,src.ebeln AS po_nbr_id\n\
        \t,src.ebelp AS po_line_item_id\n\t--,src.invoice_nbr AS invoice_nbr_id\n\t--,src.buzei AS invoice_line_item_id\n\
        \t,src.kostl AS po_cost_center_cd\n\t,src.maktx AS source_item_nm\n\t,src.maktx AS source_item_dsc\n\
        \t,src.eindt AS asn_promise_dt\n\t,src.eindt AS requested_delivery_dt\n\t--,SRC.PRCTR AS PROFIT_CENTER_CD\n\
        \t,to_timestamp(date_part(epoch_second, CURRENT_TIMESTAMP())) AS create_ts\n\t,to_timestamp(date_part(epoch_second,\
        \ CURRENT_TIMESTAMP())) AS last_updt_ts\n\t,src.snowflake_ingested_time AS ingest_ts\n,to_timestamp(date_part(epoch_second,\
        \ CURRENT_TIMESTAMP())) AS dl_last_updt_ts\n,to_timestamp(date_part(epoch_second, CURRENT_TIMESTAMP()))\
        \ AS load_ts\n\t,NULL AS root_execn_pid\n\t,CASE \n\t\tWHEN MONTH(src.budat) IN ('10', '11', '12')\n\
        \t\t\tTHEN YEAR(src.budat) + 1\n\t\tELSE YEAR(src.budat)\n\t\tEND AS fiscal_year_cd\n\t,CASE \n\
        \t\tWHEN UPPER(src.shkzg) = 'S'\n\t\t\tTHEN 'DEBIT'\n\t\tWHEN UPPER(src.shkzg) = 'H'\n\t\t\tTHEN\
        \ 'CREDIT'\n\t\tEND AS goods_debit_credit_nm\n\t--,src.waers AS currency_cd\n\t,src.lgort AS source_storage_location_cd\n\
        \t,src.lgobe AS source_storage_location_nm\n\t,'Y' AS curr_flg\n\t,'SOURCE_SYSTEM_001' AS source_system_nm\n\
        \t,'INSTANCE_001' AS instance_nm\n\t\t, $adf_pl_nm AS ADF_PIPELINE_NM       \n\t, $adf_trans_nm\
        \ AS ADF_TRANSFORMATION_NM \n\t, $dl_final_script_nm AS ADF_SCRIPT_NM \n\t,'Global' AS business_segment_nm\n\
        \t,md5(coalesce(concat_ws(src.mblnr, src.bukrs, src.mjahr, src.zeile, 'SOURCE_SYSTEM_001', 'INSTANCE_001','to_timestamp_ntz(convert_timezone(UTC,current_timestamp()))'),\
        \ '') || '|' || 'to_timestamp_ntz(convert_timezone(UTC,current_timestamp()))') AS dbt_scd_id\n\
        \t,'Global' as grn_nbr_id\n    ,concat_ws('~',src.mblnr, src.bukrs, src.mjahr, src.zeile, 'SOURCE_SYSTEM_001',\
        \ 'INSTANCE_001') AS goods_receipt_intg_id\n\t,CONCAT_AWKEY\n\t,src.mblnr as mseg_mblnr\n\t--,src.prctr\
        \ as profit_center_cd\n\t,src.shkzg\nFROM (\n\nwith CTE_MKPF AS \n\t\t(SELECT DISTINCT \n\t\t\t\
        mandt,blart,COALESCE(mkpf.XBLNR,mkpf.FRBNR) AS REFERENCE,tcode2,to_timestamp(mkpf.cpudt, 'yyyymmdd')\
        \ AS cpudt,to_timestamp(mkpf.budat, 'yyyymmdd') AS budat,to_timestamp(mkpf.bldat, 'yyyymmdd')\
        \ AS bldat,mblnr,mjahr,CONCAT(MKPF.MBLNR, MKPF.MJAHR) AS CONCAT_AWKEY  ,usnam\n\t\tFROM SAP.mkpf\
        \ MKPF)\n\t\t\n\tSELECT mkpf.mandt\n\t\t,mseg.mblnr\n\t\t--,bseg.belnr as journal_entry \n\t\t\
        --,bseg.bschl\n\t\t,mkpf.blart\n\t\t--,MKPF.reference as reference\n\t\t--,CONCAT(bseg.belnr,'-',bseg.gjahr)\
        \ as invoice_nbr\n\t\t--,bseg.hkont\n\t\t--,CASE  WHEN bseg.augdt = '00000000' THEN to_date('00000000')\
        \ ELSE to_date(bseg.augdt, 'yyyyMMdd') END AS augdt\n\t\t--,bseg.augbl\n\t\t--,bseg.buzei\n\t\t\
        --,bseg.zuonr\n\t\t--,bseg.wrbtr\n\t\t----,bseg.pswbt\n\t\t--,bseg.pswsl\n\t\t,mkpf.tcode2\n\t\
        \t,mkpf.usnam\n\t\t,mseg.mjahr\n\t\t,mseg.bukrs\n\t\t,mseg.zeile\n\t\t,MKPF.cpudt AS cpudt\n\t\
        \t,MKPF.budat AS budat\n\t\t,MKPF.bldat AS bldat\n\t\t,mseg.bwart\n\t\t,mseg.erfmg\n\t\t,mseg.charg\n\
        \t\t,CASE \n\t\t\tWHEN tcurx.currdec IS NOT NULL\n\t\t\t\tTHEN CASE \n\t\t\t\t\t\tWHEN ekpo.peinh\
        \ IS NULL\n\t\t\t\t\t\t\tOR ekpo.peinh = 0\n\t\t\t\t\t\t\tTHEN 0\n\t\t\t\t\t\tELSE (coalesce(ekpo.netpr,\
        \ 0) / ekpo.peinh) * pow(10, (2 - tcurx.currdec))\n\t\t\t\t\t\tEND\n\t\t\tWHEN tcurx.currdec IS\
        \ NULL\n\t\t\t\tTHEN CASE \n\t\t\t\t\t\tWHEN ekpo.peinh IS NULL\n\t\t\t\t\t\t\tOR ekpo.peinh =\
        \ 0\n\t\t\t\t\t\t\tTHEN 0\n\t\t\t\t\t\tELSE coalesce(ekpo.netpr, 0) / ekpo.peinh\n\t\t\t\t\t\t\
        END\n\t\t\tEND AS price_per_unit_amt\n\t\t,mseg.lifnr\n\t\t,mseg.matnr\n\t\t,mseg.werks\n\t\t\
        ,t001.butxt\n\t\t,t156t.btext\n\t\t,t001w.name1\n\t\t,cskt.ltext\n\t\t,mseg.ebeln\n\t\t,mseg.ebelp\n\
        \t\t,mseg.kostl AS kostl\n\t\t,makt.matnr AS mt_matnr\n\t\t,makt.maktx\n\t\t--,mseg.waers AS waers\n\
        \t\t,to_timestamp(eket.eindt, 'yyyymmdd') AS eindt\n\t\t,mseg.shkzg\n\t\t,mseg.lgort\n\t\t,t001l.lgobe\n\
        \t\t,mseg.snowflake_ingested_time\n\t\t--,BSEG.PRCTR\n\t\t,MKPF.CONCAT_AWKEY\n        ,mseg.prctr\n\
        \t\t,mseg.menge\n\tFROM cte_mkpf mkpf\n\tINNER JOIN SCHEMA_004.SAP_YRP_MSEG_TEMP mseg ON mkpf.mandt\
        \ = mseg.mandt\n\t\tAND mkpf.mblnr = mseg.mblnr\n\t\tAND mkpf.mjahr = mseg.mjahr\n\tLEFT OUTER\
        \ JOIN SAP.ekpo ekpo ON mseg.mandt = ekpo.mandt\n\t\tAND mseg.ebeln = ekpo.ebeln\n\t\tAND mseg.ebelp\
        \ = ekpo.ebelp\n\tLEFT OUTER JOIN (\n\t\tSELECT ekt.mandt\n\t\t\t,ekt.ebeln\n\t\t\t,ekt.ebelp\n\
        \t\t\t,ekt.eindt\n\t\tFROM (\n\t\t\tSELECT mandt\n\t\t\t\t,ebeln\n\t\t\t\t,ebelp\n\t\t\t\t,eindt\n\
        \t\t\t\t,row_number() OVER (\n\t\t\t\t\tPARTITION BY mandt\n\t\t\t\t\t,ebeln\n\t\t\t\t\t,ebelp\
        \ ORDER BY eindt\n\t\t\t\t\t) AS rn\n\t\t\tFROM SAP.eket\n\t\t\tWHERE mandt = 100\n\t\t\t) ekt\n\
        \t\tWHERE ekt.rn = 1\n\t\t) eket ON mseg.mandt = eket.mandt\n\t\tAND mseg.ebeln = eket.ebeln\n\
        \t\tAND mseg.ebelp = eket.ebelp\n\tLEFT OUTER JOIN SAP.ekko ekko ON ekpo.mandt = ekko.mandt\n\t\
        \tAND ekpo.ebeln = ekko.ebeln\n\tLEFT OUTER JOIN SAP.tcurx tcurx ON ekko.waers = tcurx.currkey\n\
        \tLEFT OUTER JOIN (\n\t\tSELECT mandt\n\t\t\t,kostl\n\t\t\t,listagg(ltext, ',') AS ltext\n\t\t\
        FROM SAP.cskt\n\t\tWHERE spras = 'E'\n\t\tGROUP BY mandt\n\t\t\t,kostl\n\t\t) cskt ON mseg.mandt\
        \ = cskt.mandt\n\t\tAND mseg.kostl = cskt.kostl\n\tLEFT OUTER JOIN SAP.makt makt ON mseg.mandt\
        \ = makt.mandt\n\t\tAND mseg.matnr = makt.matnr\n\t\tAND makt.spras = 'E'\n\tLEFT OUTER JOIN SAP.t001\
        \ t001 ON mseg.mandt = t001.mandt\n\t\tAND mseg.bukrs = t001.bukrs\n\tLEFT OUTER JOIN SAP.t156t\
        \ t156t ON mseg.mandt = t156t.mandt\n\t\tAND mseg.bwart = t156t.bwart\n\t\tAND mseg.sobkz = t156t.sobkz\n\
        \t\tAND mseg.kzbew = t156t.kzbew\n\t\tAND mseg.kzzug = t156t.kzzug\n\t\tAND mseg.kzvbr = t156t.kzvbr\n\
        \t\tAND t156t.spras = 'E'\n\tLEFT OUTER JOIN SAP.t001w t001w ON mseg.mandt = t001w.mandt\n\t\t\
        AND mseg.werks = t001w.werks\n\tLEFT OUTER JOIN SAP.t001l t001l ON mseg.mandt = t001l.mandt\n\t\
        \tAND mseg.werks = t001l.werks\n\t\tAND mseg.lgort = t001l.lgort\n\tWHERE mkpf.mandt = '100'\n\
        \t) src\nLEFT OUTER JOIN (\n\tSELECT item_nbr_sk\n\t\t,source_item_nbr\n\t\t,item_commodity_cd\n\
        \t\t,item_commodity_cd_sk\n\t\t,curr_flg\n\t\t,source_system_nm\n\t\t,instance_nm\n\tFROM SCHEMA_005.item_dim\n\
        \t) id ON src.matnr = id.source_item_nbr\n\tAND id.source_system_nm = 'SOURCE_SYSTEM_001'\n\t\
        AND id.instance_nm = 'INSTANCE_001'\n\t--AND id.curr_flg = 'Y'\nLEFT OUTER JOIN (\n\tSELECT supplier_nbr_sk\n\
        \t\t,source_supplier_nbr_id\n\t\t,entity_cd\n\t\t,curr_flg\n\t\t,source_system_nm\n\t\t,instance_nm\n\
        \tFROM SCHEMA_005.supplier_dim\n\t) sd ON src.lifnr = sd.source_supplier_nbr_id\n\tAND src.bukrs\
        \ = sd.entity_cd\n\tAND sd.source_system_nm = 'SOURCE_SYSTEM_001'\n\tAND sd.instance_nm = 'INSTANCE_001'\n\
        \t--AND sd.curr_flg = 'Y'\nLEFT OUTER JOIN SCHEMA_005.entity_dim ed ON src.bukrs = ed.entity_cd\n\
        \tAND ed.source_system_nm = 'SOURCE_SYSTEM_001'\n\tAND ed.instance_nm = 'INSTANCE_001'\n\t--AND\
        \ ed.curr_flg = 'Y'\nLEFT OUTER JOIN (\n\tSELECT location_cd_sk\n\t\t,source_location_cd\n\t\t\
        ,entity_cd\n\t\t,curr_flg\n\t\t,source_system_nm\n\t\t,instance_nm\n\tFROM SCHEMA_005.location_dim\n\
        \t) ld ON src.werks = ld.source_location_cd\n    AND src.bukrs = ld.entity_cd\n\tAND ld.source_system_nm\
        \ = 'SOURCE_SYSTEM_001'\n\tAND ld.instance_nm = 'INSTANCE_001'\n\t--AND ld.curr_flg = 'Y'\nLEFT\
        \ JOIN SCHEMA_005.source_dim AS srd \n    ON srd.source_system_nm = 'SOURCE_SYSTEM_001' \n   \
        \ AND srd.instance_nm = 'INSTANCE_001'\nLEFT JOIN SCHEMA_005.source_system_dim AS ssd \n\tON ssd.source_system_nm\
        \ = 'SOURCE_SYSTEM_001' \n\tAND ssd.source_system_cd = 'SOURCE_SYSTEM_001' \n\tAND ssd.source_database_nm=\
        \ 'ECC_B1' \n\tAND ssd.site_region_cd = 'SAP_YRP_ECC_B1';\n"
