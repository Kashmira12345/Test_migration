            LEFT OUTER JOIN SCHEMA_001.TTCCOM112525 TTCCOM112525
              ON TRIM(T100.T_BPID) = TRIM(TTCCOM112525.T_ITBP)
            LEFT OUTER JOIN SCHEMA_001.TTCMCS064525 TTCMCS064525
              ON TRIM(TTCCOM112525.T_CRAT) = TRIM(TTCMCS064525.T_CRAT)
            LEFT OUTER JOIN SCHEMA_003.SOURCE_SYSTEM_DIM SOURCE_SYSTEM_DIM
              ON SOURCE_SYSTEM_DIM.SOURCE_COMPANY_CD = '525'
