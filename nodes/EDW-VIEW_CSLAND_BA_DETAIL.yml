        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_CSLAND_BA_DETAIL] AS\r\nSELECT\r\n    BA.PRIMARY_KEY \"CODE\",\r\n    BA.FILE_STATUS \"FILE_STATUS_CODE\",\r\n    TB.DESCRIPTION \"FILE_STATUS\",\r\n    BA.ALTERNATE_CODE \"ALT_CODE\",\r\n    BA.NAME, \r\n    BA.ADDRESS_LINE_1,\r\n    BA.ADDRESS_LINE_2,\r\n    BA.ADDRESS_LINE_3,\r\n    BA.ADDRESS_LINE_4,\r\n    BA.ADDRESS_LINE_5,\r\n    BA.SHORT_NAME,\r\n    BA.CONTACT_NAME,\r\n    BA.PHONE_NUMBER,\r\n    BA.E_MAIL_ADDRESS,\r\n    BA.FAX_NUMBER,\r\n    BA.COMBINE_RENTAL \"COMBINE_RENTAL_FLAG\",\r\n    BA.MIN_CHEQUE_AMOUNT,\r\n    BA.BANK_FEE,\r\n    BA.CURRENCY_COUNTRY \"CURRENCY_COUNTRY_CODE\",\r\n    TC1.DESCRIPTION \"CURRENCY_COUNTRY\",\r\n    BA.WTAX_COUNTRY \"WTAX_COUNTRY_CODE\",\r\n    TC2.DESCRIPTION \"WTAX_COUNTRY\",\r\n    TC2.WTAX_PERCENT,\r\n    BA.GST_REG_NO,\r\n    BA.NAME || \r\n        DECODE(TRIM(BA.ADDRESS_LINE_1), NULL, '', chr(10) || BA.ADDRESS_LINE_1) ||\r\n        DECODE(TRIM(BA.ADDRESS_LINE_2), NULL, '', chr(10) || BA.ADDRESS_LINE_2) ||\r\n        DECODE(TRIM(BA.ADDRESS_LINE_3), NULL, '', chr(10) || BA.ADDRESS_LINE_3) ||\r\n        DECODE(TRIM(BA.ADDRESS_LINE_4), NULL, '', chr(10) || BA.ADDRESS_LINE_4) ||\r\n        DECODE(TRIM(BA.ADDRESS_LINE_5), NULL, '', chr(10) || BA.ADDRESS_LINE_5) \"LABEL\"\r\nFROM\r\n    DS_CSLAND.BA_TABLE BA,\r\n    DS_CSLAND.T_BFSTATUS TB,\r\n    DS_CSLAND.T_COUNTRY TC1,\r\n    DS_CSLAND.T_COUNTRY TC2\r\nWHERE BA.FILE_STATUS = TB.CODE(+)\r\n    AND BA.CURRENCY_COUNTRY = TC1.CODE(+)\r\n    AND BA.WTAX_COUNTRY = TC2.CODE(+)\r\n    ;"
