          ODS_CSLAND_L_RIGHTS: ec3a171f-a83e-73a5-94fd-7a9248f43c17
          ODS_CSLAND_L_SUB: bf882e68-bd7a-a722-832e-aaf3e7edab63
          ODS_CSLAND_T_AREA: 0ec0125b-acc2-463c-5f12-edcc8b9b9d89
          ODS_CSLAND_T_DIVISION: c5e3269c-628c-918e-9068-b3e4bb5ce044
          ODS_CSLAND_T_EXTEN: 2b07b524-2520-2e39-f848-7d954ddccd32
          ODS_CSLAND_T_LESSOR: 1715d999-19e4-af1e-3179-943f8bad42b5
          ODS_CSLAND_T_MFSTATUS: 5137dcc6-640d-2031-1e04-74ea4a5fb1be
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_CSLAND_MINERAL_SUB_DETAIL] AS\r\nSELECT \r\n    LB.FILE_NUMBER \"MINERAL_FILE_NUMBER\",\r\n    LS.FILE_SUB \"MINERAL_FILE_SUB\",\r\n    TMFS.DESCRIPTION \"MINERAL_FILE_SUB_STATUS\",\r\n    TMFS.AI_FLAG,\r\n    LS.SUB_INTEREST_TYPE,\r\n    LS.PRODUCING_STATUS,\r\n\tLS.DIVISION \"DIVISION_CODE\",\r\n\tTD.DESCRIPTION \"DIVISION\",\r\n    LS.AREA \"AREA_CODE\",\r\n    TA.NAME \"AREA\",\r\n    TA.PROVINCE,\r\n    LS.SUB_OPERATOR \"OPERATOR_BA\",\r\n    BT2.NAME \"OPERATOR_NAME\",\r\n    LS.OWNER_INTEREST,\r\n    LS.TOTAL_SUB_RENTAL,\r\n    (LS.OWNER_INTEREST/100) * LS.TOTAL_SUB_RENTAL \"NET_TOTAL_SUB_RENTAL\",     \r\n    DECODE(LS.EXTENSION, NULL, 'PRIMARY TERM',  LS.EXTENSION) \"EXTENSION_TERM\",\r\n    TE.DESCRIPTION \"EXTENSION\",\r\n    LS.EXTENSION_DATE,  \r\n    LS.COUNT_ACREAGE \"COUNT_ACREAGE_FLAG\",\r\n    LB.ACRE_HECTARE \"ACRE_HECTARE_FLAG\",\t\r\n    LS.SUB_GROSS_HECT,\r\n    LS.SUB_GROSS_ACRES,   \r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_DEV_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_DEV_ACRES\",     \r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_UNDEV_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_UNDEV_ACRES\",\t\r\n    TL.DESCRIPTION \"LESSOR_TYPE\",\r\n    LS.RENTAL_RATE,\r\n    LB.RENTAL_DOLLAR,\t\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_DEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_DEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_UNDEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_UNDEV_RENTALS\",\r\n    REPLACE(LL.LAND_DESCRIPTION,CHR(13)||CHR(10),CHR(10)) \"LAND_DESCRIPTION\",\r\n    REPLACE(LR.RIGHTS_HELD,CHR(13)||CHR(10),CHR(10)) \"RIGHTS_HELD\",\r\n    CURR_D.DOI_DETAILS \"CURR_DOI\",\r\n    REF_D.DOI_DETAILS \"REF_DOI\",\r\n    RENT_D.DOI_DETAILS \"RENT_DOI\",  \r\n    MR.REMARKS,\t\r\n    TRIM(LB.FILE_NUMBER) \"MINERAL_FILE_BASE_KEY\",\r\n    TRIM(LB.FILE_NUMBER)||TRIM(LS.FILE_SUB) \"MINERAL_FILE_SUB_KEY\"     \r\nFROM \r\n  DS_CSLAND.L_SUB LS,\r\n  DS_CSLAND.T_MFSTATUS
            TMFS,\r\n  DS_CSLAND.T_AREA TA,\r\n  DS_CSLAND.T_DIVISION TD,\r\n  DS_CSLAND.BA_TABLE BT2,\r\n  DS_CSLAND.T_EXTEN TE,\r\n  DS_CSLAND.T_LESSOR TL,  \r\n  DS_CSLAND.L_BASE LB,\r\n  DS_CSLAND.L_LEGAL LL,\r\n  DS_CSLAND.L_RIGHTS LR,  \r\n  (SELECT FILE_NUMBER, FILE_SUB,  \r\n    REPLACE(LISTAGG(TO_CHAR(REMARKS_DATE,'YYYY-MM-DD')||': ['||TRIM(REMARKS_TYPE)||'] - '||REMARKS, '~'),'~',chr(10)) \"REMARKS\"\r\n  FROM (SELECT * FROM DS_CSLAND.L_REMARK ORDER BY FILE_NUMBER, FILE_SUB, REMARKS_DATE, OCCURRENCE)\r\n  GROUP BY FILE_NUMBER, FILE_SUB       \r\n   ) MR,  \r\n  (SELECT\r\n    FILE_NUMBER,\r\n    FILE_SUB,\r\n    LISTAGG( DOI_TYPE || ' (' || DOI_ID || ') ' || CHR(10) || DOI_DETAIL || CHR(10), '~') \"DOI_DETAILS\"\r\n  FROM\r\n    (SELECT \r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION \"DOI_TYPE\",\r\n      DD.DOI_ID,\r\n      REPLACE(LISTAGG(\r\n        '     ' || RPAD(BA.NAME||'  ('||TRIM(DD.PARTNER)||')' , 50, ' ') \r\n        || LPAD(TO_CHAR(NVL(DD.PARTNER_PERCENT,0),'990.0000000'),12,' ') \r\n        || ' ' || DECODE(DD.SILENT_PARTNER,'*','S',' ') \r\n        || ' ' || DECODE(NVL(DD.PENALTY,'N'),'Y','P',' '), '~'),'~',chr(10)) \"DOI_DETAIL\"\r\n    FROM \r\n      DS_CSLAND.D_XREF DX,\r\n      DS_CSLAND.D_DETAIL DD,\r\n      DS_CSLAND.BA_TABLE BA,\r\n      DS_CSLAND.T_OWNERS TOW,\r\n      DS_CSLAND.T_DOI TD\r\n    WHERE DX.DOI_ID        = DD.DOI_ID\r\n      AND DX.SUBSYSTEM       = 'M'\r\n      AND DX.EFFECTIVE_DATE <= CURRENT_TIMESTAMP\r\n      AND DX.EXPIRY_DATE     > CURRENT_TIMESTAMP\r\n      AND DD.PARTNER         = BA.PRIMARY_KEY\r\n      AND DD.PARTNER         = TOW.OWNER(+)\r\n      AND ACCOUNT_GROUP      = 'CURR%'  \r\n      AND DX.DOI_TYPE        = TD.CODE    \r\n    GROUP BY\r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION,\r\n      DD.DOI_ID )\r\n  GROUP BY\r\n    FILE_NUMBER,\r\n    FILE_SUB  \r\n  ) CURR_D,\r\n  (SELECT\r\n    FILE_NUMBER,\r\n    FILE_SUB,\r\n    LISTAGG( DOI_TYPE || ' (' || DOI_ID || ') ' || CHR(10) || DOI_DETAIL || CHR(10), '~') \"DOI_DETAILS\"\r\n  FROM\r\n    (SELECT \r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION \"DOI_TYPE\",\r\n      DD.DOI_ID,\r\n      REPLACE(LISTAGG(\r\n        '     ' || RPAD(BA.NAME||'  ('||TRIM(DD.PARTNER)||')' , 50, ' ') \r\n        || LPAD(TO_CHAR(NVL(DD.PARTNER_PERCENT,0),'990.0000000'),12,' ') \r\n        || ' ' || DECODE(DD.SILENT_PARTNER,'*','S',' ') \r\n        || ' ' || DECODE(NVL(DD.PENALTY,'N'),'Y','P',' '), '~'),'~',chr(10)) \"DOI_DETAIL\"\r\n    FROM \r\n      DS_CSLAND.D_XREF DX,\r\n      DS_CSLAND.D_DETAIL DD,\r\n      DS_CSLAND.BA_TABLE BA,\r\n      DS_CSLAND.T_OWNERS TOW,\r\n      DS_CSLAND.T_DOI TD\r\n    WHERE DX.DOI_ID        = DD.DOI_ID\r\n      AND DX.SUBSYSTEM       = 'M'\r\n      AND DX.EFFECTIVE_DATE <= CURRENT_TIMESTAMP\r\n      AND DX.EXPIRY_DATE     > CURRENT_TIMESTAMP\r\n      AND DD.PARTNER         = BA.PRIMARY_KEY\r\n      AND DD.PARTNER         = TOW.OWNER(+)\r\n      AND ACCOUNT_GROUP      = 'REF%'  \r\n      AND DX.DOI_TYPE        = TD.CODE    \r\n    GROUP BY\r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION,\r\n      DD.DOI_ID )\r\n  GROUP BY\r\n    FILE_NUMBER,\r\n    FILE_SUB  \r\n  ) REF_D,\r\n  (SELECT\r\n    FILE_NUMBER,\r\n    FILE_SUB,\r\n    LISTAGG( DOI_TYPE || ' (' || DOI_ID || ') ' || CHR(10) || DOI_DETAIL || CHR(10), '~') \"DOI_DETAILS\"\r\n  FROM\r\n    (SELECT \r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION \"DOI_TYPE\",\r\n      DD.DOI_ID,\r\n      REPLACE(LISTAGG(\r\n        '     ' || RPAD(BA.NAME||'  ('||TRIM(DD.PARTNER)||')' , 50, ' ') \r\n        || LPAD(TO_CHAR(NVL(DD.PARTNER_PERCENT,0),'990.0000000'),12,' ') \r\n        || ' ' || DECODE(DD.SILENT_PARTNER,'*','S',' ') \r\n        || ' ' || DECODE(NVL(DD.PENALTY,'N'),'Y','P',' '), '~'),'~',chr(10)) \"DOI_DETAIL\"\r\n    FROM \r\n      DS_CSLAND.D_XREF DX,\r\n      DS_CSLAND.D_DETAIL DD,\r\n      DS_CSLAND.BA_TABLE BA,\r\n      DS_CSLAND.T_OWNERS TOW,\r\n      DS_CSLAND.T_DOI TD\r\n    WHERE DX.DOI_ID        = DD.DOI_ID\r\n      AND DX.SUBSYSTEM\
            \       = 'M'\r\n      AND DX.EFFECTIVE_DATE <= CURRENT_TIMESTAMP\r\n      AND DX.EXPIRY_DATE     > CURRENT_TIMESTAMP\r\n      AND DD.PARTNER         = BA.PRIMARY_KEY\r\n      AND DD.PARTNER         = TOW.OWNER(+)\r\n      AND ACCOUNT_GROUP      = 'RENT%'  \r\n      AND DX.DOI_TYPE        = TD.CODE    \r\n    GROUP BY\r\n      DX.FILE_NUMBER,\r\n      DX.FILE_SUB,\r\n      TD.DESCRIPTION,\r\n      DD.DOI_ID )\r\n  GROUP BY\r\n    FILE_NUMBER,\r\n    FILE_SUB  \r\n  ) RENT_D  \r\nWHERE \r\n  LS.FILE_STATUS  = TMFS.CODE(+)\r\n  AND LS.AREA = TA.CODE(+)\r\n  AND LS.DIVISION = TD.CODE(+)  \r\n  AND LS.SUB_OPERATOR = BT2.PRIMARY_KEY(+)\r\n  AND LS.EXTENSION    = TE.CODE(+)\r\n  AND LS.FILE_NUMBER  = LB.FILE_NUMBER\r\n  AND LB.LESSOR_TYPE  = TL.CODE(+) \r\n  AND LS.FILE_NUMBER  = LL.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = LL.FILE_SUB(+)\r\n  AND LS.FILE_NUMBER  = LR.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = LR.FILE_SUB(+)\r\n  AND LS.FILE_NUMBER  = CURR_D.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = CURR_D.FILE_SUB(+)\r\n  AND LS.FILE_NUMBER  = REF_D.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = REF_D.FILE_SUB(+)  \r\n  AND LS.FILE_NUMBER  = RENT_D.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = RENT_D.FILE_SUB(+) \r\n  AND LS.FILE_NUMBER  = MR.FILE_NUMBER(+)\r\n  AND LS.FILE_SUB     = MR.FILE_SUB(+)    "
