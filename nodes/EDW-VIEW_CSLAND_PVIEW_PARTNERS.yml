          - locationName: DATA_STORE
            nodeName: ODS_CSLAND_W_DETAIL1
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_CSLAND_PVIEW_PARTNERS') }} "VIEW_CSLAND_PVIEW_PARTNERS"
        name: VIEW_CSLAND_PVIEW_PARTNERS
        noLinkRefs: []
