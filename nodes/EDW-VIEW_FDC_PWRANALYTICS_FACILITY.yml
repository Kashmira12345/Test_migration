            JOIN {{ ref('EDW', 'FACT_FDC_PRODUCTION_VOLUMES') }} FACT_FDC_PRODUCTION_VOLUMES
              ON ODS_PVIEW_PVT_PVUNIT.IDREC = FACT_FDC_PRODUCTION_VOLUMES.DIM_WELL_KEY
            JOIN ( SELECT IDRECFACILITYCALC ,USERNUM2 AS CHILD_ACCOUNT ,CHILD_ACCOUNT_2 ,CHILD_ACCOUNT_3 ,USERNUM3 AS METER_NUMBER ,METER_NUMBER_2 ,METER_NUMBER_3 ,NAME ,COSTCENTERIDA AS CC_NUM
