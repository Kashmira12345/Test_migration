          DIM_LO_SAP_AFE_TYPE: 85d9f49e-b9bc-a7e4-9aad-68289ce7ba27
          DIM_LO_SAP_CC_CORP_HIER_CURRENT: 708fd649-6097-9913-de66-f7bca879c8c8
          DIM_LO_SAP_COST_CENTER: 92422852-c141-a115-6f61-583208be58f4
          ODS_SAP_ZCZFINMOSAICPRJ: 475e1f90-a425-ed23-8865-b7838d01aaf2
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FIN_WBS_ELEMENTS] AS\r\nSELECT\r\n    DA.AFE_NUM WBS_ELEMENT,\r\n    TRANSLATE(DA.AFE_NAME,chr(10)||chr(13),'  ') WBS_DESC,\r\n    DAT.AFE_TYPE WBS_TYPE,\r\n    DAT.AFE_TYPE_DESC WBS_TYPE_DESC,\r\n    DA.AFE_CREATE_DATE CREATE_DATE,\r\n    NVL(DA.CORP_PLANNING_PROJECT,'$PMOSAIC_CDM_UNBUDGETED_ENTITY_NAME$') CORP_PLANNING_PROJECT,\r\n    NVL(ZMP.ENTITY_UUID,'$PMOSAIC_CDM_UNBUDGETED_ENTITY_UUID$') ENTITY_UUID,\r\n    DA.ALLOC_AMT,\r\n    DA.OP_ALLOC_AMT,\r\n    DA.OP_CURR_CODE,\r\n    DAT.LINE_NO,\r\n    DAT.LINE_NO_DESC,\r\n    DA.MANAGING_ORG_ID COMPANY_CODE,\r\n    DCCH.COUNTRY_CODE,\r\n    DCCH.PROV_CODE,\r\n    DCCH.COREAREA_NAME,\r\n    DCCH.AREA_NAME,\r\n    DCC.OPERATOR_NAME,\r\n    DA.UWI,\r\n    DA.VET_WBS_WI VET_WI,\r\n    DA.CC_NUM COST_CENTER,\r\n    DA.SYSTEM_STAT_CODES SYSTEM_STATUS,\r\n    DA.AFE_STAT_DESC USER_STATUS,\r\n    DA.ENGINEER_ASSIGNED PERSON_RESPONSIBLE\t\r\nFROM [TABLEOWNER].[DIM_LO_SAP_AFE] DA\r\n    JOIN [TABLEOWNER].[DIM_LO_SAP_AFE_TYPE] DAT\r\n        ON (DA.DIM_AFE_TYPE_KEY = DAT.DIM_AFE_TYPE_KEY)\r\n    JOIN [TABLEOWNER].[DIM_LO_SAP_COST_CENTER] DCC\r\n        ON (DA.CC_NUM = DCC.CC_NUM)\r\n    JOIN [TABLEOWNER].[DIM_LO_SAP_CC_CORP_HIER_CURRENT] DCCH\r\n        ON (DCC.DIM_CC_CORP_HIER_CURRENT_KEY = DCCH.DIM_CC_CORP_HIER_CURRENT_KEY)\r\n   LEFT JOIN DS_SAP.ZCZFINMOSAICPRJ ZMP\r\n      ON DA.CORP_PLANNING_PROJECT = ZMP.ZZMOSAIC_PRJ\r\nWHERE DA.DIM_AFE_KEY <> 0"
