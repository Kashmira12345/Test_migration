    sourceMapping:
      - aliases:
          ODS_GDC_BUSINESS_ASSOCIATE: e0d4d730-75f3-5cc2-7af7-dd7d738a3240
          ODS_GDC_PDEN_VOL_BY_MONTH: 2ced676c-bf87-de61-7c98-bef8279befca
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_GDC_RAW_PRODUCTION] AS\r\nSELECT \r\n  BA_NAME\r\n  ,UWI\r\n  ,ACTIVITY_PERIOD\r\n  ,MONTH\r\n  ,YEAR\r\n  ,\"'WATER'\" AS WATER\r\n  ,\"'GAS'\" AS GAS\r\n  ,\"'OIL'\" AS OIL\r\n  ,\"'COND'\" AS COND\r\nFROM (\r\n  SELECT \r\n      BA_NAME\r\n      ,UWI\r\n      ,TO_DATE(YEAR || '-' || MONTH(TO_DATE(MONTH, 'MON')) || '-1') AS ACTIVITY_PERIOD\r\n      ,MONTH\r\n      ,YEAR\r\n      ,UPPER(PRODUCT_TYPE) AS PRODUCT_TYPE\r\n      ,AMOUNT\r\n  FROM (\r\n      SELECT \r\n          PDEN.BA_NAME\r\n          ,PDEN.GSL_UWI AS UWI\r\n          ,CASE PRODUCT_TYPE\r\n              WHEN 'OIL'\r\n                  THEN 'OIL'\r\n              WHEN 'CND'\r\n                  THEN 'COND'\r\n              WHEN 'GAS'\r\n                  THEN 'GAS'\r\n              WHEN 'WTR'\r\n                  THEN 'WATER'\r\n              END AS PRODUCT_TYPE\r\n          ,YEAR\r\n          ,JAN_VOLUME AS JAN\r\n          ,FEB_VOLUME AS FEB\r\n          ,MAR_VOLUME AS MAR\r\n          ,APR_VOLUME AS APR\r\n          ,MAY_VOLUME AS MAY\r\n          ,JUN_VOLUME AS JUN\r\n          ,JUL_VOLUME AS JUL\r\n          ,AUG_VOLUME AS AUG\r\n          ,SEP_VOLUME AS SEP\r\n          ,OCT_VOLUME AS OCT\r\n          ,NOV_VOLUME AS NOV\r\n          ,DEC_VOLUME AS DEC\r\n      FROM (\r\n          SELECT \r\n              BA.BA_NAME\r\n              ,V.GSL_UWI\r\n              ,V.GSL_OLD_UWI\r\n              ,V.PDEN_ID\r\n              ,V.PDEN_TYPE\r\n              ,V.PRODUCT_TYPE\r\n              ,V.YEAR\r\n              ,V.JAN_VOLUME\r\n              ,V.FEB_VOLUME\r\n              ,V.MAR_VOLUME\r\n              ,V.APR_VOLUME\r\n              ,V.MAY_VOLUME\r\n              ,V.JUN_VOLUME\r\n              ,V.JUL_VOLUME\r\n              ,V.AUG_VOLUME\r\n              ,V.SEP_VOLUME\r\n              ,V.OCT_VOLUME\r\n              ,V.NOV_VOLUME\r\n              ,V.DEC_VOLUME\r\n          FROM WS_DATA_STORE.ODS_GDC_PDEN_VOL_BY_MONTH V\r\n          LEFT JOIN WS_DATA_STORE.ODS_GDC_PDEN PDEN ON V.PDEN_ID = PDEN.PDEN_ID AND PDEN.DSS_CURRENT_FLAG = 'Y' AND PDEN.DSS_DELETE_FLAG != 'Y'\r\n          LEFT JOIN WS_DATA_STORE.ODS_GDC_BUSINESS_ASSOCIATE BA ON PDEN.CURRENT_OPERATOR = BA.BUSINESS_ASSOCIATE AND BA.DSS_CURRENT_FLAG = 'Y' AND BA.DSS_DELETE_FLAG !='Y'\r\n          WHERE V.ACTIVITY_TYPE = 'PRODUCTION'\r\n              AND V.PRODUCT_TYPE IN (\r\n                  'OIL'\r\n                  ,'CND'\r\n                  ,'GAS'\r\n                  ,'WTR'\r\n                  )\r\n              AND V.DSS_CURRENT_FLAG = 'Y'\r\n              AND V.DSS_DELETE_FLAG != 'Y'\r\n           ) PDEN\r\n      ) S\r\n    UNPIVOT(AMOUNT FOR MONTH IN (\r\n                JAN\r\n                ,FEB\r\n                ,MAR\r\n                ,APR\r\n                ,MAY\r\n                ,JUN\r\n                ,JUL\r\n                ,AUG\r\n                ,SEP\r\n                ,OCT\r\n                ,NOV\r\n                ,DEC\r\n                )) AMT\r\n        ) SD\r\n      PIVOT(SUM(AMOUNT) FOR PRODUCT_TYPE IN (\r\n              'WATER'\r\n              ,'GAS'\r\n              ,'OIL'\r\n              ,'COND'\r\n              ));\r\n"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_GDC_BUSINESS_ASSOCIATE
          - locationName: DATA_STORE
            nodeName: ODS_GDC_PDEN_VOL_BY_MONTH
