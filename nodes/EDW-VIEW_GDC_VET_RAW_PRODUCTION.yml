        join:
          joinCondition: |-
            FROM ( SELECT VIEW_GDC_RAW_PRODUCTION.BA_NAME ,VIEW_GDC_RAW_PRODUCTION.UWI ,VIEW_GDC_RAW_PRODUCTION.ACTIVITY_PERIOD ,VIEW_GDC_RAW_PRODUCTION.WATER ,VIEW_GDC_RAW_PRODUCTION.GAS ,VIEW_GDC_RAW_PRODUCTION.OIL ,VIEW_GDC_RAW_PRODUCTION.COND ,DIM_LO_SAP_COST_CENTER_HIER.CC_NUM ,DIM_LO_SAP_COST_CENTER_HIER.CC_NAME ,DIM_LO_SAP_COST_CENTER_HIER.CC_NUM_NAME ,DIM_LO_SAP_COST_CENTER_HIER.FORMATTED_UWI ,VIEW_CSLAND_WELL_DETAIL.WI AS WORKING_INTEREST ,DIM_LO_SAP_COST_CENTER_HIER.AREA_NAME ,DIM_LO_SAP_COST_CENTER_HIER.COREAREA_NAME ,DIM_LO_SAP_COST_CENTER_HIER.COUNTRY_NAME ,DIM_LO_SAP_COST_CENTER_HIER.PROV_NAME ,DIM_LO_SAP_PRODUCT_TYPE.LIQUID_BOE_THERMAL ,DIM_LO_SAP_PRODUCT_TYPE.GAS_SI_TO_IMP_CONV_FACTOR ,DIM_LO_SAP_PRODUCT_TYPE.GAS_BOE_THERMAL
            FROM {{ ref('EDW', 'VIEW_GDC_RAW_PRODUCTION') }} VIEW_GDC_RAW_PRODUCTION
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_COST_CENTER_HIER') }} DIM_LO_SAP_COST_CENTER_HIER
              ON VIEW_GDC_RAW_PRODUCTION.UWI = DIM_LO_SAP_COST_CENTER_HIER.UWI
            LEFT JOIN [TABLEOWNER].[VIEW_CSLAND_WELL_DETAIL] VIEW_CSLAND_WELL_DETAIL
              ON VIEW_GDC_RAW_PRODUCTION.UWI = VIEW_CSLAND_WELL_DETAIL.RAW_UWI
            JOIN ( SELECT DISTINCT MAX(CASE WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN SI_TO_IMP_CONV_FACTOR END) AS GAS_SI_TO_IMP_CONV_FACTOR , MAX(CASE WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL END) AS GAS_BOE_THERMAL , MAX(CASE WHEN PROD_CODE NOT IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL END) AS LIQUID_BOE_THERMAL
            FROM [TABLEOWNER].[DIM_LO_SAP_PRODUCT_TYPE] ) AS DIM_LO_SAP_PRODUCT_TYPE
              ON 1 = 1
            GROUP BY VIEW_GDC_RAW_PRODUCTION.BA_NAME ,VIEW_GDC_RAW_PRODUCTION.UWI ,VIEW_GDC_RAW_PRODUCTION.ACTIVITY_PERIOD ,VIEW_GDC_RAW_PRODUCTION.WATER ,VIEW_GDC_RAW_PRODUCTION.GAS ,VIEW_GDC_RAW_PRODUCTION.OIL ,VIEW_GDC_RAW_PRODUCTION.COND ,DIM_LO_SAP_COST_CENTER_HIER.CC_NUM ,DIM_LO_SAP_COST_CENTER_HIER.CC_NAME ,DIM_LO_SAP_COST_CENTER_HIER.CC_NUM_NAME ,DIM_LO_SAP_COST_CENTER_HIER.FORMATTED_UWI ,VIEW_CSLAND_WELL_DETAIL.WI ,DIM_LO_SAP_COST_CENTER_HIER.AREA_NAME ,DIM_LO_SAP_COST_CENTER_HIER.COREAREA_NAME ,DIM_LO_SAP_COST_CENTER_HIER.COUNTRY_NAME ,DIM_LO_SAP_COST_CENTER_HIER.PROV_NAME ,DIM_LO_SAP_PRODUCT_TYPE.LIQUID_BOE_THERMAL ,DIM_LO_SAP_PRODUCT_TYPE.GAS_SI_TO_IMP_CONV_FACTOR ,DIM_LO_SAP_PRODUCT_TYPE.GAS_BOE_THERMAL ) AS TARGET
            WHERE TARGET.BA_NAME LIKE '%VERMILION%'
