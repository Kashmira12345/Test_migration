          VIEW_MOSAIC_CDM_ECONOMICS: 0a05fcb7-1248-4861-983c-04342d77830f
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_CDM_CC_HIER_EXCEPTIONS] AS\r\nWITH \r\n  cdm as ( \r\n    SELECT DISTINCT \r\n      BUSINESS_UNIT,\r\n      DISTRICT, \r\n      ENTITY_NAME, \r\n      TRIM(CC) AS CC, \r\n      TRIM(CORE_AREA) AS CORE_AREA, \r\n      TRIM(AREA) AS AREA \r\n    FROM BI_ECON.VW_CDM_ECONOMICS \r\n    WHERE \r\n        ENTITY_STATE_ID = 0 ), \r\n  hier as ( \r\n    SELECT DISTINCT \r\n      TRIM(CC_NUM) AS CC, \r\n      TRIM(COREAREA_NAME) AS CORE_AREA, \r\n      TRIM(AREA_NAME) AS AREA \r\n    FROM BI_LEASE_OPS.DIM_CC_CORP_HIER_CURRENT_SAP ) \r\nSELECT \r\n   cdm.BUSINESS_UNIT,\r\n   cdm.DISTRICT, \r\n   cdm.ENTITY_NAME, \r\n   cdm.CC, \r\n   cdm.CORE_AREA, \r\n   cdm.AREA, \r\n   DECODE(cdm.CC, NULL, '[CC NOT DEFINED]', DECODE(hier.CC, NULL, '[CC NOT FOUND]',hier.CORE_AREA)) AS CC_CORP_HIER_CORE_AREA, \r\n   DECODE(cdm.CC, NULL, '[CC NOT DEFINED]', DECODE(hier.CC, NULL, '[CC NOT FOUND]',hier.AREA)) AS CC_CORP_HIER_AREA \r\nFROM \r\n    cdm LEFT JOIN hier ON cdm.CC = hier.CC \r\nWHERE \r\n    hier.CC IS NULL \r\n    OR (hier.CC IS NOT NULL AND (cdm.AREA <> hier.AREA OR cdm.CORE_AREA <> hier.CORE_AREA)) \r\n\r\n"
