    sourceMapping:
      - aliases:
          ODS_MOSAIC_CDM_ECONOMIC_CASE: 3908eaa9-7e54-fe91-8aa7-bc07d0b72a63
          ODS_MOSAIC_CDM_ECONOMIC_DETAIL: 3abde54f-73f3-8da7-2f0e-adf08f9e72b5
          ODS_MOSAIC_CDM_ECONOMIC_ENTITY: 13de67e1-a562-3964-a73b-6e584b1c6ac1
          ODS_MOSAIC_CDM_ECONOMIC_RESULT: 4daa6fb1-9194-e45f-c67f-933685cb0bfc
          ODS_MOSAIC_CDM_ENTITY_UDL: d7a41366-2310-86ce-193b-a8aeb0511383
          ODS_MOSAIC_CDM_PARTICIPANT: 689fe9b6-4b12-ce3c-8528-7ad3fee9d7ee
          ODS_MOSAIC_CDM_PRICE_DECK: 07a2c4f9-0614-6694-18b4-506d62928413
          ODS_MOSAIC_CDM_VINTAGE: 73fb6e10-1308-06a7-e44c-09f5136a54f9
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_CDM_ECONOMICS_UNRISKED] AS\r\nSELECT \r\n  TRIM(TRANSLATE(SUBSTR(ec.case_name,1,1),'*#^!',' ')||SUBSTR(ec.case_name,2)) as Economic_Case,\r\n  DECODE(SUBSTR(ec.case_name,1,1),'*','Approved','#','Vintage Source','^','Vintage','!','Approved','Undefined') as Economic_State,\r\n  ec.case_name as Case_Name,\r\n  ec.case_description as Case_Description,\r\n  pd.name as Price_Deck, \r\n  ec.results_currency_code Currency, \r\n  ee.entity_name as Entity_Name, \r\n  v.vintage_name as Vintage_Name,\r\n  rc.category_name as Category,\r\n  ee.user_defined_14 as Business_Unit,\r\n  ee.user_defined_15 as District,\r\n  ee.user_defined_16 as Core_Area,\r\n  ee.user_defined_17 as Area,\r\n  ee.user_defined_13 as CC,\r\n  ee.project_identifier as Project_Identifier,\r\n  ee.user_defined_10 as Workflow,\r\n  ee.user_defined_18 as Budget_Year,\r\n  ee.user_defined_7 as Capital_Year,\r\n  ee.user_defined_8 as Volume_Year,\r\n  ee.user_defined_5 as Capital_Expense_Category,\r\n  ee.user_defined_1 as Capital_Production_Classification,  \r\n  ee.user_defined_19 as Strategic,\r\n  ee.user_defined_2 as Op_Non_Op,\r\n  ee.user_defined_9 as Exploitation_Engineer,\r\n  ee.user_defined_20 as Production_Engineer,\r\n  ee.user_defined_4 as Prev_Hier_Core_Area,\r\n  ee.user_defined_6 as Gross_Well_Count,\r\n  ee.user_defined_11 as Well_Count_Year,\r\n  ee.user_defined_12 as Asset_Play_Area,\r\n  ee.user_defined_3 as Risk_Tier,\r\n  ee.user_defined_12 as Play,\r\n  --Ext UDLs \r\n  em.METER_STATION as Meter_Station,\r\n  ecc.CAPITAL_CATEGORY as Facility_Capital_Category,\r\n  epr.PROJECT_RATIONALE as Facility_Project_Rationale,\r\n  ephbu.PREV_HIER_BUSINESS_UNIT Prev_Hier_Business_Unit,\r\n  ephd.PREV_HIER_DISTRICT Prev_Hier_District,\r\n  epha.PREV_HIER_AREA Prev_Hier_Area,\r\n  aro.ARO_CAP_DESC as ARO_Capital_Desc,\r\n  aroy.ARO_ABDN_YR as ARO_Abandonment_Yr,\r\n  arowc.ARO_GR_WC as ARO_Gross_Well_Count,\r\n  d2sl.DIST_2_LOC as Dist_2_Loc, \r\n  devsc.DEV_SCENARIO as Development_Scenario,\r\n  epl.PLANT as Plant,\r\n  ebt.BATTERY as Battery,\r\n  esapprj.SAP_PROJECT as SAP_Project,  \r\n  --\r\n  ee.on_production_date as Estimated_On_Prod_Date,\r\n  ee.rig_release_date as Rig_Release_Date,  \r\n  ed.year as Year, \r\n  ed.month as Month,\r\n  ed.avg_company_working_interest as Avg_Working_Interest,\r\n  ed.avg_company_share_interest as Avg_Company_Share_Interest, \r\n  ed.explor_prob_success as POS,\r\n  ed.oil_well_count as Oil_Well_Count,\r\n  ed.gas_well_count as Gas_Well_Count,\r\n  --Volumes\r\n  ed.total_company_boe_volume as Gross_BOE_Volume, ed.company_wi_boe_volume as WI_BOE_Volume, ed.company_share_boe_volume as CoShare_BOE_Volume, \r\n  ed.oil_pool_volume as Gross_Oil_Volume, ed.oil_working_interest_volume as WI_Oil_Volume,ed.oil_royalty_interest_volume as RI_Oil_Volume, ed.company_share_oil_volume as CoShare_Oil_Volume, \r\n  ed.gas_pool_volume as Gross_Gas_Volume, ed.gas_working_interest_volume as WI_Gas_Volume,ed.gas_royalty_interest_volume as RI_Gas_Volume,ed.company_share_gas_volume as CoShare_Gas_Volume,\r\n  ed.raw_gas_pool_volume as Gross_Raw_Gas_Volume, ed.raw_gas_wi_volume as WI_Raw_Gas_Volume,\r\n  ed.ngl_pool_volume as Gross_NGL_Volume,ed.ngl_working_interest_volume as WI_NGL_Volume, ed.ngl_royalty_interest_volume as RI_NGL_Volume,ed.company_share_ngl_volume as CoShare_NGL_Volume,\r\n  ed.fcond_lease_volume as Gross_Fcond_Volume,ed.fcond_working_interest_volume as WI_Fcond_Volume,ed.fcond_royalty_interest_volume as RI_Fcond_Volume,ed.company_share_fcond_volume as CoShare_Fcond_Volume,\r\n  ed.cond_pool_volume as Gross_Cond_Volume, ed.cond_working_interest_volume as WI_Cond_Volume, ed.cond_royalty_interest_volume as RI_Cond_Volume,ed.company_share_cond_volume as CoShare_Cond_Volume,\r\n  ed.prop_pool_volume as Gross_Prop_Volume, ed.prop_working_interest_volume as WI_Prop_Volume,ed.prop_royalty_interest_volume as RI_Prop_Volume,ed.company_share_prop_volume as CoShare_Prop_Volume,\r\n  ed.but_pool_volume as Gross_Butane_Volume,ed.but_working_interest_volume as WI_Butane_Volume,
            ed.but_royalty_interest_volume as RI_Butane_Volume,ed.company_share_but_volume as CoShare_Butane_Volume,\r\n  ed.eth_pool_volume as Gross_Eth_Volume, ed.eth_working_interest_volume as WI_Eth_Volume, ed.eth_royalty_interest_volume as RI_Eth_Volume,ed.company_share_eth_volume as CoShare_Eth_Volume, \r\n--Capital\r\n  ed.net_investment as Total_Capital, \r\n  ed.committed_leasehold_cost as Land, \r\n  ed.exploration_g_g as Seismic_Studies_Capitalized_OH, \r\n  (ed.development_drilling + ed.committed_dev_drilling) as Dev_Drilling, \r\n  (ed.exploration_drilling + ed.committed_exp_drilling) as Exp_Drilling,\r\n  (ed.eor_drilling +  ed.committed_eor_drilling) as EOR_Drilling,\r\n  (ed.development_completion + ed.committed_dev_completion) as Dev_Completion, \r\n  (ed.exploration_completion + ed.committed_exp_completion) as Exp_Completion,\r\n  (ed.eor_completion+ ed.committed_eor_completion) as EOR_Completion,  \r\n  (ed.oilfield_equipment + ed.committed_oilfield_equip) as Well_Equipping, \r\n  (ed.eor_equipment + ed.committed_eor_equipment) as EOR_Equipping,\r\n  (ed.storage_tank + ed.committed_storage_tank) as Well_Pad_Pipeline_Tie_In, \r\n  (ed.equipment_supply + ed.committed_equip_supply) as Workover_Recompletion,\r\n  (ed.gas_gathering_system + ed.committed_gas_gath_sys) as Optimization,\r\n  (ed.gas_plant + ed.committed_gas_plant) as Facilities_Major_Pp,\r\n  (ed.gas_well_equipment + ed.committed_gas_well_equip) as Subsurface_Maintenance,\r\n  (ed.other_capital + ed.committed_other_capital) as Other_Capital_Costs, \r\n  (ed.other_equipment + ed.committed_other_equip) as Controllable_Inventory,\r\n  ed.gross_leasehold_cost as Gross_Land, \r\n  ed.gross_exp_g_g as Gross_Seismic_Studies_Cap_OH, \r\n  ed.gross_dev_drilling as Gross_Dev_Drilling, \r\n  ed.gross_exp_drilling as Gross_Exp_Drilling,\r\n  ed.gross_eor_drilling as Gross_EOR_Drilling, \r\n  ed.gross_dev_completion as Gross_Dev_Completion, \r\n  ed.gross_exp_completion as Gross_Exp_Completion,\r\n  ed.gross_eor_completion as Gross_EOR_Completion,\r\n  ed.gross_oilfield_equip as Gross_Well_Equipping,\r\n  ed.gross_eor_equipment as Gross_EOR_Equip,\r\n  ed.gross_storage_tank as Gross_Well_Pad_Pipeline_Tie_In,\r\n  ed.gross_equip_supply as Gross_Workover_Recompletion,\r\n  ed.gross_gas_gath_sys as Gross_Optimization,\r\n  ed.gross_gas_plant as Gross_Facilities_Major_Pp,\r\n  ed.gross_gas_well_equip as Gross_Subsurface_Maintenance,\r\n  ed.gross_other_capital as Gross_Other_Capital,\r\n  ed.gross_other_equip as Gross_Controllable_Inventory,\r\n  (ed.gross_leasehold_cost +\r\n  ed.gross_exp_g_g +\r\n  ed.gross_dev_drilling +\r\n  ed.gross_exp_drilling +\r\n  ed.gross_eor_drilling +\r\n  ed.gross_dev_completion + \r\n  ed.gross_exp_completion +\r\n  ed.gross_eor_completion +\r\n  ed.gross_oilfield_equip +\r\n  ed.gross_eor_equipment +\r\n  ed.gross_storage_tank +\r\n  ed.gross_equip_supply +\r\n  ed.gross_gas_gath_sys +\r\n  ed.gross_gas_plant +\r\n  ed.gross_gas_well_equip +\r\n  ed.gross_other_capital +\r\n  ed.gross_other_equip) as Total_Gross_Capital,\r\n  -- Per-Day Volumes\r\n  (ed.company_share_boe_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')))) as Daily_CoShare_BOE,\r\n  (ed.company_share_oil_volume /EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Oil_Volume,\r\n  (ed.company_share_gas_volume /EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Gas_Volume,\r\n  (ed.company_share_ngl_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_NGL_Volume,\r\n  (ed.company_share_boe_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))\
            \  as Daily_CoShare_BOE_Volume,\r\n  (ed.company_share_eth_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Eth_Volume,\r\n  (ed.company_share_prop_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Prop_Volume,\r\n  (ed.company_share_cond_volume /EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Cond_Volume,\r\n  (ed.company_share_fcond_volume /EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD'))))  as Daily_CoShare_Fcond_Volume,\r\n  (ed.company_share_but_volume/EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')))) as Daily_CoShare_But_Volume,\r\n  --\r\n  DECODE(ee.entity_state_id,0,'Approved',4,'Vintage','Unknown') as Entity_State_Desc,  \r\n  LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')) ACCT_PER_DATE,\r\n  ee.entity_id,\r\n  ee.entity_state_id,\r\n  ee.uuid as entity_uuid,\r\n  v.vintage_id,\r\n  ec.case_id,  \r\n  er.result_id,\r\n  er.reserve_category_id,\r\n  er.company_id,\r\n  pd.price_deck_id \r\nFROM \r\n  DS_MOSAIC_CDM.ECONOMIC_RESULT er, \r\n  DS_MOSAIC_CDM.ECONOMIC_DETAIL ed, \r\n  DS_MOSAIC_CDM.ECONOMIC_ENTITY ee, \r\n  DS_MOSAIC_CDM.RESERVE_CATEGORY rc , \r\n  DS_MOSAIC_CDM.ECONOMIC_CASE ec, \r\n  DS_MOSAIC_CDM.PRICE_DECK pd,\r\n  DS_MOSAIC_CDM.VINTAGE v,  \r\n  DS_MOSAIC_CDM.PARTICIPANT p,  \r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLAY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 56240) ep,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"METER_STATION\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 8201) em,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"CAPITAL_CATEGORY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64240) ecc,   \r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PROJECT_RATIONALE\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64241) epr,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_BUSINESS_UNIT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104242) ephbu,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_DISTRICT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104241) ephd,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_AREA\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104240) epha,\r\n (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_CAP_DESC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 128240) aro,\r\n(SELECT
            DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_ABDN_YR\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132241) aroy,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_GR_WC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132242) arowc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DIST_2_LOC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132240) d2sl,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DEV_SCENARIO\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 124241) devsc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLANT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 4200) epl, \r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"BATTERY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 16241) ebt,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"SAP_PROJECT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 136240) esapprj  \t  \r\nWHERE \r\n  ee.entity_state_id IN (0,4)\r\n  AND er.reserve_category_id in (101,102, 104, 106, 108, 10 , 11, 15, 53, 54, 55)\r\n    -- 101 = Base, 102 = Growth 1, 104 - G2,106 = G3,108 = G4,\r\n    -- 10 = Storage 1, 11 = Storage2 ,\r\n    -- 15 = Budget Scenario 1, 53 = Budget Scenario 2, 54 = Budget Scenario 3, 55 = Budget Scenario 4\r\n  AND er.risk in('B','N')-- risked is  'B'  B if no risk is entered, N is unrisked input\r\n  AND ee.user_defined_10 LIKE ('%LRP%')\r\n  AND ee.parent_entity_id is null\r\n  AND er.result_id = ed.result_id\r\n  AND ee.entity_id = er.entity_id\r\n  AND er.reserve_category_id = rc.category_value\r\n  AND ec.price_deck_id = pd.price_deck_id\r\n  AND er.case_id = ec.case_id \r\n  AND er.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  AND ee.vintage_id = v.vintage_id(+) \r\n  AND ee.entity_id = ep.entity_id(+)\r\n  AND ee.entity_id = em.entity_id(+)\r\n  AND ee.entity_id = ecc.entity_id(+)\r\n  AND ee.entity_id = epr.entity_id(+) \r\n  AND ee.entity_id = ephbu.entity_id(+)\r\n  AND ee.entity_id = ephd.entity_id(+)\r\n  AND ee.entity_id = epha.entity_id(+)\r\n  AND ee.entity_id = aro.entity_id(+)\r\n  AND ee.entity_id = aroy.entity_id(+)\r\n  AND ee.entity_id = arowc.entity_id(+)\r\n  AND ee.entity_id = d2sl.entity_id(+)  \r\n  AND ee.entity_id = devsc.entity_id(+)  \r\n  AND ee.entity_id = epl.entity_id(+)  \r\n  AND ee.entity_id = ebt.entity_id(+) \r\n  AND ee.entity_id = esapprj.entity_id(+)   \r\n  AND ee.entity_id = p.entity_id(+)\r\n  AND p.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  -- Orphaned Results Workaround\r\n  AND EXISTS (SELECT * FROM DS_MOSAIC_CDM.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)  "
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_CDM_ECONOMIC_CASE
