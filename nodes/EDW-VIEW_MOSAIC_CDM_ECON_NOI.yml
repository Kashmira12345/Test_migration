      - aliases:
          ODS_MOSAIC_CDM_ECONOMIC_CASE: 3908eaa9-7e54-fe91-8aa7-bc07d0b72a63
          ODS_MOSAIC_CDM_ECONOMIC_DETAIL: 3abde54f-73f3-8da7-2f0e-adf08f9e72b5
          ODS_MOSAIC_CDM_ECONOMIC_ENTITY: 13de67e1-a562-3964-a73b-6e584b1c6ac1
          ODS_MOSAIC_CDM_ECONOMIC_RESULT: 4daa6fb1-9194-e45f-c67f-933685cb0bfc
          ODS_MOSAIC_CDM_ENTITY_UDL: d7a41366-2310-86ce-193b-a8aeb0511383
          ODS_MOSAIC_CDM_PARTICIPANT: 689fe9b6-4b12-ce3c-8528-7ad3fee9d7ee
          ODS_MOSAIC_CDM_PRICE_DECK: 07a2c4f9-0614-6694-18b4-506d62928413
          ODS_MOSAIC_CDM_VINTAGE: 73fb6e10-1308-06a7-e44c-09f5136a54f9
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_CDM_ECON_NOI] AS\r\nSELECT \r\n  TRIM(TRANSLATE(SUBSTR(ec.case_name,1,1),'*#^',' ')||SUBSTR(ec.case_name,2)) as Economic_Case,\r\n  DECODE(SUBSTR(ec.case_name,1,1),'*','Approved','#','Vintage Source','^','Vintage','Undefined') as Economic_State,\r\n  ec.case_name as Case_Name,\r\n  ec.case_description as Case_Description,\r\n  pd.name as Price_Deck, \r\n  ec.results_currency_code Currency, \r\n  ee.entity_name as Entity_Name, \r\n  v.vintage_name as Vintage_Name,\r\n  rc.category_name as Category,\r\n  ee.user_defined_14 as Business_Unit,\r\n  ee.user_defined_15 as District,\r\n  ee.user_defined_16 as Core_Area,\r\n  ee.user_defined_17 as Area,\r\n  ee.user_defined_13 as CC,\r\n  ee.project_identifier as Project_Identifier,\r\n  ee.user_defined_10 as Workflow,\r\n  ee.user_defined_18 as Budget_Year,\r\n  ee.user_defined_7 as Capital_Year,\r\n  ee.user_defined_8 as Volume_Year,\r\n  ee.user_defined_5 as Capital_Expense_Category,\r\n  ee.user_defined_1 as Capital_Production_Classification,  \r\n  ee.user_defined_19 as Strategic,\r\n  ee.user_defined_2 as Op_Non_Op,\r\n  ee.user_defined_9 as Exploitation_Engineer,\r\n  ee.user_defined_20 as Production_Engineer,\r\n  ee.user_defined_4 as Prev_Hier_Core_Area,\r\n  ee.user_defined_6 as Gross_Well_Count,\r\n  ee.user_defined_11 as Well_Count_Year,\r\n  ee.user_defined_12 as Asset_Play_Area,\r\n  ee.user_defined_3 as Risk_Tier,\r\n  ee.user_defined_12 as Play,\r\n  --Ext UDLs \r\n  em.METER_STATION as Meter_Station,\r\n  ecc.CAPITAL_CATEGORY as Facility_Capital_Category,\r\n  epr.PROJECT_RATIONALE as Facility_Project_Rationale,\r\n  ephbu.PREV_HIER_BUSINESS_UNIT Prev_Hier_Business_Unit,\r\n  ephd.PREV_HIER_DISTRICT Prev_Hier_District,\r\n  epha.PREV_HIER_AREA Prev_Hier_Area,\r\n  aro.ARO_CAP_DESC as ARO_Capital_Desc,\r\n  aroy.ARO_ABDN_YR as ARO_Abandonment_Yr,\r\n  arowc.ARO_GR_WC as ARO_Gross_Well_Count,\r\n  d2sl.DIST_2_LOC as Dist_2_Loc, \r\n  devsc.DEV_SCENARIO as Development_Scenario,\r\n  epl.PLANT as Plant,\r\n  ebt.BATTERY as Battery,\r\n  esapprj.SAP_PROJECT as SAP_Project,   \r\n  --\r\n  ee.on_production_date as Estimated_On_Prod_Date,\r\n  ee.rig_release_date as Rig_Release_Date,  \r\n  ed.year as Year, \r\n  ed.month as Month,\r\n  ed.oil_well_count as Oil_Well_Count,\r\n  ed.gas_well_count as Gas_Well_Count,\r\n  --Volumes\r\n  ed.company_share_boe_volume as CoShare_BOE_Volume,\r\n  ed.company_share_oil_volume as CoShare_Oil_Volume,\r\n  (\r\n    ed.company_share_cond_volume + ed.company_share_fcond_volume\r\n  ) as CoShare_VET_Cond_Volume,\r\n  ed.company_share_gas_volume as CoShare_Gas_Volume,\r\n  (\r\n    ed.company_share_ngl_volume - ed.company_share_cond_volume - ed.company_share_fcond_volume\r\n  ) as CoShare_VET_NGL_Volume,\r\n  ed.net_revenue_before_royalty as Revenue_Before_Royalty,\r\n  ed.state_royalties as State_Share,\r\n  ed.net_revenue_after_royalty as Revenue_After_Royalty,\r\n  ed.transportation_cost as Transportation_Cost,\r\n  ed.lease_transportation_cost as Lease_Transportation_Cost,\r\n  ed.TOTAL_COMPANY_BOE_VOLUME as Gross_Lease_BOE_Volumes,\r\n  ed.site_restoration_cost as Abandonment,\r\n  ed.net_operating_income as Net_Operating_Income,\r\n  ed.total_net_investment as Total_Net_Investment,\r\n  ed.before_tax_cash_flow as Before_Tax_Cash_Flow,\r\n  ed.federal_income_tax as Federal_Income_Tax,\r\n  ed.state_income_tax as State_Income_Tax, \r\n  ed.after_tax_cash_flow as After_Tax_Cash_Flow,\r\n  --\r\n  DECODE(ee.entity_state_id,0,'Approved',4,'Vintage','Unknown') as Entity_State_Desc,  \r\n  LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')) ACCT_PER_DATE,\r\n  ee.entity_id,\r\n  ee.entity_state_id,\r\n  ee.uuid as entity_uuid,\r\n  v.vintage_id,\r\n  ec.case_id,  \r\n  er.result_id,\r\n  er.reserve_category_id,\r\n  er.company_id,\r\n  pd.price_deck_id   \r\nFROM \r\n  DS_MOSAIC_CDM.ECONOMIC_RESULT er, \r\n  DS_MOSAIC_CDM.ECONOMIC_DETAIL ed, \r\n  DS_MOSAIC_CDM.ECONOMIC_ENTITY ee, \r\n  DS_MOSAIC_CDM.RESERVE_CATEGORY
            rc , \r\n  DS_MOSAIC_CDM.ECONOMIC_CASE ec, \r\n  DS_MOSAIC_CDM.PRICE_DECK pd,\r\n  DS_MOSAIC_CDM.VINTAGE v,  \r\n  DS_MOSAIC_CDM.PARTICIPANT p,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLAY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 56240) ep,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"METER_STATION\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 8201) em,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"CAPITAL_CATEGORY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64240) ecc,   \r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PROJECT_RATIONALE\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64241) epr,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_BUSINESS_UNIT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104242) ephbu,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_DISTRICT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104241) ephd,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_AREA\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104240) epha,\r\n (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_CAP_DESC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 128240) aro,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_ABDN_YR\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132241) aroy,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_GR_WC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132242) arowc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DIST_2_LOC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132240) d2sl,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DEV_SCENARIO\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 124241) devsc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLANT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 4200) epl, \r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"BATTERY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 16241) ebt,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL
            \"SAP_PROJECT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 136240) esapprj  \t  \r\nWHERE \r\n  ee.entity_state_id IN (0,4)  AND er.reserve_category_id in (101, 102, 104, 106, 108) \r\n -- 101 = Base, 102 = Growth 1, 104 -G2,106 = G3,108 = G4\r\n  AND er.risk in('B', 'Y') -- risked is  'B'  B if no risk is entered, Y is risk input\r\n  AND ee.user_defined_10 = 'Budget/Fcast/LRP'\r\n  AND ee.parent_entity_id is null\r\n  AND er.result_id = ed.result_id\r\n  AND ee.entity_id = er.entity_id\r\n  AND er.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  AND er.reserve_category_id = rc.category_value\r\n  AND ec.price_deck_id = pd.price_deck_id\r\n  AND er.case_id = ec.case_id \r\n  AND ec.case_description = 'NOI'  \r\n  AND ee.vintage_id = v.vintage_id(+) \r\n  AND ee.entity_id = ep.entity_id(+)\r\n  AND ee.entity_id = em.entity_id(+)\r\n  AND ee.entity_id = ecc.entity_id(+)\r\n  AND ee.entity_id = epr.entity_id(+) \r\n  AND ee.entity_id = ephbu.entity_id(+)\r\n  AND ee.entity_id = ephd.entity_id(+)\r\n  AND ee.entity_id = epha.entity_id(+)\r\n  AND ee.entity_id = aro.entity_id(+)\r\n  AND ee.entity_id = aroy.entity_id(+)\r\n  AND ee.entity_id = arowc.entity_id(+)\r\n  AND ee.entity_id = d2sl.entity_id(+)  \r\n  AND ee.entity_id = devsc.entity_id(+)  \r\n  AND ee.entity_id = epl.entity_id(+)  \r\n  AND ee.entity_id = ebt.entity_id(+) \r\n  AND ee.entity_id = esapprj.entity_id(+)    \r\n  AND ee.entity_id = p.entity_id(+)\r\n  AND p.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  -- Orphaned Results Workaround\r\n  AND EXISTS (SELECT * FROM DS_MOSAIC_CDM.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)  "
