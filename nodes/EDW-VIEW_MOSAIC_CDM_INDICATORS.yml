          ODS_MOSAIC_CDM_ECONOMIC_RESULT: 4daa6fb1-9194-e45f-c67f-933685cb0bfc
          ODS_MOSAIC_CDM_ENTITY_UDL: d7a41366-2310-86ce-193b-a8aeb0511383
          ODS_MOSAIC_CDM_PARTICIPANT: 689fe9b6-4b12-ce3c-8528-7ad3fee9d7ee
          ODS_MOSAIC_CDM_PRICE_DECK: 07a2c4f9-0614-6694-18b4-506d62928413
          ODS_MOSAIC_CDM_RESERVE_CATEGORY: 9bf103f9-437d-1493-1d81-4cb375eeae97
          ODS_MOSAIC_CDM_VINTAGE: 73fb6e10-1308-06a7-e44c-09f5136a54f9
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_CDM_INDICATORS] AS\r\nSELECT \r\n  TRIM(TRANSLATE(SUBSTR(ec.case_name,1,1),'*#^!',' ')||SUBSTR(ec.case_name,2)) as Economic_Case,\r\n  DECODE(SUBSTR(ec.case_name,1,1),'*','Approved','#','Vintage Source','^','Vintage','!','Approved','Undefined') as Economic_State,  \r\n  ec.case_id as Economic_Case_ID,\r\n  ec.case_name as Case_Name,\r\n  ec.case_description as Case_Description,\r\n  pd.name as Price_Deck, \r\n  ec.results_currency_code as Currency, \r\n  ee.entity_name as Entity_Name, \r\n  v.vintage_name as Vintage_Name,\r\n  rc.category_name as Category,\r\n  ee.Country as Country,\r\n  ee.user_defined_14 as Business_Unit,\r\n  ee.user_defined_15 as District,\r\n  ee.user_defined_16 as Core_Area,\r\n  ee.user_defined_17 as Area,\r\n  ee.user_defined_13 as CC,\r\n  ee.project_identifier as Project_Identifier,\r\n  ee.user_defined_10 as Workflow,\r\n  ee.user_defined_18 as Budget_Year,\r\n  ee.user_defined_7 as Capital_Year,\r\n  ee.user_defined_8 as Volume_Year,\r\n  ee.user_defined_5 as Capital_Expense_Category,\r\n  ee.user_defined_1 as Capital_Prod_Class,  \r\n  ee.user_defined_19 as Strategic,\r\n  ee.user_defined_2 as Op_Non_Op,\r\n  ee.user_defined_9 as Exploitation_Engineer,\r\n  ee.user_defined_20 as Production_Engineer,\r\n  ee.user_defined_4 as Prev_Hier_Core_Area,\r\n  ee.user_defined_6 as Gross_Well_Count,\r\n  ee.user_defined_11 as Well_Count_Year,\r\n  ee.user_defined_12 as Asset_Play_Area,\r\n  ee.user_defined_3 as Risk_Tier,\r\n  ee.user_defined_12 as Play,\r\n  --Ext UDLs   \r\n  em.METER_STATION as Meter_Station,\r\n  ecc.CAPITAL_CATEGORY as Facility_Capital_Category,\r\n  epr.PROJECT_RATIONALE as Facility_Project_Rationale,\r\n  ephbu.PREV_HIER_BUSINESS_UNIT Prev_Hier_Business_Unit,\r\n  ephd.PREV_HIER_DISTRICT Prev_Hier_District,\r\n  epha.PREV_HIER_AREA Prev_Hier_Area, \r\n  aro.ARO_CAP_DESC as ARO_Capital_Desc,\r\n  aroy.ARO_ABDN_YR as ARO_Abandonment_Yr,\r\n  arowc.ARO_GR_WC as ARO_Gross_Well_Count,\r\n  d2sl.DIST_2_LOC as Dist_2_Loc,\r\n  devsc.DEV_SCENARIO as Development_Scenario,  \r\n  epl.PLANT as Plant,\r\n  ebt.BATTERY as Battery, \r\n  esapprj.SAP_PROJECT as SAP_Project,  \r\n  --  \r\n  ei.COE as Chance_of_Expenditure, \r\n  ei.POS as Probability_of_Success, \r\n  ei.npv_cash_flow_3_btax as NPV10_BTAX_CF,\r\n  ei.npv_cash_flow_3_atax as NPV10_ATAX_CF,\r\n  DECODE(ei.boe_gross_total,0,0, ((ei.boe_company_share_total/ei.boe_gross_total)*100)) as Avg_CoShare_Interest,\r\n  ei.earliest_investment_date as First_Capital_Date,\r\n  ei.npv_investment_0_btax as Total_Capital,\r\n  ei.earliest_prod_date as On_Prod_Month,\r\n  DECODE(ee.entity_type,1, 'Oil,', 2, 'Gas', 'Other')as Product_Type,\r\n  ei.first_x_co_share_boe_per_day as FIRST_12MOS_BOEPD,\r\n  (ei.first_yr_co_share_boe / 365) as Calendar_Year_BOEPD,\r\n  DECODE(ei.npv_investment_detail_btax,0,0, (ei.npv_op_income_detail_btax / ei.npv_investment_detail_btax)) as Btax_DPI,\r\n  DECODE(ei.npv_investment_detail_atax,0,0, (ei.npv_op_income_detail_atax / ei.npv_investment_detail_atax)) as Atax_DPI,\r\n  ei.btax_dcf_ror as Btax_ROR,npv_cash_flow_detail_btax,\r\n  ei.atax_dcf_ror as Atax_ROR,\r\n  ei.npv_cash_flow_detail_btax as Btax_NPV10,\r\n  ei.npv_cash_flow_detail_atax as Atax_NPV10,\r\n  DECODE(ei.boe_company_share_total ,0,0,(ei.npv_op_income_0_btax/ei.boe_company_share_total)*1000) as Netback_Per_CoShare_BOE,\r\n  DECODE(ei.npv_investment_detail_btax,0,0, (ei.npv_cash_flow_detail_btax / ei.npv_investment_detail_btax)) as NPV_Disc_Invest_Btax,\r\n  ei.boe_company_share_total as BOE_Company_Share_Total,\r\n  ei.btax_dcf_ror as Btax_Disc_ROR,\r\n  ei.atax_dcf_ror as Atax_Disc_ROR,\r\n  ei.coe  as Chance_of_Occurence,\r\n  ei.pos as Prob_of_Success,\r\n  ei.payout_date_btax as Payout_Date_Btax,\r\n  ei.payout_date_atax as Payout_Date_Atax,\r\n  ee.entity_id,\r\n  ee.entity_state_id,\r\n  ee.uuid as entity_uuid,\r\n  v.vintage_id,\r\n  ec.case_id,  \r\n  er.result_id,\r\n  er.reserve_category_id,\r\n  er.company_id,\r\n  pd.price_deck_id\r\nFROM\r\n  DS_MOSAIC_CDM.ECONOMIC_RESULT
            er, \r\n  DS_MOSAIC_CDM.ECONOMIC_INDICATOR ei, \r\n  DS_MOSAIC_CDM.ECONOMIC_ENTITY ee, \r\n  DS_MOSAIC_CDM.RESERVE_CATEGORY rc , \r\n  DS_MOSAIC_CDM.ECONOMIC_CASE ec, \r\n  DS_MOSAIC_CDM.PRICE_DECK pd,\r\n  DS_MOSAIC_CDM.VINTAGE v,\r\n  DS_MOSAIC_CDM.PARTICIPANT p,    \r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLAY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 56240) ep,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"METER_STATION\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 8201) em,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"CAPITAL_CATEGORY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64240) ecc,   \r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PROJECT_RATIONALE\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 64241) epr,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_BUSINESS_UNIT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104242) ephbu,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_DISTRICT\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104241) ephd,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PREV_HIER_AREA\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 104240) epha,\r\n (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_CAP_DESC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 128240) aro,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_ABDN_YR\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132241) aroy,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"ARO_GR_WC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132242) arowc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DIST_2_LOC\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 132240) d2sl,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"DEV_SCENARIO\"\r\n\tFROM\r\n\t  DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 124241) devsc,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLANT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 4200) epl, \r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"BATTERY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND
            EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 16241) ebt,\r\n(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"SAP_PROJECT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 136240) esapprj\t  \r\nWHERE \r\n      ee.entity_state_id in (0,4)\r\n      --IN (0,4)\r\n  AND er.reserve_category_id in (101,102, 104, 106, 108, 10 , 11, 15, 53, 54, 55)\r\n    -- 101 = Base, 102 = Growth 1, 104 - G2,106 = G3,108 = G4,\r\n    -- 10 = Storage 1, 11 = Storage2 ,\r\n    -- 15 = Budget Scenario 1, 53 = Budget Scenario 2, 54 = Budget Scenario 3, 55 = Budget Scenario 4  \r\n  AND er.risk in('B','Y')-- risked is  'B'  B if no risk is entered, Y is risk input\r\n  AND ee.user_defined_10 LIKE ('%LRP%')\r\n  AND ee.parent_entity_id IS NULL\r\n  AND er.result_id = ei.result_id\r\n  AND ee.entity_id = er.entity_id\r\n  AND er.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  AND rc.category_value = er.reserve_category_id\r\n  AND ec.price_deck_id = pd.price_deck_id\r\n  AND er.case_id = ec.case_id \r\n  AND ee.vintage_id = v.vintage_id(+)\r\n  AND ee.entity_id = ep.entity_id(+)\r\n  AND ee.entity_id = em.entity_id(+)\r\n  AND ee.entity_id = ecc.entity_id(+)\r\n  AND ee.entity_id = epr.entity_id(+) \r\n  AND ee.entity_id = ephbu.entity_id(+)\r\n  AND ee.entity_id = ephd.entity_id(+)\r\n  AND ee.entity_id = epha.entity_id(+) \r\n  AND ee.entity_id = aro.entity_id(+)\r\n  AND ee.entity_id = aroy.entity_id(+)\r\n  AND ee.entity_id = arowc.entity_id(+)\r\n  AND ee.entity_id = d2sl.entity_id(+) \r\n  AND ee.entity_id = devsc.entity_id(+)  \r\n  AND ee.entity_id = epl.entity_id(+)  \r\n  AND ee.entity_id = ebt.entity_id(+)  \r\n  AND ee.entity_id = esapprj.entity_id(+)  \r\n  AND ee.entity_id = p.entity_id(+)\r\n  AND p.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  -- Orphaned Results Workaround\r\n  AND EXISTS (SELECT * FROM DS_MOSAIC_CDM.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)  \r\n"
