        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_CDM_VOLUMES] AS\r\nSELECT \r\n  TRIM(TRANSLATE(SUBSTR(ec.case_name,1,1),'*#^!',' ')||SUBSTR(ec.case_name,2)) as Economic_Case,\r\n  DECODE(SUBSTR(ec.case_name,1,1),'*','Approved','#','Vintage Source','^','Vintage','!','Approved','Undefined') as Economic_State,\r\n  ec.case_name as Case_Name,\r\n  ee.entity_name as Entity_Name, \r\n  v.vintage_name as Vintage_Name,\r\n  rc.category_name as Category,\r\n  --UDLs\r\n  ee.user_defined_14 as Business_Unit,\r\n  ee.user_defined_15 as District,\r\n  ee.user_defined_16 as Core_Area,\r\n  ee.user_defined_17 as Area,  \r\n  ee.user_defined_13 as CC,\r\n  ee.user_defined_5 as Capital_Expense_Category,\r\n  ee.user_defined_1 as Capital_Production_Classification,\r\n  ee.user_defined_2 as Op_Non_Op,\r\n  --Ext UDLs\r\n  epl.PLANT as Plant,\r\n  ebt.BATTERY as Battery,\r\n  --\r\n  ed.year as Year, \r\n  ed.month as Month,\r\n  ed.explor_prob_success as POS,\r\n  ed.oil_well_count as Oil_Well_Count,\r\n  ed.gas_well_count as Gas_Well_Count,\r\n  --Volumes\r\n  ed.total_company_boe_volume as Gross_BOE_Volume, ed.company_wi_boe_volume as WI_BOE_Volume, ed.company_share_boe_volume as CoShare_BOE_Volume, \r\n  ed.oil_pool_volume as Gross_Oil_Volume, ed.oil_working_interest_volume as WI_Oil_Volume,ed.oil_royalty_interest_volume as RI_Oil_Volume, ed.company_share_oil_volume as CoShare_Oil_Volume, \r\n  ed.gas_pool_volume as Gross_Gas_Volume, ed.gas_working_interest_volume as WI_Gas_Volume,ed.gas_royalty_interest_volume as RI_Gas_Volume,ed.company_share_gas_volume as CoShare_Gas_Volume,\r\n  ed.raw_gas_pool_volume as Gross_Raw_Gas_Volume, ed.raw_gas_wi_volume as WI_Raw_Gas_Volume,\r\n  ed.ngl_pool_volume as Gross_NGL_Volume,ed.ngl_working_interest_volume as WI_NGL_Volume, ed.ngl_royalty_interest_volume as RI_NGL_Volume,ed.company_share_ngl_volume as CoShare_NGL_Volume,\r\n  ed.fcond_lease_volume as Gross_Fcond_Volume,ed.fcond_working_interest_volume as WI_Fcond_Volume,ed.fcond_royalty_interest_volume as RI_Fcond_Volume,ed.company_share_fcond_volume as CoShare_Fcond_Volume,\r\n  ed.cond_pool_volume as Gross_Cond_Volume, ed.cond_working_interest_volume as WI_Cond_Volume, ed.cond_royalty_interest_volume as RI_Cond_Volume,ed.company_share_cond_volume as CoShare_Cond_Volume,\r\n  ed.prop_pool_volume as Gross_Prop_Volume, ed.prop_working_interest_volume as WI_Prop_Volume,ed.prop_royalty_interest_volume as RI_Prop_Volume,ed.company_share_prop_volume as CoShare_Prop_Volume,\r\n  ed.but_pool_volume as Gross_Butane_Volume,ed.but_working_interest_volume as WI_Butane_Volume, ed.but_royalty_interest_volume as RI_Butane_Volume,ed.company_share_but_volume as CoShare_Butane_Volume,\r\n  ed.eth_pool_volume as Gross_Eth_Volume, ed.eth_working_interest_volume as WI_Eth_Volume, ed.eth_royalty_interest_volume as RI_Eth_Volume,ed.company_share_eth_volume as CoShare_Eth_Volume, \r\n  --Gross Volumes per Day\r\n  ed.oil_daily_volume as Daily_Gross_Oil_Volume,\r\n  ed.gas_daily_volume as Daily_Gross_Gas,\r\n  ed.raw_gas_daily_volume as  Daily_Gross_Raw_Gas,\r\n  ed.ngl_daily_volume as Daily_Gross_NGL_Volume,\r\n  ed.eth_daily_volume as Daily_Gross_Eth_Volume,\r\n  ed.prop_daily_volume as Daily_Gross_Prop_Volume,\r\n  ed.cond_daily_volume as Daily_Gross_Cond_Volume,\r\n  ed.fcond_daily_volume as Daily_Gross_Fcond_Volume,\r\n  ed.but_daily_volume as Daily_Gross_But_Volume,\r\n  DECODE(ee.entity_state_id,1,'Working',4,'Vintaged','Unknown') as Entity_State_Desc,  \r\n  LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')) ACCT_PER_DATE,\r\n  ee.user_defined_10 as Workflow,\r\n  ee.entity_id,\r\n  ee.entity_state_id,\r\n  ee.uuid as entity_uuid,\r\n  v.vintage_id,\r\n  ec.case_id,  \r\n  er.result_id,\r\n  er.reserve_category_id,\r\n  er.company_id\r\nFROM \r\n  DS_MOSAIC_CDM.ECONOMIC_RESULT er, \r\n  DS_MOSAIC_CDM.ECONOMIC_DETAIL ed, \r\n  DS_MOSAIC_CDM.ECONOMIC_ENTITY ee, \r\n  DS_MOSAIC_CDM.RESERVE_CATEGORY rc , \r\n  DS_MOSAIC_CDM.ECONOMIC_CASE ec,\r\n  DS_MOSAIC_CDM.VINTAGE v,  \r\
            \n  DS_MOSAIC_CDM.PARTICIPANT p,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"PLANT\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 4200) epl,\r\n  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL \"BATTERY\"\r\n    FROM\r\n      DS_MOSAIC_CDM.ENTITY_UDL EU,\r\n      DS_MOSAIC_CDM.UDL_ELEMENT UE\r\n    WHERE EU.UDL_ID = UE.UDL_ID\r\n      AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n      AND UE.UDL_ID = 16241) ebt\r\nWHERE \r\n  ee.entity_state_id in (4, 1, 0)-- 1 = Working Copy, 0 = Approved, 4 = Vintaged\r\n  AND er.reserve_category_id in (101,102,104, 106, 108)\r\n    -- 101 = Base, 102 = Growth 1, 104 - G2,106 = G3,108 = G4,\r\n  AND er.risk in('B','Y')-- risked is  'B'  B if no risk is entered, Y is risk input\r\n  AND (ee.user_defined_10 IN ('Budget/Forecast', 'LRP') or ee.user_defined_10 LIKE ('%LRP%'))\r\n  AND ee.parent_entity_id is null\r\n  AND er.result_id = ed.result_id\r\n  AND ee.entity_id = er.entity_id\r\n  AND er.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  AND er.entity_id = epl.entity_id(+)\r\n  AND er.entity_id = ebt.entity_id(+)\r\n  AND ee.vintage_id = v.vintage_id(+) \r\n  AND er.reserve_category_id = rc.category_value\r\n  AND er.case_id = ec.case_id  \r\n  AND ee.entity_id = p.entity_id(+)\r\n  AND p.company_id = $PMOSAIC_CDM_VET_COMPANY_ID$\r\n  -- Orphaned Results Workaround\r\n  AND EXISTS (SELECT * FROM DS_MOSAIC_CDM.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)  \r\n  ;"
        dependencies:
