      - aliases:
          ODS_MOSAIC_CDM_ECONOMIC_CASE: 3908eaa9-7e54-fe91-8aa7-bc07d0b72a63
          ODS_MOSAIC_CDM_ECONOMIC_DETAIL: 3abde54f-73f3-8da7-2f0e-adf08f9e72b5
          ODS_MOSAIC_CDM_ECONOMIC_ENTITY: 13de67e1-a562-3964-a73b-6e584b1c6ac1
          ODS_MOSAIC_CDM_ECONOMIC_RESULT: 4daa6fb1-9194-e45f-c67f-933685cb0bfc
          ODS_MOSAIC_CDM_ENTITY_UDL: d7a41366-2310-86ce-193b-a8aeb0511383
          ODS_MOSAIC_CDM_PARTICIPANT: 689fe9b6-4b12-ce3c-8528-7ad3fee9d7ee
