        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_RES_ECONOMICS] AS\r\nSELECT \r\n\tec.case_name as Economic_Case,\r\n\tpd.name as Price_Deck,\r\n\tec.results_currency_code as Currency,\r\n\tee.entity_name as Entity_Name,\r\n\tv.vintage_name as Vintage_Name,\r\n\trc.category_name as Category,\r\n\tee.entity_type as Primary_Product,\r\n\tee.production_class as Production_Class,\r\n\tee.secondary_class_type as Secondary_Class,\r\n\tee.USER_DEFINED_2 as Country,\r\n\tee.USER_DEFINED_3 as Province_State,\r\n\tee.USER_DEFINED_4 as Area_SBU,\r\n\tee.USER_DEFINED_5 as UDL_2019_Property,\r\n\tee.USER_DEFINED_6 as Engineering_Folder_1,\r\n\tee.USER_DEFINED_7 as Engineering_Folder_2,\r\n\tee.USER_DEFINED_8 as Prior_Year_Property,\r\n\tee.USER_DEFINED_9 as Prior_Year_Core_Area,\r\n\tee.USER_DEFINED_10 as VET_CGU,\r\n\tee.USER_DEFINED_11 as GLJ_Reconciliation_Folder,\r\n\tee.USER_DEFINED_12 as Engineering_Folder_3,\r\n\tee.USER_DEFINED_13 as Engineering_Folder_4,\r\n\tee.USER_DEFINED_14 as Engineering_Folder_5,\r\n\tee.USER_DEFINED_15 as Tax_Total,\r\n\tee.USER_DEFINED_16 as Probable_Undeveloped_Only,\r\n\tee.USER_DEFINED_17 as Current_Core_Property,\r\n\tee.USER_DEFINED_19 as Current_Core_Area,\r\n\t--Ext UDLs\r\n\tudl.Project as Project,\r\n\tudl.Property as Property,--10\r\n\tudl.Capital_Type as Capital_Type,--241\r\n\tudl.Entity_Type as Entity_Type,--247\r\n\tudl.Future_Loc_Form_Play_Type as Future_Loc_Form_Play_Type,--246\r\n\tudl.Future_Loc_IR_Group as Future_Loc_IR_Group,--260\r\n\tudl.Entity_Reserve_Category as Entity_Reserve_Category, --12240\r\n\tudl.Entity_Review_Status as Entity_Review_Status,--20240\r\n\tudl.Entity_Review_Stage as Entity_Review_Stage, --24240\r\n\tudl.Capital_Reconciliation as Capital_Reconciliation, --28240\r\n\tudl.MCD_Type_Well as MCD_Type_Well, --60240\r\n\tudl.Proved_Booking_Year as Proved_Booking_Year, --4240\r\n\tudl.Probable_Booking_Year as Probable_Booking_Year, --4241\r\n\tudl.MCD_Zone_Name as MCD_Zone_Name, --36240\r\n\t--\r\n\ted.year as Year, ed.month as Month,\r\n\tDECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) Days,\r\n\ted.avg_company_working_interest as Avg_Working_Interest,\r\n\ted.avg_company_share_interest as Avg_Company_Share_Interest,\r\n\ted.oil_well_count as Oil_Well_Count,\r\n\ted.gas_well_count as Gas_Well_Count,\r\n\t--Volumes\r\n\ted.total_company_boe_volume as Gross_BOE_Volume, ed.company_wi_boe_volume as WI_BOE_Volume, ed.company_share_boe_volume as CoShare_BOE_Volume,\r\n\ted.oil_pool_volume as Gross_Oil_Volume, ed.oil_working_interest_volume as WI_Oil_Volume,ed.oil_royalty_interest_volume as RI_Oil_Volume, ed.company_share_oil_volume as CoShare_Oil_Volume,\r\n\ted.gas_pool_volume as Gross_Gas_Volume, ed.gas_working_interest_volume as WI_Gas_Volume,ed.gas_royalty_interest_volume as RI_Gas_Volume,ed.company_share_gas_volume as CoShare_Gas_Volume,\r\n\ted.ngl_pool_volume as Gross_NGL_Volume,ed.ngl_working_interest_volume as WI_NGL_Volume, ed.ngl_royalty_interest_volume as RI_NGL_Volume,ed.company_share_ngl_volume as CoShare_NGL_Volume,\r\n\ted.eth_pool_volume as Gross_Eth_Volume, ed.eth_working_interest_volume as WI_Eth_Volume, ed.eth_royalty_interest_volume as RI_Eth_Volume,ed.company_share_eth_volume as CoShare_Eth_Volume, \r\n\ted.prop_pool_volume as Gross_Prop_Volume, ed.prop_working_interest_volume as WI_Prop_Volume,ed.prop_royalty_interest_volume as RI_Prop_Volume,ed.company_share_prop_volume as CoShare_Prop_Volume,\r\n\ted.but_pool_volume as Gross_Butane_Volume,ed.but_working_interest_volume as WI_Butane_Volume, ed.but_royalty_interest_volume as RI_Butane_Volume,ed.company_share_but_volume as CoShare_Butane_Volume,\r\n\ted.cond_pool_volume as Gross_Cond_Volume, ed.cond_working_interest_volume as WI_Cond_Volume, ed.cond_royalty_interest_volume as RI_Cond_Volume,ed.company_share_cond_volume as CoShare_Cond_Volume,\r\n\ted.fcond_lease_volume as Gross_Fcond_Volume,ed.fcond_working_interest_volume
            as WI_Fcond_Volume,ed.fcond_royalty_interest_volume as RI_Fcond_Volume,ed.company_share_fcond_volume as CoShare_Fcond_Volume,\r\n\t--WI Revenue\r\n\ted.oil_working_interest_revenue as Oil_WI_Revenue,\r\n\ted.gas_working_interest_revenue as Gas_WI_Revenue,\r\n\ted.ngl_working_interest_revenue as NGL_WI_Revenue, \r\n\ted.eth_working_interest_revenue as Ethane_WI_Revenue,\r\n\ted.prop_working_interest_revenue as Propane_WI_Revenue,\r\n\ted.but_working_interest_revenue as Butane_WI_Revenue,\r\n\ted.cond_working_interest_revenue as Condensate_WI_Revenue,\r\n\ted.fcond_revenue as Field_Condensate_WI_Revenue,\r\n\t--Co Share Revenue\r\n\ted.company_share_oil_revenue as Company_Share_Oil_Revenue,\r\n\ted.company_share_gas_revenue as Company_Share_Gas_Revenue,\r\n\ted.company_share_NGL_revenue as Company_Share_NGL_Revenue,\r\n\ted.company_share_eth_revenue as Company_Share_Ethane_Revenue,\r\n\ted.company_share_prop_revenue as Company_Share_Propane_Revenue,\r\n\ted.company_share_but_revenue as Company_Share_Butane_Revenue,\r\n\ted.company_share_cond_revenue as Company_Share_Cond_Revenue,\r\n\ted.company_share_fcond_revenue as Company_Share_FCond_Revenue,\r\n\ted.other_production_income as Other_Production_Income,\r\n\t--Royalties, Production Taxes and Operating Costs\r\n\ted.net_crown_royalty as Net_Crown_Royalty,\r\n\ted.net_revenue_before_royalty as Net_Revenue_Before_Royalty,\r\n\ted.FH_royalty_Burden as Freehold_Royalty_Burden,\r\n\ted.total_ORR_royalty as Total_ORR_Royalty,\r\n\ted.production_tax as Production_Tax,\r\n\ted.total_net_burdens as Total_Net_Burdens,\r\n\ted.net_revenue_after_royalty as Net_Revenue_After_Royalty,\r\n\ted.other_business_income as Other_Income,\r\n\ted.resource_sales_revenue_tax as Resource_Sales_Revenue_Tax,\r\n\ted.fixed_production_expense as Fixed_Production_Expense,\r\n\ted.variable_production_expense as Variable_Production_Expense,\r\n\ted.other_production_expense as Other_Production_Expense,\r\n\ted.total_operating_costs as Total_Operating_Costs,\r\n\t(ed.gross_leasehold_cost +\r\n\ted.gross_exp_g_g +\r\n\ted.gross_dev_drilling +\r\n\ted.gross_eor_drilling +\r\n\ted.gross_exp_drilling +\r\n\ted.gross_dev_completion +\r\n\ted.gross_exp_completion +\r\n\ted.gross_eor_equipment +\r\n\ted.gross_equip_supply +\r\n\ted.gross_gas_gath_sys +\r\n\ted.gross_gas_plant +\r\n\ted.gross_gas_well_equip+\r\n\ted.gross_oilfield_equip) as Total_Gross_Capital,\r\n\t(ed.site_restoration_cost - ed.salvage_cost) as Abandonment,\r\n\ted.net_operating_income as Net_Operating_Income,\r\n\ted.net_investment as Total_Net_Investment,\r\n\ted.before_tax_cash_flow as Before_Tax_Cash_Flow,\r\n\t--Per-Day Volumes\r\n\ted.company_share_oil_volume / DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Oil_Volume,\r\n\ted.company_share_gas_volume / DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Gas_Volume,\r\n\ted.company_share_ngl_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_NGL_Volume,\r\n\ted.company_share_boe_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_BOE_Volume,\r\n\ted.company_share_eth_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000'))
            || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Eth_Volume,\r\n\ted.company_share_prop_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Prop_Volume,\r\n\ted.company_share_cond_volume / DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Cond_Volume,\r\n\ted.company_share_fcond_volume / DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_Fcond_Volume,\r\n\ted.company_share_but_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_CoShare_But_Volume,\r\n\ted.oil_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Oil_Volume,\r\n\ted.gas_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Gas_Volume,\r\n\ted.ngl_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_NGL_Volume,\r\n\ted.company_wi_boe_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_BOE_Volume,\r\n\ted.eth_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Eth_Volume,\r\n\ted.prop_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Prop_Volume,\r\n\ted.cond_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Cond_Volume,\r\n\ted.fcond_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as Daily_WI_Fcond_Volume,\r\n\ted.but_working_interest_volume/ DECODE(ed.month,0,TO_NUMBER(TRIM(TO_CHAR(DATE_PART('DOY',TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || '1231','YYYYMMDD')))),'999'),EXTRACT(DAYS FROM LAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || TRIM(TO_CHAR(ed.month,'00')) || '01','YYYYMMDD')))) as
            Daily_WI_But_Volume,\r\n\t--IDs and State\r\n\tDECODE(ee.entity_state_id,1,'Working',4,'Vintage','Unknown') as Entity_State_Desc,\r\n\tLAST_DAY(TO_DATE(TRIM(TO_CHAR(ed.year,'0000')) || DECODE(ed.month,0,'12',TRIM(TO_CHAR(ed.month,'00'))) || '01','YYYYMMDD')) ACCT_PER_DATE,\r\n\tee.entity_id,\r\n\tee.entity_state_id,\r\n\tee.uuid as entity_uuid,\r\n\tec.case_id,\r\n\ter.result_id,\r\n\ter.reserve_category_id,\r\n\ter.company_id,\r\n\tv.vintage_id,\r\n\tpd.price_deck_id \r\nFROM \r\n\tDS_MOSAIC_RES.ECONOMIC_RESULT er,\r\n\tDS_MOSAIC_RES.ECONOMIC_DETAIL ed, \r\n\tDS_MOSAIC_RES.ECONOMIC_ENTITY ee, \r\n\tDS_MOSAIC_RES.RESERVE_CATEGORY rc,\r\n\tDS_MOSAIC_RES.ECONOMIC_CASE ec,\r\n\tDS_MOSAIC_RES.PRICE_DECK pd,\r\n\tDS_MOSAIC_RES.VINTAGE v,\r\n\t[TABLEOWNER].[VIEW_MOSAIC_RES_ENTITY_EXT_UDL] udl\r\nWHERE \r\n\tee.entity_state_id IN (1,4)\r\n\tAND er.reserve_category_id in (201, 202, 204, 205, 221, 222, 223, 224, 225) -- 201 = PDP, 202 = PDNP, 204 = PU, 205 = TP, 221 = 2PDP, 2PDNP = 222, 2PD = 223, 2PU = 224, 225 = 2P\r\n\tAND er.risk in('B','Y')-- risked is  'B'  B if no risk is entered, Y is risk input\r\n\tAND ee.parent_entity_id IS NULL\r\n\tAND er.result_id = ed.result_id\r\n\tAND ee.entity_id = er.entity_id\r\n\tAND rc.category_value = er.reserve_category_id\r\n\tAND ec.price_deck_id = pd.price_deck_id\r\n\tAND er.case_id = ec.case_id \r\n\tAND er.company_id = 801\r\n\tAND ec.vintage_id = v.vintage_id(+)\r\n\tAND ee.entity_id = udl.entity_id(+)\r\n\t-- Orphaned Results Workaround\r\n\tAND EXISTS (SELECT * FROM DS_MOSAIC_RES.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)"
