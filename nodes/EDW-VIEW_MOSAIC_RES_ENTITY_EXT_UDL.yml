        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_RES_ENTITY_EXT_UDL] AS\r\nSELECT \r\n\tee.entity_name as Entity_Name,\r\n\tep.Project as Project,--20\r\n\tepy.Property as Property,--10\r\n\tct.Capital_Type as Capital_Type,--241\r\n\tet.Entity_Type as Entity_Type,--247\r\n\tflfp.Future_Loc_Form_Play_Type as Future_Loc_Form_Play_Type,--246\r\n\tflir.Future_Loc_IR_Group as Future_Loc_IR_Group,--260\r\n\tecat.Entity_Reserve_Category as Entity_Reserve_Category, --12240\r\n\trstat.Entity_Review_Status as Entity_Review_Status,--20240\r\n\trstag.Entity_Review_Stage as Entity_Review_Stage, --24240\r\n\tcrecon.Capital_Reconciliation as Capital_Reconciliation, --28240\r\n\tmctw.MCD_Type_Well as MCD_Type_Well, --60240\r\n\tpvby.Proved_Booking_Year as Proved_Booking_Year, --4240\r\n\tpbby.Probable_Booking_Year as Probable_Booking_Year, --4241\r\n\tmczn.MCD_Zone_Name as MCD_Zone_Name, --36240\r\n\tee.entity_id,\r\n\tee.entity_state_id,\r\n\tee.uuid as entity_uuid\r\nFROM \r\n\tDS_MOSAIC_RES.ECONOMIC_ENTITY ee,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Project\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 20) ep,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Property\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 10) epy,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Capital_Type\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 241) ct,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Entity_Type\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 247) et, \r\n\t  (SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Future_Loc_Form_Play_Type\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 246) flfp,   \r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Future_Loc_IR_Group\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 260) flir,        \r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Entity_Reserve_Category\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 12240) ecat,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Entity_Review_Stage\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 24240) rstag,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Entity_Review_Status\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 20240) rstat,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Capital_Reconciliation\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 28240) crecon,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as MCD_Type_Well\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 60240) mctw,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Proved_Booking_Year\r\
            \n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 4240) pvby,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as Probable_Booking_Year\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 4241) pbby,\r\n\t(SELECT DISTINCT EU.ENTITY_ID, UE.ELEMENT_LABEL as MCD_Zone_Name\r\n\tFROM\r\n\t  DS_MOSAIC_RES.ENTITY_UDL EU,\r\n\t  DS_MOSAIC_RES.UDL_ELEMENT UE\r\n\tWHERE EU.UDL_ID = UE.UDL_ID\r\n\t  AND EU.UDL_ELEMENT_ID = UE.UDL_ELEMENT_ID\r\n\t  AND UE.UDL_ID = 36240) mczn  \t\r\nWHERE \r\n\tee.entity_id = ep.entity_id(+)\r\n\tAND ee.entity_id = epy.entity_id(+)\r\n\tAND ee.entity_id = ct.entity_id(+)\r\n\tAND ee.entity_id = et.entity_id(+)\r\n\tAND ee.entity_id = flfp.entity_id(+)\r\n\tAND ee.entity_id = flir.entity_id(+)\r\n\tAND ee.entity_id = ecat.entity_id(+)\r\n\tAND ee.entity_id = rstag.entity_id(+)\r\n\tAND ee.entity_id = rstat.entity_id(+)\r\n\tAND ee.entity_id = crecon.entity_id(+)\r\n\tAND ee.entity_id = mctw.entity_id(+)\r\n\tAND ee.entity_id = pvby.entity_id(+)\r\n\tAND ee.entity_id = pbby.entity_id(+)\r\n\tAND ee.entity_id = mczn.entity_id(+)"
