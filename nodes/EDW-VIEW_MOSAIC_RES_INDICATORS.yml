        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_MOSAIC_RES_INDICATORS] AS\r\nSELECT \r\n\tec.case_name as Economic_Case, \r\n\tpd.name as Price_Deck, \r\n\tec.results_currency_code as Currency, \r\n\tee.entity_name as Entity_Name, \r\n\tv.vintage_name as Vintage_Name,\r\n\trc.category_name as Category,\r\n\tee.entity_type as Primary_Product,\r\n\tee.production_class as Production_Class,\r\n\tee.secondary_class_type as Secondary_Class,\t\r\n\tee.USER_DEFINED_2 as Country,\r\n\tee.USER_DEFINED_3 as Province_State,\r\n\tee.USER_DEFINED_4 as Area_SBU,\r\n\tee.USER_DEFINED_5 as UDL_2019_Property,\r\n\tee.USER_DEFINED_6 as Engineering_Folder_1,\r\n\tee.USER_DEFINED_7 as Engineering_Folder_2,\r\n\tee.USER_DEFINED_8 as Prior_Year_Property,\r\n\tee.USER_DEFINED_9 as Prior_Year_Core_Area,\r\n\tee.USER_DEFINED_10 as VET_CGU,\r\n\tee.USER_DEFINED_11 as GLJ_Reconciliation_Folder,\r\n\tee.USER_DEFINED_12 as Engineering_Folder_3,\r\n\tee.USER_DEFINED_13 as Engineering_Folder_4,\r\n\tee.USER_DEFINED_14 as Engineering_Folder_5,\r\n\tee.USER_DEFINED_15 as Tax_Total,\r\n\tee.USER_DEFINED_16 as Probable_Undeveloped_Only,\r\n\tee.USER_DEFINED_17 as Current_Core_Property,\r\n\tee.USER_DEFINED_19 as Current_Core_Area,\r\n\t--Ext UDLs \r\n\tudl.Project as Project,\r\n\tudl.Property as Property,--10\r\n\tudl.Capital_Type as Capital_Type,--241\r\n\tudl.Entity_Type as Entity_Type,--247\r\n\tudl.Future_Loc_Form_Play_Type as Future_Loc_Form_Play_Type,--246\r\n\tudl.Future_Loc_IR_Group as Future_Loc_IR_Group,--260\r\n\tudl.Entity_Reserve_Category as Entity_Reserve_Category, --12240\r\n\tudl.MCD_Type_Well as MCD_Type_Well, --60240\r\n\tudl.Proved_Booking_Year as Proved_Booking_Year, --4240\r\n\tudl.Probable_Booking_Year as Probable_Booking_Year, --4241\r\n\tudl.MCD_Zone_Name as MCD_Zone_Name, --36240  \r\n\t--Indicators\r\n\tei.date_booked as Date_Booked,\r\n\tei.initial_wi as Initial_WI,\r\n\tDECODE(ei.boe_gross_total,0,0, (ei.boe_company_share_total/ei.boe_gross_total)) as Avg_CoShare_Interest,\r\n\tei.on_production_date as On_Prod_Date,\r\n\tei.first_yr_co_share_boe as First_Year_CoSh_Prod,\r\n\tei.first_yr_co_share_boe_per_day as First_Year_CoSh_Prod_Rate,\r\n\tei.economic_eol_date as End_of_Life_Date,\r\n\tei.economic_eol_rate as End_of_Life_Rate,\r\n\tei.earliest_prod_date as Earliest_Prod_Date_from_ED,\r\n\tei.earliest_investment_date as First_Capital_Date,\r\n\tei.latest_prod_date as Latest_Prod_Date,\r\n\tei.trend_end_date as Forecast_End_Date,\r\n\tDECODE(ei.calculation_type,0,'Undefined', 1, 'Volumetric,', 2, 'Decline', 3, 'Material Balance', 4, 'Analogy', 5,'Other', 6, 'Performance', 7, 'Oilcut', 8, 'Vol.Dec', 10, 'Vol/Perf',\r\n\t\t  11, 'Pool Allocated MB', 12, 'Decline/Analogy', 13, 'Ratios')as Calculation_Type,\r\n\tei.oil_tech_rem_rec as Oil_Tech_Rem_Rec,\r\n\tei.oil_tech_ult_rec as Oil_Tech_Ult_Rec,\r\n\tei.gas_tech_rem_rec as Gas_Tech_Rem_Rec,\r\n\tei.gas_tech_ult_rec as Gas_Tech_Ult_Rec,\r\n\tei.ngl_tech_rem_rec as NGL_Tech_Rem_Rec,\r\n\tei.ngl_tech_ult_rec as NGL_Tech_Ult_Rec,\r\n\tei.oil_gross_total as Oil_Gross_Total,\r\n\tei.oil_wi_total as Oil_WI_Total,\r\n\t(ei.oil_company_share_total - ei.oil_wi_total) as Oil_RI_Total,\r\n\tei.oil_company_share_total as Oil_Company_Share_Total,\r\n\tei.oil_company_net_total as Oil_Company_Net_NRI_Total,\r\n\tei.gas_gross_total as Gas_Gross_Total,\r\n\tei.gas_wi_total as Gas_WI_Total,\r\n\t(ei.gas_company_share_total - ei.gas_wi_total) as Gas_RI_Total,\r\n\tei.gas_company_share_total as Gas_Company_Share_Total,\r\n\tei.gas_company_net_total as Gas_Company_Net_NRI_Total,  \r\n\tei.ngl_gross_total as NGL_Gross_Total,\r\n\tei.ngl_wi_total as NGL_WI_Total,\r\n\t(ei.ngl_company_share_total - ei.ngl_wi_total) as NGL_RI_Total,\r\n\tei.ngl_company_share_total as NGL_Company_Share_Total,\r\n\tei.ngl_company_net_total as NGL_Company_Net_NRI_Total,  \r\n\tei.boe_gross_total as BOE_Gross_Total,\r\n\tei.boe_wi_total as BOE_WI_Total,\r\n\t(ei.boe_company_share_total - ei.boe_wi_total) as BOE_RI_Total,\r\n\tei.boe_company_share_total as BOE_Company_Share_Total,\r\n\tei.boe_company_net_total as
            BOE_Company_Net_NRI_Total, \r\n\tei.reserves_life as Reserves_Life,\r\n\tei.reserves_half_life as Reserves_Half_Life,\r\n\tei.reserves_life_index as Reserves_Life_Index_BOE,\r\n\tei.reserves_life_index_product as Reserves_Life_Index_Product, \r\n\tei.npv_investment_0_atax as NPV_Investment_Atax_0,\r\n\tei.npv_cash_flow_0_btax as NPV_Cash_Flow_Btax_0,\r\n\tei.npv_cash_flow_1_btax as NPV_Cash_Flow_Btax_5,\r\n\tei.npv_cash_flow_2_btax as NPV_Cash_Flow_Btax_10, \r\n\tei.npv_cash_flow_3_btax as NPV_Cash_Flow_Btax_12,\r\n\tei.npv_cash_flow_4_btax as NPV_Cash_Flow_Btax_15,\r\n\tei.npv_cash_flow_5_btax as NPV_Cash_Flow_Btax_20,\r\n\tei.npv_cash_flow_0_atax as NPV_Cash_Flow_Atax_0,\r\n\tei.npv_cash_flow_1_atax as NPV_Cash_Flow_Atax_5,\r\n\tei.npv_cash_flow_2_atax as NPV_Cash_Flow_Atax_10,\r\n\tei.npv_cash_flow_3_atax as NPV_Cash_Flow_Atax_12,\r\n\tei.npv_cash_flow_4_atax as NPV_Cash_Flow_Atax_15,\r\n\tei.npv_cash_flow_5_atax as NPV_Cash_Flow_Atax_20,\r\n\tDECODE(ee.entity_type,1, 'Oil,', 2, 'Gas', 'Other')as Product_Type,\r\n\tDECODE(ei.npv_investment_detail_btax,0,0, (ei.npv_cash_flow_detail_btax / ei.npv_investment_detail_btax)) as NPV_Disc_Invest_Btax,\r\n\tei.btax_dcf_ror as Btax_Disc_ROR,\r\n\tDECODE(ei.boe_company_share_total ,0,0,((ei.npv_investment_0_btax/ei.boe_company_share_total)*1000))as Cost_of_Reserves,\r\n\t--DECODE((ei.oil_wi_revenue_total + ei.gas_wi_revenue_total + ei.ngl_wi_revenue_total),0,0,ei.net_burdens_total/(ei.oil_wi_revenue_total + ei.gas_wi_revenue_total + ei.ngl_wi_revenue_total))as Avg_WI_Burden_Rate,\r\n\tDECODE((ei.oil_co_share_revenue_total + ei.gas_co_share_revenue_total + ei.ngl_co_share_revenue_total),0,0,ei.net_burdens_total/(ei.oil_co_share_revenue_total + ei.gas_co_share_revenue_total + ei.ngl_co_share_revenue_total))as Avg_CoShare_Burden_Rate, \r\n\tDECODE(ei.boe_company_share_total ,0,0,(ei.total_opcosts/ei.boe_company_share_total)*1000) as Avg_OpCost_Per_CoShare_BOE,\r\n\tDECODE(ei.boe_company_share_total ,0,0,(ei.npv_op_income_0_btax/ei.boe_company_share_total)*1000) as Netback_Per_CoShare_BOE,  \r\n\tei.calculated_by_ringfence as Calculated_by_Ringfence,\r\n\tei.ringfence_name as Ring_Fence_Name,\r\n\tei.ringfence_value as Ring_Fence_Value,\r\n\tei.ignore_indiv_econ_eol as Ring_Fence_Ignore_Indv_EOL,\r\n\tei.coe  as Chance_of_Occurence,\r\n\tei.pos as Prob_of_Success,\r\n\tei.payout_date_btax as Payout_Date_Btax,\r\n\tei.payout_date_atax as Payout_Date_Atax,\r\n\tee.entity_id,\r\n\tee.entity_state_id,\r\n\tee.uuid as entity_uuid,\r\n\tv.vintage_id,\r\n\tec.case_id,  \r\n\ter.result_id,\r\n\ter.reserve_category_id,\r\n\ter.company_id,\r\n\tpd.price_deck_id\r\nFROM\r\n\tDS_MOSAIC_RES.ECONOMIC_RESULT er, \r\n\tDS_MOSAIC_RES.ECONOMIC_INDICATOR ei, \r\n\tDS_MOSAIC_RES.ECONOMIC_ENTITY ee, \r\n\tDS_MOSAIC_RES.RESERVE_CATEGORY rc , \r\n\tDS_MOSAIC_RES.ECONOMIC_CASE ec, \r\n\tDS_MOSAIC_RES.PRICE_DECK pd,\r\n\tDS_MOSAIC_RES.VINTAGE v,\r\n\t[TABLEOWNER].[VIEW_MOSAIC_RES_ENTITY_EXT_UDL] udl   \r\nWHERE \r\n\tee.entity_state_id IN (1,4)\r\n\tAND er.reserve_category_id in (201, 202, 204, 205, 221, 222, 223, 224, 225)\r\n\t-- 201 = PDP, 202 = PDNP, 204 = PU, 205 = TP, 221 = 2PDP, 2PDNP = 222, 2PD = 223, 2PU = 224, 225 = 2P\r\n\tAND er.risk in('B','Y')-- risked is  'B'  B if no risk is entered, Y is risk input\r\n\tAND ee.parent_entity_id IS NULL\r\n\tAND er.result_id = ei.result_id\r\n\tAND ee.entity_id = er.entity_id\r\n\tAND rc.category_value = er.reserve_category_id\r\n\tAND ec.price_deck_id = pd.price_deck_id\r\n\tAND er.case_id = ec.case_id \r\n\tAND er.company_id = 801\r\n\tAND ec.vintage_id = v.vintage_id(+) \r\n\tAND ee.entity_id = udl.entity_id(+)\r\n\t-- Orphaned Results Workaround\r\n\tAND EXISTS (SELECT * FROM DS_MOSAIC_RES.ENTITY_RESERVE eres WHERE ee.entity_id = eres.entity_id)  \r\n\r\n"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_RES_ECONOMIC_CASE
