            nodeName: ODS_MOSAIC_RES_PRICE_DECK
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_RES_RESERVE_CATEGORY
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_RES_VINTAGE
          - locationName: EDW
            nodeName: VIEW_MOSAIC_RES_ENTITY_EXT_UDL
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_MOSAIC_RES_INDICATORS') }} "VIEW_MOSAIC_RES_INDICATORS"
