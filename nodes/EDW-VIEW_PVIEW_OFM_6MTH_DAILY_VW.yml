    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVFLOWNETHEADER: f766ece4-d7ae-59bf-1ded-1825e56f5578
          ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY: a88a5390-bf3b-3ee4-889a-d0fd0c7466a6
          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
          ODS_PVIEW_PVT_PVUNITCOMPPARAM: 0bda6665-d7cf-a7f9-35c8-19a99ec575b3
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_6MTH_DAILY_VW] AS\r\nSELECT c.compidb SITE_NAME,\n    c.completionname SITE_UWI,\n    c.compida RAW_UWI,\n    /*producing 1 injecting 6 */\n    NULL AS SITE_TYPE,\n    a.dttm DATE_STAMP,\n    a.durop * 24 HOURS,\n    p.prestub TUBING_PRESS,\n    p.prescas CASING_PRESS,\n    NULL CASING_FLUID_LEVEL,\n    0 PIPELINE_PRESS,\n    0 PIPELINE_TEMP,\n    p.preswh WELLHEAD_PRESS,\n    p.tempwh WELLHEAD_TEMP,\n    0 WATER_PRESS,\n    0 MANIFOLD_PRESS,\n    0 MANIFOLD_TEMP,\n    a.volnewprodallochcliq OIL,\n    a.volnewprodallocwater WATER,\n    a.volnewprodallocgas GAS,\n    a.volnewprodalloccond CONDY,\n    a.volinjectwater INJ_PROD_WATER,\n    0 INJ_SOURCE_WATER,\n    a.volinjectgas INJ_GAS,\n    a.volnewprodallochcliq + (a.volnewprodallocgas * 0.9400516) BOE,\n    a.wihcliq WI,\n    (\n        a.volnewprodallochcliq + (a.volnewprodallocgas * 0.9400516)\n    ) * a.wihcliq BOE_WI,\n    WS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\nFROM DS_PRODVIEW.PVT_pvunitallocmonthday a\n    INNER JOIN DS_PRODVIEW.PVT_pvunit u ON u.idrec = a.idrecunit\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp c ON c.idrec = a.idreccomp\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompparam p ON p.idrec = a.idrecparam\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompfluidlevel l ON l.idrec = a.idrecfluidlevel\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = a.idflownet\nWHERE UPPER(h.usertxt2) = 'FRANCE'\n    AND a.dttm >= ADD_MONTHS(CURRENT_DATE(), -6)   "
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPPARAM
        join:
          joinCondition: |-
