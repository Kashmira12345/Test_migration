          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_DAILY] (\r\n\tIDFLOWNET,\r\n\tIDREC,\r\n\tFLOW_NETWORK,\r\n\tWELL_NAME,\r\n\tUWI,\r\n\tPERIOD,\r\n\tHOURS_ON,\r\n\tHOURS_DOWN,\r\n\tPRESTUB,\r\n\tPRESCAS,\r\n\tPRESLINE,\r\n\tTEMPWH,\r\n\tSZCHOKE,\r\n\tPROD_OIL,\r\n\tPROD_GAS,\r\n\tPROD_WATER,\r\n\tALLOC_OIL,\r\n\tALLOC_GAS,\r\n\tALLOC_WATER,\r\n\tGOR,\r\n\tRATECHGHCLIQ,\r\n\tRATECHGGAS,\r\n\tRATECHGWATER,\r\n\tPCTCHGHCLIQ,\r\n\tPCTCHGGAS,\r\n\tPCTCHGWATER,\r\n\tFACILITY_NAME,\r\n\tTONS_OIL,\r\n\tWCUT,\r\n\tBU_SF_ROLE,\r\n\tDSS_CREATE_TIME,\r\n    DSS_UPDATE_TIME\r\n)\r\nAS\r\nSELECT \r\n\tF.IDFLOWNET\r\n    ,C.IDREC\r\n\t,F.NAME FLOW_NETWORK\r\n\t,C.COMPLETIONNAME WELL_NAME\r\n\t,C.WELLIDREGULATORY UWI\r\n\t,P.DTTM AS PERIOD\r\n\t,P.DUROP *24 AS HOURS_ON\r\n\t,P.DURDOWN* 24 AS HOURS_DOWN\r\n\t,PA.PRESTUB\r\n\t,PA.PRESCAS\r\n\t,PA.PRESLINE\r\n\t,PA.TEMPWH\r\n\t,PA.SZCHOKE\r\n\t,P.VOLPRODGATHHCLIQ AS PROD_OIL\r\n\t,P.VOLPRODGATHGAS AS PROD_GAS\r\n\t,P.VOLPRODGATHWATER AS PROD_WATER\r\n\t,P.VOLNEWPRODALLOCHCLIQ ALLOC_OIL\r\n\t,P.VOLNEWPRODALLOCGAS ALLOC_GAS\r\n\t,P.VOLNEWPRODALLOCWATER ALLOC_WATER\r\n\t,CASE WHEN (P.VOLPRODGATHHCLIQ > 0) THEN ((P.VOLPRODGATHGAS / 1000) / P.VOLPRODGATHHCLIQ) ELSE 0 END AS GOR\r\n\t,GATH_CALCS.RATECHGHCLIQ\r\n\t,GATH_CALCS.RATECHGGAS\r\n\t,GATH_CALCS.RATECHGWATER\r\n\t,GATH_CALCS.PCTCHGHCLIQ\r\n\t,GATH_CALCS.PCTCHGGAS\r\n\t,GATH_CALCS.PCTCHGWATER\r\n\t,NULL AS FACILITY_NAME\r\n\t,ROUND(P.VOLPRODGATHHCLIQ * D.DENSITYHCLIQ / 1000,2) TONS_OIL\r\n\t,CASE WHEN (P.VOLPRODGATHWATER + P.VOLPRODGATHHCLIQ) > 0 THEN P.VOLPRODGATHWATER / (P.VOLPRODGATHWATER + P.VOLPRODGATHHCLIQ) ELSE 0 END WCUT\r\n\t,'BI_BU_'|| \r\n\t\tDECODE (UPPER(F.SYSSECURITYTYP)\r\n\t\t\t,'FRANCE','FBU'\r\n\t\t\t,'CANADA','CBU'\r\n\t\t\t,'NETHERLANDS','NBU'\r\n\t\t\t,'GERMANY','GBU'\r\n\t\t\t,'IRELAND','IBU'\r\n\t\t\t,'AUSTRALIA','ABU'\r\n\t\t\t,'UNITED_STATES','USBU'\r\n\t\t\t,'CENTRAL AND EASTERN EUROPE','CEEBU'\r\n\t\t\t,'USBU','USBU'\r\n\t\t\t,'SOUTHERN PLAINS', 'CBU'\r\n\t\t\t,'SOUTHERN FOOTHILLS', 'CBU'\r\n\t\t\t,'SOUTHEAST SASKATCHEWAN', 'CBU'\r\n\t\t\t,'NORTHERN', 'CBU')  || \r\n\t\tDECODE(CURRENT_DATABASE()\r\n\t\t\t,'EDW_TST', '_TEST'\r\n\t\t\t,'EDW_DEV', '_DEV'\r\n\t\t\t,'EDW', '') AS BU_SF_ROLE\r\n\t,F.DSS_CREATE_TIME\r\n\t,F.DSS_UPDATE_TIME\r\nFROM \r\n\t(SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') F \r\n\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMP] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') C  ON C.IDFLOWNET = F.IDFLOWNET   \r\n\t\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') P ON P.IDRECCOMP = C.IDREC AND P.DTTM < DATEADD(D,-2, GETDATE())\r\n\t\t\t\tLEFT JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPPARAM] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') PA ON PA.IDREC = P.IDRECPARAM\r\n\t\t\t\t\tLEFT JOIN (\r\n\t\t\t\t\t\tSELECT C.IDREC\r\n\t\t\t\t\t\t\t,C.COMPLETIONNAME\r\n\t\t\t\t\t\t\t,CO.DTTM\r\n\t\t\t\t\t\t\t,CO.RATECHGHCLIQ\r\n\t\t\t\t\t\t\t,CO.RATECHGGAS\r\n\t\t\t\t\t\t\t,CO.RATECHGWATER\r\n\t\t\t\t\t\t\t,CO.PCTCHGHCLIQ\r\n\t\t\t\t\t\t\t,CO.PCTCHGGAS\r\n\t\t\t\t\t\t\t,CO.PCTCHGWATER\r\n\t\t\t\t\t\tFROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPGATHMONTHDAYCALC] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') CO \r\n\t\t\t\t\t\t\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPGATHMONTHCALC] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') MO ON CO.IDRECPARENT = MO.IDREC\r\n\t\t\t\t\t\t\t\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMP] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') C ON MO.IDRECPARENT = C.IDREC )GATH_CALCS ON GATH_CALCS.IDREC = P.IDRECCOMP \r\n\t\t\t\t\t\t\tAND GATH_CALCS.DTTM = P.DTTM\r\n\t\t\t\t\t\tLEFT JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITLIQUIDDENSITY] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') D ON C.IDRECPARENT = D.IDRECPARENT \r\n\t\t\t\t\t\t\t\
            AND D.DTTM = (SELECT MAX(DTTM) FROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITLIQUIDDENSITY] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') WHERE IDRECPARENT = C.IDRECPARENT AND DTTM <= P.DTTM)\r\n;"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
