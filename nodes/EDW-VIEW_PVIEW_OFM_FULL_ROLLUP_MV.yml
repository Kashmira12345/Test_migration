          ODS_PVIEW_PVT_PVUNITCOMPPARAM: 0bda6665-d7cf-a7f9-35c8-19a99ec575b3
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_FULL_ROLLUP_MV] AS\r\nSELECT\r\n    u.keymigrationsource SITE_ID,\r\n    c.completionname SITE_UWI,\r\n    c.compida RAW_UWI,\r\n    a.dttmend PROD_DATE,\r\n    a.durop * 24 HOURS,\r\n    a.volnewprodallochcliq OIL,\r\n    a.volnewprodallocwater WATER,\r\n    a.volnewprodallocgas GAS,\r\n    a.volnewprodalloccond CONDENSATE,\r\n    case\r\n        when a.durop = 0 THEN 0\r\n        ELSE a.volnewprodallochcliq / a.durop\r\n    END PDOIL,\r\n    case\r\n        when a.durop = 0 THEN 0\r\n        ELSE a.volnewprodallocwater / a.durop\r\n    END PDWATER,\r\n    case\r\n        when a.durop = 0 THEN 0\r\n        ELSE a.volnewprodallocgas / a.durop\r\n    END PDGAS,\r\n    case\r\n        when a.durop = 0 THEN 0\r\n        ELSE a.volnewprodalloccond / a.durop\r\n    END PDCON,\r\n    case\r\n        when a.volinjectwater is null then 0\r\n        else a.volinjectwater\r\n    END INJ_PROD_WATER,\r\n    0 INJ_SOURCE_WATER,\r\n    case\r\n        when a.volinjectgas is null then 0\r\n        else a.volinjectgas\r\n    END INJ_GAS,\r\n    p.prestub TUBING_PRESS,\r\n    p.prescas CASING_PRESS,\r\n    l.jointstofluid CASING_FLUID_LEVEL,\r\n    day(a.dttmend) CAL_DAYS,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM\r\n    DS_PRODVIEW.PVT_pvunitallocmonth a\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunit u ON u.idrec = a.idrecparent\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp c ON c.idrec = a.idreccomp\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompparam p ON p.idrec = a.idrecparam\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompfluidlevel l ON l.idrec = a.idrecfluidlevel\r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = a.idflownet\r\nWHERE\r\n    UPPER(h.usertxt2) = 'FRANCE'"
