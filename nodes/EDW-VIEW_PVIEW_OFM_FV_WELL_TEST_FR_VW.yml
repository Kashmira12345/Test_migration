        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_FV_WELL_TEST_FR_VW] AS\r\nWITH rodsize AS(\r\n\tSELECT e.idrec,\r\n\t\tr.pumpdiameter\r\n\tFROM DS_PRODVIEW.PVT_pvunitcomppumprodentry e\r\n\t\tINNER JOIN DS_PRODVIEW.PVT_pvunitcomppumprod r ON r.idrec = e.idrecparent\r\n)\r\nSELECT c.completionname UWI,\r\n    u.keymigrationsource SITE_ID,\r\n    c.compida SITE_NAME,\r\n    t.dttm dttm,\r\n    1 TEST_TYPE,\r\n    t.durtest * 24 HOURS,\r\n    t.ratehcliqcalc M3OPD,\r\n    t.ratewatercalc M3WPD,\r\n    t.ratechggascalc / 1000 E3M3GPD,\r\n    CASE\r\n        WHEN t.systag = 'Historic Data Loader' THEN div0(t.volwater, (t.volwater + t.volhcliq)) * 100\r\n        ELSE t.bsw * 100\r\n    END AS BSW,\r\n    pa.prescas CASING,\r\n    pa.prestub TUBING,\r\n    fl.jointsoffluidcalc FLUID_LEVEL_JTS,\r\n    re.spm STROKE_SPEED,\r\n    pe.rpm ROTARY_SPEED,\r\n    ROUND(re.strokelength * 39.37, 3) STROKE_LENGTH,\r\n    CASE\r\n        WHEN pe.electriccurrent IS NOT NULL THEN pe.electriccurrent\r\n        WHEN ee.electriccurrent IS NOT NULL THEN ee.electriccurrent\r\n        ELSE NULL\r\n    END AMP,\r\n    CASE\r\n        WHEN a.idrecpumpentrytk = 'pvunitcomppumpespentry' THEN 'Submersible'\r\n        WHEN a.idrecpumpentrytk = 'pvunitcomppumppcpentry' THEN 'Submersible'\r\n        WHEN a.idrecpumpentrytk = 'pvunitcomppumprodentry' THEN 'Plunger Pump'\r\n        ELSE NULL\r\n    END Pompe,\r\n    a.pumpeff EFF,\r\n    ROUND(rodsize.pumpdiameter * 39.37, 3) PDIAM,\r\n    NULL PFACTOR,\r\n    NULL EFFDATE,\r\n    NULL DEPTH,\r\n    NULL PTYPE,\r\n    ee.electricfreq freq,\r\n    NULL WHOURS,\r\n    NULL WCHOKE,\r\n    NULL WT_TBG,\r\n    NULL WT_CSG,\r\n    u.nameshort OPERATOR,\r\n    NULL PHD_PRESS,\r\n    fl.jointsinhole JTS_IN_HOLE,\r\n    NULL WT_DIFF,\r\n    NULL WT_TEMP,\r\n    NULL WT_ORF,\r\n    s.usertxt1 STATUS,\r\n    pa.salinity SALINITY,\r\n    u.typ2 SPECIFIC,\r\n    NULL REMARK,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM DS_PRODVIEW.PVT_pvunitallocmonthday a\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunit u ON u.idrec = a.idrecunit\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcompstatus s ON s.idrec = a.idrecstatus\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomptest t ON t.idrec = a.idrectest\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp c ON c.idrec = a.idreccomp\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcomppumprodentry re ON re.idrec = a.idrecpumpentry\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcomppumpespentry ee ON ee.idrec = a.idrecpumpentry\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcomppumppcpentry pe ON pe.idrec = a.idrecpumpentry\r\n    LEFT JOIN rodsize ON rodsize.idrec = a.idrecpumpentry\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompparam pa ON pa.idrec = a.idrecparam\r\n    LEFT JOIN DS_PRODVIEW.PVT_pvunitcompfluidlevel fl ON fl.idrec = a.idrecfluidlevel\r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = a.idflownet\r\n    INNER JOIN DS_PRODVIEW.PVT_pvroutesetroute r ON r.idrec = u.idrecroutesetroutecalc\r\nWHERE UPPER(h.usertxt2) = 'FRANCE'\r\n"
