          ODS_PVIEW_PVT_PVFLOWNETHEADER: f766ece4-d7ae-59bf-1ded-1825e56f5578
          ODS_PVIEW_PVT_PVUNITALLOCMONTH: d8aebf6c-be01-9acf-bac7-009c65ae6c62
          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_MONTHLY] (\r\n\tIDFLOWNET,\r\n\tIDREC,\r\n\tUWI,\r\n\tNAME,\r\n\tPERIOD,\r\n\tHOURS_DOWN,\r\n\tHOURS_ON,\r\n\tPROD_OIL,\r\n\tPROD_GAS,\r\n\tPROD_WATER,\r\n\tALLOC_OIL,\r\n\tALLOC_GAS,\r\n\tALLOC_WATER,\r\n\tLOST_OIL,\r\n\tLOST_GAS,\r\n\tLOST_WATER,\r\n\tINJ_GAS,\r\n\tINJ_OIL,\r\n\tINJ_WATER,\r\n\tSALES_GAS,\r\n\tFUEL_GAS,\r\n\tFLARE_GAS,\r\n\tVENT_GAS,\r\n\tTONS_OIL,\r\n\tBU_SF_ROLE,\r\n\tDSS_CREATE_TIME,\r\n\tDSS_UPDATE_TIME\r\n)\r\nAS\r\nSELECT \r\n\tF.IDFLOWNET\r\n    ,C.IDREC\r\n\t,C.WELLIDREGULATORY AS UWI\r\n\t,C.COMPLETIONNAME AS NAME \r\n\t,P.DTTMSTART AS PERIOD\r\n\t,P.DURDOWN * 24 AS HOURS_DOWN\r\n\t,P.DUROP * 24 AS HOURS_ON\r\n\t,P.VOLPRODGATHHCLIQ AS PROD_OIL\r\n\t,P.VOLPRODGATHGAS AS PROD_GAS\r\n\t,P.VOLPRODGATHWATER AS PROD_WATER\r\n\t,P.VOLNEWPRODALLOCHCLIQ AS ALLOC_OIL\r\n\t,P.VOLNEWPRODALLOCGAS AS ALLOC_GAS\r\n\t,P.VOLNEWPRODALLOCWATER AS ALLOC_WATER\r\n\t,P.VOLLOSTHCLIQ AS LOST_OIL\r\n\t,P.VOLLOSTGAS AS LOST_GAS\r\n\t,P.VOLLOSTWATER AS LOST_WATER\r\n\t,P.VOLINJECTRECOVGAS AS INJ_GAS\r\n\t,P.VOLINJECTRECOVHCLIQ AS INJ_OIL\r\n\t,P.VOLINJECTRECOVWATER AS INJ_WATER\r\n\t,P.VOLDISPSALEGAS AS SALES_GAS\r\n\t,P.VOLDISPFUELGAS AS FUEL_GAS\r\n\t,P.VOLDISPFLAREGAS AS FLARE_GAS\r\n\t,P.VOLDISPVENTGAS AS VENT_GAS\r\n\t, ROUND(P.VOLNEWPRODALLOCHCLIQ * D.DENSITYHCLIQ / 1000,2) TONS_OIL\r\n\t,'BI_BU_'|| \r\n\t\tDECODE (UPPER(F.SYSSECURITYTYP)\r\n\t\t\t,'FRANCE','FBU'\r\n\t\t\t,'CANADA','CBU'\r\n\t\t\t,'NETHERLANDS','NBU'\r\n\t\t\t,'GERMANY','GBU'\r\n\t\t\t,'IRELAND','IBU'\r\n\t\t\t,'AUSTRALIA','ABU'\r\n\t\t\t,'UNITED_STATES','USBU'\r\n\t\t\t,'CENTRAL AND EASTERN EUROPE','CEEBU'\r\n\t\t\t,'USBU','USBU'\r\n\t\t\t,'SOUTHERN PLAINS', 'CBU'\r\n\t\t\t,'SOUTHERN FOOTHILLS', 'CBU'\r\n\t\t\t,'SOUTHEAST SASKATCHEWAN', 'CBU'\r\n\t\t\t,'NORTHERN', 'CBU')  || \r\n\t\tDECODE(CURRENT_DATABASE()\r\n\t\t\t,'EDW_TST', '_TEST'\r\n\t\t\t,'EDW_DEV', '_DEV'\r\n\t\t\t,'EDW', '') AS BU_SF_ROLE\r\n    ,F.DSS_CREATE_TIME\r\n    ,F.DSS_UPDATE_TIME\r\nFROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') F \r\n\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITALLOCMONTH] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') P ON F.IDFLOWNET = P.IDFLOWNET AND P.DTTMSTART < DATEADD( DAY, 1, LAST_DAY(DATEADD(MONTH, -1, CURRENT_DATE)))\r\n\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMP] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') C ON P.IDRECCOMP = C.IDREC\r\n\t\t\tLEFT JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITLIQUIDDENSITY] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') D ON C.IDRECPARENT = D.IDRECPARENT \r\n\t\t\t\tAND D.DTTM = (SELECT MAX(DTTM) FROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITLIQUIDDENSITY] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') WHERE IDRECPARENT = C.IDRECPARENT AND DTTM <= P.DTTMEND)\r\n;"
        dependencies:
          - locationName: DATA_STORE
