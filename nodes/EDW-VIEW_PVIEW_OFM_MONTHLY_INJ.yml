        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_MONTHLY_INJ] (\r\n\tIDFLOWNET,\r\n\tIDREC,\r\n\tUWI,\r\n\tNAME,\r\n\tPERIOD,\r\n\tHOURS_DOWN,\r\n\tHOURS_ON,\r\n\tZONENAME,\r\n\tVOLINJECTHCLIQ,\r\n\tVOLINJECTGAS,\r\n\tVOLINJECTWATER,\r\n\tVOLDISPWATER,\r\n\tBU_SF_ROLE,\r\n\tDSS_CREATE_TIME,\r\n\tDSS_UPDATE_TIME\r\n)\r\nAS\r\nSELECT \r\n    F.IDFLOWNET\r\n    ,C.IDREC\r\n\t,C.WELLIDREGULATORY AS UWI\r\n\t,C.COMPLETIONNAME AS NAME \r\n\t,P.DTTMSTART AS PERIOD\r\n\t,P.DURDOWN * 24 AS HOURS_DOWN\r\n\t,P.DUROP * 24 AS HOURS_ON\r\n\t,Z.ZONENAME\r\n\t,P.VOLINJECTHCLIQ\r\n\t,P.VOLINJECTGAS\r\n\t,P.VOLINJECTWATER\r\n\t,CASE WHEN U.TYPREGULATORY LIKE 'DIS%' THEN P.VOLINJECTWATER ELSE 0 END AS VOLDISPWATER\r\n\t,'BI_BU_'|| \r\n\t\tDECODE (UPPER(F.SYSSECURITYTYP)\r\n\t\t\t,'FRANCE','FBU'\r\n\t\t\t,'CANADA','CBU'\r\n\t\t\t,'NETHERLANDS','NBU'\r\n\t\t\t,'GERMANY','GBU'\r\n\t\t\t,'IRELAND','IBU'\r\n\t\t\t,'AUSTRALIA','ABU'\r\n\t\t\t,'UNITED_STATES','USBU'\r\n\t\t\t,'CENTRAL AND EASTERN EUROPE','CEEBU'\r\n\t\t\t,'USBU','USBU'\r\n\t\t\t,'SOUTHERN PLAINS', 'CBU'\r\n\t\t\t,'SOUTHERN FOOTHILLS', 'CBU'\r\n\t\t\t,'SOUTHEAST SASKATCHEWAN', 'CBU'\r\n\t\t\t,'NORTHERN', 'CBU')  || \r\n\t\tDECODE(CURRENT_DATABASE()\r\n\t\t\t,'EDW_TST', '_TEST'\r\n\t\t\t,'EDW_DEV', '_DEV'\r\n\t\t\t,'EDW', '') AS BU_SF_ROLE\r\n    ,F.DSS_CREATE_TIME\r\n    ,F.DSS_UPDATE_TIME\r\nFROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') F \r\n\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITALLOCMONTH] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') P ON F.IDFLOWNET = P.IDFLOWNET\r\n\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMP] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') C ON P.IDRECCOMP = C.IDREC  \r\n\t\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNIT] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') U ON C.IDRECPARENT = U.IDREC\r\n\t\t\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPZONE] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') Z ON P.IDRECCOMPZONE = Z.IDREC\r\nWHERE P.DTTMSTART < DATEADD( DAY, 1, LAST_DAY(DATEADD(MONTH, -1, CURRENT_DATE)))"
        dependencies:
          - locationName: DATA_STORE
