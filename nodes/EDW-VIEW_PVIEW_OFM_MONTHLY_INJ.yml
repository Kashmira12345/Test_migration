          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPZONE
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_PVIEW_OFM_MONTHLY_INJ') }} "VIEW_PVIEW_OFM_MONTHLY_INJ"
        name: VIEW_PVIEW_OFM_MONTHLY_INJ
