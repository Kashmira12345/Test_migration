    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVFLOWNETHEADER: f766ece4-d7ae-59bf-1ded-1825e56f5578
          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
          ODS_PVIEW_PVT_PVUNITCOMPTEST: f168e715-717a-3aa0-a0e2-fab417e94a5d
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_WELL_TEST] (\r\n\tIDFLOWNET,\r\n\tIDREC,\r\n\tUWI,\r\n\tPROD_DATE,\r\n\tTESTHOURS,\r\n\tGAS,\r\n\tOIL,\r\n\tWATER,\r\n\tTESTEDBY,\r\n\tBU_SF_ROLE,\r\n\tDSS_CREATE_TIME,\r\n\tDSS_UPDATE_TIME\r\n)\r\nAS\r\nSELECT \r\n    F.IDFLOWNET\r\n    ,UC.IDREC\r\n    ,UC.WELLIDREGULATORY UWI\r\n\t,CT.DTTM AS PROD_DATE\r\n\t,CT.DURTEST * 24 AS TESTHOURS\r\n\t,NVL(CT.VOLGASCALC, CT.VOLGAS) / 1000 AS GAS\r\n\t,NVL(CT.VOLHCLIQCALC, CT.VOLHCLIQ) AS OIL\r\n\t,NVL(CT.VOLWATERCALC, CT.VOLWATER) AS WATER\r\n\t,CT.TESTEDBY\r\n    ,'BI_BU_'|| \r\n    DECODE (UPPER(F.SYSSECURITYTYP)\r\n      ,'FRANCE','FBU'\r\n      ,'CANADA','CBU'\r\n      ,'NETHERLANDS','NBU'\r\n      ,'GERMANY','GBU'\r\n      ,'IRELAND','IBU'\r\n      ,'AUSTRALIA','ABU'\r\n      ,'UNITED_STATES','USBU'\r\n      ,'CENTRAL AND EASTERN EUROPE','CEEBU'\r\n      ,'USBU','USBU'\r\n      ,'SOUTHERN PLAINS', 'CBU'\r\n      ,'SOUTHERN FOOTHILLS', 'CBU'\r\n      ,'SOUTHEAST SASKATCHEWAN', 'CBU'\r\n      ,'NORTHERN', 'CBU'\r\n      ,'CORP')  || \r\n    DECODE(CURRENT_DATABASE()\r\n      ,'EDW_TST', '_TEST'\r\n\t  ,'EDW_DEV', '_DEV'\r\n      ,'EDW','') AS BU_SF_ROLE\r\n    ,F.DSS_CREATE_TIME\r\n    ,F.DSS_UPDATE_TIME\r\nFROM (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') F \r\n\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMP] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') UC ON F.IDFLOWNET = UC.IDFLOWNET  \r\n\t\tINNER JOIN (SELECT * FROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPTEST] WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') CT ON UC.IDREC = CT.IDRECPARENT AND NVL(CT.DONTUSE,0) <> 1  \r\n"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPTEST
        join:
          joinCondition: |-
