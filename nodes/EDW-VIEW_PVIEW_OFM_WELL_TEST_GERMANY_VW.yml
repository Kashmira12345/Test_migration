        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_OFM_WELL_TEST_GERMANY_VW] AS\r\nSELECT uc2.wellidb uwi,\r\n    ct.DtTm as prod_date,\r\n    durtest * 24 as testhours,\r\n    ifnull(ct.volgascalc, ct.volgas) / 1000 as gas,\r\n    ifnull(ct.volhcliqcalc, ct.volhcliq) as oil,\r\n    ifnull(ct.volwatercalc, ct.volwater) as water,\r\n    ct.testedby,\r\n    WS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(f.SYSSECURITYTYP) AS BU_SF_ROLE\t\r\nFROM DS_PRODVIEW.PVT_pvflownetheader f\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp uc2 on f.idflownet = uc2.idflownet and f.syssecuritytyp = 'Germany'\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomptest ct on uc2.idrec = ct.idrecparent and ifnull(ct.dontuse, 0) != 1"
        dependencies:
          - locationName: DATA_STORE
