          ODS_PVIEW_PVT_PVUNITTANKENTRY: d797d9c8-9f12-abf2-40f7-ac36262ae166
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_DIESEL_VW] AS \r\nwith crane_tank as (\r\n        select t.idflownet,\r\n            t.name tank_name,\r\n            t.volcapacity,\r\n            CAST(te.dttm AS date) as date,\r\n            te.voltotalcalc tank_vol,\r\n            case\r\n                when t.volcapacity = 0 then 0\r\n                else te.voltotalcalc / t.volcapacity * 100\r\n            end percent_full\r\n        from DS_PRODVIEW.PVT_pvunit u\r\n            inner join DS_PRODVIEW.PVT_pvunittank t on u.idrec = t.idrecparent\r\n\t\t\t\tand t.productname = 'Diesel'\r\n\t\t\t\tand lower(t.name) like '%crane%'\r\n            inner join DS_PRODVIEW.PVT_pvunittankentry te on t.idrec = te.idrecparent\r\n    ),\r\nshaft_tank as (\r\n        select t.idflownet,\r\n            t.name tank_name,\r\n            t.volcapacity,\r\n            CAST(te.dttm AS date) as date,\r\n            te.voltotalcalc tank_vol,\r\n            case\r\n                when t.volcapacity = 0 then 0\r\n                else te.voltotalcalc / t.volcapacity * 100\r\n            end percent_full\r\n        from DS_PRODVIEW.PVT_pvunit u\r\n            inner join DS_PRODVIEW.PVT_pvunittank t on u.idrec = t.idrecparent\r\n\t\t\t\tand t.productname = 'Diesel'\r\n\t\t\t\tand lower(t.name) like '%shaft%'\r\n            inner join DS_PRODVIEW.PVT_pvunittankentry te on t.idrec = te.idrecparent\r\n    ),\r\nusage as (\r\n        select u.idflownet,\r\n            CAST(le.dttm AS date) as date,\r\n            'Usage' as name,\r\n            sum(ifnull(le.voltotalcalc, 0)) vol\r\n        from DS_PRODVIEW.PVT_pvunit u\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n\t\t\t\tand lower(l.name) not like '%storage%'\r\n\t\t\t\tand lower(u.name) like '%diesel%'\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry le on l.idrec = le.idrecparent\r\n        group by u.idflownet, le.dttm\r\n    ),\r\nstorage as (\r\n        select u.idflownet,\r\n            CAST(le.dttm AS date) as date,\r\n            'diesel_storage' as name,\r\n            sum(ifnull(le.voltotalcalc, 0)) vol\r\n        from DS_PRODVIEW.PVT_pvunit u\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n\t\t\t\tand lower(u.name) like '%diesel%'\r\n\t\t\t\tand lower(l.name) like '%storage%'\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry le on l.idrec = le.idrecparent\r\n\t\t\t\tand ifnull(le.voltotalcalc, 0) != 0\r\n        group by u.idflownet, le.dttm\r\n    )\r\nselect c.idflownet,\r\n    c.date,\r\n    c.percent_full as diesel_percent_crane,\r\n    round(s.percent_full, 1) as diesel_percent_shaft2,\r\n    c.tank_vol as diesel_vol_crane,\r\n    s.tank_vol as diesel_vol_shaft2,\r\n    c.tank_vol + s.tank_vol as diesel_in_storage,\r\n    u.vol as diesel_usage,\r\n    o.vol as diesel_add_storage,\r\n    case\r\n        when ifnull(u.vol, 0) = 0 then 0\r\n        else floor((c.tank_vol + s.tank_vol) / u.vol)\r\n    end days_remaining,\r\n    c.volcapacity crane_capacity,\r\n    s.volcapacity shaft2_capacity,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\t\r\nfrom crane_tank c\r\n    inner join shaft_tank s on c.date = s.date\r\n\t\tand c.idflownet = s.idflownet\r\n    left join usage u on c.date = u.date\r\n\t\tand c.idflownet = u.idflownet\r\n    left join storage o on c.date = o.date\r\n\t\tand c.idflownet = o.idflownet\r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = c.idflownet\t"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITMETERLIQUIDENTRY
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITTANK
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITTANKENTRY
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_PVIEW_VRL_AUS_DIESEL_VW') }} "VIEW_PVIEW_VRL_AUS_DIESEL_VW"
        name: VIEW_PVIEW_VRL_AUS_DIESEL_VW
        noLinkRefs: []
