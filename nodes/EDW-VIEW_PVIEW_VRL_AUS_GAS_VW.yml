        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_GAS_VW] AS\r\nselect g.idflownet,\r\n    CAST(ge.dttm AS date) as date,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%inj%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as inj_gas,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%wna lift%'\r\n                or lower(g.name) like '%wnb lift%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as lift_gas,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%formation%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as formation_gas,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%fuel%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as fuel_gas,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%flare%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as flare_gas,\r\n    round(\r\n        sum(\r\n            case\r\n                when lower(g.name) like '%wna lift%'\r\n                or lower(g.name) like '%wnb lift%'\r\n                or lower(g.name) like '%formation%' then ge.volgascalc\r\n                else 0\r\n            end\r\n        ),\r\n        2\r\n    ) as thruput_gas,\r\n    round(avg(pe.value), 2) as b10_down_hole_press,\r\n    p.uomreading press_uom,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom DS_PRODVIEW.PVT_pvunitmeterpdgas g\r\n    inner join DS_PRODVIEW.PVT_pvunitmeterpdgasentry ge on g.idrec = ge.idrecparent\r\n    left join DS_PRODVIEW.PVT_pvunitmeaspt p on p.idflownet = p.idflownet\r\n\t\tand lower(p.name) like '%b10 down hole press%'\r\n    left join DS_PRODVIEW.PVT_pvunitmeasptentry pe on p.idrec = pe.idrecparent\r\n\t\tand ge.dttm = pe.dttm\r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = g.idflownet\t\t\r\nwhere g.idflownet = '58877C62BE0F489EA5E5B14F1A3D3947'\r\ngroup by g.idflownet,\r\n    h.SYSSECURITYTYP,\r\n    ge.dttm,\r\n    p.uomreading"
