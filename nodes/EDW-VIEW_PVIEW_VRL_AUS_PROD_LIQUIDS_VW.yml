        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_PROD_LIQUIDS_VW] AS\r\nselect l.idflownet,\r\n      CAST(le.dttm AS date) as date,\r\n      sum(\r\n            case\r\n                  when lower(l.name) like '%water%' then le.volwatercalc\r\n                  else 0\r\n            end\r\n      ) as prod_water,\r\n      sum(\r\n            case\r\n                  when lower(l.name) like '%oil%' then le.voltotalcalc\r\n                  else 0\r\n            end\r\n      ) as total_oil_uncorrect,\r\n      sum(\r\n            case\r\n                  when lower(l.name) like '%oil%' then le.volhcliqcalc\r\n                  else 0\r\n            end\r\n      ) as total_oil,\r\n      sum(le.voltotalcalc) as total_fluids,\r\n      case\r\n            when round(sum(le.voltotalcalc), 1) = 0.0 then 0\r\n            else sum(\r\n                  case\r\n                        when lower(l.name) like '%water%' then le.volwatercalc\r\n                        else 0\r\n                  end\r\n            ) / sum(le.voltotalcalc) * 100\r\n      end as watercut,\r\n\t  WS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom DS_PRODVIEW.PVT_pvunitmeterliquid l\r\n      inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry le on l.idrec = le.idrecparent\r\n\t\tand lower(l.name) like '%prod%'\r\n\t  INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = l.idflownet\t\r\ngroup by l.idflownet, le.dttm, h.SYSSECURITYTYP"
