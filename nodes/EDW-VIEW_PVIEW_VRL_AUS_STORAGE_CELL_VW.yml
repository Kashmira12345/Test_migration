          ODS_PVIEW_PVT_PVUNITMETERLIQUIDENTRY: ef4a30e7-b653-194a-4623-2b48351eff82
          ODS_PVIEW_PVT_PVUNITTANK: a7315a57-43f2-5173-c41d-0f2e7d2bbc85
          ODS_PVIEW_PVT_PVUNITTANKENTRY: d797d9c8-9f12-abf2-40f7-ac36262ae166
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_STORAGE_CELL_VW] \r\nAS \r\nwith daily_oil as (\r\n        select n.idflownet,\r\n            e.dttm,\r\n            round (sum(e.volhcliqcalc), 2) as daily_produced_oil\r\n        from DS_PRODVIEW.PVT_pvflownetheader n\r\n            inner join DS_PRODVIEW.PVT_pvunit u on u.idflownet = n.idflownet\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n\t\t\t\tand u.name like 'Wandoo Platform'\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry e on l.idrec = e.idrecparent\r\n        group by n.idflownet, e.dttm\r\n    ),\r\n    storage_tank as (\r\n        select t.idflownet,\r\n            sum(t.volcapacity) capacity,\r\n            e.dttm,\r\n            round(sum(e.volhcliqcalc), 2) as oil_in_storage_stkl,\r\n            case\r\n                when sum(t.volcapacity) = 0 then 0\r\n                else round(sum(e.volhcliqcalc) / sum(t.volcapacity) * 100, 2)\r\n            end as percent_full,\r\n            round(sum(t.volcapacity) - sum (e.volhcliqcalc), 2) as vol_remaining\r\n        from DS_PRODVIEW.PVT_pvflownetheader n\r\n            inner join DS_PRODVIEW.PVT_pvunittank t on n.idflownet = t.idflownet\r\n            inner join DS_PRODVIEW.PVT_pvunittankentry e on t.idrec = e.idrecparent\r\n\t\t\t\tand t.name like 'SC%'\r\n        group by t.idflownet, e.dttm\r\n    )\r\nselect d.idflownet,\r\n    CAST(s.dttm AS date) as date,\r\n    s.oil_in_storage_stkl,\r\n    s.capacity,\r\n    s.percent_full,\r\n    s.vol_remaining,\r\n    d.daily_produced_oil last_daily_prod_oil,\r\n    CAST(d.dttm AS date) as last_date_prod_oil,\r\n    case\r\n        when d.daily_produced_oil = 0 then 0\r\n        else floor (s.vol_remaining / d.daily_produced_oil)\r\n    end as num_days,\r\n    CAST(\r\n        dateadd(\r\n            d,\r\n            case\r\n                when d.daily_produced_oil = 0 then 0\r\n                else floor (s.vol_remaining / d.daily_produced_oil)\r\n            end,\r\n            s.dttm\r\n        ) AS date\r\n    ) as date_tank_tops,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom storage_tank s,\r\n    daily_oil d,\r\n\tDS_PRODVIEW.PVT_pvflownetheader h \r\nwhere d.dttm = (\r\n        select max(dttm)\r\n        from daily_oil x\r\n        where x.daily_produced_oil != 0\r\n            and x.dttm <= s.dttm\r\n    )\r\n    and d.idflownet = s.idflownet\r\n\tand h.idflownet = s.idflownet"
        dependencies:
