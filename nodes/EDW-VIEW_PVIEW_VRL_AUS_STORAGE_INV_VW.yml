          ODS_PVIEW_PVT_PVUNITMETERLIQUIDENTRY: ef4a30e7-b653-194a-4623-2b48351eff82
          ODS_PVIEW_PVT_PVUNITTANK: a7315a57-43f2-5173-c41d-0f2e7d2bbc85
          ODS_PVIEW_PVT_PVUNITTANKENTRY: d797d9c8-9f12-abf2-40f7-ac36262ae166
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_STORAGE_INV_VW] AS \r\nwith sc_tanks as (\r\n        select t.idflownet,\r\n            t.name,\r\n            t.volcapacity,\r\n            CAST(e.dttm AS date) as date,\r\n            e.volhcliqcalc as oil_stkl,\r\n            case\r\n                when t.volcapacity = 0 then 0\r\n                else round(e.volhcliqcalc / t.volcapacity, 2)\r\n            end as percent_full\r\n        from DS_PRODVIEW.PVT_pvunittank t\r\n            inner join DS_PRODVIEW.PVT_pvunittankentry e on t.idrec = e.idrecparent\r\n        where t.name like 'SC%'\r\n    ),\r\noil_move as (\r\n        select idflownet,\r\n            cell_name,\r\n            sum(Produced_Oil) as Produced_Oil,\r\n            sum(Adjdown_oil) as Adjdown_oil,\r\n            sum(adjup_oil) as adjup_oil,\r\n            sum(Transfer_oil) as Transfer_oil,\r\n            sum(Export_oil) as Export_oil,\r\n            date\r\n        from (\r\n                select u.idflownet,\r\n                    case\r\n                        when charindex('SC1', l.name) > 0 then 'SC1'\r\n                        else 'SC2'\r\n                    end cell_name,\r\n                    (\r\n                        case\r\n                            when l.name like 'Prod%' then ifnull(e.volhcliqcalc, 0)\r\n                            else 0\r\n                        end\r\n                    ) as Produced_Oil,\r\n                    (\r\n                        case\r\n                            when l.name like '%Adj -%' then e.volhcliqcalc\r\n                            else 0\r\n                        end\r\n                    ) as Adjdown_oil,\r\n                    (\r\n                        case\r\n                            when l.name like '%Adj +%' then e.volhcliqcalc\r\n                            else 0\r\n                        end\r\n                    ) as Adjup_oil,\r\n                    (\r\n                        case\r\n                            when l.name like '%Transfer%' then e.volhcliqcalc\r\n                            else 0\r\n                        end\r\n                    ) as Transfer_oil,\r\n                    (\r\n                        case\r\n                            when l.name like '%Export%' then e.volhcliqcalc\r\n                            else 0\r\n                        end\r\n                    ) as Export_oil,\r\n                    CAST(e.dttm AS date) as date\r\n                from DS_PRODVIEW.PVT_pvunit u\r\n                    inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n                    and (\r\n                        u.name like 'Storage Cell%'\r\n                        or u.name like 'Wandoo Platform'\r\n                    )\r\n                    inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry e on l.idrec = e.idrecparent\r\n                union\r\n                select u.idflownet,\r\n                    case\r\n                        when charindex('SC1', l.name) > 0 then 'SC2'\r\n                        else 'SC1'\r\n                    end cell_name,\r\n                    0 as Produced_Oil,\r\n                    0 as Adjdown_oil,\r\n                    0 as Adjup_oil,\r\n                    (\r\n                        case\r\n                            when l.name like '%Transfer%' then 0 - e.volhcliqcalc\r\n                            else 0\r\n                        end\r\n                    ) as Transfer_oil,\r\n                    0 as Export_oil,\r\n                    CAST(e.dttm AS date) as date\r\n                from DS_PRODVIEW.PVT_pvunit u\r\n                    inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n                    and (\r\n                        u.name like 'Storage Cell%'\r\n                        or u.name like 'Wandoo Platform'\r\n                    )\r\n                    inner join DS_PRODVIEW.PVT_pvunitmeterliquidentry e on l.idrec = e.idrecparent\r\n                    and l.name like '%Transfer%'\r\n           \
            \ ) x\r\n        group by idflownet,\r\n            cell_name,\r\n            DATE\r\n    ),\r\noil_export as (\r\n        select u.idflownet,\r\n            case\r\n                when charindex('SC1', l.name) > 0 then 'SC1'\r\n                else 'SC2'\r\n            end cell_name,\r\n            sum(\r\n                case\r\n                    when l.name like '%Export' then ifnull(e.volhcliqcalc, 0)\r\n                    else 0\r\n                end\r\n            ) as Export_Oil,\r\n            CAST(e.dttm AS date) as date\r\n        from DS_PRODVIEW.PVT_pvunit u\r\n            inner join DS_PRODVIEW.PVT_pvunitmeterliquid l on u.idrec = l.idrecparent\r\n            and u.name like 'Storage Cell%'\r\n            and l.name in ('SC1 Oil Export', 'SC2 Oil Export')\r\n            left join DS_PRODVIEW.PVT_pvunitmeterliquidentry e on l.idrec = e.idrecparent\r\n        group by u.idflownet,\r\n            case\r\n                when charindex('SC1', l.name) > 0 then 'SC1'\r\n                else 'SC2'\r\n            end,\r\n            e.dttm\r\n    )\r\nselect t.idflownet,\r\n    t.date,\r\n    t.name,\r\n    sum(ifnull(o.oil_stkl, 0)) yesterday_oil,\r\n    sum(ifnull(m.Produced_Oil, 0)) Produced_oil,\r\n    sum(ifnull(e.Export_oil, 0)) as Export_oil,\r\n    sum(ifnull(m.Transfer_oil, 0)) as transfer_oil,\r\n    sum(ifnull(m.Adjdown_oil, 0)) as adjdown_oil,\r\n    sum(ifnull(m.Adjup_oil, 0)) as adjup_oil,\r\n    sum(ifnull(t.oil_stkl, 0)) as close_oil,\r\n    avg(t.volcapacity) capacity,\r\n    avg(t.percent_full) as percent_full,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom sc_tanks t\r\n    left join oil_move m on t.name = m.cell_name\r\n\t\tand t.date = m.date\r\n\t\tand t.idflownet = m.idflownet\r\n    left join oil_export e on t.name = e.cell_name\r\n\t\tand t.date = e.date\r\n\t\tand t.idflownet = e.idflownet\r\n    left join sc_tanks o on t.name = o.name\r\n\t\tand o.date = dateadd(d, -1, t.date)\r\n\t\tand t.idflownet = o.idflownet\r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = t.idflownet\t\t\r\ngroup by t.idflownet, t.date, t.name,h.SYSSECURITYTYP"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
