        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_AUS_WELLS_VW] AS\r\nselect c.idflownet,\r\n    CAST(p.dttm AS date) as date,\r\n    c.completionname as well,\r\n    param.szchoke * 1000 as choke,\r\n    param.prestub as fthp,\r\n    ge.volgascalc / 1000 as qgl,\r\n    p.durdown * 24 as downtime_hrs,\r\n    d.codedowntm1,\r\n    d.codedowntm2,\r\n    d.codedowntm3,\r\n    d.com,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom DS_PRODVIEW.PVT_pvunitcomp c\r\n    left join DS_PRODVIEW.PVT_pvunitcompgathmonthcalc pm on c.idrec = pm.idrecparent\r\n    left join DS_PRODVIEW.PVT_pvunitcompgathmonthdaycalc p on pm.idrec = p.idrecparent\r\n    left join DS_PRODVIEW.PVT_pvunitcompparam param on param.idrec = p.idrecparam\r\n    left join DS_PRODVIEW.PVT_pvunitcompdowntm d on c.idrec = d.idrecparent\r\n\t\tand p.dttm = d.dttmstart\r\n    inner join DS_PRODVIEW.PVT_pvunit u on c.idrecparent = u.idrec\r\n    left join DS_PRODVIEW.PVT_pvunitmeterpdgas g on u.idrec = g.idrecparent\r\n    left join DS_PRODVIEW.PVT_pvunitmeterpdgasentry ge on g.idrec = ge.idrecparent\r\n\t\tand ge.dttm = p.dttm\r\n\tINNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = c.idflownet\t\r\n where c.completionname not like 'WB10%'"
