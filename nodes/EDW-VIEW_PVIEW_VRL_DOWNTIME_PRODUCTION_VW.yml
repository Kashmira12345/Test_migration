        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_DOWNTIME_PRODUCTION_VW] AS\r\nselect d.idflownet,\r\n    h.name as networkName,\r\n    s.tempbase,\r\n    u.name as unitName,\r\n    u.district as district,\r\n    u.area as core_area,\r\n    u.field as area,\r\n    c.completionname as wellName,\r\n    r.name as route,\r\n    r.usertxt1 as foreman,\r\n    round(d.durdown * 24, 1) as dwntm_hours,\r\n    dt.codedowntm1 as code1,\r\n    dt.codedowntm2 as code2,\r\n    dt.codedowntm3 as code3,\r\n    dt.com as note,\r\n    c.wellidregulatory as uwi,\r\n    c.idrec as idreccomporigin,\r\n    u.idrec as idrecunitorigin,\r\n    d.dttm as prod_date,\r\n    d.durop * 24 as ophours,\r\n    d.wigas as wi_gas,\r\n    d.wihcliq as wi_oil,\r\n    CASE\r\n        WHEN IFNULL(d.wigas, 0) = 0 THEN IFNULL(d.wihcliq, 0)\r\n        ELSE IFNULL(d.wigas, 0)\r\n    END AS working_interest,\r\n    d.volprodgathgas / 1000 * case\r\n        when s.tempbase is null then 1\r\n        else 37.25 / 35.49373\r\n    end as gas_raw_gross,\r\n    d.voldispsalegas / 1000 * case\r\n        when s.tempbase is null then 1\r\n        else 37.25 / 35.49373\r\n    end as gas_sales_gross,\r\n    d.volprodgathhcliq as oil_raw_gross,\r\n    d.volnewprodallocoil as oil_alloc_gross,\r\n    d.voldispsaleoil - ifnull(d.volrecovhcliq, 0) as oil_sales_gross,\r\n    d.volnewprodallocngl as ngl_alloc_gross,\r\n    d.volnewprodalloccond as cond_alloc_gross,\r\n    d.voldispsalengl + d.voldispsalecond as ngl_sales_gross,\r\n    d.volnewprodallocwater as water_alloc_gross,\r\n    d.volprodgathwater as water_raw_gross,\r\n    ifnull(d.volnewprodallochcliq, 0) + ifnull(d.voldispsalegas, 0) / 1000 * case\r\n        when s.tempbase is null then 1\r\n        else 37.25 / 35.49373\r\n    end * 35.49373 / 6 * 0.158910004497153 as boe_alloc_gross,\r\n    ifnull(d.voldispsalehcliq, 0) + ifnull(d.voldispsalegas, 0) / 1000 * case\r\n        when s.tempbase is null then 1\r\n        else 37.25 / 35.49373\r\n    end * 35.49373 / 6 * 0.158910004497153 as boe_sales_gross,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom DS_PRODVIEW.PVT_pvunitallocmonthday d\r\n    left join DS_PRODVIEW.PVT_pvcalcset s on s.idrec = d.idreccalcset\r\n    and s.tempbase != 15\r\n    inner join DS_PRODVIEW.PVT_pvunitallocmonth m on d.idrecparent = m.idrec\r\n    inner join DS_PRODVIEW.PVT_pvunit u on d.idrecunit = u.idrec\r\n    inner join DS_PRODVIEW.PVT_pvunitcomp c on d.idreccomp = c.idrec\r\n    inner join DS_PRODVIEW.PVT_pvroutesetroute r ON u.idrecroutesetroutecalc = r.idrec\r\n    inner join DS_PRODVIEW.PVT_pvflownetheader h on h.idflownet = d.idflownet\r\n    left join DS_PRODVIEW.PVT_pvunitcompdowntm dt on dt.idrec = d.idrecdowntime\r\nWHERE h.usertxt1 = 'CANADA'\r\n    AND d.dttm >= '01-NOV-2020'\r\n"
