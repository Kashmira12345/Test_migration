        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_DOWNTIME_VW] AS\r\nselect f.name as flownet,\r\n    c.wellname as completionname,\r\n    d.typdowntm,\r\n    p.dttm as period,\r\n    p.durdown * 24 as hrs_down,\r\n    p.durdown,\r\n    p.durop,\r\n    p.vollostgas as lost_gas,\r\n    p.vollosthcliq as lost_hcliq,\r\n    d.codedowntm1,\r\n    d.codedowntm2,\r\n    d.codedowntm3,\r\n    d.com as note,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(f.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM DS_PRODVIEW.PVT_pvunitallocmonthday p\r\n    inner join DS_PRODVIEW.PVT_pvflownetheader f on p.idflownet = f.idflownet\r\n    inner join DS_PRODVIEW.PVT_pvunitcompdowntm d on p.idrecdowntime = d.idrec\r\n    inner join DS_PRODVIEW.PVT_pvunitcomp c on p.idreccomp = c.idrec"
