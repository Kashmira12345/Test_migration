        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_PVIEW_VRL_OFM_DAILY_GERMANY_VW') }} "VIEW_PVIEW_VRL_OFM_DAILY_GERMANY_VW"
