    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVFLOWNETHEADER: f766ece4-d7ae-59bf-1ded-1825e56f5578
          ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY: a88a5390-bf3b-3ee4-889a-d0fd0c7466a6
          ODS_PVIEW_PVT_PVUNITCOMPGATHMONTHDAYCALC: da108563-3428-7ac5-3adf-18b24308d78a
          ODS_PVIEW_PVT_PVUNITCOMPPARAM: 0bda6665-d7cf-a7f9-35c8-19a99ec575b3
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_OFM_DAILY_GERMANY_VW]\r\nAS\r\nWITH gath_calcs AS(\r\nSELECT c.idrec\r\n    ,c.completionname\r\n    ,co.dttm\r\n    ,co.ratechghcliq\r\n    ,co.ratechggas\r\n    ,co.ratechgwater\r\n    ,co.pctchghcliq\r\n    ,co.pctchggas\r\n    ,co.pctchgwater\r\n    FROM DS_PRODVIEW.PVT_pvunitcompgathmonthdaycalc co\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcompgathmonthcalc mo ON co.idrecparent = mo.idrec\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp c ON mo.idrecparent = c.idrec\r\n)\r\n-- Main Query\r\nSELECT f.name flow_network\r\n    ,c.completionname well_name\r\n    ,c.wellidb uwi\r\n    ,p.dttm as period\r\n    ,p.durop *24 as hours_on\r\n    ,p.durdown* 24 as hours_down\r\n    ,pa.prestub\r\n    ,pa.prescas\r\n    ,pa.presline\r\n    ,pa.tempwh\r\n    ,pa.szchoke\r\n    ,p.volprodgathhcliq as prod_oil\r\n    ,p.volprodgathgas as prod_gas\r\n    ,p.volprodgathwater as prod_water\r\n    ,p.volnewprodallochcliq alloc_oil\r\n    ,p.volnewprodallocgas alloc_gas\r\n    ,p.volnewprodallocwater alloc_water\r\n    ,case when (p.volprodgathhcliq > 0) then ((p.volprodgathgas / 1000) / p.volprodgathhcliq) else 0 end as gor\r\n    ,gath_calcs.ratechghcliq\r\n    ,gath_calcs.ratechggas\r\n    ,gath_calcs.ratechgwater\r\n    ,gath_calcs.pctchghcliq\r\n    ,gath_calcs.pctchggas\r\n    ,gath_calcs.pctchgwater\r\n    ,null as facility_name\r\n    ,round(p.volprodgathhcliq * d.densityhcliq / 1000,2) tons_oil\r\n    ,case when (p.volprodgathwater + p.volprodgathhcliq) > 0 \r\n     then p.volprodgathwater / (p.volprodgathwater + p.volprodgathhcliq) \r\n     else 0 end wcut,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(f.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom \r\nDS_PRODVIEW.PVT_pvflownetheader f \r\n    inner join DS_PRODVIEW.PVT_pvunitcomp c  on c.idflownet = f.idflownet and f.syssecuritytyp = 'Germany'\r\n    inner join DS_PRODVIEW.PVT_pvunitallocmonthday p on p.idreccomp = c.idrec and p.dttm < dateadd(d,-2, current_timestamp) \r\n    left join DS_PRODVIEW.PVT_pvunitcompparam pa ON pa.idrec = p.idrecparam\r\n    LEFT JOIN gath_calcs ON gath_calcs.idrec = p.idreccomp and gath_calcs.dttm = p.dttm\r\n    left join DS_PRODVIEW.PVT_pvUnitLiquidDensity d on c.idrecparent = d.idrecparent \r\n        and d.dttm = (select max(dttm)\r\n                        from DS_PRODVIEW.PVT_pvUnitLiquidDensity\r\n                        where idrecparent = c.idrecparent and dttm <= p.dttm)"
        dependencies:
