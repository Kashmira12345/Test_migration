        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_OFM_DAILY_INJ_VW]\r\nAS\r\nSELECT\r\n  c.wellidregulatory AS uwi,\r\n  c.completionname   well_name,\r\n  i.dttm             AS period,\r\n  i.durdown * 24     AS hours_down,\r\n  i.durop * 24       AS hours_on,\r\n  i.volinjecthcliq   AS inj_oil,\r\n  i.volinjectgas     AS inj_gas,\r\n  i.volinjectwater   AS inj_water,\r\n  WS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM\r\n  DS_PRODVIEW.pvt_pvunitallocmonthday i\r\n    INNER JOIN DS_PRODVIEW.pvt_pvunitcomp c ON i.idreccomp = c.idrec\r\n\tINNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = i.idflownet"
