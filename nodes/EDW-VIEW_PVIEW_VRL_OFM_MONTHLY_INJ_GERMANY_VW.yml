        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_OFM_MONTHLY_INJ_GERMANY_VW]\r\nAS\r\nSELECT\r\n    c.wellidb        AS uwi,\r\n    c.completionname AS name,\r\n    p.dttmstart      AS period,\r\n    p.durdown * 24   AS hours_down,\r\n    p.durop * 24     AS hours_on,\r\n    z.zonename,\r\n    p.volinjecthcliq,\r\n    p.volinjectgas,\r\n    p.volinjectwater,\r\n    CASE\r\n      WHEN u.typregulatory LIKE 'Dis%' THEN\r\n        p.volinjectwater\r\n      ELSE 0\r\n    END AS voldispwater,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(f.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM\r\n     DS_PRODVIEW.PVT_pvflownetheader f\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitallocmonth p ON f.idflownet = p.idflownet\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp       c ON p.idreccomp = c.idrec\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunit           u ON c.idrecparent = u.idrec\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcompzone   z ON p.idreccompzone = z.idrec\r\nWHERE\r\n    f.syssecuritytyp = 'Germany'\r\n    AND p.dttmstart < DATE_TRUNC('MONTH',current_timestamp)"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITALLOCMONTH
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
