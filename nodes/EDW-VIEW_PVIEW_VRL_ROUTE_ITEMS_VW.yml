        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_ROUTE_ITEMS_VW]\r\nAS\r\nSELECT n.idrec     route_idrec,\n       n.name as routename,\n       u.name      unit_name,\n       u.idrec     unit_idrec\n  FROM DS_PRODVIEW.PVT_pvrouteset s inner join DS_PRODVIEW.PVT_pvroutesetroute n  on s.idrec = n.idrecparent and s.activetodaycalc = 1\n  inner join DS_PRODVIEW.PVT_pvroutesetrouteunit i    on n.idrec = i.idrecparent \n inner join DS_PRODVIEW.PVT_pvunit u\n    on i.idrecunit = u.idrec\n   and u.typ1 = 'pvunitcomp'\nUNION\nSELECT n.idrec     route_idrec,\n       n.name as routename,\n       u.name      unit_name,\n       u.idrec     unit_idrec\n FROM DS_PRODVIEW.PVT_pvrouteset r inner join DS_PRODVIEW.PVT_pvroutesetroute n  on n.idrecparent = r.idrec and r.activetodaycalc is not null\n inner join DS_PRODVIEW.PVT_pvroutesetroutevwflowdiag i\n    on n.idrec = i.idrecparent\n inner join DS_PRODVIEW.PVT_pvunit u\n    on i.idrecunit = u.idrec\n   and u.typ1 = 'pvunitcomp'\r\n"
