            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVROUTESETROUTE
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNIT
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_PVIEW_VRL_WELL_HEADER_VW') }} "VIEW_PVIEW_VRL_WELL_HEADER_VW"
        name: VIEW_PVIEW_VRL_WELL_HEADER_VW
        noLinkRefs: []
