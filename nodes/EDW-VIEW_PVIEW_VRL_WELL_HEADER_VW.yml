          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_WELL_HEADER_VW] AS\r\nSELECT n.name AS network_name,\r\n\tu.division AS country,\r\n\tu.stateprov AS province,\r\n\tu.district AS district,\r\n\tu.field AS field_name,\r\n\tu.fieldoffice AS field_office,\r\n\tu.name AS unit_name,\r\n\tu.nameshort AS display_name,\r\n\tu.typ1 AS unit_type,\r\n\tu.typregulatory AS type,\r\n\tCASE\r\n\t\tu.operated\r\n\t\tWHEN '1' THEN 'Operated'\r\n\t\tELSE 'Non-Operated'\r\n\tEND AS operated,\r\n\tu.operator,\r\n\tu.fieldcode AS field,\r\n\tu.field AS qbyte_area,\r\n\tu.area AS qbyte_core_area,\r\n\tu.stateprov AS basin,\r\n\tu.county AS concession,\r\n\tu.legalsurfloc AS surface_location,\r\n\tu.latitude,\r\n\tu.longitude,\r\n\tu.elevation AS ground_elevation,\r\n\tu.unitidregulatory AS regulatory_id,\r\n\t-- battery\r\n\tu.costcenterida AS cost_centre,\r\n\tu.unitidpa AS production_acct_code,\r\n\tu.costcenteridb AS prism_control_group,\r\n\tu.com AS comment,\r\n\tr.name AS run_name,\r\n\tu.dttmstart AS start_display_date,\r\n\tu.dttmend AS stop_display_date,\r\n\tw.completionname AS well_name,\r\n\tw.wellidregulatory AS uwi,\r\n\tw.wellide AS sample_point_id,\r\n\tw.dttmonprod AS start_allocating_well_in_network,\r\n\tw.dttmend AS expiry_date,\r\n\tw.usertxt1 AS zone,\r\n\tw.usertxt2 AS form_at_td,\r\n\tw.completionlicensee AS licensee,\r\n\tw.completionlicenseno AS well_license,\r\n\tw.dttmonprod AS first_production_date,\r\n\tw.dttmlicense as license_date,\r\n\tw.usernum2 AS tvd,\r\n\tw.usernum1 AS total_depth,\r\n\tn.idflownet,\r\n\tu.idrec AS unit_idrec,\r\n\tCASE\r\n\t\tu.typregulatory\r\n\t\tWHEN 'Gas Plant' THEN 4\r\n\t\tWHEN 'Battery' THEN 2\r\n\t\tWHEN 'Satellite' THEN 3\r\n\t\tWHEN 'Oil Well' THEN 1\r\n\t\tWHEN 'Gas Well' THEN 5\r\n\t\tWHEN 'Source Well' THEN 7\r\n\t\tWHEN 'Injection Well' THEN 6\r\n\t\tWHEN 'SWB' THEN 1\r\n\t\tELSE 0\r\n\tEND AS site_type_id,\r\n\tu.keymigrationsource AS fv_site_id,\r\n\tw.compidregulatory reg_unit_code,\r\n\t-- unit\r\n\tw.compidb reg_unit_name,\r\n\tw.compidc project_code,\r\n\t-- waterflood\r\n\tw.compidd project_name,\r\n\tf.name reporting_facility,\r\n\tw.wellname formatted_uwi,\r\n\tr.name routenames,\r\n\tWS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(n.SYSSECURITYTYP) AS BU_SF_ROLE\r\nFROM DS_PRODVIEW.PVT_pvflownetheader AS n\r\n\tInner JOIN DS_PRODVIEW.PVT_pvunit AS u ON n.idflownet = u.idflownet\r\n\tinner JOIN DS_PRODVIEW.PVT_pvunitcomp AS w ON n.idflownet = w.idflownet\r\n\t\tAND u.idrec = w.idrecparent\r\n\tleft join DS_PRODVIEW.PVT_pvroutesetroute r on u.idrecroutesetroutecalc = r.idrec\r\n\tleft join DS_PRODVIEW.PVT_pvfacility f on u.idrecfacilitycalc = f.idrec\r\n"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFACILITY
