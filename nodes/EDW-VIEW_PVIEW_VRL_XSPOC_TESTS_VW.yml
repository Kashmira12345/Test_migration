        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PVIEW_VRL_XSPOC_TESTS_VW]\r\nAS\r\nselect DECODE(IS_REAL(TO_VARIANT(substring(c.wellidregulatory,1,1))),\r\n    TRUE,\r\n    substring(c.wellidregulatory,1,3)||'/'||substring(c.wellidregulatory,4,2)||'-'||substring(c.wellidregulatory,6,2)||'-'||substring(c.wellidregulatory,8,3)||'-'||substring(c.wellidregulatory,11,4)||'/'||substring(c.wellidregulatory,15,2) \r\n    ,c.wellidregulatory) as uwi,\r\n   u.name as wellname, \r\n   t.dttm as testdate, \r\n   round(t.durtest*24,2) as hrs, \r\n   round(t.ratehcliqcalc*6.29287,5) as oil_rate,\r\n   round(t.ratewatercalc*6.29287,5) as water_rate, \r\n   round((t.ratetotalgascalc/1000) *35.49373,5) as gas_rate,\r\n   WS_EDW.PVIEW_SYSSECURITYTYP_VET_BU_ROLE(h.SYSSECURITYTYP) AS BU_SF_ROLE\r\nfrom \r\n    DS_PRODVIEW.PVT_pvunit u \r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomp c on c.idrecparent = u.idrec \r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitcomptest t on t.idrecparent = c.idrec \r\n    INNER JOIN DS_PRODVIEW.PVT_pvflownetheader h ON h.idflownet = u.idflownet"
