          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PWRANALYTICS_CBU_POWERALLOCATION_MTH] AS\r\nWith MJ as \r\n(\r\n\tSelect * From \r\n\t(\r\n\tSELECT DISTINCT(\"UNIT_NAME\") as WELL_NAME \t\r\n\t,Try_Cast(\"CHILD_ACCOUNT\" as  float) as CHILD_ACCOUNT_NUMBER  ---pls keep this as float!!----\r\n\t,Try_Cast(\"METER_NUMBER\" as  float) as METER_NUMBER\r\n\t,\"COST_CENTER\" as CC_NUM\r\n\t,'' as CC_NAME\r\n\t,\"AREA\" as AREA \r\n\t,\"CORE_AREA\" as CORE_AREA\r\n\t,Province \r\n\t,Facility\r\n\t,Foreman \t\r\n\t,'' as RUN_NAME\r\n\t,'' as Battery\r\n\t,TYPE as TYPE\r\n\t,'Non PV' as Source\r\nFrom DS_POWER.NONPV_ENTITIES NPV\r\nwhere \"CHILD_ACCOUNT\" IS NOT NULL and Country='CANADA'\r\nUNION ALL\r\nSELECT \r\n\tDISTINCT(WELL_NAME)\t,CHILD_ACCOUNT_NUMBER as CHILD_ACCOUNT_NUMBER,METER_NUMBER as METER_NUMBER\r\n\t,CC_NUM\t,CC_NAME,AREA,CORE_AREA,PROVINCE,FACILITY,FOREMAN,RUN_NAME,BATTERY,WELL_TYPE as TYPE,'ProdView' as Source\r\nFROM ML_POWER.VW_FDC_PWRANALYTICS PV\r\nwhere CHILD_ACCOUNT_NUMBER IS NOT NULL and PROVINCE in ('ALBERTA', 'SASKATCHEWAN','MANITOBA') and WELL_NAME not like '%Battery%'\r\n) MJ3\r\ncross join DS_POWER.VET_DIMDATE M\r\nwhere Year(Date) > 2016 and Year(Date) <= Year(GetDate())) \r\n,\r\n\r\nPV_AGG_A as (\t\r\nSelect\r\n\tMJ.CHILD_ACCOUNT_NUMBER\t,Max(PV.Facility) as Facility\r\n\t,MJ.Date,Sum(IFNULL(PV.WATER_M3,'0')) as WATER_M3\r\n\t,Sum(IFNULL(PV.OIL_M3,'0')) as OIL_M3,Sum(IFNULL(PV.GAS_E3M3,'0')) as GAS_E3M3\r\n    ,Sum(IFNULL(PV.BOE,'0'))   as BOE ,count(*) as Well_Count\r\n\t,1.00/Count(*) as \"WellCount Proration\"\t,(DATEFROMPARTS(year(MJ.Date), month (MJ.Date), 01)) as FOM,Max(MJ.Source) as Source\r\n\tFrom  MJ\r\n    LEFT OUTER JOIN ML_POWER.VW_FDC_PWRANALYTICS PV\r\nON MJ.Well_Name = PV.WELL_NAME and MJ.Date = LAST_DAY(TO_DATE(CAST(PROD_YEARMONTH AS VARCHAR), 'YYYYMM'))\r\nGroup by MJ.CHILD_ACCOUNT_NUMBER, MJ.Date)\r\n,\r\n\r\nT as (Select *,  (DATEFROMPARTS(year(MJ.Date), month (MJ.Date), 01)) as FOM\r\n\t from MJ \r\n     where Source='Non PV' and Facility IS NOT NULL and (TYPE='PVFAC' or TYPE='FAC')\r\n  )\r\n \r\n,T1 as (Select\r\n        max(T.CHILD_ACCOUNT_NUMBER) as CHILD_ACCOUNT_NUMBER\r\n        ,T.Date ,count(*) as Well_Count\r\n        ,1.00/Count(*) as \"WellCount Proration\" from T \r\nleft join ML_POWER.VW_FDC_PWRANALYTICS PV on T.Facility = PV.FACILITY \r\nand T.Date = LAST_DAY(TO_DATE(CAST(PROD_YEARMONTH AS VARCHAR), 'YYYYMM'))\r\nGroup by T.Facility, T.Date)\r\n \r\n,PV_AGG_NONPV as (\t\r\nSelect\r\n\tmax (T.CHILD_ACCOUNT_NUMBER) as CHILD_ACCOUNT_NUMBER\r\n\t,Max(IFNULL(PV.Facility,T.Facility) )as FACILITY\r\n\t,max(T.Date) as Date\r\n\t,Sum(IFNULL(PV.WATER_M3,'0')) as WATER_M3\r\n\t,Sum(IFNULL(PV.OIL_M3,'0')) as OIL_M3\r\n\t,Sum(IFNULL(PV.GAS_E3M3,'0')) as GAS_E3M3\r\n\t,Sum(IFNULL(PV.BOE,'0'))   as BOE  \r\n\t,Max(T1.Well_Count)as Well_Count\r\n\t,Max(T1.\"WellCount Proration\") as \"WellCount Proration\"\r\n\t,Max(FOM) as FOM,Max(T.Source) as Source\r\n\tFrom  T\r\n    left join T1 on T1.CHILD_ACCOUNT_NUMBER = T.CHILD_ACCOUNT_NUMBER and T1.Date = T.Date\r\nLEFT JOIN ML_POWER.VW_FDC_PWRANALYTICS PV\r\nON T.Facility = PV.FACILITY and T.Date = LAST_DAY(TO_DATE(CAST(PROD_YEARMONTH AS VARCHAR), 'YYYYMM'))\r\nGroup by PV.Facility, Prod_YEARMONTH\r\n)\r\n, AGG as (Select * from PV_AGG_A union all Select * from PV_AGG_NONPV)\r\n, AGG_Final AS (\r\nSelect CHILD_ACCOUNT_NUMBER,Date,Max(Facility) as Facility, Sum(WATER_M3)as WATER_M3,Sum(OIL_M3)as OIL_M3, Sum(GAS_E3M3) as GAS_E3M3 ,\r\nSum(BOE)as BOE,Sum(Well_Count) as Well_Count\r\n from AGG \r\nGroup by AGG.CHILD_ACCOUNT_NUMBER, AGG.Date\r\n) \r\n,\r\nPV as (\r\nSelect  MJ.WELL_NAME,PV_W.UWI ,IFNULL(PV_W.CC_NUM,MJ.CC_NUM) as CC_NUM\r\n\t,PV_W.CC_NAME,IFNULL(MJ.Province,PV_W.PROVINCE) as Province\t\r\n\t,IFNULL(MJ.\"CORE_AREA\",PV_W.CORE_AREA) as CORE_AREA\t,IFNULL(MJ.\"AREA\",PV_W.AREA) as Area\r\n\t,IFNULL(MJ.Foreman,PV_W.FOREMAN ) as FOREMAN,IFNULL(PV_W.RUN_NAME,MJ.RUN_NAME) as RUN_NAME\t\r\n\t,IFNULL(MJ.Facility,PV_W.FACILITY) as FACILITY,IFNULL(PV_W.BATTERY,MJ.Battery) as BATTERY\r\n\t,IFNULL(PV_W.WELL_TYPE,MJ.TYPE) as
            WELL_TYPE\t,PV_W.Surface_Location\r\n\t,PV_W.SURFACE_LATITUDE\t,PV_W.SURFACE_LONGITUDE\t,PV_W.OPERATING_HOURS,PV_W.DOWNTIME_HOURS\t\r\n\t,PV_W.ON_PROD_DATE,PV_W.LAST_PROD_DATE\t,PV_W.PROD_YEAR,PV_W.PROD_MONTH\t,PV_W.PROD_YEARMONTH\r\n\t,PV_W.WORKING_INTEREST,PV_W.PUMP_TYPE,TO_VARCHAR(PV_W.METER_NUMBER) AS METER_NUMBER\r\n\t,TO_VARCHAR(MJ.CHILD_ACCOUNT_NUMBER)  as CHILD_ACCOUNT_NUMBER\t,MJ.Date as EoProdMonth\t\r\n\t,(DATE_FROM_PARTS(year(MJ.Date), month (MJ.Date), 01)) as FOM\r\n\t,CASE WHEN  MJ.Source = 'Non PV' THEN AGG_Final.WATER_M3 ELSE IFNULL(PV_W.WATER_M3,'0') END as WATER_M3\r\n\t,CASE WHEN  MJ.Source = 'Non PV' THEN AGG_Final.OIL_M3 ELSE IFNULL(PV_W.OIL_M3,'0') END as OIL_M3\r\n\t,CASE WHEN  MJ.Source = 'Non PV' THEN AGG_Final.GAS_E3M3 ELSE IFNULL(PV_W.GAS_E3M3,'0') END as GAS_E3M3\r\n\t,IFNULL(PV_W.OIL_BOE,'0') as OIL_BOE\t,IFNULL(PV_W.GAS_BOE,'0') as GAS_BOE\r\n\t,CASE WHEN  MJ.Source = 'Non PV' THEN AGG_Final.BOE ELSE IFNULL(PV_W.BOE,'0') END as BOE\r\n\t,IFNULL(AGG_Final.BOE,'0') AS TotalBOE\t,AGG_Final.WELL_COUNT as PV_Well_Count  ,MJ.Source \r\n\t,CASE \r\n\t\tWHEN AGG_Final.BOE = 0 THEN 1.00/AGG_Final.WELL_COUNT\r\n\t\tWHEN AGG_Final.BOE IS NULL and 1.00/AGG_Final.WELL_COUNT IS NULL THEN 1.00\r\n\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/AGG_Final.BOE END as Proration_BOE\r\n\t,1.00/AGG_Final.WELL_COUNT as Well_Proration\r\n\t\t\r\n\tFrom MJ  \r\n\r\n\tLEFT JOIN ML_POWER.VW_FDC_PWRANALYTICS PV_W\r\n\tON MJ.Well_Name = PV_W.WELL_NAME and MJ.Date = LAST_DAY(TO_DATE(CAST(PV_W.PROD_YEARMONTH AS VARCHAR), 'YYYYMM'))\r\n\tLEFT JOIN AGG_Final\r\n    ON MJ.CHILD_ACCOUNT_NUMBER = AGG_Final.CHILD_ACCOUNT_NUMBER and MJ.Date = AGG_Final.Date\r\n)\r\n,\r\nPV1 as (\r\nSelect PV.*,\r\n       Case when BOE = 0 then 0 \r\n\t   when TotalBOE=0 then 0\r\n\t   else BOE/TotalBOE end as PR_BOE \r\n\t   from PV \r\n)\r\n,Fin as (\r\nselect  \r\n\t\t\tPB.Country\r\n\t\t\t,case when PB.PROVINCE='Manitoba' then 'SASKATCHEWAN' else PB.PROVINCE end as PROVINCE\r\n\t\t\t,PB.Language,PB.Currency,Utility_Provider,Invoice_Number,Account_Number\r\n\t\t\t,PB.Delivery_Point \t,Consumption_Month\t,IFNULL(PB.Meter_Number,PV1.METER_NUMBER) as Meter_Number\r\n\t\t\t,try_cast(PB.Cost_Center as nvarchar(255))as Cost_Center,PV1.CC_NAME as CC_NAME\t\r\n\t\t\t,PV1.CORE_AREA  AS CORE_AREA,PV1.Area        \r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Total_Consumption_kWh\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Total_Consumption_kWh\r\n\t\t\telse Total_Consumption_kWh END as  Total_Consumption_kWh\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Peak_Consumption_kWh\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Peak_Consumption_kWh\r\n\t\t\telse Peak_Consumption_kWh END as  Peak_Consumption_kWh\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Off_Peak_Consumption_kWh\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Off_Peak_Consumption_kWh\r\n\t\t\telse Off_Peak_Consumption_kWh END as  Off_Peak_Consumption_kWh\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Registered_Demand_kVA\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Registered_Demand_kVA\r\n\t\t\telse Registered_Demand_kVA END as  Registered_Demand_kVA\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Billed_Demand_kVA\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Billed_Demand_kVA\r\n\t\t\telse Billed_Demand_kVA END as  Billed_Demand_kVA\r\n\t\t\t,Current_Meter_Read_Date,Current_Meter_Read\t,Previous_Meter_Read_Date,Previous_Meter_Read\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Total_Amount_Due\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Total_Amount_Due\r\n\t\t\telse Total_Amount_Due END as  Total_Amount_Due\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Subtotal\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Subtotal\r\n\t\t\telse Subtotal END as  Subtotal\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0')
            * Energy_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Energy_Cost\r\n\t\t\telse Energy_Cost END as  Energy_Cost\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Peak_Energy_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Peak_Energy_Cost\r\n\t\t\telse Peak_Energy_Cost END as  Peak_Energy_Cost\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Off_Peak_Energy_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Off_Peak_Energy_Cost\r\n\t\t\telse Peak_Energy_Cost END as  Off_Peak_Energy_Cost\r\n\t\t\t,Basic_Cost/PV_Well_Count as Basic_Cost\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Demand_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Demand_Cost\r\n\t\t\telse Demand_Cost END as  Demand_Cost\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Reactive_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,0) * Reactive_Cost\r\n\t\t\telse Reactive_Cost END as  Reactive_Cost\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Transmission_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Transmission_Cost\r\n\t\t\telse Transmission_Cost END as  Transmission_Cost\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Other_Cost\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Other_Cost\r\n\t\t\telse Other_Cost END as  Other_Cost\t\t\t\r\n\t\t\t,Service_Address\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Carbon_Tax\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Carbon_Tax\r\n\t\t\telse Carbon_Tax END as  Carbon_Tax\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Carbon_Tax_GST\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Carbon_Tax_GST\r\n\t\t\telse Carbon_Tax_GST END as  Carbon_Tax_GST\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Federal_Tax_GST\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Federal_Tax_GST\r\n\t\t\telse Federal_Tax_GST END as  Federal_Tax\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * PST\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * PST\r\n\t\t\telse PST END as  PST\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * MST\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * MST\r\n\t\t\telse MST END as  MST\t\t\t\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * VAT\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * VAT\r\n\t\t\telse VAT END as  VAT\r\n\t\t\t,Cast(Meter_Type as varchar) as Meter_Type\r\n\t\t        ,Bill_Multiplier  ,Rate\t,Power_Factor\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Peak_Demand\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Peak_Demand\r\n\t\t\telse Peak_Demand END as  Peak_Demand,Bill_Days\t\t\r\n\r\n\t\t\t,PV1.CC_NUM as CC_NUM,PV1.PROD_YEARMONTH,PV1.Well_Name as WELL_NAME\r\n\t\t\t,CASE WHEN PV1.FOREMAN is null THEN PV1.FOREMAN ELSE PV1.FOREMAN END AS FOREMAN\r\n\t\t\t,PV1.RUN_NAME,BATTERY,UWI,WELL_TYPE\t,PV1.SURFACE_LOCATION,PV1.SURFACE_LATITUDE\r\n\t\t\t,PV1.SURFACE_LONGITUDE,PV1.OPERATING_HOURS,PV1.DOWNTIME_HOURS,PV1.OIL_M3\r\n            ,PV1.WATER_M3,PV1.GAS_E3M3,PV1.OIL_BOE,PV1.GAS_BOE,PV1.BOE,PV1.TotalBOE\r\n\t\t\t,PV1.FACILITY,WORKING_INTEREST,PUMP_TYPE,PV1.Source\r\n\t\t\t,CASE WHEN PV1.CORE_AREA = 'QUEENSDALE' \r\n\t\t\tAND PV1.AREA in ('ARCOLA', 'ARLINGTON', 'BROWNING', 'CANTAL', \r\n\t\t\t'CRYSTAL HILLS', 'EDENVALE/WAUCHOPE', 'FLINTON/MOOSE VALLEY', 'HAZELWOOD', \r\n\t\t\t'QUEENSDALE FIELD', 'WINMORE/WORKMAN', 'WORDSWORTH FIELD') THEN 'Woodlands Sold' ELSE '' END AS SK_Flag\r\n\r\n\t\t\t,case when PV1.TotalBOE = 0 then IFNULL(Well_Proration,'0') * Subtotal\r\n\t\t\twhen   PV1.TotalBOE <> 0 then IFNULL(PR_BOE,'0') * Subtotal\r\n\t\t\telse Subtotal  END as  Total_Cost \t\t\t\r\n\t\t ,CASE\r\n\t            WHEN  BATTERY IS NULL THEN 'FAC'\r\n\t            WHEN
            WELL_TYPE LIKE 'Inj%' THEN 'FAC'\r\n\t            when WELL_TYPE = 'facility' THEN 'FAC'\r\n                    when  PB.PROVINCE<>'ALBERTA' and WELL_TYPE IS NULL THEN 'FAC'\r\n\t            ELSE 'WELL' END as Norm_Type\r\n\t\r\n\r\nfrom WS_EDW.VIEW_PWRANALYTICS_VET_POWER_MTH_UNION PB\r\nleft join PV1\r\non PB.Account_Number=PV1.CHILD_ACCOUNT_NUMBER\r\nand PV1.FOM = (PB.Consumption_Month)\r\nwhere Country = 'Canada' \r\n)\r\n\r\nSelect Country,PROVINCE,Language,Currency,Utility_Provider,Invoice_Number\r\n,CASE WHEN Account_Number = '510003313101' THEN '510002563490'\r\n        ELSE Account_Number\r\n    END AS Account_Number\r\n\t,Delivery_Point,Consumption_Month,Meter_Number,Cost_Center,CC_NAME,CORE_AREA,Area,Total_Consumption_kWh,Peak_Consumption_kWh,Off_Peak_Consumption_kWh,Registered_Demand_kVA,Billed_Demand_kVA\r\n\t,Current_Meter_Read_Date,Current_Meter_Read,Previous_Meter_Read_Date,Previous_Meter_Read,Total_Amount_Due,Subtotal,Energy_Cost,Peak_Energy_Cost,Off_Peak_Energy_Cost,Basic_Cost,Demand_Cost\r\n\t,Reactive_Cost,Transmission_Cost,Other_Cost,Service_Address,Carbon_Tax,Carbon_Tax_GST,Federal_Tax,PST,MST,VAT,Meter_Type ,Bill_Multiplier ,Rate,(Total_Consumption_kWh / (NULLIF(Registered_Demand_kVA,'0') * NULLIF((Bill_Days * 24),'0'))) AS Power_Factor\r\n\t,Peak_Demand,Bill_Days,CC_NUM,PROD_YEARMONTH,WELL_NAME,FOREMAN,BATTERY,UWI,WELL_TYPE,RUN_NAME,SURFACE_LOCATION,SURFACE_LATITUDE,SURFACE_LONGITUDE,OPERATING_HOURS,DOWNTIME_HOURS,OIL_M3,WATER_M3,GAS_E3M3,OIL_BOE,GAS_BOE\r\n\t,BOE,FACILITY,WORKING_INTEREST,PUMP_TYPE,Source,Total_Cost,Norm_Type from Fin where SK_Flag <>'Woodlands Sold' AND ACCOUNT_NUMBER NOT IN (SELECT TO_VARCHAR(ACCOUNT_NUMBER) FROM DS_POWER.ACCOUNT_EXCLUSIONS)"
        dependencies:
          - locationName: MATILLION_DATA_STORE
            nodeName: ODS_PWRANALYTICS_NONPV_ENTITIES
          - locationName: MATILLION_DATA_STORE
            nodeName: ODS_PWRANALYTICS_VET_DIMDATE
          - locationName: EDW
            nodeName: VIEW_FDC_PWRANALYTICS
          - locationName: EDW
            nodeName: VIEW_PWRANALYTICS_VET_POWER_MTH_UNION
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_PWRANALYTICS_CBU_POWERALLOCATION_MTH') }} "VIEW_PWRANALYTICS_CBU_POWERALLOCATION_MTH"
        name: VIEW_PWRANALYTICS_CBU_POWERALLOCATION_MTH
        noLinkRefs: []
