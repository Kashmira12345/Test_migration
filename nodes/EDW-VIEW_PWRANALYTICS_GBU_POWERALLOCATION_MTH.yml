      - aliases:
          VIEW_PWRANALYTICS_VET_POWER_MTH_UNION: 0ef875f6-905d-3e8d-c1bf-ca84ea867c89
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PWRANALYTICS_GBU_POWERALLOCATION_MTH] AS\r\nWith MJ as (\r\n\tSelect * From \r\n\t(\r\n\t\tSELECT \tDISTINCT(UNIT_NAME) as WELL_NAME \t,Try_Cast(CHILD_ACCOUNT as  float) as CHILD_ACCOUNT_NUMBER  ---pls keep this as float!!----\r\n\t\t,Try_Cast(METER_NUMBER as  float) as METER_NUMBER\t,COST_CENTER as CC_NUM\r\n\t\t,'' as CC_NAME\t,Area as AREA \r\n\t\t,CORE_AREA as CORE_AREA\t,PROVINCE\r\n\t\t,FACILITY\t,FOREMAN \t\r\n\t\t,'' as RUN_NAME\t,'' as BATTERY\r\n\t\t,TYPE as TYPE\t,'Non PV' as SOURCE\r\n\tFrom DS_POWER.NONPV_ENTITIES NPV\r\n\twhere CHILD_ACCOUNT IS NOT NULL and COUNTRY='Germany'\r\n\tUNION ALL\r\n\tSELECT \r\n\t\tDISTINCT(WELL_NAME)\t,CHILD_ACCOUNT_NUMBER\r\n\t\t,METER_NUMBER\t,COALESCE(CC_NUM, AREA) as CC_NUM\r\n\t\t,CC_NAME\t,AREA\r\n\t\t,CORE_AREA\t,PROVINCE\r\n\t\t,FACILITY\t,FOREMAN\r\n\t\t,RUN_NAME\t,BATTERY\r\n\t\t,WELL_TYPE as TYPE\t,'ProdView' as SOURCE\r\n\tFrom WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\twhere COUNTRY = 'GERMANY' and CHILD_ACCOUNT_NUMBER IS NOT NULL) MJ3\r\n\t\tcross join DS_POWER.VET_DIMDATE M\r\n\twhere Year(Date) > 2020 and Year(Date) <= Year(GetDate())),\r\nPV_AGG_A as (\t\r\n\tSelect\r\n\t\tMJ.CHILD_ACCOUNT_NUMBER\r\n\t\t,MJ.DATE\r\n\t\t,Sum(IFNULL(PV.WATER_M3,0)) + Sum(IFNULL(PV.OIL_M3,0)) + Sum(IFNULL(PV.GAS_E3M3,0))   as BOE  \r\n\t\t,count(*)  as WELL_COUNT \r\n\t\t,1.00/count(*)  as WELLCOUNT_PRORATION\r\n\t\tFrom  MJ\r\n\tLEFT OUTER JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\tON MJ.WELL_NAME = PV.WELL_NAME and MJ.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\tGroup by MJ.CHILD_ACCOUNT_NUMBER, MJ.Date),\r\nPV as (\r\n\tSelect  \r\n\t\t MJ.WELL_NAME\t,PV_W.UWI \r\n\t\t,IFNULL(PV_W.CC_NUM,MJ.CC_NUM) as CC_NUM\t,PV_W.CC_NAME\r\n\t\t,IFNULL(MJ.Province,PV_W.PROVINCE) as PROVINCE\t,IFNULL(MJ.CORE_AREA,PV_W.CORE_AREA) as CORE_AREA\r\n\t\t,IFNULL(MJ.AREA,PV_W.AREA) as AREA\t,IFNULL(MJ.Foreman,PV_W.FOREMAN ) as FOREMAN\r\n\t\t,PV_W.RUN_NAME\t,IFNULL(MJ.Facility,PV_W.FACILITY) as FACILITY\r\n\t\t,PV_W.BATTERY\t,PV_W.WELL_TYPE\r\n\t\t,PV_W.SURFACE_LOCATION\t,PV_W.OPERATING_HOURS\r\n\t\t,PV_W.DOWNTIME_HOURS\t,PV_W.ON_PROD_DATE\r\n\t\t,PV_W.LAST_PROD_DATE\t,PV_W.PROD_YEAR\r\n\t\t,PV_W.PROD_MONTH\t,PV_W.PROD_YEARMONTH\r\n\t\t,PV_W.WORKING_INTEREST\t,PV_W.PUMP_TYPE\r\n\t\t,PV_W.METER_NUMBER\t,MJ.CHILD_ACCOUNT_NUMBER as CHILD_ACCOUNT_NUMBER\r\n\t\t,PV_W.FIELD_COMMENTS\t,PV_W.SURFACE_LATITUDE\r\n\t\t,PV_W.SURFACE_LONGITUDE\t,MJ.Date as EOPRODMONTH\r\n\t\t,(datefromparts(Prod_year,right(cast(prod_yearmonth as varchar),2),01)) as FOM\r\n\t\t,IFNULL(PV_W.WATER_M3,0) as WATER_M3\t,IFNULL(PV_W.OIL_M3,0) as OIL_M3\r\n\t\t,PV_W.GAS_E3M3\t,PV_W.OIL_BOE\t,PV_W.GAS_BOE\r\n\t\t,IFNULL(PV_W.BOE,0) as BOE\t,PV_AGG_A.BOE  AS TOTALBOE\r\n\t\t,PV_AGG_A.WELL_COUNT as PV_WELL_COUNT ,PV_AGG_A.WELLCOUNT_PRORATION,PV_AGG_A.WELL_COUNT \r\n\t\t,SOURCE \r\n\t\t,CASE \r\n\t\t\tWHEN PV_AGG_A.BOE = 0 THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t\tWHEN PV_AGG_A.BOE IS NULL and 1.00/PV_AGG_A.WELL_COUNT IS NULL THEN 1.00\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/PV_AGG_A.BOE END as PRORATION_BOE\r\n\t\t,Case \r\n\t\t--No production  then divide equally ---\r\n\t\t\tWHEN (IFNULL(PV_AGG_A.BOE,0) = 0 and PV_AGG_A.WELL_COUNT >= 1) Or ((IFNULL(PV_W.WATER_M3,0)+IFNULL(PV_W.OIL_M3,0)+ IFNULL(PV_W.GAS_E3M3,0) ) = 0 and PV_AGG_A.WELL_COUNT >= 1) THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t---else 1 ---\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3+PV_W.GAS_E3M3)/PV_AGG_A.BOE\r\n\t\t\tEND AS WELL_PRORATION\r\n\tFrom MJ  \r\n\t\tLEFT JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV_W\r\n\t\t\tON MJ.Well_Name = PV_W.WELL_NAME and MJ.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(PV_W.Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(PV_W.Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\t\tLEFT OUTER  JOIN PV_AGG_A \r\n\t\t\tON MJ.CHILD_ACCOUNT_NUMBER = PV_AGG_A.CHILD_ACCOUNT_NUMBER and MJ.Date = PV_AGG_A.Date),\r\nFin as (\r\n\tselect  \r\n\t\tPB.COUNTRY\t\t\t,PV.PROVINCE AS PROVINCE\r\n\t\t,PB.LANGUAGE\t\t\t,PB.CURRENCY\r\
            \n\t\t,UTILITY_PROVIDER\t\t\t,INVOICE_NUMBER\r\n\t\t,ACCOUNT_NUMBER\t\t\t,PB.DELIVERY_POINT \r\n\t\t,CONSUMPTION_MONTH\t\t\t,PB.METER_NUMBER AS METER_NUMBER\r\n\t\t,try_cast(PB.Cost_Center as nvarchar(255))as COST_CENTER\r\n\t\t,PV.CC_NAME as CC_NAME\t\t\t,PV.CORE_AREA  AS CORE_AREA\r\n\t\t,PV.AREA\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) * Total_Consumption_kWh\r\n\t\t\tELSE  Total_Consumption_kWh END as  TOTAL_CONSUMPTION_KWH\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Peak_Consumption_kWh \r\n\t\t\tELSE Peak_Consumption_kWh END as PEAK_CONSUMPTION_KWH\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Off_Peak_Consumption_kWh \r\n\t\t\tELSE Off_Peak_Consumption_kWh END as OFF_PEAK_CONSUMPTION_KWH\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Registered_Demand_kVA \r\n\t\t\telse Registered_Demand_kVA END as REGISTERED_DEMAND_KVA\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Billed_Demand_kVA\r\n\t\t\telse  Billed_Demand_kVA END as BILLED_DEMAND_KVA\r\n\t\t,CURRENT_METER_READ_DATE\r\n\t\t,CURRENT_METER_READ\r\n\t\t,PREVIOUS_METER_READ_DATE\r\n\t\t,PREVIOUS_METER_READ\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then  IFNULL(Well_Proration,0) * Total_Amount_Due \r\n\t\t\tELSE Total_Amount_Due END as TOTAL_AMOUNT_DUE\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 = 0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then  IFNULL(Well_Proration,0) *Subtotal \r\n\t\t\telse Subtotal END as SUBTOTAL\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Energy_Cost \r\n\t\t\telse Energy_Cost END as ENERGY_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0)  *Peak_Energy_Cost\r\n\t\t\telse Peak_Energy_Cost END As PEAK_ENERGY_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Off_Peak_Energy_Cost \r\n\t\t\telse Off_Peak_Energy_Cost END as OFF_PEAK_ENERGY_COST\r\n\t\t,pv.WELLCOUNT_PRORATION *Basic_Cost as BASIC_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Demand_Cost \r\n\t\t\telse Demand_Cost end as DEMAND_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)\
            \  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) * Reactive_Cost \r\n\t\t\telse  Reactive_Cost end as REACTIVE_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then  IFNULL(Well_Proration,0) * Transmission_Cost \r\n\t\t\telse Transmission_Cost end as TRANSMISSION_COST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) * Other_Cost \r\n\t\t\telse Other_Cost end as OTHER_COST\r\n\t\t,SERVICE_ADDRESS\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Carbon_Tax \r\n\t\t\telse Carbon_Tax end as CARBON_TAX\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *Carbon_Tax_GST \r\n\t\t\telse Carbon_Tax_GST end as CARBON_TAX_GST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0)  * Federal_Tax_GST \r\n\t\t\telse Federal_Tax_GST end as FEDERAL_TAX\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *PST \r\n\t\t\telse PST end as PST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then IFNULL(Well_Proration,0) *MST \r\n\t\t\telse  MST end as MST\r\n\t\t,CASE when PV.WATER_M3 = 0 AND PV.OIL_M3 =0 AND GAS_E3M3 = 0 AND PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER)  and PV.Well_Count > 1 THEN 0\r\n\t\t\twhen  PB.Delivery_Point in (PV.CHILD_ACCOUNT_NUMBER) Then  IFNULL(Well_Proration,0) *VAT \r\n\t\t\telse VAT end as VAT\r\n\t\t,Cast(Meter_Type as varchar) as METER_TYPE\r\n\t\t,BILL_MULTIPLIER\t\t    ,RATE\r\n\t\t,POWER_FACTOR\t\t\t,PEAK_DEMAND\r\n\t\t,BILL_DAYS\r\n\t\t----- Prodview ---------\r\n\t\t,PV.CC_NUM as CC_NUM\t\t\t,PV.PROD_YEARMONTH\r\n\t\t,PV.Well_Name as WELL_NAME\t\t,CASE WHEN PV.FOREMAN is null THEN PV.FOREMAN ELSE PV.FOREMAN END AS FOREMAN\r\n\t\t,PV.RUN_NAME\t\t\t,BATTERY\r\n\t\t,UWI\t\t\t,WELL_TYPE\t\t\r\n\t\t,PV.SURFACE_LOCATION\t\t\t,PV.SURFACE_LATITUDE\r\n\t\t,PV.SURFACE_LONGITUDE\t\t\t,PV.OPERATING_HOURS\r\n\t\t,PV.DOWNTIME_HOURS\t\t\t,PV.OIL_M3\r\n\t\t,PV.WATER_M3\t\t\t,PV.GAS_E3M3\r\n\t\t,PV.OIL_BOE\t\t\t,PV.GAS_BOE\r\n\t\t,PV.BOE\t\t\t,CASE WHEN PV.FACILITY is null THEN PV.FACILITY ELSE PV.FACILITY END AS FACILITY\r\n\t\t,WORKING_INTEREST\t\t\t,PUMP_TYPE\t\r\n\t\t,PV.Source\t\t\t,(Well_Proration*(Energy_Cost + Demand_Cost + VAT + PST))+ (PV.WELLCOUNT_PRORATION*Basic_Cost) as TOTAL_COST\r\n\tfrom WS_EDW.VIEW_PWRANALYTICS_VET_POWER_MTH_UNION PB\r\n\t\tleft join PV\t\r\n\t\t\ton PV.CHILD_ACCOUNT_NUMBER = PB.DELIVERY_POINT and PV.FOM = (PB.CONSUMPTION_MONTH)  \r\n\twhere Country = 'Germany')\r\nSelect \r\n\tCOUNTRY\t,PROVINCE\r\n\t,LANGUAGE\t,CURRENCY\r\n\t,UTILITY_PROVIDER\t,INVOICE_NUMBER\r\n\t,ACCOUNT_NUMBER\t,DELIVERY_POINT \r\n\t,CONSUMPTION_MONTH\t,METER_NUMBER\r\n\t,COST_CENTER\t,CC_NAME\t\r\n\t,CORE_AREA\t,AREA\r\n\t,TOTAL_CONSUMPTION_KWH\t,PEAK_CONSUMPTION_KWH\r\n\t,OFF_PEAK_CONSUMPTION_KWH\t,REGISTERED_DEMAND_KVA\r\n\t,BILLED_DEMAND_KVA\t,CURRENT_METER_READ_DATE\r\n\t\
            ,CURRENT_METER_READ\t,PREVIOUS_METER_READ_DATE\r\n\t,PREVIOUS_METER_READ\t,TOTAL_AMOUNT_DUE\r\n\t,SUBTOTAL\t,ENERGY_COST\r\n\t,PEAK_ENERGY_COST\t,OFF_PEAK_ENERGY_COST\r\n\t,BASIC_COST\t,DEMAND_COST\r\n\t,REACTIVE_COST\t,TRANSMISSION_COST\r\n\t,OTHER_COST\t,SERVICE_ADDRESS\r\n\t,CARBON_TAX\t,CARBON_TAX_GST\r\n\t,FEDERAL_TAX\t,PST\r\n\t,MST\t,VAT\r\n\t,METER_TYPE    ,BILL_MULTIPLIER\r\n    ,RATE    ,POWER_FACTOR\r\n\t,PEAK_DEMAND\t,BILL_DAYS\r\n\t,CC_NUM\t,PROD_YEARMONTH\r\n\t,WELL_NAME\t,FOREMAN\r\n\t,BATTERY\t,UWI\r\n\t,WELL_TYPE\t,RUN_NAME\r\n\t,SURFACE_LOCATION\t,SURFACE_LATITUDE\r\n\t,SURFACE_LONGITUDE\t,OPERATING_HOURS\r\n\t,DOWNTIME_HOURS\t,OIL_M3\r\n\t,WATER_M3\t,GAS_E3M3\r\n\t,OIL_BOE\t,GAS_BOE\r\n\t,BOE\t,FACILITY\r\n\t,WORKING_INTEREST\t,PUMP_TYPE\t\r\n\t,SOURCE\t,TOTAL_COST\r\n\t,'' AS NORM_TYPE\r\n from Fin"
        dependencies:
          - locationName: EDW
