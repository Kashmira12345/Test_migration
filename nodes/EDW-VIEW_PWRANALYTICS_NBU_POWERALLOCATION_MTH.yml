      - aliases:
          VIEW_PWRANALYTICS_VET_POWER_MTH_UNION: 0ef875f6-905d-3e8d-c1bf-ca84ea867c89
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PWRANALYTICS_NBU_POWERALLOCATION_MTH] AS\r\nWith MJ as (\r\n\tSELECT \r\n\t\tdistinct(WELL_NAME)\t,CHILD_ACCOUNT_NUMBER\r\n\t\t,METER_NUMBER\t,IFNULL(PV.CC_NUM,T.CC_NUM) as CC_NUM\r\n\t\t,IFNULL(CC_NAME,T.CC_NAME_L2) as CC_NAME\r\n\t\t,AREA\t,CORE_AREA\r\n\t\t,PROVINCE\t,IFNULL(FACILITY,T.FAC_L3) as FACILITY\r\n\t\t,FOREMAN\t,T.METER_TYPE as TYPE\r\n\t\t,'ProdView' as SOURCE\r\n\tFrom WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\tLeft join (select * from DS_POWER.NBU_MAPPING ) T\r\n\t\t\ton PV.WELL_NAME=T.WELL_NAME_L1\r\n\twhere COUNTRY = 'NETHERLANDS' and PROD_YEARMONTH>='202201'),\r\nMJ1 as (\r\n\tSelect * \r\n\tfrom MJ\r\n\t\tcross join DS_POWER.VET_DIMDATE M\r\n\twhere Year(Date) >= 2022 and Year(Date) <= Year(GetDate())),\r\nPV_AGG_A as (\t\r\n\t(Select\r\n\t\tMJ1.WELL_NAME\r\n\t\t,Max(MJ1.CHILD_ACCOUNT_NUMBER) as CHILD_ACCOUNT_NUMBER\r\n\t\t,max(MJ1.Facility) as FACILITY\r\n\t\t,MJ1.DATE\r\n\t\t,Max(MJ1.Type) as TYPE\r\n\t\t,Sum(IFNULL(BOE,0)) as BOE\r\n\t\t,count(*) as WELL_COUNT\r\n\t\t,1.00/Count(*) as WELLCOUNT_PRORATION\r\n\tFrom  MJ1\r\n\t\tLEFT OUTER JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\t\tON MJ1.WELL_NAME = PV.WELL_NAME and MJ1.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\tGroup by MJ1.WELL_NAME, MJ1.Date )),\r\nPV_AGG_NONPV as (\r\n\t(Select\r\n\t\t0 As CHILD_ACCOUNT_NUMBER\r\n\t\t,MJ1.Facility as FACILITY\r\n\t\t,MJ1.DATE\r\n\t\t,MJ1.Type as TYPE\r\n\t\t,Sum(IFNULL(BOE,0)) as BOE\r\n\t\t,count(*)-1 as WELL_COUNT\r\n\t\t,1.00/Count(*) as WELLCOUNT_PRORATION\r\n\tFrom  MJ1 \r\n\t\tLEFT OUTER JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\t\tON MJ1.WELL_NAME = PV.WELL_NAME and MJ1.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\tGroup by MJ1.FACILITY, MJ1.DATE,MJ1.TYPE  )),\r\nNONPV as ( \r\n\tSelect T.EANCODE as EAN\r\n\t\t,FACILITY \r\n\t\t,(DATEFROMPARTS(year(Date), month (Date), 01)) as FOM\r\n\t\t,T.CC_NUM as CC_NUM\r\n\t\t,T.CC_NAME_L2 as CC_NAME\r\n\t\t,BOE\r\n\t\t,WELL_COUNT\r\n\t\t,WELLCOUNT_PRORATION\r\n\t\t,T.METER_TYPE as TYPE\r\n\t\t,'NONPV' as SOURCE\r\n\tfrom PV_AGG_NONPV \r\n\t\tleft join DS_POWER.NBU_MAPPING T\r\n\t\t\ton Facility =FAC_L3 \r\n\twhere METER_TYPE = 'FAC'), \r\nPV as (\r\n\tSelect  \r\n\t\tMJ1.WELL_NAME\t,PV_W.UWI \r\n\t\t,MJ1.CC_NUM\t,MJ1.CC_NAME\r\n\t\t,PV_W.PROVINCE as PROVINCE\t,PV_W.CORE_AREA as CORE_AREA\r\n\t\t,PV_W.AREA as AREA\t,PV_W.FOREMAN as FOREMAN\r\n\t\t,PV_W.RUN_NAME\t,MJ1.FACILITY as FACILITY\r\n\t\t,PV_W.BATTERY\t,PV_W.WELL_TYPE\r\n\t\t,PV_W.Surface_Location\t,PV_W.SURFACE_LATITUDE\r\n\t\t,PV_W.SURFACE_LONGITUDE\t,PV_W.OPERATING_HOURS\r\n\t\t,PV_W.DOWNTIME_HOURS\t,PV_W.PROD_YEARMONTH\r\n\t\t,PV_W.WORKING_INTEREST\t,PV_W.PUMP_TYPE\r\n\t\t,MJ1.METER_NUMBER\t,PV_AGG_A.CHILD_ACCOUNT_NUMBER  as CHILD_ACCOUNT_NUMBER\r\n\t\t,MJ1.Date as EOPRODMONTH\t,(DATEFROMPARTS(year(MJ1.Date), month (MJ1.Date), 01)) as FOM\r\n\t\t,IFNULL(PV_W.WATER_M3,0) as WATER_M3\t,IFNULL(PV_W.OIL_M3,0) as OIL_M3\r\n\t\t,PV_W.GAS_E3M3\t,PV_W.OIL_BOE\r\n\t\t,PV_W.GAS_BOE\t,IFNULL(PV_AGG_A.BOE,0)as BOE\r\n\t\t, IFNULL(PV_AGG_A.BOE,0) as TOTALBOE\t,PV_AGG_A.WELL_COUNT as PV_WELL_COUNT\r\n\t\t,PV_AGG_A.WELL_COUNT as MJ_WELL_COUNT\t,PV_AGG_A.WELLCOUNT_PRORATION\r\n\t\t,SOURCE\t,MJ1.TYPE\r\n\t\t,CASE \r\n\t\t\tWHEN PV_AGG_A.BOE = 0 THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t\tWHEN PV_AGG_A.BOE IS NULL and 1.00/PV_AGG_A.WELL_COUNT IS NULL THEN 1.00\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/PV_AGG_A.BOE END as PRORATION_BOE\r\n\t\t,Case \r\n\t\t\tWHEN (PV_AGG_A.BOE = 0 and PV_AGG_A.WELL_COUNT >= 1) Or ((PV_W.WATER_M3+PV_W.OIL_M3) = 0 and PV_AGG_A.BOE = 0 and PV_AGG_A.WELL_COUNT > 1) THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/PV_AGG_A.BOE\r\n\t\t\tEND AS WELL_PRORATION\r\n\t\tFrom MJ1 \r\n\t\t\tLEFT JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV_W\r\n\t\t\t\tON MJ1.Well_Name = PV_W.WELL_NAME and MJ1.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(PV_W.Prod_YEARMONTH
            as varchar),1,4), '-', SUBSTRING(cast(PV_W.Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\t\t\tLEFT JOIN PV_AGG_A \r\n\t\t\t\tON MJ1.CHILD_ACCOUNT_NUMBER = PV_AGG_A.CHILD_ACCOUNT_NUMBER and MJ1.Date = PV_AGG_A.Date)\r\nselect  \r\n\t PB.COUNTRY\t\t\t,PV.PROVINCE\r\n\t,PB.LANGUAGE\t\t\t,PB.CURRENCY\r\n\t,PB.UTILITY_PROVIDER\t\t\t,PB.INVOICE_NUMBER\r\n\t,PB.ACCOUNT_NUMBER\t\t\t,PB.DELIVERY_POINT\r\n\t,CAST(CONSUMPTION_MONTH AS DATE) AS CONSUMPTION_MONTH\r\n\t,PB.METER_NUMBER\t\t\t,PB.COST_CENTER \r\n\t,IFNULL(PV.CC_NAME,NONPV.CC_NAME) AS CC_NAME\r\n\t,PV.CORE_AREA AS CORE_AREA\t\t\t,PV.AREA AS AREA\r\n\t,CASE WHEN PV.TYPE='WELL' THEN WELL_PRORATION* TOTAL_CONSUMPTION_KWH \r\n\t ELSE TOTAL_CONSUMPTION_KWH\r\n\t END AS  TOTAL_CONSUMPTION_KWH\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0)*PEAK_CONSUMPTION_KWH \r\n\t ELSE PEAK_CONSUMPTION_KWH\r\n\t END AS PEAK_CONSUMPTION_KWH\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0)*OFF_PEAK_CONSUMPTION_KWH \r\n\t ELSE OFF_PEAK_CONSUMPTION_KWH \r\n\t END AS OFF_PEAK_CONSUMPTION_KWH\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0)*REGISTERED_DEMAND_KVA \r\n\t ELSE REGISTERED_DEMAND_KVA\r\n\t END AS REGISTERED_DEMAND_KVA\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0)*BILLED_DEMAND_KVA\r\n\t ELSE BILLED_DEMAND_KVA\r\n\t END AS BILLED_DEMAND_KVA\r\n\t,CURRENT_METER_READ_DATE\t\t\t,CURRENT_METER_READ\r\n\t,PREVIOUS_METER_READ_DATE\t\t\t,PREVIOUS_METER_READ\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0) * TOTAL_AMOUNT_DUE \r\n\t ELSE TOTAL_AMOUNT_DUE \r\n\t END AS TOTAL_AMOUNT_DUE\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0) *SUBTOTAL \r\n\t ELSE  SUBTOTAL \r\n\t END AS SUBTOTAL\r\n\t ,CASE WHEN PV.TYPE = 'WELL' THEN IFNULL(WELL_PRORATION,0) *ENERGY_COST \r\n\t ELSE ENERGY_COST\r\n\t  END AS ENERGY_COST\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0) *PEAK_ENERGY_COST\r\n\t ELSE PEAK_ENERGY_COST \r\n\t END AS PEAK_ENERGY_COST\r\n\t,CASE WHEN PV.TYPE='WELL' THEN IFNULL(WELL_PRORATION,0) *OFF_PEAK_ENERGY_COST \r\n\t ELSE OFF_PEAK_ENERGY_COST \r\n\t END AS OFF_PEAK_ENERGY_COST\r\n\t,CASE WHEN PV.TYPE ='WELL' THEN BASIC_COST/PV.MJ_WELL_COUNT\r\n\t ELSE BASIC_COST\r\n\t END AS BASIC_COST\t\t\t\r\n\t,CASE WHEN PV.TYPE = 'WELL' THEN IFNULL(WELL_PRORATION,0) *DEMAND_COST \r\n\t ELSE DEMAND_COST \r\n\t END AS DEMAND_COST\r\n\t,REACTIVE_COST\r\n\t,CASE WHEN PV.TYPE = 'WELL' THEN IFNULL(WELL_PRORATION,0) * TRANSMISSION_COST\r\n\t ELSE TRANSMISSION_COST\r\n\t END AS  TRANSMISSION_COST\r\n\t,CASE WHEN PV.TYPE = 'WELL' THEN IFNULL(WELL_PRORATION,0) * OTHER_COST\r\n\t ELSE OTHER_COST\r\n\t END AS OTHER_COST\r\n\t,PB.SERVICE_ADDRESS\r\n\t--Taxes---\r\n\t,CARBON_TAX\t\t    ,CARBON_TAX_GST\r\n\t,FEDERAL_TAX_GST\t\t\t,PST\r\n\t,MST\t\t\t,VAT\r\n\t,CAST(METER_TYPE AS VARCHAR) AS METER_TYPE\t\t\t,BILL_MULTIPLIER\r\n\t,RATE\t\t\t,POWER_FACTOR\r\n\t,PEAK_DEMAND\t\t\t,BILL_DAYS\r\n\t---PV Cols ---\r\n\t,IFNULL(PV.CC_NUM,NONPV.CC_NUM) as CC_NUM\t\t\t,PV.PROD_YEARMONTH\r\n\t,PV.WELL_NAME\t\t\t,PV.FOREMAN AS FOREMAN\r\n\t,BATTERY\t\t\t,UWI\r\n\t,IFNULL(PV.Type,NONPV.TYPE) as WELL_TYPE\t\t\t,RUN_NAME\r\n\t,SURFACE_LOCATION\t\t\t,SURFACE_LATITUDE\r\n\t,SURFACE_LONGITUDE\t\t\t,PV.OPERATING_HOURS\r\n\t,PV.DOWNTIME_HOURS\t\t\t,PV.OIL_M3\t\t\r\n\t,PV.WATER_M3\t\t\t,PV.GAS_E3M3\r\n\t,PV.OIL_BOE\t\t\t,PV.GAS_BOE\r\n\t,IFNULL(PV.BOE,NONPV.BOE) as BOE\t\t,IFNULL(PV.FACILITY,NONPV.Facility) AS FACILITY\t\t\r\n\t,WORKING_INTEREST\t\t\t\t\t\t,PV.PUMP_TYPE\r\n\t,IFNULL(PV.Source,NONPV.Source) as Source\r\n\t----   calculated columns below provide by the business to include in view -----------\r\n\t,(WELL_PRORATION*(ENERGY_COST + DEMAND_COST + VAT + PST))+ (PV.WELLCOUNT_PRORATION*BASIC_COST) AS TOTAL_COST\r\n\t,case when WELL_TYPE = 'WELL' then 'WELL'\r\n\t\telse  'FAC'\r\n\t\tend AS NORM_TYPE\r\nfrom WS_EDW.VIEW_PWRANALYTICS_VET_POWER_MTH_UNION PB\r\n\tleft join NONPV \r\n\t\ton NONPV.EAN = PB.Delivery_Point and NONPV.FOM = (PB.Consumption_Month)\r\n\tleft join PV\r\n\t\ton PV.CHILD_ACCOUNT_NUMBER=PB.Account_Number and PV.FOM = (PB.Consumption_Month)\r\
            \nwhere PB.COUNTRY = 'NETHERLANDS'"
