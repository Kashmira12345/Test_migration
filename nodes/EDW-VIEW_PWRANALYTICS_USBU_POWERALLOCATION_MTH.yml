          VIEW_PWRANALYTICS_VET_POWER_MTH_UNION: 0ef875f6-905d-3e8d-c1bf-ca84ea867c89
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_PWRANALYTICS_USBU_POWERALLOCATION_MTH] AS\r\nWith MJ as (\r\n\tSelect * From (\r\n\t\tSELECT \r\n\t\t\tDISTINCT(WELL_NAME)\t,CHILD_ACCOUNT_NUMBER\r\n\t\t\t,METER_NUMBER\t,CC_NUM\r\n\t\t\t,AREA\t,CORE_AREA\r\n\t\t\t,PROVINCE\t,FACILITY\r\n\t\t\t,FOREMAN\t,RUN_NAME\r\n\t\t\t,BATTERY\t,'ProdView' as SOURCE\r\n\t\tFrom WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\twhere COUNTRY = 'UNITED STATES'\r\n\t\t) MJ3\r\n\t\tcross join DS_POWER.VET_DIMDATE M\r\n\twhere Year(Date) >= 2021 and Year(Date) <= Year(GetDate())),\r\nPV_AGG_A as (\t\r\n\tSelect\r\n\t\tMJ.CHILD_ACCOUNT_NUMBER\r\n\t\t,MJ.DATE\r\n\t\t,Sum(IFNULL(PV.WATER_M3,0)) + Sum(IFNULL(PV.OIL_M3,0)) as BOE\r\n\t\t,count(*) as WELL_COUNT\r\n\t\t,1.00/Count(*) as WELLCOUNT_PRORATION\r\n\tFrom  MJ\r\n\t\tLEFT OUTER JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV\r\n\t\t\tON MJ.Well_Name = PV.WELL_NAME and MJ.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\tGroup by MJ.CHILD_ACCOUNT_NUMBER, MJ.Date),\r\nPV as (\r\n\tSelect  \r\n\t\tMJ.WELL_NAME\t,PV_W.UWI \r\n\t\t,IFNULL(PV_W.CC_NUM,MJ.CC_NUM) as CC_NUM\t,PV_W.CC_NAME\r\n\t\t,IFNULL(MJ.PROVINCE,PV_W.PROVINCE) as Province\t,IFNULL(MJ.CORE_AREA,PV_W.CORE_AREA) as CORE_AREA\r\n\t\t,IFNULL(MJ.AREA,PV_W.AREA) as Area\t,IFNULL(MJ.FOREMAN,PV_W.FOREMAN ) as FOREMAN\r\n\t\t,IFNULL(PV_W.RUN_NAME,MJ.RUN_NAME) as RUN_NAME\t,IFNULL(MJ.FACILITY,PV_W.FACILITY) as FACILITY\r\n\t\t,IFNULL(PV_W.BATTERY,MJ.Battery) as BATTERY\t,PV_W.WELL_TYPE\r\n\t\t,PV_W.SURFACE_LOCATION\t,PV_W.SURFACE_LATITUDE\r\n\t\t,PV_W.SURFACE_LONGITUDE\t,PV_W.OPERATING_HOURS\r\n\t\t,PV_W.DOWNTIME_HOURS\t,PV_W.ON_PROD_DATE\r\n\t\t,PV_W.LAST_PROD_DATE\t,PV_W.PROD_YEAR\r\n\t\t,PV_W.PROD_MONTH\t,PV_W.PROD_YEARMONTH\r\n\t\t,PV_W.WORKING_INTEREST\t,PV_W.PUMP_TYPE\r\n\t\t,PV_W.METER_NUMBER\t,MJ.CHILD_ACCOUNT_NUMBER  as CHILD_ACCOUNT_NUMBER\r\n\t\t,MJ.Date as EoProdMonth\t,(DATEFROMPARTS(year(MJ.Date), month (MJ.Date), 01)) as FOM\r\n\t\t,IFNULL(PV_W.WATER_M3,0) as WATER_M3\t,IFNULL(PV_W.OIL_M3,0) as OIL_M3\r\n\t\t,PV_W.GAS_E3M3\t,PV_W.OIL_BOE\r\n\t\t,PV_W.GAS_BOE\t,IFNULL(PV_W.BOE,0) as BOE\r\n\t\t,IFNULL(PV_AGG_A.BOE,0) AS TOTALBOE\t,PV_AGG_A.WELL_COUNT AS PV_WELL_COUNT\r\n\t\t,PV_AGG_A.WELL_COUNT AS MJ_WELL_COUNT\t,PV_AGG_A.WELLCOUNT_PRORATION\r\n\t\t,SOURCE \r\n\t\t,CASE \r\n\t\t\tWHEN PV_AGG_A.BOE = 0 THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t\tWHEN PV_AGG_A.BOE IS NULL and 1.00/PV_AGG_A.WELL_COUNT IS NULL THEN 1.00\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/PV_AGG_A.BOE END as PRORATION_BOE\r\n\t\t,Case \r\n\t\t\tWHEN (PV_AGG_A.BOE = 0 and PV_AGG_A.WELL_COUNT >= 1) Or ((PV_W.WATER_M3+PV_W.OIL_M3) = 0 and PV_AGG_A.BOE = 0 and PV_AGG_A.WELL_COUNT > 1) THEN 1.00/PV_AGG_A.WELL_COUNT\r\n\t\t\tELSE (PV_W.WATER_M3+PV_W.OIL_M3)/PV_AGG_A.BOE\r\n\t\t\tEND AS WELL_PRORATION\r\n\tFrom MJ \r\n\t\tLEFT JOIN WS_EDW.VIEW_FDC_PWRANALYTICS PV_W\r\n\t\t\tON MJ.Well_Name = PV_W.WELL_NAME and MJ.Date = LAST_DAY(DATE(concat(SUBSTRING(cast(PV_W.Prod_YEARMONTH as varchar),1,4), '-', SUBSTRING(cast(PV_W.Prod_YEARMONTH as varchar),5,2), '-01')))\r\n\t\tLEFT JOIN PV_AGG_A \r\n\t\t\tON MJ.CHILD_ACCOUNT_NUMBER = PV_AGG_A.CHILD_ACCOUNT_NUMBER  and MJ.Date = PV_AGG_A.Date),\r\nFin as(\r\n\tselect  \r\n\t\tPB.COUNTRY\t\t\t,PB.PROVINCE\r\n\t\t,PB.LANGUAGE\t\t,PB.CURRENCY\r\n\t\t,UTILITY_PROVIDER\t,INVOICE_NUMBER\r\n\t\t,ACCOUNT_NUMBER\t    ,PB.DELIVERY_POINT \r\n\t\t,CONSUMPTION_MONTH\t,PB.METER_NUMBER AS METER_NUMBER\r\n\t\t,COST_CENTER\t\t,PV.CC_NAME AS CC_NAME\t\r\n\t\t,PV.CORE_AREA  AS CORE_AREA\t\t\t,PV.AREA\r\n\t\t,IFNULL(WELL_PRORATION,0) * TOTAL_CONSUMPTION_KWH AS  TOTAL_CONSUMPTION_KWH\r\n\t\t,IFNULL(WELL_PRORATION,0) *PEAK_CONSUMPTION_KWH AS PEAK_CONSUMPTION_KWH\r\n\t\t,IFNULL(WELL_PRORATION,0) *OFF_PEAK_CONSUMPTION_KWH AS OFF_PEAK_CONSUMPTION_KWH\r\n\t\t,IFNULL(WELL_PRORATION,0) *REGISTERED_DEMAND_KVA AS REGISTERED_DEMAND_KVA\r\n\t\t,IFNULL(WELL_PRORATION,0) *BILLED_DEMAND_KVA AS BILLED_DEMAND_KVA\r\n\t\t,CURRENT_METER_READ_DATE\t\t\t,CURRENT_METER_READ\r\n\t\t,PREVIOUS_METER_READ_DATE\t\
            \t\t,PREVIOUS_METER_READ\r\n\t\t,IFNULL(WELL_PRORATION,0) * TOTAL_AMOUNT_DUE AS TOTAL_AMOUNT_DUE\r\n\t\t,IFNULL(WELL_PRORATION,0) *SUBTOTAL AS SUBTOTAL\r\n\t\t,IFNULL(WELL_PRORATION,0) *ENERGY_COST AS ENERGY_COST\r\n\t\t,IFNULL(WELL_PRORATION,0)  *PEAK_ENERGY_COST AS PEAK_ENERGY_COST\r\n\t\t,IFNULL(WELL_PRORATION,0) *OFF_PEAK_ENERGY_COST AS OFF_PEAK_ENERGY_COST\r\n\t\t,BASIC_COST/PV.MJ_WELL_COUNT AS BASIC_COST\r\n\t\t,IFNULL(WELL_PRORATION,0) *DEMAND_COST AS DEMAND_COST\r\n\t\t,IFNULL(WELL_PRORATION,0) * REACTIVE_COST AS REACTIVE_COST\r\n\t\t,IFNULL(WELL_PRORATION,0) * TRANSMISSION_COST AS TRANSMISSION_COST\r\n\t\t,IFNULL(WELL_PRORATION,0) * OTHER_COST AS OTHER_COST\r\n\t\t,SERVICE_ADDRESS\r\n\t\t,IFNULL(WELL_PRORATION,0) *CARBON_TAX AS CARBON_TAX\r\n\t\t,IFNULL(WELL_PRORATION,0) *CARBON_TAX_GST AS CARBON_TAX_GST\r\n\t\t,IFNULL(WELL_PRORATION,0)  * FEDERAL_TAX_GST AS FEDERAL_TAX\r\n\t\t,IFNULL(WELL_PRORATION,0) *PST AS PST\r\n\t\t,IFNULL(WELL_PRORATION,0) *MST AS MST\r\n\t\t,IFNULL(WELL_PRORATION,0) *VAT AS VAT\r\n\t\t,CAST(METER_TYPE AS VARCHAR) AS METER_TYPE\r\n\t\t,BILL_MULTIPLIER\t\t    ,RATE\r\n\t\t,POWER_FACTOR\t\t\t,PEAK_DEMAND\r\n\t\t,BILL_DAYS\t\t\t\r\n\t\t\t----- Prodview ---------\r\n\t\t,PV.CC_NUM as CC_NUM\t\t\t,PV.PROD_YEARMONTH\r\n\t\t,PV.Well_Name as WELL_NAME\t,CASE WHEN PV.FOREMAN is null THEN PV.FOREMAN ELSE PV.FOREMAN END AS FOREMAN\r\n\t\t,PV.RUN_NAME\t\t,BATTERY\r\n\t\t,UWI\t\t\t,WELL_TYPE\t\t\r\n\t\t,PV.SURFACE_LOCATION\t\t\t,PV.SURFACE_LATITUDE\r\n\t\t,PV.SURFACE_LONGITUDE\t\t\t,PV.OPERATING_HOURS\r\n\t\t,PV.DOWNTIME_HOURS\t\t\t,PV.OIL_M3\r\n\t\t,PV.WATER_M3\t\t\t,PV.GAS_E3M3\r\n\t\t,PV.OIL_BOE\t\t\t,PV.GAS_BOE\r\n\t\t,PV.BOE\t\t\t,CASE WHEN PV.FACILITY is null THEN PV.FACILITY ELSE PV.FACILITY END AS FACILITY\r\n\t\t,WORKING_INTEREST\t\t\t,PUMP_TYPE\t\r\n\t\t,PV.SOURCE\r\n\t----calculated columns below provide by the business to include in view\r\n\t\t,(IFNULL(Well_Proration,0))*Subtotal as TOTAL_COST\r\n\t\t,'' as NORM_TYPE\r\n\tfrom WS_EDW.VIEW_PWRANALYTICS_VET_POWER_MTH_UNION PB\r\n\t\tleft join PV\r\n\t\t\ton  PB.Account_Number=PV.CHILD_ACCOUNT_NUMBER and PV.FOM = (PB.Consumption_Month)\r\n\twhere COUNTRY = 'United States' )\r\nSelect \r\n\tCOUNTRY\t,PROVINCE\r\n\t,LANGUAGE\t,CURRENCY\r\n\t,UTILITY_PROVIDER\t,INVOICE_NUMBER\r\n\t,ACCOUNT_NUMBER\t,DELIVERY_POINT \r\n\t,CONSUMPTION_MONTH\t,METER_NUMBER\r\n\t,COST_CENTER\t,CC_NAME\t\r\n\t,CORE_AREA\t,AREA\r\n\t,TOTAL_CONSUMPTION_KWH\t,PEAK_CONSUMPTION_KWH\r\n\t,OFF_PEAK_CONSUMPTION_KWH\t,REGISTERED_DEMAND_KVA\r\n\t,BILLED_DEMAND_KVA\t,CURRENT_METER_READ_DATE\r\n\t,CURRENT_METER_READ\t,PREVIOUS_METER_READ_DATE\r\n\t,PREVIOUS_METER_READ\t,TOTAL_AMOUNT_DUE\r\n\t,SUBTOTAL\t,ENERGY_COST\r\n\t,PEAK_ENERGY_COST\t,OFF_PEAK_ENERGY_COST\r\n\t,BASIC_COST\t,DEMAND_COST\r\n\t,REACTIVE_COST\t,TRANSMISSION_COST\r\n\t,OTHER_COST\t,SERVICE_ADDRESS\r\n\t,CARBON_TAX\t,CARBON_TAX_GST\r\n\t,FEDERAL_TAX\t,PST\r\n\t,MST\t,VAT\r\n\t,METER_TYPE    ,BILL_MULTIPLIER\r\n    ,RATE    ,POWER_FACTOR\r\n\t,PEAK_DEMAND\t,BILL_DAYS\r\n\t,CC_NUM\t,PROD_YEARMONTH\r\n\t,WELL_NAME\t,FOREMAN\r\n\t,BATTERY\t,UWI\r\n\t,WELL_TYPE\t,RUN_NAME\r\n\t,SURFACE_LOCATION\t,SURFACE_LATITUDE\r\n\t,SURFACE_LONGITUDE\t,OPERATING_HOURS\r\n\t,DOWNTIME_HOURS\t,OIL_M3\r\n\t,WATER_M3\t,GAS_E3M3\r\n\t,OIL_BOE\t,GAS_BOE\r\n\t,BOE\t,FACILITY\r\n\t,WORKING_INTEREST\t,PUMP_TYPE\t\r\n\t,SOURCE\t,TOTAL_COST\r\n\t,NORM_TYPE\r\n from Fin"
