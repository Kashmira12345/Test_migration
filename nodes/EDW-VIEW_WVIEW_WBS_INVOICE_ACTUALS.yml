          DIM_LO_SAP_INVOICE: 69b59d6f-604f-bc6f-b0c8-ff1569fdae77
          FACT_LO_SAP_LEASE_OPS: 47d4ed22-3053-c6ec-e832-480f43ab4d0b
          ODS_WVIEW_WVT_WVJOBAFE: c3a67cfe-57b0-7650-8722-f65ca2a06ec7
          ODS_WVIEW_WVT_WVWELLHEADER: c8d5871e-f0e2-3a87-16c9-2dfd301a22e2
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_WVIEW_WBS_INVOICE_ACTUALS] AS\r\n    select\n        wvheader.idwell WELLHEADER_IDWELL,\n        wvafe.idrec JOBAFE_IDREC,\n        gl_account.acct_desc GL_ACCOUNT_DESC,\n        gl_account.major_acct GL_ACCOUNT,\n        sum(lease_ops.CAD_AMT_FLPD) CAD_AMT_FLPD,\n        invoice.invoice_date INVOICE_DATE,\n        invoice.invoice_num INVOICE_NUM,\n        coalesce(invoice.business_associate_name,'UNKNOWN VENDOR') business_associate_name,\n        coalesce(invoice.business_associate_id, 'UNKNOWN') business_associate_id\n    from\n        BI_LEASE_OPS.FACT_LEASE_OPS_SAP lease_ops\n        join BI_LEASE_OPS.DIM_AFE_SAP afe on \n            lease_ops.dim_afe_key = afe.dim_afe_key\n        join BI_LEASE_OPS.DIM_INVOICE_SAP invoice on \n            lease_ops.dim_invoice_key = invoice.dim_invoice_key\n        join BI_LEASE_OPS.DIM_GL_ACCOUNT_SAP gl_account on \n            lease_ops.dim_gl_account_key = gl_account.dim_gl_account_key\n        join BI_LEASE_OPS.DIM_COST_CENTER_SAP cc on \n            lease_ops.dim_cost_center_key = cc.dim_cost_center_key\n        join BI_LEASE_OPS.DIM_LEDGER_SAP ledger on \n            lease_ops.dim_ledger_key = ledger.dim_ledger_key\n        join BI_LEASE_OPS.DIM_LEASE_OPS_HIER_SAP lines on \n            lease_ops.dim_lease_ops_hier_key = lines.dim_lease_ops_hier_key\n        join BI_LEASE_OPS.DIM_LEASE_OPS_VERSION_SAP scenario on \n            lease_ops.dim_lease_ops_version_key = scenario.dim_lease_ops_version_key\n        join BI_LEASE_OPS.DIM_GROSS_NET_SAP gross_net on \n            lease_ops.dim_gross_net_key = gross_net.dim_gross_net_key\n        left join DS_WELLVIEW.WVT_WVWELLHEADER wvheader on \n            cc.cc_num = wvheader.usertxt3\n        left join DS_WELLVIEW.WVT_WVJOBAFE wvafe on \n            regexp_replace(regexp_replace(regexp_replace(afe.afe_num,' S.',''),' R.',''),'R. ','') = regexp_replace(regexp_replace(regexp_replace(wvafe.afenumber,' S.',''),' R.',''),'R. ','')\n            and wvheader.idwell = wvafe.idwell\n        left join DS_WELLVIEW.WVT_WVJOB wvjob on wvafe.idrecparent = wvjob.idrec \n    where\n        ledger.LEDGER_CODE = '0L'\n        and lines.flg_summary_subset = 'N'\n        and scenario.IDX = 1\n        and gross_net.GROSS_OR_NET_CODE = 'N'\n        and wvafe.afenumber is not null\n        and wvheader.usertxt3 is not null\n    group by\n        invoice.invoice_num,\n        invoice.invoice_date,\n        invoice.business_associate_name,\n        invoice.business_associate_id,\n        gl_account.acct_desc,\n        gl_account.major_acct,\n        wvafe.idrec,\n        wvheader.idwell\n    ;    "
        dependencies:
          - locationName: EDW
            nodeName: DIM_LO_SAP_GL_ACCOUNT
          - locationName: EDW
            nodeName: DIM_LO_SAP_INVOICE
          - locationName: EDW
            nodeName: FACT_LO_SAP_LEASE_OPS
          - locationName: DATA_STORE
            nodeName: ODS_WVIEW_WVT_WVJOBAFE
          - locationName: DATA_STORE
            nodeName: ODS_WVIEW_WVT_WVWELLHEADER
        join:
          joinCondition: |-
            FROM {{ ref_no_link('EDW','VIEW_WVIEW_WBS_INVOICE_ACTUALS') }} "VIEW_WVIEW_WBS_INVOICE_ACTUALS"
        name: VIEW_WVIEW_WBS_INVOICE_ACTUALS
        noLinkRefs: []
