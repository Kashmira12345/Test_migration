        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_WVIEW_WBS_NON_BUDGETED] AS\nSELECT \n    J.AFENUMBERCALC,\n    J.DTTMSTART,\n    J.DTTMEND,\n    WH.USERTXT3 \"COST_CENTER\",\n    J.COSTTOTALCALC\nFROM (SELECT * FROM [TABLEOWNER].[ODS_WVIEW_WVT_WVJOB] \r\n      WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y') J\n    LEFT JOIN (SELECT * FROM [TABLEOWNER].[ODS_WVIEW_WVT_WVWELLHEADER] \r\n              WHERE DSS_CURRENT_FLAG = 'Y' AND DSS_DELETE_FLAG != 'Y')WH\n        ON J.IDWELL = WH.IDWELL\nWHERE NVL(J.COSTTOTALCALC,0) <> 0 AND WH.USERTXT3 IS NOT NULL AND J.AFENUMBERCALC IS NOT NULL"
