    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVSYSINTEGRATION: c039d73b-2ad4-24a9-9f6a-f8692122fa4f
          ODS_WVIEW_WVT_WVJOB: 444d12f5-fbb5-0796-3b6e-3b1c0840e09e
          ODS_WVIEW_WVT_WVJOBAFECOST: aae42f4a-baf7-9e0e-bae6-2ad75b31f514
          ODS_WVIEW_WVT_WVJOBCONTACT: ffb43b5f-0d17-0231-84f4-a4d4f27a83e5
          ODS_WVIEW_WVT_WVJOBRIG: ddd46cce-ef09-cbe8-f5b0-0117cd5d4d53
          ODS_WVIEW_WVT_WVPROBLEM: 7f8d8a7a-6674-5702-f44e-6a0844ce65df
          ODS_WVIEW_WVT_WVWELLHEADER: c8d5871e-f0e2-3a87-16c9-2dfd301a22e2
          ODS_WVIEW_WVT_WVWELLREVIEW: 7ab7d801-6b1f-752d-a612-91baab498c74
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_WVIEW_WELL_FAILURE]\r\nAS \r\nSELECT \r\nWVJOB.IDREC,\r\nWVJOB.IDWELL,\r\nWVJOB.AFENUMBERCALC,\r\nWVJOB.AFENUMBERSUPPCALC,\r\nWVJOB.JOBTYP,\r\nWVJOB.JOBSUBTYP,\r\nWVJOB.DTTMSTART AS JOB_START_DATE,\r\nWVJOB.DTTMEND AS JOB_END_DATE,\r\nWVJOB.DTTMSPUD,\r\nWVJOB.COSTTOTALCALC AS REPAIR_COST,\r\nWVJOB.OBJECTIVE,\r\nWVWELLHEADER.FIELDNAME,\r\nWVWELLHEADER.COUNTRY,\r\nWVWELLHEADER.STATEPROV,\r\nWVWELLHEADER.DISTRICT,\r\nWVWELLHEADER.AREA,\r\nWVWELLHEADER.WELLIDA,\r\nWVWELLHEADER.WELLNAME,\r\nWVWELLHEADER.WELLTYP2 AS ARTIFICIAL_LIFT_TYPE,\r\nWVPROBLEM.DTTMSTART AS FAILURE_DATE,\r\nWVPROBLEM.TYP AS FAILURE_CATEGORY,\r\nWVPROBLEM.CAUSE AS FAILURE_ROOT_CAUSE,\r\nWVPROBLEM.TYPDETAIL,\r\nWVPROBLEM.DTTMACTION AS ACTION_DATE,\r\nWVPROBLEM.DTTMEND AS PROBLEM_DTTMEND,\r\nWVPROBLEM.DURACTIONTOSTARTCALC AS FAILURE_TO_ACTION_DURATION,\r\nWVPROBLEM.DURENDTOACTIONCALC AS ACTION_TO_RESOLUTION_DURATION,\r\nWVPROBLEM.DURENDTOSTARTCALC AS FAILURE_TO_RESOLUTION_DURATION,\r\nWVPROBLEM.DURJOBSTARTTOSTARTCALC AS FAILURE_TO_JOB_START_DURATION,\r\nCASE WHEN WVJOBAFECOST.CODE3 = '601660' THEN 'SERVICE RIG & CREW'\r\n     WHEN WVJOBAFECOST.CODE3 = '601630' THEN 'RODS'\r\n     WHEN WVJOBAFECOST.CODE3 = '601760' THEN 'TUBING'\r\n     WHEN WVJOBAFECOST.CODE3 = '601600' THEN 'DOWNHOLE PUMPS'\r\n     ELSE NULL END AS COST_CODE3_DESCRIPTION,\r\nCASE WHEN WVPROBLEM.DTTMSTART IS NULL THEN 0\r\n     WHEN WVJOB.DTTMSTART IS NULL THEN 0\r\n     ELSE DATEDIFF('day', WVPROBLEM.DTTMSTART, WVJOB.DTTMSTART) END AS DAYS_TO_ACTION,\r\nCASE WHEN WVPROBLEM.DTTMEND IS NULL THEN  WVJOB.DTTMEND\r\n     ELSE WVPROBLEM.DTTMEND END AS RESOLUTION_DATE,\r\nCASE WHEN ABS(DATEDIFF('day', WVPROBLEM.DTTMEND,WVPROBLEM.DTTMSTART)) IS NULL THEN ABS(DATEDIFF('day', WVJOB.DTTMEND,WVPROBLEM.DTTMSTART))\r\n     ELSE ABS(DATEDIFF('day', WVPROBLEM.DTTMEND,WVPROBLEM.DTTMSTART)) END AS DAYS_DOWN,\r\nCASE WHEN ABS(DATEDIFF('day', WVPROBLEM.DTTMEND,WVJOB.DTTMSTART)) IS NULL THEN ABS(DATEDIFF('day', WVJOB.DTTMEND,WVJOB.DTTMSTART))\r\n     ELSE ABS(DATEDIFF('day', WVPROBLEM.DTTMEND,WVJOB.DTTMSTART)) END AS OPS_DAYS,\r\nWVJOBCONTACT.CONTACTNAME,\r\nWVJOBCONTACT.TITLE,\r\nWVJOBCONTACT.IDRECPARENT,\r\nWVJOBRIG.CONTRACTOR AS RIG_CONTRACTOR,\r\nWVWELLREVIEW.PROPOSEDPROJSTATUS AS FAILED_AND_NOT_REPAIRED,\r\nWVWELLREVIEW.PROPOSEDPROJTYP AS DIAGNOSED_FAILURE,\r\nWVJOBAFECOST.AMOUNT AS COST_ESTIMATE,\r\nWVJOBAFECOST.CODE3 AS COST_CODES_CODE3,\r\nWVJOBAFECOST.DES AS COST_CODES_DESCRIPTION,\r\nPVSYSINTEGRATION.AFIDREC,\r\nPVSYSINTEGRATION.AFIDENTITY,\r\nDIM_WELL.DIM_WELL_KEY,\r\nDIM_WELL.MANUAL_FOREMAN,\r\nDIM_WELL.NETWORK_FOREMAN\r\nFROM WS_DATA_STORE.ODS_WVIEW_WVT_WVJOB WVJOB\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVWELLHEADER WVWELLHEADER ON WVJOB.IDWELL = WVWELLHEADER.IDWELL AND WVWELLHEADER.DSS_CURRENT_FLAG = 'Y' AND WVWELLHEADER.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVWELLREVIEW WVWELLREVIEW ON WVJOB.IDWELL = WVWELLREVIEW.IDWELL AND WVJOB.IDREC = WVWELLREVIEW.IDRECJOB AND WVWELLREVIEW.DSS_CURRENT_FLAG = 'Y' AND WVWELLREVIEW.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVPROBLEM WVPROBLEM ON WVJOB.IDREC = WVPROBLEM.IDRECJOB AND WVPROBLEM.DSS_CURRENT_FLAG = 'Y' AND WVPROBLEM.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVJOBAFE WVJOBAFE ON WVJOB.IDREC = WVJOBAFE.IDRECPARENT AND WVJOBAFE.DSS_CURRENT_FLAG = 'Y' AND WVJOBAFE.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVJOBAFECOST WVJOBAFECOST ON WVJOBAFE.IDREC = WVJOBAFECOST.IDRECPARENT AND WVJOBAFECOST.DSS_CURRENT_FLAG = 'Y' AND WVJOBAFECOST.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVJOBCONTACT WVJOBCONTACT ON WVJOB.IDREC = WVJOBCONTACT.IDRECPARENT AND WVJOBCONTACT.DSS_CURRENT_FLAG = 'Y' AND WVJOBCONTACT.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_WVIEW_WVT_WVJOBRIG WVJOBRIG ON WVJOBCONTACT.IDWELL = WVJOBRIG.IDWELL AND WVJOBCONTACT.IDRECPARENT = WVJOBRIG.IDRECPARENT AND WVJOBRIG.DSS_CURRENT_FLAG = 'Y' AND WVJOBRIG.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVSYSINTEGRATION
            PVSYSINTEGRATION ON WVJOB.IDWELL = PVSYSINTEGRATION.AFIDREC AND PVSYSINTEGRATION.DSS_CURRENT_FLAG = 'Y' AND PVSYSINTEGRATION.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN BI_FDC.DIM_WELL DIM_WELL ON PVSYSINTEGRATION.IDRECPARENT = DIM_WELL.DIM_WELL_KEY\r\nWHERE \r\n\tWVJOB.DSS_CURRENT_FLAG = 'Y'\r\n\tAND WVJOB.DSS_DELETE_FLAG != 'Y'"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVSYSINTEGRATION
          - locationName: DATA_STORE
