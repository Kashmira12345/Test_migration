        join:
          joinCondition: |-
            FROM ( SELECT * , '0101' AS ACCT_PER_DATE_MNTH , JAN_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0201' AS ACCT_PER_DATE_MNTH , FEB_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0301' AS ACCT_PER_DATE_MNTH , MAR_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0401' AS ACCT_PER_DATE_MNTH , APR_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0501' AS ACCT_PER_DATE_MNTH , MAY_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0601' AS ACCT_PER_DATE_MNTH , JUN_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0701' AS ACCT_PER_DATE_MNTH , JUL_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0801' AS ACCT_PER_DATE_MNTH , AUG_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '0901' AS ACCT_PER_DATE_MNTH , SEP_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '1001' AS ACCT_PER_DATE_MNTH , OCT_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '1101' AS ACCT_PER_DATE_MNTH , NOV_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED
            UNION ALL SELECT * , '1201' AS ACCT_PER_DATE_MNTH , DEC_AMT AS ACCT_PER_DATE_AMT
            FROM WS_STAGE_BT.STAGE_BUDGET_CSV_MERGED ) STAGE_BUDGET_CSV_MERGED
            JOIN WS_STAGE_BT.STAGE_BUDGET_CSV_HEADER
              ON STAGE_BUDGET_CSV_HEADER.FILE_ID = STAGE_BUDGET_CSV_MERGED.FILE_ID
