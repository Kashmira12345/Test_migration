        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_QBYTE_COST_CENTRES
          - locationName: DATA_STORE
            nodeName: ODS_QBYTE_DOI_DECK_PARTNERS
        join:
          joinCondition: |-
            FROM ( SELECT c.cc_num, sum(ddp.la_partner_pct) qbyte_working_interest
            FROM (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_ownership_agreement_links]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') oal, (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_cost_centres]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') c, (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_doi_deck_partners]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ddp, (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_business_associates]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ba
            WHERE c.cc_num = oal.cc_num
                AND c.jib_flag = 'Y'
                AND oal.agreement_id = ddp.doi_deck_id
                AND ddp.partner_ba_id = ba.id
                AND oal.afe_num is null
                AND oal.major_acct is null
                AND oal.expiry_date is null
                AND oal.terminate_flag = 'N'
                AND nvl(oal.acct_group_code,'x') in ('x', 'NPLAND')
                AND ba.ref_org_id is not null
                AND oal.cc_num || oal.effective_date || oal.ownership_link_id in (select l.cc_num || max(l.effective_date) || max(l.ownership_link_id)
            FROM (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_ownership_agreement_links]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') l
            WHERE l.terminate_flag = 'N'
                AND l.expiry_date is null
                AND l.afe_num is null
                AND l.major_acct is null
                AND l.effective_date in (select max(l2.effective_date)
            FROM (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_ownership_agreement_links]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') l2
            WHERE l2.terminate_flag = 'N'
                AND l2.expiry_date is null
                AND l2.afe_num is null
                AND l2.major_acct is null
                AND l2.cc_num = l.cc_num)
                AND nvl(l.acct_group_code,'x') in ('x', 'NPLAND')
            GROUP BY l.cc_num)
            GROUP BY c.cc_num
            UNION ALL select c.cc_num, 100.00 qbyte_working_interest
            FROM (SELECT *
            FROM [TABLEOWNER].[ODS_QBYTE_cost_centres]
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') c
            WHERE c.jib_flag = 'N' ) AS TARGET
        name: STAGE_COST_CENTER_WI
        noLinkRefs: []
