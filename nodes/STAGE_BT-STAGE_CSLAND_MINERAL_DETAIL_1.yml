      - aliases:
          ODS_CSLAND_BA_TABLE: 0b9bce80-70f7-a03f-3037-96680c30b052
          ODS_CSLAND_L_BASE: 68d54da7-4323-a3d2-af8b-4d34e3d47662
          ODS_CSLAND_L_SUB: bf882e68-bd7a-a722-832e-aaf3e7edab63
          ODS_CSLAND_T_AREA: 0ec0125b-acc2-463c-5f12-edcc8b9b9d89
          ODS_CSLAND_T_EXTEN: 2b07b524-2520-2e39-f848-7d954ddccd32
          ODS_CSLAND_T_LESSOR: 1715d999-19e4-af1e-3179-943f8bad42b5
          ODS_CSLAND_T_MFSTATUS: 5137dcc6-640d-2031-1e04-74ea4a5fb1be
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_CSLAND_MINERAL_DETAIL_1] AS\r\nSELECT \r\n    LB.FILE_NUMBER \"MINERAL_FILE_NUMBER\",\r\n    LS.FILE_SUB \"MINERAL_FILE_SUB\",\r\n    LS.FILE_STATUS \"MINERAL_FILE_STATUS_CODE\",\r\n    TMFS.DESCRIPTION \"MINERAL_FILE_STATUS\",\r\n    TMFS.AI_FLAG,\r\n    TL.CATEGORY \"LESSOR_TYPE_CATEGORY\",\r\n    LB.LESSOR_TYPE \"LESSOR_TYPE_CODE\",\r\n    TL.DESCRIPTION \"LESSOR_TYPE\",\r\n    LB.LESSOR_NUMBER \"LEASE_NUMBER\",\r\n    LS.SUB_INTEREST_TYPE,\r\n    LS.PRODUCING_STATUS,\r\n    LS.AREA \"AREA_CODE\",\r\n    TA.NAME \"AREA\",\r\n    TA.PROVINCE,\r\n    LB.LEASE_PAYOR \"LEASE_PAYOR_CODE\",\r\n    BT.NAME \"PAYOR\",\r\n    LS.SUB_OPERATOR \"OPERATOR_CODE\",\r\n    BT2.NAME \"OPERATOR\",\r\n    LS.OWNER_INTEREST,\r\n    LB.RENTAL_DATE,\r\n    TO_CHAR(LB.RENTAL_DATE,'MM') \"RENTAL_MONTH\",    \r\n    LS.RENTAL_RATE,\r\n    LB.RENTAL_DOLLAR,\r\n    LS.TOTAL_SUB_RENTAL,\r\n    (LS.OWNER_INTEREST/100) * LS.TOTAL_SUB_RENTAL \"NET_TOTAL_SUB_RENTAL\",     \r\n    LB.EXPIRY_DATE,\r\n    DECODE(LS.EXTENSION, NULL, 'PRIMARY TERM',  LS.EXTENSION) \"EXTENSION_TERM\",\r\n    LS.EXTENSION  \"EXTENSION_CODE\",\r\n    TE.DESCRIPTION \"EXTENSION\",\r\n    LS.EXTENSION_DATE,  \r\n    LS.COUNT_ACREAGE \"COUNT_ACREAGE_FLAG\",\r\n    LB.ACRE_HECTARE \"ACRE_HECTARE_FLAG\",\r\n    LS.SUB_GROSS_HECT,\r\n    LS.SUB_GROSS_ACRES,   \r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.PROD_ACRES, 'H', LS.PROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_PROD_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.PROD_ACRES, 'H', LS.PROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_PROD_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.NONPROD_ACRES, 'H', LS.NONPROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_NONPROD_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.NONPROD_ACRES, 'H', LS.NONPROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_NONPROD_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_DEV_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_DEV_ACRES\",     \r\n    DECODE(LS.COUNT_ACREAGE,'Y',DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"GROSS_UNDEV_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)),0) \"NET_UNDEV_ACRES\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.SUB_GROSS_ACRES, 'H', LS.SUB_GROSS_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.PROD_ACRES, 'H', LS.PROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_PROD_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.PROD_ACRES, 'H', LS.PROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE,
            0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_PROD_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.NONPROD_ACRES, 'H', LS.NONPROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_NONPROD_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.NONPROD_ACRES, 'H', LS.NONPROD_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_NONPROD_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_DEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.DEV_ACRES, 'H', LS.DEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_DEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"GROSS_UNDEV_RENTALS\",\r\n    DECODE(LS.COUNT_ACREAGE,'Y',(LS.OWNER_INTEREST/100) * (DECODE(LB.ACRE_HECTARE, 'A', LS.UNDEV_ACRES, 'H', LS.UNDEV_HECT * DECODE(TL.CATEGORY,'CR', 2.5, 2.471054)) * DECODE(LS.RENTAL_RATE, 0, LB.RENTAL_DOLLAR, LS.RENTAL_RATE)),0) \"NET_UNDEV_RENTALS\",\r\n    TRIM(LB.FILE_NUMBER)||TRIM(LS.FILE_SUB) \"MINERAL_FILE_KEY\"     \r\nFROM \r\n  DS_CSLAND.L_BASE LB,\r\n  DS_CSLAND.L_SUB LS,\r\n  DS_CSLAND.T_MFSTATUS TMFS,\r\n  DS_CSLAND.T_AREA TA,\r\n  DS_CSLAND.T_LESSOR TL,\r\n  DS_CSLAND.BA_TABLE BT,\r\n  DS_CSLAND.BA_TABLE BT2,\r\n  DS_CSLAND.T_EXTEN TE    \r\nWHERE \r\n  LS.FILE_STATUS  = TMFS.CODE(+)\r\n  AND LS.AREA = TA.CODE(+)\r\n  AND LB.LEASE_PAYOR  = BT.PRIMARY_KEY(+)\r\n  AND LS.SUB_OPERATOR = BT2.PRIMARY_KEY(+)\r\n  AND LB.LESSOR_TYPE  = TL.CODE(+)\r\n  AND LS.EXTENSION    = TE.CODE(+)\r\n  AND LB.FILE_NUMBER  = LS.FILE_NUMBER(+)"
