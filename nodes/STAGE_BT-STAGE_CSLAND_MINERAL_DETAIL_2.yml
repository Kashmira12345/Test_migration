          - locationName: DATA_STORE
            nodeName: ODS_CSLAND_L_REMARK
          - locationName: DATA_STORE
            nodeName: ODS_CSLAND_L_RIGHTS
          - locationName: DATA_STORE
            nodeName: ODS_CSLAND_L_SUB
        join:
          joinCondition: |-
            FROM {{ ref_no_link('STAGE_BT','STAGE_CSLAND_MINERAL_DETAIL_2') }} "STAGE_CSLAND_MINERAL_DETAIL_2"
        name: STAGE_CSLAND_MINERAL_DETAIL_2
        noLinkRefs: []
