        join:
          joinCondition: |-
            EXTENDED
            FROM ( SELECT RLDNR, RBUKRS, GJAHR, BELNR, DOCLN ,RHCUR, RUNIT, PS_PSP_PNR ,RCNTR, RACCT, RECID, AUFNR ,SUM(HSL) HSL ,SUM(TSL) TSL ,SUM(KSL) KSL ,SUM(MSL) MSL ,SUM(FCSL) FCSL ,'N' AS GROSS_OR_NET_CODE
            FROM {{ ref('DATA_STORE', 'ODS_SAP_ACDOCA') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
            GROUP BY RLDNR, RBUKRS, GJAHR, BELNR, DOCLN ,RHCUR, RUNIT, PS_PSP_PNR ,RCNTR, RACCT, RECID, AUFNR
            UNION SELECT RLDNR, RBUKRS, GJAHR, BELNR, DOCLN ,RHCUR, RUNIT, PS_PSP_PNR ,RCNTR, RACCT, RECID, AUFNR ,SUM(HSL) HSL ,SUM(TSL) TSL ,SUM(KSL) KSL ,SUM(MSL) MSL ,SUM(FCSL) FCSL ,'G' AS GROSS_OR_NET_CODE
            FROM {{ ref('DATA_STORE', 'ODS_SAP_ACDOCA') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND RECID NOT IN ('CB','ZA','ZB','ZY')
            GROUP BY RLDNR, RBUKRS, GJAHR, BELNR, DOCLN ,RHCUR, RUNIT, PS_PSP_PNR ,RCNTR, RACCT, RECID, AUFNR) ODS_SAP_ACDOCA
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_BKPF') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_BKPF
              ON ODS_SAP_BKPF.BELNR = ODS_SAP_ACDOCA.BELNR
                AND ODS_SAP_BKPF.GJAHR = ODS_SAP_ACDOCA.GJAHR
                AND ODS_SAP_BKPF.BUKRS = ODS_SAP_ACDOCA.RBUKRS
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_LEDGER') }} DIM_LO_SAP_LEDGER
              ON ODS_SAP_ACDOCA.RLDNR = DIM_LO_SAP_LEDGER.LEDGER_CODE
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_LINE_ITEM') }} DIM_LO_SAP_LINE_ITEM
              ON ODS_SAP_ACDOCA.RLDNR||ODS_SAP_ACDOCA.RBUKRS||TO_CHAR(ODS_SAP_ACDOCA.GJAHR)||ODS_SAP_ACDOCA.BELNR||ODS_SAP_ACDOCA.DOCLN = DIM_LO_SAP_LINE_ITEM.LI_ID
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_VOUCHER') }} DIM_LO_SAP_VOUCHER
              ON ODS_SAP_ACDOCA.RLDNR||ODS_SAP_ACDOCA.RBUKRS||TO_CHAR(ODS_SAP_ACDOCA.GJAHR)||ODS_SAP_ACDOCA.BELNR = DIM_LO_SAP_VOUCHER.VOUCHER_ID
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_ACCT_PER_DATE') }} DIM_LO_SAP_ACCT_PER_DATE
              ON DIM_LO_SAP_LINE_ITEM.ACCT_PER_DATE = DIM_LO_SAP_ACCT_PER_DATE.DATE
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_ACTVY_PER_DATE') }} DIM_LO_SAP_ACTVY_PER_DATE
              ON DIM_LO_SAP_LINE_ITEM.ACTVY_PER_DATE = DIM_LO_SAP_ACTVY_PER_DATE.DATE
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_DEST_ORGANIZATION') }} DIM_LO_SAP_DEST_ORGANIZATION
              ON ODS_SAP_ACDOCA.RBUKRS = DIM_LO_SAP_DEST_ORGANIZATION.ORG_ID
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_GL_ACCOUNT') }} DIM_LO_SAP_GL_ACCOUNT
              ON LTRIM(ODS_SAP_ACDOCA.RACCT,'0') = DIM_LO_SAP_GL_ACCOUNT.ACCOUNT
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_GROSS_NET') }} DIM_LO_SAP_GROSS_NET
              ON ODS_SAP_ACDOCA.GROSS_OR_NET_CODE = DIM_LO_SAP_GROSS_NET.GROSS_OR_NET_CODE
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_INVOICE') }} DIM_LO_SAP_INVOICE
              ON ODS_SAP_ACDOCA.RLDNR||ODS_SAP_ACDOCA.RBUKRS||TO_CHAR(ODS_SAP_ACDOCA.GJAHR)||ODS_SAP_ACDOCA.BELNR = DIM_LO_SAP_INVOICE.INVOICE_ID
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_AFE') }} DIM_LO_SAP_AFE
              ON CASE -- Order WBS WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NOT NULL THEN DIM_LO_SAP_LINE_ITEM.ORDER_AFE_NUM -- LI WBS ELSE DIM_LO_SAP_LINE_ITEM.AFE_NUM END = DIM_LO_SAP_AFE.AFE_NUM
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_AFE_TYPE') }} DIM_LO_SAP_AFE_TYPE
              ON DIM_LO_SAP_AFE.DIM_AFE_TYPE_KEY = DIM_LO_SAP_AFE_TYPE.DIM_AFE_TYPE_KEY
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_ORDER') }} DIM_LO_SAP_ORDER
              ON LTRIM(ODS_SAP_ACDOCA.AUFNR,'0') = DIM_LO_SAP_ORDER.ORDER_NUM
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_COST_CENTER') }} DIM_LO_SAP_COST_CENTER
              ON CASE -- Order WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NOT NULL THEN COALESCE(DIM_LO_SAP_LINE_ITEM.ORDER_CC_NUM ,DIM_LO_SAP_LINE_ITEM.ORDER_REQ_CC_NUM ,DIM_LO_SAP_LINE_ITEM.ORDER_RESP_CC_NUM ,DIM_LO_SAP_LINE_ITEM.ORDER_AFE_CC_NUM) -- Non-Capital WBS WHEN NVL(DIM_LO_SAP_AFE_TYPE.NON_CAPITAL_FLAG,'Y') = 'Y' THEN COALESCE(DIM_LO_SAP_LINE_ITEM.CC_NUM ,DIM_LO_SAP_LINE_ITEM.AFE_CC_NUM)
