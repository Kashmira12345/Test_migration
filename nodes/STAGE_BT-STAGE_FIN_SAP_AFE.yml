        join:
          joinCondition: |-
            FROM (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_PRPS') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_PRPS
            LEFT JOIN (SELECT *, MAX(CHGNR) OVER (PARTITION BY OBJNR) AS MAX_CHGNR
            FROM {{ ref('DATA_STORE', 'ODS_SAP_JEST') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND SUBSTR(STAT,1,1) = 'E'
                AND INACT != 'X') ODS_SAP_JEST_E
              ON ODS_SAP_PRPS.OBJNR = ODS_SAP_JEST_E.OBJNR
                AND ODS_SAP_JEST_E.CHGNR = ODS_SAP_JEST_E.MAX_CHGNR
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_TJ30T') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND SPRAS = 'E'
                AND STSMA = 'ZPS00001') ODS_SAP_TJ30T
              ON ODS_SAP_JEST_E.STAT = ODS_SAP_TJ30T.ESTAT
            LEFT JOIN (SELECT ODS_SAP_JEST_I.OBJNR, LISTAGG(TXT04, ', ') WITHIN GROUP (ORDER BY TXT04) TXT04
            FROM (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_JEST') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND SUBSTR(STAT,1,1) = 'I'
                AND INACT != 'X') ODS_SAP_JEST_I
            INNER JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_TJ02T') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND SPRAS = 'E' ) ODS_SAP_TJ02T_I
              ON ODS_SAP_JEST_I.STAT = ODS_SAP_TJ02T_I.ISTAT
            GROUP BY ODS_SAP_JEST_I.OBJNR) ODS_SAP_TJ02T
              ON ODS_SAP_PRPS.OBJNR = ODS_SAP_TJ02T.OBJNR
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_TFKBT') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND SPRAS = 'E') ODS_SAP_TFKBT
              ON ODS_SAP_PRPS.FUNC_AREA = ODS_SAP_TFKBT.FKBER
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_BPGE') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_BPGE
              ON ODS_SAP_PRPS.OBJNR = ODS_SAP_BPGE.OBJNR
                AND ODS_SAP_BPGE.LEDNR = '0001'
                AND ODS_SAP_BPGE.VORGA = 'KBUD'
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_PRTE') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_PRTE
              ON ODS_SAP_PRPS.PSPNR = ODS_SAP_PRTE.POSNR
            WHERE ODS_SAP_PRPS.BELKZ = 'X'
