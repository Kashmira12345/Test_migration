        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFACILITY
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVFLOWNETHEADER
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNIT
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPSTATUS
          - locationName: STAGE_BT
            nodeName: STAGE_FIN_SAP_BI_APP_CC_ATTR
        join:
          joinCondition: |-
            FROM ( (SELECT DISTINCT 'DS_PRODVIEW' AS SOURCE, NULLIF(TRIM(LTRIM(ODS_PVIEW_PVT_PVUNIT.COSTCENTERIDA,'0'),' '),'') AS CC_NUM, ODS_PVIEW_PVT_PVUNIT.IDFLOWNET, ODS_PVIEW_PVT_PVFLOWNETHEADER.NAME AS NETWORK_NAME, ODS_PVIEW_PVT_PVUNIT.IDRECFACILITYCALC AS FACILITY_IDREC, ODS_PVIEW_PVT_PVFACILITY.NAME AS FACILITY_NAME, ODS_PVIEW_PVT_PVUNIT.USERTXT2 AS BATTERY, STAGE_FIN_SAP_BI_APP_CC_ATTR.MANUAL_FOREMAN AS MANUAL_FOREMAN, NVL(ODS_PVIEW_PVT_PVUNITCOMPSTATUS.DTTM,TO_TIMESTAMP('01011900','DDMMYYYY')) AS STATUS_DATE
            FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNIT ODS_PVIEW_PVT_PVUNIT
            LEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMP ODS_PVIEW_PVT_PVUNITCOMP
              ON ODS_PVIEW_PVT_PVUNIT.IDFLOWNET = ODS_PVIEW_PVT_PVUNITCOMP.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNIT.IDREC = ODS_PVIEW_PVT_PVUNITCOMP.IDRECPARENT
                AND ODS_PVIEW_PVT_PVUNITCOMP.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITCOMP.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVFLOWNETHEADER ODS_PVIEW_PVT_PVFLOWNETHEADER
              ON ODS_PVIEW_PVT_PVUNIT.IDFLOWNET = ODS_PVIEW_PVT_PVFLOWNETHEADER.IDFLOWNET
                AND ODS_PVIEW_PVT_PVFLOWNETHEADER.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFLOWNETHEADER.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVFACILITY ODS_PVIEW_PVT_PVFACILITY
              ON ODS_PVIEW_PVT_PVUNIT.IDRECFACILITYCALC = ODS_PVIEW_PVT_PVFACILITY.IDREC
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVROUTESETROUTE ODS_PVIEW_PVT_PVROUTESETROUTE
              ON ODS_PVIEW_PVT_PVUNIT.IDRECROUTESETROUTECALC = ODS_PVIEW_PVT_PVROUTESETROUTE.IDREC
                AND ODS_PVIEW_PVT_PVROUTESETROUTE.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVROUTESETROUTE.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPSTATUS ODS_PVIEW_PVT_PVUNITCOMPSTATUS
              ON ODS_PVIEW_PVT_PVUNITCOMP.IDFLOWNET = ODS_PVIEW_PVT_PVUNITCOMPSTATUS.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNITCOMP.IDREC = ODS_PVIEW_PVT_PVUNITCOMPSTATUS.IDRECPARENT
                AND ODS_PVIEW_PVT_PVUNITCOMPSTATUS.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITCOMPSTATUS.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN WS_STAGE_BT.STAGE_FIN_SAP_BI_APP_CC_ATTR STAGE_FIN_SAP_BI_APP_CC_ATTR
              ON ODS_PVIEW_PVT_PVUNIT.COSTCENTERIDA = STAGE_FIN_SAP_BI_APP_CC_ATTR.CC_NUM
            WHERE ODS_PVIEW_PVT_PVUNIT.COSTCENTERIDA IS NOT NULL
                AND ODS_PVIEW_PVT_PVUNIT.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNIT.DSS_DELETE_FLAG != 'Y' )
            UNION (SELECT DISTINCT 'BI_APP' AS SOURCE, NULLIF(TRIM(LTRIM(STAGE_FIN_SAP_BI_APP_CC_ATTR.CC_NUM,'0'),' '),'') CC_NUM, NULL IDFLOWNET, NULL NETWORK_NAME, NULL FACILITY_IDREC, NULL FACILITY_NAME, STAGE_FIN_SAP_BI_APP_CC_ATTR.BATTERY, STAGE_FIN_SAP_BI_APP_CC_ATTR.MANUAL_FOREMAN, CAST(STAGE_FIN_SAP_BI_APP_CC_ATTR.DSS_UPDATE_TIME AS TIMESTAMP) AS STATUS_DATE
            FROM WS_STAGE_BT.STAGE_FIN_SAP_BI_APP_CC_ATTR STAGE_FIN_SAP_BI_APP_CC_ATTR
            WHERE NOT EXISTS (SELECT *
            FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNIT
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND COSTCENTERIDA = STAGE_FIN_SAP_BI_APP_CC_ATTR.CC_NUM) ) ) AS TARGET
        name: STAGE_FIN_SAP_COST_CENTER_FDC_ATTR
        noLinkRefs: []
