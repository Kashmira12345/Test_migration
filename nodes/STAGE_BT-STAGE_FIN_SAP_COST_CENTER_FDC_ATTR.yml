    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVFACILITY: a0862821-70ca-9351-60f8-c9d42bf3a640
          ODS_PVIEW_PVT_PVFLOWNETHEADER: f766ece4-d7ae-59bf-1ded-1825e56f5578
          ODS_PVIEW_PVT_PVUNIT: 25548ef3-08f5-5812-b243-6c4f50853ef8
