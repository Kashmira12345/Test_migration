        join:
          joinCondition: |-
            FROM (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_BKPF') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_BKPF
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_ACDOCA') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND DOCLN = '000001'
                AND RLDNR = '0L') ODS_SAP_ACDOCA
              ON ODS_SAP_BKPF.BELNR = ODS_SAP_ACDOCA.BELNR
                AND ODS_SAP_BKPF.GJAHR = ODS_SAP_ACDOCA.GJAHR
