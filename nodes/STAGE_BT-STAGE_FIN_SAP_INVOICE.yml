            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_KNA1
              ON ODS_SAP_ACDOCA.KUNNR = ODS_SAP_KNA1.KUNNR
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_LFA1') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_LFA1
              ON ODS_SAP_ACDOCA.LIFNR = ODS_SAP_LFA1.LIFNR
            LEFT JOIN (SELECT *
            FROM {{ ref('DATA_STORE', 'ODS_SAP_T003T') }}
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y') ODS_SAP_T003T
              ON ODS_SAP_BKPF.BLART = ODS_SAP_T003T.BLART
                AND ODS_SAP_T003T.SPRAS = 'E'
            WHERE ODS_SAP_BKPF.BLART IN ('DR','KR','RE','OI','X5')
