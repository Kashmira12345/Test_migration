            transform: "CASE --assign line no if Docment Type is not NULL and account >400000 XOR =120060 XOR <> 791000      WHEN NULLIF(ODS_SAP_ACDOCA.BLART,'') IS NULL THEN NULL   WHEN LTRIM(ODS_SAP_ACDOCA.RACCT,'0') = '791000' THEN NULL   WHEN TO_NUMBER(LTRIM(ODS_SAP_ACDOCA.RACCT,'0')) < 400000 AND LTRIM(ODS_SAP_ACDOCA.RACCT,'0') <> '120060' THEN NULL      ELSE     CASE     -- LI Order Reference     WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NOT NULL THEN      CASE       -- Order Non-Capital WBS Reference      WHEN NVL(ODS_SAP_AUFK.PSPEL,0) <> 0 AND NVL(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR_ORDER.NON_CAPITAL_FLAG,'Y') = 'Y' THEN       COALESCE(LOAD_VET_FIN_SAP_ACCOUNT_ATTR_ORDER_WBS.LINE_NO,          LOAD_VET_FIN_SAP_ACCOUNT_ATTR_ORDER_WBS_CC.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_FA.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_CC_FA.LINE_NO,                  LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_WBS_FA.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_WBS_CC_FA.LINE_NO,                  LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)       -- Order Capital WBS Reference      WHEN NVL(ODS_SAP_AUFK.PSPEL,0) <> 0 AND NVL(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR_ORDER.NON_CAPITAL_FLAG,'Y') = 'N' THEN       COALESCE(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR_ORDER.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_WBS_FA.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)           -- Order No WBS Reference      ELSE       COALESCE(LOAD_VET_FIN_SAP_ACCOUNT_ATTR_ORDER.LINE_NO,          LOAD_VET_FIN_SAP_ACCOUNT_ATTR_ORDER_CC.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_FA.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_ORDER_CC_FA.LINE_NO,          LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)      END     -- No LI Order or WBS Reference AND Not Captial Inventory Account     WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NULL AND NVL(ODS_SAP_ACDOCA.PS_PSP_PNR,0) = 0 AND LTRIM(ODS_SAP_ACDOCA.RACCT,'0') <> '120060' THEN      COALESCE(LOAD_VET_FIN_SAP_ACCOUNT_ATTR_LI.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_LI_FA.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)      -- No LI Order Reference, LI Non-Captial WBS Reference     WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NULL AND NVL(ODS_SAP_ACDOCA.PS_PSP_PNR,0) <> 0 AND NVL(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR.NON_CAPITAL_FLAG,'Y') = 'Y' THEN      COALESCE(LOAD_VET_FIN_SAP_ACCOUNT_ATTR_LI.LINE_NO,         LOAD_VET_FIN_SAP_ACCOUNT_ATTR_WBS.LINE_NO,         LOAD_VET_FIN_SAP_ACCOUNT_ATTR_WBS_CC.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_LI_FA.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_WBS_FA.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_WBS_CC_FA.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)      -- No LI Order Reference, LI Captial WBS Reference     WHEN NULLIF(TRIM(LTRIM(ODS_SAP_ACDOCA.AUFNR,'0'),' '),'') IS NULL AND NVL(ODS_SAP_PRPS.PSPNR,0) <> 0 AND NVL(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR.NON_CAPITAL_FLAG,'Y') = 'N' THEN      COALESCE(LOAD_VET_FIN_SAP_AFE_TYPE_ATTR.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_WBS_FA.LINE_NO,         LOAD_VET_FIN_SAP_LEASE_OPS_HIER_NO_FA.LINE_NO)       END  END"
