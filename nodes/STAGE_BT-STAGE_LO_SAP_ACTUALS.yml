        join:
          joinCondition: |-
            FROM {{ ref('EDW', 'FACT_LO_SAP_ACTUALS') }} FACT_LO_SAP_ACTUALS
            JOIN {{ ref('EDW', 'DIM_LO_SAP_LINE_ITEM') }} DIM_LO_SAP_LINE_ITEM
              ON FACT_LO_SAP_ACTUALS.LI_ID = DIM_LO_SAP_LINE_ITEM.LI_ID
            JOIN {{ ref('EDW', 'DIM_LO_SAP_LEASE_OPS_HIER') "DIM_LO_SAP_LEASE_OPS_HIER"
              ON FACT_LO_SAP_ACTUALS.GLOP_LINE_NO= DIM_LO_SAP_LEASE_OPS_HIER.LINE_NO
            JOIN {{ ref('EDW', 'DIM_LO_SAP_PRODUCT_TYPE') }} DIM_LO_SAP_PRODUCT_TYPE
              ON FACT_LO_SAP_ACTUALS.DIM_PRODUCT_TYPE_KEY = DIM_LO_SAP_PRODUCT_TYPE.DIM_PRODUCT_TYPE_KEY
            JOIN {{ ref('STAGE_BT', 'STAGE_LO_SAP_ACTUALS_AVG_FX') }} STAGE_LO_SAP_ACTUALS_AVG_FX
              ON FACT_LO_SAP_ACTUALS.DIM_ACTVY_PER_DATE_KEY = STAGE_LO_SAP_ACTUALS_AVG_FX.DIM_ACTVY_PER_DATE_KEY
                AND FACT_LO_SAP_ACTUALS.OP_CURR_CODE = STAGE_LO_SAP_ACTUALS_AVG_FX.OP_CURR_CODE
            CROSS JOIN (SELECT MAX(DIM_LEASE_OPS_VERSION_KEY) DIM_LEASE_OPS_VERSION_KEY
            FROM {{ ref('EDW', 'DIM_LO_SAP_LEASE_OPS_VERSION') }}
