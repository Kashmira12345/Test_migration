.R_VERSION WHERE NVL(FLG_ARCHIVE,'N') = 'N') RV \r\n\t\t\tON E.CASE_ID = RV.ECON_CASE_ID AND E.VINTAGE_ID
            = RV.ECON_VINTAGE_ID\r\n\t\tJOIN (SELECT * FROM DS_BUDGET.R_SRC WHERE SRC_TYPE = 'EDW_CAP' AND SRC_TABLE LIKE 'CAP_PASS3_%') RS\r\n\t\t\tON RV.IDX = RS.FK_R_VERSION_IDX\r\n\t\tLEFT JOIN DS_BUDGET.X_DISTRICT_ATTR XD \r\n\t\t\tON E.DISTRICT = XD.DISTRICT AND E.BUSINESS_UNIT = XD.BUSINESS_UNIT   \r\n\t\tLEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NULL AND ACCT_PER_DATE IS NULL) FX_VER \r\n\t\t\tON XD.OP_CURR_CODE = FX_VER.OP_CURR_CODE AND RV.IDX = FX_VER.FK_R_VERSION_IDX\r\n\t\tLEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NOT NULL AND ACCT_PER_DATE IS NULL) FX_YR \r\n\t\t\tON XD.OP_CURR_CODE = FX_YR.OP_CURR_CODE AND EXTRACT(YEAR FROM E.ACCT_PER_DATE) = FX_YR.ACCT_PER_YEAR AND RV.IDX = FX_YR.FK_R_VERSION_IDX\r\n\t\tLEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NOT NULL AND ACCT_PER_DATE IS NOT NULL) FX_DT \r\n\t\t\tON XD.OP_CURR_CODE = FX_DT.OP_CURR_CODE AND E.ACCT_PER_DATE = FX_DT.ACCT_PER_DATE AND RV.IDX = FX_DT.FK_R_VERSION_IDX\r\n\t\tCROSS JOIN (SELECT DISTINCT AFE_TYPE FROM DS_BUDGET.X_AFE_TYPE_ATTR WHERE PROCESSING_PASS = '3') XA\r\n\tGROUP BY\r\n\t\tRV.IDX,  \r\n\t\tRV.VERSION_NAME,\r\n\t\tRV.EFFECTIVE_DATE,        \r\n\t\tRS.IDX,\r\n\t\tRV.ECON_CASE_ID,\r\n\t\tRV.ECON_CASE_NAME,\r\n\t\tRV.ECON_VINTAGE_ID,\r\n\t\tRV.ECON_VINTAGE_NAME,\r\n\t\tE.ENTITY_ID,\r\n\t\tE.ENTITY_NAME,\r\n\t\tE.ENTITY_UUID,   \r\n\t\tE.ACCT_PER_DATE,\r\n\t\tE.CC,\r\n\t\tXA.AFE_TYPE,\r\n\t\tXD.DEST_ORG_ID,\r\n\t\tXD.OP_CURR_CODE,\r\n\t\tCOALESCE(FX_DT.FX_RATE, FX_YR.FX_RATE, FX_VER.FX_RATE),\r\n\t\tXA.AFE_TYPE \r\n\t)\r\nWHERE NVL(CAD_AMT,0) <> 0 AND NVL(OP_FX,0) <> 0    "
