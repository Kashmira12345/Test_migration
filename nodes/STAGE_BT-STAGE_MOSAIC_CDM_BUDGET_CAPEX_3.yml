        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_MOSAIC_CDM_BUDGET_CAPEX_3] AS\r\nSELECT\r\n\tR_VERSION_IDX,\r\n\tBUDGET_NAME,\r\n\tBUDGET_EFFECTIVE_DATE,    \r\n\tR_SRC_IDX,\r\n\tCASE_ID,\r\n\tCASE_NAME,\r\n\tVINTAGE_ID,\r\n\tVINTAGE_NAME,\r\n\tENTITY_ID,\r\n\tENTITY_NAME,\r\n\tENTITY_UUID,    \r\n\tACCT_PER_DATE,\r\n\tAFE_TYPE,\r\n\tCC,\r\n\tDEST_ORG_ID,\r\n\tGROSS_OR_NET_CODE,\r\n\tROUND(CAD_AMT,2) \"CAD_AMT\",\r\n\tROUND((CAD_AMT * OP_FX),2) \"OP_AMT\",\r\n\tOP_CURR_CODE,\r\n\tOP_FX,\r\n\tCREATE_DT\r\nFROM ( \r\n\tSELECT\r\n\t\tRV.IDX \"R_VERSION_IDX\",\r\n\t\tRV.VERSION_NAME \"BUDGET_NAME\",\r\n\t\tRV.EFFECTIVE_DATE \"BUDGET_EFFECTIVE_DATE\",        \r\n\t\tRS.IDX \"R_SRC_IDX\",\r\n\t\tRV.ECON_CASE_ID \"CASE_ID\",\r\n\t\tRV.ECON_CASE_NAME \"CASE_NAME\",\r\n\t\tRV.ECON_VINTAGE_ID \"VINTAGE_ID\",\r\n\t\tRV.ECON_VINTAGE_NAME \"VINTAGE_NAME\",\r\n\t\tE.ENTITY_ID,\r\n\t\tE.ENTITY_NAME,\r\n\t\tE.ENTITY_UUID,        \r\n\t\tE.ACCT_PER_DATE,\r\n\t\tXA.AFE_TYPE \"AFE_TYPE\",\r\n\t\tE.CC,\r\n\t\tXD.DEST_ORG_ID,\r\n\t\t'N' \"GROSS_OR_NET_CODE\",\r\n\t\tSUM(DECODE(XA.AFE_TYPE,\r\n\t\t\t'CA',DECODE(E.CAPITAL_EXPENSE_CATEGORY,\r\n\t\t\t\t\t\t   'Acquisition',(NVL(TOTAL_CAPITAL,0) - \r\n\t\t\t\t\t\t\t\t\t\t (NVL(E.DEV_COMPLETION,0) + NVL(E.EOR_COMPLETION,0) + NVL(E.EXP_COMPLETION,0) + NVL(E.CONTROLLABLE_INVENTORY,0) + \r\n\t\t\t\t\t\t\t\t\t\t  NVL(E.OPTIMIZATION,0) + NVL(E.WORKOVER_RECOMPLETION,0) + NVL(E.EOR_EQUIPPING,0) + NVL(E.WELL_PAD_PIPELINE_TIE_IN,0) + \r\n\t\t\t\t\t\t\t\t\t\t  NVL(E.WELL_EQUIPPING,0) + NVL(E.LAND,0) + NVL(FACILITIES_MAJOR_PP,0) + NVL(E.DEV_DRILLING,0) + NVL(E.EOR_DRILLING,0) + NVL(E.EXP_DRILLING,0) +\r\n\t\t\t\t\t\t\t\t\t\t  NVL(SEISMIC_STUDIES_CAPITALIZED_OH,0) + NVL(E.SUBSURFACE_MAINTENANCE,0))),\r\n\t\t\t\t\t\t   NULL),\r\n\t\t\t'GA',DECODE(E.CAPITAL_EXPENSE_CATEGORY,\r\n\t\t\t\t\t\t   'Capitalized G&A',(NVL(TOTAL_CAPITAL,0) - \r\n\t\t\t\t\t\t\t\t\t\t (NVL(E.DEV_COMPLETION,0) + NVL(E.EOR_COMPLETION,0) + NVL(E.EXP_COMPLETION,0) + NVL