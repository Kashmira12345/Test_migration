          LOAD_BUDGET_R_VERSION: 0ecc3a51-321e-483d-b37c-7b78b9167d26
          LOAD_BUDGET_R_VERSION_FX: 0ecc3a51-321e-483d-b37c-7b78b9167d26
          LOAD_BUDGET_X_DISTRICT_ATTR: 0ecc3a51-321e-483d-b37c-7b78b9167d26
          LOAD_BUDGET_X_GL_ACCOUNT: 0ecc3a51-321e-483d-b37c-7b78b9167d26
          VW_BDGT_CDM_ECONOMICS: cfc0d912-7484-709e-fb37-f2d5b387e3fe
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_MOSAIC_CDM_BUDGET_PRD_CON] AS \r\nSELECT \n    R_VERSION_IDX, \n    BUDGET_NAME, \n    BUDGET_EFFECTIVE_DATE, \n    R_SRC_IDX, \n    CASE_ID, \n    CASE_NAME, \n    VINTAGE_ID, \n    VINTAGE_NAME, \n    ENTITY_ID, \n    ENTITY_NAME, \n    ENTITY_UUID, \n    ACCT_PER_DATE, \n    ACCT_GROUP_CODE,\n    FUNCTIONAL_AREA,\n    ACCOUNT,    \n    CC, \n    DEST_ORG_ID, \n    OP_CURR_CODE,\n    OP_FX,    \n    VOL,\n    VOL_UOM_CODE,\n    CREATE_DT\nFROM (\n    SELECT\n        RV.IDX \"R_VERSION_IDX\",\n        RV.VERSION_NAME \"BUDGET_NAME\",\n        RV.EFFECTIVE_DATE \"BUDGET_EFFECTIVE_DATE\",\n        RS.IDX \"R_SRC_IDX\",\n        RV.ECON_CASE_ID \"CASE_ID\",\n        RV.ECON_CASE_NAME \"CASE_NAME\",\n        RV.ECON_VINTAGE_ID \"VINTAGE_ID\",\n        RV.ECON_VINTAGE_NAME \"VINTAGE_NAME\",\n        E.ENTITY_ID,\n        E.ENTITY_NAME,\n        E.ENTITY_UUID,\n        E.ACCT_PER_DATE \"ACTVY_PER_DATE\",\n        E.ACCT_PER_DATE,\n        'COND' \"ACCT_GROUP_CODE\",\n        (SELECT FUNCTIONAL_AREA FROM \"DS_BUDGET\".\"X_GL_ACCOUNT\" WHERE X_TYPE = 'PROD_TYPE' AND CODE = 'CON') \"FUNCTIONAL_AREA\",\n        (SELECT ACCOUNT FROM \"DS_BUDGET\".\"X_GL_ACCOUNT\" WHERE X_TYPE = 'PROD_TYPE' AND CODE = 'CON') \"ACCOUNT\",\n        E.CC,\n        XD.DEST_ORG_ID,\n        XD.OP_CURR_CODE,\n        COALESCE(FX_DT.FX_RATE, FX_YR.FX_RATE, FX_VER.FX_RATE) \"OP_FX\",        \n        SUM(NVL(COSHARE_COND_VOLUME,0) + NVL(COSHARE_FCOND_VOLUME,0)) \"VOL\",\n        'BBL' \"VOL_UOM_CODE\",\n        SYSDATE() \"CREATE_DT\"\n    FROM \n      (SELECT * FROM DS_BUDGET.VW_BDGT_CDM_ECONOMICS WHERE ENTITY_STATE_ID = 4) E     \n        JOIN (SELECT * FROM DS_BUDGET.R_VERSION WHERE NVL(FLG_ARCHIVE,'N') = 'N') RV \n            ON E.CASE_ID = RV.ECON_CASE_ID AND E.VINTAGE_ID = RV.ECON_VINTAGE_ID\n        JOIN (SELECT * FROM DS_BUDGET.R_SRC WHERE SRC_TYPE = 'EDW_PRD' AND SRC_TABLE LIKE 'PRD_CON_%') RS\n            ON RV.IDX = RS.FK_R_VERSION_IDX      \n        LEFT JOIN DS_BUDGET.X_DISTRICT_ATTR XD ON E.DISTRICT = XD.DISTRICT AND E.BUSINESS_UNIT = XD.BUSINESS_UNIT   \n        LEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NULL AND ACCT_PER_DATE IS NULL) FX_VER \n            ON XD.OP_CURR_CODE = FX_VER.OP_CURR_CODE AND RV.IDX = FX_VER.FK_R_VERSION_IDX            \n        LEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NOT NULL AND ACCT_PER_DATE IS NULL) FX_YR \n            ON XD.OP_CURR_CODE = FX_YR.OP_CURR_CODE AND EXTRACT(YEAR FROM E.ACCT_PER_DATE) = FX_YR.ACCT_PER_YEAR AND RV.IDX = FX_YR.FK_R_VERSION_IDX \n        LEFT JOIN (SELECT * FROM DS_BUDGET.R_VERSION_FX WHERE ACCT_PER_YEAR IS NOT NULL AND ACCT_PER_DATE IS NOT NULL) FX_DT \n            ON XD.OP_CURR_CODE = FX_DT.OP_CURR_CODE AND E.ACCT_PER_DATE = FX_DT.ACCT_PER_DATE AND RV.IDX = FX_DT.FK_R_VERSION_IDX   \n    WHERE \n       (E.COSHARE_COND_VOLUME IS NOT NULL OR E.COSHARE_FCOND_VOLUME IS NOT NULL)\n    GROUP BY\n        RV.IDX,  \n        RV.VERSION_NAME,\n        RV.EFFECTIVE_DATE,\n        RS.IDX,\n        RV.ECON_CASE_ID,\n        RV.ECON_CASE_NAME,\n        RV.ECON_VINTAGE_ID,\n        RV.ECON_VINTAGE_NAME,\n        E.ENTITY_ID,\n        E.ENTITY_NAME,\n        E.ENTITY_UUID,   \n        E.ACCT_PER_DATE,\n        E.CC,\n        XD.DEST_ORG_ID,\n        XD.OP_CURR_CODE,\n        FX_DT.FX_RATE,\n        FX_YR.FX_RATE,\n        FX_VER.FX_RATE )\nWHERE NVL(VOL,0) <> 0;"
        dependencies:
          - locationName: LOAD
            nodeName: LOAD_BUDGET_R_SRC
          - locationName: LOAD
            nodeName: LOAD_BUDGET_R_VERSION
          - locationName: LOAD
            nodeName: LOAD_BUDGET_R_VERSION_FX
          - locationName: LOAD
            nodeName: LOAD_BUDGET_X_DISTRICT_ATTR
          - locationName: LOAD
            nodeName: LOAD_BUDGET_X_GL_ACCOUNT
          - locationName: DS_BUDGET
            nodeName: VW_BDGT_CDM_ECONOMICS
        join:
          joinCondition: |-
            FROM {{ ref_no_link('STAGE_BT','STAGE_MOSAIC_CDM_BUDGET_PRD_CON') }} "STAGE_MOSAIC_CDM_BUDGET_PRD_CON"
        name: STAGE_MOSAIC_CDM_BUDGET_PRD_CON
        noLinkRefs: []
