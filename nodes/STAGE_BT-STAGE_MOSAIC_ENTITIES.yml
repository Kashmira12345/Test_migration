    sourceMapping:
      - aliases:
          ODS_MOSAIC_CDM_ECONOMIC_ENTITY: 13de67e1-a562-3964-a73b-6e584b1c6ac1
          ODS_MOSAIC_CDM_ZONE: 3b2b4770-83ae-bee4-7fc0-764a58715c05
          STAGE_PRODVIEW_WELLS: 13de67e1-a562-3964-a73b-6e584b1c6ac1
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_CDM_ECONOMIC_ENTITY
          - locationName: DATA_STORE
            nodeName: ODS_MOSAIC_CDM_ZONE
          - locationName: DATA_STORE
            nodeName: STAGE_PRODVIEW_WELLS
        join:
          joinCondition: |-
            FROM {{ ref('DATA_STORE', 'ODS_MOSAIC_CDM_ECONOMIC_ENTITY') }} "ODS_MOSAIC_CDM_ECONOMIC_ENTITY"
            JOIN {{ ref('DATA_STORE', 'ODS_MOSAIC_CDM_ECONOMIC_RESULT') }} "ODS_MOSAIC_CDM_ECONOMIC_RESULT"
              ON ODS_MOSAIC_CDM_ECONOMIC_ENTITY.ENTITY_ID = ODS_MOSAIC_CDM_ECONOMIC_RESULT.ENTITY_ID
                AND ODS_MOSAIC_CDM_ECONOMIC_RESULT.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_ECONOMIC_RESULT.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN ( SELECT *
            FROM ( SELECT *, ROW_NUMBER() OVER (PARTITION BY ENTITY_ID
            ORDER BY ENTITY_ID) AS R
            FROM WS_DATA_STORE.ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE
            WHERE ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE.DSS_DELETE_FLAG != 'Y' )
            WHERE R = 1 ) ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE
              ON ODS_MOSAIC_CDM_ECONOMIC_ENTITY.ENTITY_ID = ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE.ENTITY_ID
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_MOSAIC_CDM_ZONE') }} ODS_MOSAIC_CDM_ZONE
              ON ODS_MOSAIC_CDM_ECONOMIC_ENTITY_ZONE.ZONE_ID = ODS_MOSAIC_CDM_ZONE.ZONE_ID
                AND ODS_MOSAIC_CDM_ZONE.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_ZONE.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN ( SELECT DISTINCT ODS_MOSAIC_CDM_ENTITY_UDL.ENTITY_ID, ODS_MOSAIC_CDM_UDL_ELEMENT.ELEMENT_LABEL AS "PLANT"
            FROM {{ ref('DATA_STORE', 'ODS_MOSAIC_CDM_ENTITY_UDL') }} "ODS_MOSAIC_CDM_ENTITY_UDL"
            JOIN {{ ref('DATA_STORE', 'ODS_MOSAIC_CDM_UDL_ELEMENT') }} "ODS_MOSAIC_CDM_UDL_ELEMENT"
              ON ODS_MOSAIC_CDM_ENTITY_UDL.UDL_ELEMENT_ID = ODS_MOSAIC_CDM_UDL_ELEMENT.UDL_ELEMENT_ID
                AND ODS_MOSAIC_CDM_UDL_ELEMENT.UDL_ID = 4200
                AND ODS_MOSAIC_CDM_UDL_ELEMENT.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_UDL_ELEMENT.DSS_DELETE_FLAG != 'Y'
            WHERE ODS_MOSAIC_CDM_ENTITY_UDL.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_ENTITY_UDL.DSS_DELETE_FLAG != 'Y' ) ODS_MOSAIC_CDM_ENTITY_UDL
              ON ODS_MOSAIC_CDM_ECONOMIC_ENTITY.ENTITY_ID = ODS_MOSAIC_CDM_ENTITY_UDL.ENTITY_ID
            LEFT JOIN {{ ref('STAGE_BT', 'STAGE_PRODVIEW_WELLS') }} "STAGE_PRODVIEW_WELLS"
              ON UPPER(LEFT('1' || REPLACE(REPLACE(LEFT(ODS_MOSAIC_CDM_ZONE.UWI, 17) || REPLACE(SUBSTRING(ODS_MOSAIC_CDM_ZONE.UWI, 18, LEN(ODS_MOSAIC_CDM_ZONE.UWI)), '/', '0'), '/', ''), '-', ''), 16)) = STAGE_PRODVIEW_WELLS.UWI
                AND ODS_MOSAIC_CDM_ZONE.UWI_TYPE_ID = 1
                OR ODS_MOSAIC_CDM_ZONE.UWI = STAGE_PRODVIEW_WELLS.UWI
                AND ODS_MOSAIC_CDM_ZONE.UWI_TYPE_ID <> 1
            WHERE ODS_MOSAIC_CDM_ECONOMIC_ENTITY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_MOSAIC_CDM_ECONOMIC_ENTITY.DSS_DELETE_FLAG != 'Y'
                AND ODS_MOSAIC_CDM_ECONOMIC_RESULT.CASE_ID IN ($PMOSAIC_CDM_FORECAST_CASE_IDS$, $PMOSAIC_CDM_LIVE_FORECAST_CASE_ID$)
        name: STAGE_MOSAIC_ENTITIES
        noLinkRefs: []
