        join:
          joinCondition: |-
            EXTENDED
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY') }} "ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY"
            JOIN {{ ref('STAGE_BT', 'STAGE_PRODVIEW_WELLS') }} "STAGE_PRODVIEW_WELLS"
              ON ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.IDFLOWNET = STAGE_PRODVIEW_WELLS.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.IDRECUNIT = STAGE_PRODVIEW_WELLS.ENTITY_KEY
            LEFT JOIN ( SELECT ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDFLOWNET, ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDRECUNIT, ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.DTTM AS ACTIVITY_DATE, SUM(NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLC1LIQ, 0)) AS METHANE_METRIC, SUM(NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLC2LIQ, 0)) AS ETHANE_METRIC, SUM(NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLC3LIQ, 0)) AS PROPANE_METRIC, SUM(NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLIC4LIQ, 0) + NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLNC4LIQ, 0)) AS BUTANE_METRIC, SUM(NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLIC5LIQ, 0) + NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLNC5LIQ, 0) + NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLC6LIQ, 0) + NVL(ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.VOLC7LIQ, 0)) AS PENTANE_METRIC
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITDISPMONTHDAY') }} "ODS_PVIEW_PVT_PVUNITDISPMONTHDAY"
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITNODE') }} "ODS_PVIEW_PVT_PVUNITNODE"
              ON ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDRECDISPUNITNODE = ODS_PVIEW_PVT_PVUNITNODE.IDREC
                AND ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDFLOWNET = ODS_PVIEW_PVT_PVUNITNODE.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNITNODE.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITNODE.DSS_DELETE_FLAG != 'Y'
            WHERE ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.DSS_DELETE_FLAG != 'Y'
                AND LOWER(ODS_PVIEW_PVT_PVUNITNODE.TYPDISPHCLIQ) = 'ngl'
            GROUP BY ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDFLOWNET, ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDRECUNIT, ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.DTTM ) ODS_PVIEW_PVT_PVUNITDISPMONTHDAY
              ON ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.IDRECUNIT = ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDRECUNIT
                AND ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.DTTM = ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.ACTIVITY_DATE
                AND ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.IDFLOWNET = ODS_PVIEW_PVT_PVUNITDISPMONTHDAY.IDFLOWNET
            LEFT JOIN ( SELECT ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.BALFACTGAS, ODS_PVIEW_PVT_PVFACILITY.IDREC AS IDRECFACILITY, ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.DTTM
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC') }} "ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC"
            JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVFACILITYMONTHCALC') }} "ODS_PVIEW_PVT_PVFACILITYMONTHCALC"
              ON ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.IDRECPARENT = ODS_PVIEW_PVT_PVFACILITYMONTHCALC.IDREC
                AND ODS_PVIEW_PVT_PVFACILITYMONTHCALC.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFACILITYMONTHCALC.DSS_DELETE_FLAG != 'Y'
            JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVFACILITY') }} "ODS_PVIEW_PVT_PVFACILITY"
              ON ODS_PVIEW_PVT_PVFACILITYMONTHCALC.IDRECPARENT = ODS_PVIEW_PVT_PVFACILITY.IDREC
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_DELETE_FLAG != 'Y'
            WHERE ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.DSS_DELETE_FLAG != 'Y' ) ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC
              ON ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.IDRECFACILITY = ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.IDRECFACILITY
                AND ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY.DTTM = ODS_PVIEW_PVT_PVFACILITYMONTHDAYCALC.DTTM
            LEFT JOIN ( SELECT DTTM AS START_DATE, COALESCE(DATEADD(DAY, -1, LEAD(DTTM) OVER (ORDER BY DTTM)), '2999-12-31') AS END_DATE, RATE
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITMETERRATEENTRY') }} "ODS_PVIEW_PVT_PVUNITMETERRATEENTRY"
            WHERE ODS_PVIEW_PVT_PVUNITMETERRATEENTRY.IDRECPARENT = 'B4E41CDA995F4FD0BDEF2233B7D9D8B8'
                AND ODS_PVIEW_PVT_PVUNITMETERRATEENTRY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITMETERRATEENTRY.DSS_DELETE_FLAG != 'Y' ) ODS_PVIEW_PVT_PVUNITMETERRATEENTRY
              ON ODS
