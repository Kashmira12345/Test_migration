        join:
          joinCondition: |-
            EXTENDED
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNIT') }} "ODS_PVIEW_PVT_PVUNIT"
            JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITCOMP') }} "ODS_PVIEW_PVT_PVUNITCOMP"
              ON ODS_PVIEW_PVT_PVUNIT.IDFLOWNET = ODS_PVIEW_PVT_PVUNITCOMP.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNIT.IDREC = ODS_PVIEW_PVT_PVUNITCOMP.IDRECPARENT
                AND ODS_PVIEW_PVT_PVUNITCOMP.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITCOMP.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN {{ ref('EDW', 'DIM_LO_QB_CC_CORP_HIER_CURRENT') "DIM_LO_QB_CC_CORP_HIER_CURRENT"
              ON ODS_PVIEW_PVT_PVUNIT.COSTCENTERIDA = DIM_LO_QB_CC_CORP_HIER_CURRENT.CC_NUM
            LEFT JOIN {{ ref('EDW', 'DIM_LO_SAP_CC_CORP_HIER_CURRENT') "DIM_LO_SAP_CC_CORP_HIER_CURRENT"
              ON ODS_PVIEW_PVT_PVUNIT.COSTCENTERIDA = DIM_LO_SAP_CC_CORP_HIER_CURRENT.CC_NUM
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITCOMPSTATUS') }} "ODS_PVIEW_PVT_PVUNITCOMPSTATUS"
              ON ODS_PVIEW_PVT_PVUNITCOMP.IDFLOWNET = ODS_PVIEW_PVT_PVUNITCOMPSTATUS.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNITCOMP.IDREC = ODS_PVIEW_PVT_PVUNITCOMPSTATUS.IDRECPARENT
                AND ODS_PVIEW_PVT_PVUNITCOMPSTATUS.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVUNITCOMPSTATUS.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVFACILITY') }} "ODS_PVIEW_PVT_PVFACILITY"
              ON ODS_PVIEW_PVT_PVUNIT.IDRECFACILITYCALC = ODS_PVIEW_PVT_PVFACILITY.IDREC
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFACILITY.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVROUTESETROUTE') }} "ODS_PVIEW_PVT_PVROUTESETROUTE"
              ON ODS_PVIEW_PVT_PVUNIT.IDRECROUTESETROUTECALC = ODS_PVIEW_PVT_PVROUTESETROUTE.IDREC
                AND ODS_PVIEW_PVT_PVROUTESETROUTE.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVROUTESETROUTE.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVFLOWNETHEADER') }} "ODS_PVIEW_PVT_PVFLOWNETHEADER"
              ON ODS_PVIEW_PVT_PVUNIT.IDFLOWNET = ODS_PVIEW_PVT_PVFLOWNETHEADER.IDFLOWNET
                AND ODS_PVIEW_PVT_PVFLOWNETHEADER.DSS_CURRENT_FLAG = 'Y'
                AND ODS_PVIEW_PVT_PVFLOWNETHEADER.DSS_DELETE_FLAG != 'Y'
            LEFT JOIN ( SELECT DISTINCT IDFLOWNET , IDRECPARENT , FIRST_VALUE(TYP) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS TYP , FIRST_VALUE(MODEL) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS MODEL , FIRST_VALUE(MAKE) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS MAKE , FIRST_VALUE(EXPORTID1) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS MSD , FIRST_VALUE(EXPORTID2) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS EXPORTID2 , FIRST_VALUE(IMPORTID1) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS JSD , FIRST_VALUE(IMPORTID2) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS JACK_RATIO , FIRST_VALUE(IMPORTTYP1) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS BELT , FIRST_VALUE(IMPORTTYP2) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS RPM , FIRST_VALUE(EXPORTTYP1) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS CM , FIRST_VALUE(EXPORTTYP2) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS CMOD , FIRST_VALUE(OTHERID) OVER (PARTITION BY IDRECPARENT
            ORDER BY SYSCREATEDATE DESC) AS CTYP
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITEQUIP') }} "ODS_PVIEW_PVT_PVUNITEQUIP"
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND NAME = 'Surface Equipment' ) ODS_PVIEW_PVT_PVUNITEQUIP
              ON ODS_PVIEW_PVT_PVUNIT.IDFLOWNET = ODS_PVIEW_PVT_PVUNITEQUIP.IDFLOWNET
                AND ODS_PVIEW_PVT_PVUNIT.IDREC = ODS_PVIEW_PVT_PVUNITEQUIP.IDRECPARENT
            LEFT JOIN {{ ref('STAGE_BT', 'STAGE_PRODVIEW_LATEST_WI') }} "STAGE_PRODVIEW_LATEST_WI"
              ON ODS_PVIEW_PVT_PVUNIT.IDREC = STAGE_PRODVIEW_LATEST_WI.IDRECUNIT
            LEFT JOIN ( SELECT IDRECUNIT, MAX(DTTM) AS LPD
            FROM {{ ref('DATA_STORE', 'ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY') }} "ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY"
            WHERE DSS_CURRENT_FLAG = 'Y'
                AND DSS_DELETE_FLAG != 'Y'
                AND NVL(VOLPRODGATHHCLIQ,0) + NVL(VOLPRODALLOCCOND,0) + NVL(VOLPRODALLOCNGL,0) + NVL(VOLPRODGATHGAS,0) != 0 G
