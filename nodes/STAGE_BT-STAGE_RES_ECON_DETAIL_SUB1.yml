          ODS_MOSAIC_RES_ECONOMIC_DETAIL: db429fb7-752a-2ab4-eb2f-2ad8e14e9cae
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_RES_ECON_DETAIL_SUB1] AS \nSELECT ODS_MOSAIC_RES_ECONOMIC_DETAIL.* \r\nFROM [TABLEOWNER].[ODS_MOSAIC_RES_ECONOMIC_DETAIL] ODS_MOSAIC_RES_ECONOMIC_DETAIL\r\nWHERE ODS_MOSAIC_RES_ECONOMIC_DETAIL.DSS_CURRENT_FLAG = 'Y'\r\n    AND ODS_MOSAIC_RES_ECONOMIC_DETAIL.RESULT_ID IN (\r\n       SELECT DISTINCT RESULT_ID FROM [TABLEOWNER].[ODS_MOSAIC_RES_ECONOMIC_RESULT] ODS_MOSAIC_RES_ECONOMIC_RESULT \r\n          INNER JOIN [TABLEOWNER].[ODS_MOSAIC_RES_ECONOMIC_CASE] ODS_MOSAIC_RES_ECONOMIC_CASE\r\n             ON ODS_MOSAIC_RES_ECONOMIC_RESULT.CASE_ID = ODS_MOSAIC_RES_ECONOMIC_CASE.CASE_ID\r\n                 AND ODS_MOSAIC_RES_ECONOMIC_CASE.DSS_CURRENT_FLAG = 'Y' \r\n                 AND ARRAY_CONTAINS('FACT_ECONOMICS'::VARIANT,SPLIT(ODS_MOSAIC_RES_ECONOMIC_CASE.CASE_DESCRIPTION,'|'))    \r\n       WHERE ODS_MOSAIC_RES_ECONOMIC_RESULT.DSS_CURRENT_FLAG = 'Y' \r\n         AND ODS_MOSAIC_RES_ECONOMIC_RESULT.COMPANY_ID = 801\r\n         AND ODS_MOSAIC_RES_ECONOMIC_RESULT.RISK IN ('B','Y')\r\n         AND ODS_MOSAIC_RES_ECONOMIC_RESULT.RESERVE_CATEGORY_ID IN (201, 202, 204, 205, 221, 222, 223, 224, 225)      \r\n       )\r\n    AND (NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.total_company_boe_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_wi_boe_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_boe_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.oil_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.oil_working_interest_volume ,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.oil_royalty_interest_volume ,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_oil_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.gas_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.gas_working_interest_volume,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.gas_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_gas_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.ngl_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.ngl_working_interest_volume,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.ngl_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_ngl_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.eth_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.eth_working_interest_volume,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.eth_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_eth_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.prop_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.prop_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.prop_royalty_interest_volume ,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_prop_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.but_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.but_working_interest_volume,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.but_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_but_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.cond_pool_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.cond_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.cond_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_cond_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fcond_lease_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fcond_working_interest_volume ,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fcond_royalty_interest_volume,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_fcond_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.oil_working_interest_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.gas_working_interest_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.ngl_working_interest_revenue,0)
            <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.eth_working_interest_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.prop_working_interest_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.but_working_interest_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.cond_working_interest_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fcond_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_oil_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_gas_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_NGL_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_eth_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_prop_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_but_revenue,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_cond_revenue,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_fcond_revenue,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.net_crown_royalty,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.net_revenue_before_royalty,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.FH_royalty_Burden,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.total_ORR_royalty,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.production_tax,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.total_net_burdens,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.net_revenue_after_royalty ,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.other_production_income,0) <> 0 OR\tNVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.resource_sales_revenue_tax,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fixed_production_expense ,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.variable_production_expense ,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.other_production_expense,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.total_operating_costs,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.site_restoration_cost,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.salvage_cost,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.net_operating_income,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.net_investment,0) <> 0 OR\t\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.before_tax_cash_flow,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_oil_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_gas_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_ngl_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_boe_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_eth_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_prop_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_cond_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_fcond_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_share_but_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.oil_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.gas_working_interest_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.ngl_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.company_wi_boe_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.eth_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.prop_working_interest_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.cond_working_interest_volume,0) <> 0 OR NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.fcond_working_interest_volume,0) <> 0 OR\r\n      NVL(ODS_MOSAIC_RES_ECONOMIC_DETAIL.but_working_interest_volume,0) <> 0 )"
