        join:
          joinCondition: |-
            FROM ( SELECT DISTINCT 'ENTITY' HIER_SRC_CODE, COUNTRY, PROVINCE_STATE, CURRENT_CORE_AREA, CURRENT_CORE_PROPERTY
            FROM {{ ref('EDW', 'DIM_RES_ENTITY') }}
            UNION SELECT DISTINCT 'MANUAL' HIER_SRC_CODE,COUNTRY, PROVINCE_STATE, CURRENT_CORE_AREA, CURRENT_CORE_PROPERTY
            FROM {{ ref('WHERESCAPE_LOAD', 'LOAD_VET_RES_HIERARCHY_MANUAL') }} ) AS TARGET
            LEFT JOIN {{ ref('WHERESCAPE_LOAD', 'LOAD_VET_RES_XREF_RESERVE_HIER_CORP_HIER') "LOAD_VET_RES_XREF_RESERVE_HIER_CORP_HIER"
              ON TARGET.CURRENT_CORE_PROPERTY = LOAD_VET_RES_XREF_RESERVE_HIER_CORP_HIER.RES_HIER_CURRENT_CORE_PROPERTY
            LEFT JOIN ( SELECT DISTINCT AREA_CODE, AREA_NAME, BU_SF_ROLE
            FROM [TABLEOWNER') }}.[DIM_LO_SAP_CC_CORP_HIER_CURRENT') }}) DIM_LO_CC_CORP_HIER_CURRENT
              ON LOAD_VET_RES_XREF_RESERVE_HIER_CORP_HIER.CORP_HIER_AREA_CODE = DIM_LO_CC_CORP_HIER_CURRENT.AREA_CODE
            WHERE TARGET.COUNTRY IS NOT NULL
                AND TARGET.PROVINCE_STATE IS NOT NULL
                AND TARGET.CURRENT_CORE_AREA IS NOT NULL
                AND TARGET.CURRENT_CORE_PROPERTY IS NOT NULL
        name: STAGE_RES_SAP_RPT_HIERARCHY
