    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_DIM_FDC_SCENARIO] AS\r\n\r\nSELECT CAST(DIM_BUDGET_VERSION_KEY AS VARCHAR(100)) AS SCENARIO_KEY\r\n\t,VERSION_NAME AS SCENARIO_NAME\r\n\t,'Budget' AS SCENARIO_LEVEL_01\r\n\t,VERSION_NAME AS SCENARIO_LEVEL_02\r\n\t,ECON_CASE_NAME AS SCENARIO_LEVEL_03\r\n\t,NULL AS SCENARIO_LEVEL_04\r\n\t,NULL AS SCENARIO_LEVEL_05\r\n\t,NULL AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,'Not Applicable' AS DOWNTIME_CODE_1\r\n\t,'Not Applicable' AS DOWNTIME_CODE_2\r\n\t,'Not Applicable' AS DOWNTIME_CODE_3\r\n\t,1 AS IS_PLANNING\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM WS_EDW.DIM_LO_SAP_BUDGET_VERSION\r\nWHERE DIM_BUDGET_VERSION_KEY != 0\r\n\r\nUNION ALL\r\n\r\nSELECT CAST(CASE_ID || '-' || NVL(CATEGORY, 'UNKNOWN') || '-' || NVL(CAPITAL_EXPENSE_CATEGORY, 'UNKNOWN') AS VARCHAR(100)) AS SCENARIO_KEY\r\n\t,CASE_NAME AS SCENARIO_NAME\r\n\t,'Budget' AS SCENARIO_LEVEL_01\r\n\t,CASE_NAME AS SCENARIO_LEVEL_02\r\n\t,CATEGORY AS SCENARIO_LEVEL_03\r\n\t,CAPITAL_EXPENSE_CATEGORY AS SCENARIO_LEVEL_04\r\n\t,NULL AS SCENARIO_LEVEL_05\r\n\t,'Loaded case from Mosaic' AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,'Not Applicable' AS DOWNTIME_CODE_1\r\n\t,'Not Applicable' AS DOWNTIME_CODE_2\r\n\t,'Not Applicable' AS DOWNTIME_CODE_3\r\n\t,1 AS IS_PLANNING\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_FORECAST_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_BUDGET_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM (\r\n    SELECT DISTINCT CASE_ID, CASE_NAME, CATEGORY, CAPITAL_EXPENSE_CATEGORY\r\n    FROM \"WS_EDW\".\"VIEW_MOSAIC_CDM_VOLUMES\"\r\n    WHERE MONTH <> 0\r\n    AND CASE_ID IN ($PMOSAIC_CDM_FORECAST_CASE_IDS$)\r\n)\r\n\r\nUNION ALL\r\n\r\nSELECT SCENARIO_KEY\r\n\t,'Downtime' AS SCENARIO_NAME\r\n\t,'Downtime' AS SCENARIO_LEVEL_01\r\n\t,DIVISION AS SCENARIO_LEVEL_02\r\n\t,CODE1 AS SCENARIO_LEVEL_03\r\n\t,CODE2 AS SCENARIO_LEVEL_04\r\n\t,CODE3 AS SCENARIO_LEVEL_05\r\n\t,NULL AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,CODE1 AS DOWNTIME_CODE_1\r\n\t,CODE2 AS DOWNTIME_CODE_2\r\n\t,CODE3 AS DOWNTIME_CODE_3\r\n\t,0 AS IS_PLANNING\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM \"WS_STAGE_BT\".\"VIEW_FDC_DOWNTIME_CODES\"\r\n\r\nUNION ALL\r\n\r\nSELECT FS.SCENARIO_KEY\r\n\t,'Weekly Archive' AS SCENARIO_NAME\r\n\t,'Prodview' AS SCENARIO_LEVEL_01\r\n\t,'Weekly Archives' AS SCENARIO_LEVEL_02\r\n\t,FS.SCENARIO_KEY AS SCENARIO_LEVEL_03\r\n\t,NULL AS SCENARIO_LEVEL_04\r\n\t,NULL AS SCENARIO_LEVEL_05\r\n\t,NULL AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,'Not Applicable' AS DOWNTIME_CODE_1\r\n\t,'Not Applicable' AS DOWNTIME_CODE_2\r\n\t,'Not Applicable' AS DOWNTIME_CODE_3\r\n\t,0 AS IS_PLANNING\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM (\r\n   SELECT DISTINCT SCENARIO_KEY\r\n   FROM \"WS_STAGE_BT\".\"VIEW_FDC_WEEK_ARCHIVES\"\r\n) FS\r\n\r\nUNION ALL\r\n\r\nSELECT SCENARIO_KEY\r\n\t,SCENARIO_NAME\r\n\t,SCENARIO_LEVEL_01\r\n\t,SCENARIO_LEVEL_02\r\n\t,SCENARIO_LEVEL_03\r\n\t,SCENARIO_LEVEL_04\r\n\t,SCENARIO_LEVEL_05\r\n\t,SCENARIO_DESCRIPTION\r\n\t,SCENARIO_LEVEL_01_SORT_KEY\r\
            \n\t,SCENARIO_LEVEL_02_SORT_KEY\r\n\t,SCENARIO_LEVEL_03_SORT_KEY\r\n\t,SCENARIO_LEVEL_04_SORT_KEY\r\n\t,SCENARIO_LEVEL_05_SORT_KEY\r\n\t,DOWNTIME_CODE_1\r\n\t,DOWNTIME_CODE_2\r\n\t,DOWNTIME_CODE_3\r\n\t,IS_PLANNING\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(NULL AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM \"WS_LOAD\".\"LOAD_FDC_SCENARIO\"\r\n\r\nUNION ALL\r\n\r\nSELECT \r\n      CAST(CASE_ID || '-' || NVL(CATEGORY, 'UNKNOWN') || '-' || NVL(CAPITAL_EXPENSE_CATEGORY, 'UNKNOWN') AS VARCHAR(100)) AS SCENARIO_KEY\r\n\t,'Mosaic Live Forecast' AS SCENARIO_NAME\r\n\t,'Forecast' AS SCENARIO_LEVEL_01\r\n\t,'Mosaic Live Forecast' AS SCENARIO_LEVEL_02\r\n\t,CATEGORY AS SCENARIO_LEVEL_03\r\n\t,CAPITAL_EXPENSE_CATEGORY AS SCENARIO_LEVEL_04\r\n\t,NULL AS SCENARIO_LEVEL_05\r\n\t,NULL AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,'Not Applicable' AS DOWNTIME_CODE_1\r\n\t,'Not Applicable' AS DOWNTIME_CODE_2\r\n\t,'Not Applicable' AS DOWNTIME_CODE_3\r\n\t,1 AS IS_PLANNING\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_FORECAST_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_BUDGET_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM (\r\n    SELECT DISTINCT CASE_ID, CASE_NAME, CATEGORY, CAPITAL_EXPENSE_CATEGORY\r\n    FROM \"WS_EDW\".\"VIEW_MOSAIC_CDM_VOLUMES\"\r\n    WHERE MONTH <> 0\r\n    AND CASE_ID IN ($PMOSAIC_CDM_LIVE_FORECAST_CASE_ID$)\r\n)\r\n\r\nUNION ALL\r\n\r\nSELECT PP.PP || CASE_ID AS SCENARIO_KEY\r\n\t,'Mosaic Downtime' AS SCENARIO_NAME\r\n\t,'Downtime' AS SCENARIO_LEVEL_01\r\n\t,CASE_NAME AS SCENARIO_LEVEL_02\r\n\t,PP.DESCRIPTION AS SCENARIO_LEVEL_03\r\n\t,NULL AS SCENARIO_LEVEL_04\r\n\t,NULL AS SCENARIO_LEVEL_05\r\n\t,NULL AS SCENARIO_DESCRIPTION\r\n\t,NULL AS SCENARIO_LEVEL_01_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_02_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_03_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_04_SORT_KEY\r\n\t,NULL AS SCENARIO_LEVEL_05_SORT_KEY\r\n\t,PP.DESCRIPTION AS DOWNTIME_CODE_1\r\n\t,NULL AS DOWNTIME_CODE_2\r\n\t,NULL AS DOWNTIME_CODE_3\r\n\t,1 AS IS_PLANNING\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_FORECAST_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_FORECAST\r\n\t,CAST(CASE WHEN CASE_ID = '$PFDC_CURRENT_BUDGET_KEY$' THEN 'Y' ELSE NULL END AS VARCHAR(1)) AS IS_CURRENT_BUDGET\r\nFROM (\r\n   SELECT DISTINCT CASE_NAME, CASE_ID\r\n   FROM \"WS_EDW\".\"VIEW_MOSAIC_CDM_VOLUMES\"\r\n   WHERE CASE_ID IN ($PMOSAIC_CDM_FORECAST_CASE_IDS$)\r\n) V\r\nCROSS JOIN (\r\n   SELECT 'PRODUCTION_PATTERN_' AS PP, 'PLANNED' AS DESCRIPTION \r\n   UNION \r\n   SELECT 'PRODUCTION_PATTERN_2_' AS PP, 'UNPLANNED' AS DESCRIPTION\r\n   UNION \r\n   SELECT 'COST_PATTERN_' AS PP, 'COST PATTERN' AS DESCRIPTION\r\n) PP"
        dependencies:
          - locationName: ''
            nodeName: ''
