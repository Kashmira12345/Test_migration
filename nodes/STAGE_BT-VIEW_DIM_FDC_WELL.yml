        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_DIM_FDC_WELL] AS\r\nSELECT ENTITY_KEY\r\n\t,UNIT_NAME\r\n\t,UWI\r\n\t,CC.CC_NUM\r\n\t,LONGITUDE\r\n\t,LATITUDE\r\n\t,COMPLETIONIDE\r\n\t,ON_PROD_DATE\r\n\t,PV_UNIT_END_DATE\r\n\t,ZONE\r\n\t,FORM_AT_TD\r\n\t,LICENSEE\r\n\t,LICENSE_NO\r\n\t,TOTAL_DEPTH\r\n\t,LICENSE_DATE\r\n\t,TVD\r\n\t,STATUS\r\n\t,WELL_STATUS_DTTM\r\n    ,EXPIRY_DATE\r\n\t,PRODUCT\r\n\t,OIL_OR_CONDENSATE\r\n\t,COMMINGLED\r\n\t,METHODPROD\r\n\t,OPERATOR\r\n\t,OPERATED\r\n\t,DIVISION\r\n\t,ELEVATION\r\n\t,DISTRICT\r\n\t,AREA\r\n\t,FIELD\r\n\t,STATEPROV\r\n\t,USERTXT2\r\n\t,USERTXT3\r\n\t,TYPREGULATORY\r\n\t,LEGALSURFLOC\r\n\t,WELL_TYPE\r\n\t,UNITIDPA\r\n\t,UNITIDREGULATORY\r\n\t,FIELDCODE\r\n\t,REPORTING_FACILITY\r\n\t,RUN_NAME\r\n\t,NETWORK_NAME\r\n\t,BATTERY\r\n\t,FACILITY_NAME\r\n\t,LAST_PRODUCING_DATE\r\n\t,NUMBER_OF_DAYS_DOWN\r\n\t,DOWN_FOR_60_DAYS\r\n\t,UPPER(COALESCE(CC.CC_NAME, 'NO COST CENTER')) AS CC_NAME\r\n\t,UPPER(COALESCE(CC.AREA_NAME, AREA, 'NO AREA')) AS AREA_NAME\r\n\t,UPPER(COALESCE(CC.COREAREA_NAME, DISTRICT, 'NO CORE AREA')) AS COREAREA_NAME\r\n\t,UPPER(COALESCE(CC.PROV_NAME, STATEPROV, 'NO PROVINCE')) AS PROV_NAME\r\n\t,UPPER(COALESCE(CC.COUNTRY_NAME, DIVISION, 'NO COUNTRY')) AS COUNTRY_NAME\r\n\t,CC.CC_CORP\r\n\t,CC.LICENSEE_OPERATOR\r\n\t,CC.PHYSICAL_OPERATOR\r\n\t,CC.PLAY\r\n\t,CC.EXPLOITATION_ENGINEER\r\n\t,CC.PRODUCTION_ENGINEER\r\n\t,CC.FACILITY\r\n\t,CC.BUDGET_YEAR AS CAPITAL_BUDGET_YEAR\r\n\t,CC.ROUTE AS OPERATOR_RUN\r\n\t,CC.FOREMAN\r\n\t,CC.FACILITY AS BATTERY_GAS_PLANT_SWB\r\n\t,CC.ACQUISITION\r\n\t,COALESCE(CC.PRE_CC_NAME, UNIT_NAME, 'NO COST CENTER') AS PRE_CC_NAME\r\n\t,COALESCE(CC.PRE_AREA_NAME, AREA, 'NO AREA') AS PRE_AREA_NAME\r\n\t,COALESCE(CC.PRE_COREAREA_NAME, DISTRICT, 'NO CORE AREA') AS PRE_COREAREA_NAME\r\n\t,COALESCE(CC.PRE_PROV_NAME, DISTRICT, 'NO PROVINCE') AS PRE_PROV_NAME\r\n\t,COALESCE(CC.PRE_COUNTRY_NAME, DIVISION, 'NO COUNTRY') AS PRE_COUNTRY_NAME\r\n\t,CC.PRE_CC_CORP\r\n\t,CC.PRE_LICENSEE_OPERATOR\r\n\t,CC.PRE_PHYSICAL_OPERATOR \r\n\t,CC.BU_CODE\r\n\t,CC.BU_DESC\r\n\t,CC.BU_SF_ROLE \r\n\t,SOURCE\r\nFROM (\r\n\tSELECT PV.IDREC AS ENTITY_KEY\r\n\t\t,PV.UNIT_NAME\r\n\t\t,PV.UWI AS UWI\r\n\t\t,PV.CC_NUM\r\n\t\t,PV.LONGITUDE\r\n\t\t,PV.LATITUDE\r\n\t\t,PV.COMPLETIONIDE\r\n\t\t,PV.ON_PROD_DATE\r\n\t\t,PV.PV_UNIT_END_DATE\r\n\t\t,PV.ZONE\r\n\t\t,PV.FORM_AT_TD\r\n\t\t,PV.LICENSEE\r\n\t\t,PV.LICENSE_NO\r\n\t\t,PV.TOTAL_DEPTH\r\n\t\t,PV.LICENSE_DATE\r\n\t\t,PV.TVD\r\n\t\t,PV.STATUS\r\n\t\t,PV.WELL_STATUS_DTTM\r\n\t\t,PV.EXPIRY_DATE\r\n\t\t,PV.PRODUCT\r\n\t\t,PV.OIL_OR_CONDENSATE\r\n\t\t,PV.COMMINGLED\r\n\t\t,PV.METHODPROD\r\n\t\t,PV.OPERATOR\r\n\t\t,PV.OPERATED\r\n\t\t,Nvl(PV.DIVISION, 'NO DIVISION') AS DIVISION\r\n\t\t,PV.ELEVATION\r\n\t\t,Nvl(PV.DISTRICT, 'NO DISTRICT') AS DISTRICT\r\n\t\t,Nvl(PV.AREA, 'NO AREA') AS AREA\r\n\t\t,Nvl(PV.FIELD, 'NO FIELD') AS FIELD\r\n\t\t,PV.STATEPROV\r\n\t\t,PV.USERTXT2\r\n\t\t,PV.USERTXT3\r\n\t\t,PV.TYPREGULATORY\r\n\t\t,PV.LEGALSURFLOC\r\n\t\t,PV.WELL_TYPE\r\n\t\t,PV.UNITIDPA\r\n\t\t,PV.UNITIDREGULATORY\r\n\t\t,PV.FIELDCODE\r\n\t\t,PV.REPORTING_FACILITY\r\n\t\t,PV.RUN_NAME\r\n\t\t,PV.NETWORK_NAME\r\n\t\t,PV.BATTERY\r\n\t\t,PV.FACILITY_NAME\r\n\t\t,PV.LAST_PRODUCING_DATE\r\n\t\t,PV.NUMBER_OF_DAYS_DOWN\r\n\t\t,PV.DOWN_FOR_60_DAYS\r\n\t\t,'PRODVIEW' AS SOURCE\r\n\tFROM WS_STAGE_BT.STAGE_PRODVIEW_WELLS PV\r\n\t\r\n\tUNION ALL\r\n\t\r\n\tSELECT ENTITY_KEY\r\n\t\t,UNIT_NAME\r\n\t\t,UWI\r\n\t\t,CC_NUM\r\n\t\t,LONGITUDE\r\n\t\t,LATITUDE\r\n\t\t,NULL AS COMPLETIONIDE\r\n\t\t,ON_PROD_DATE\r\n\t\t,NULL AS PV_UNIT_END_DATE\r\n\t\t,NULL AS ZONE\r\n\t\t,NULL AS FORM_AT_TD\r\n\t\t,NULL AS LICENSEE\r\n\t\t,NULL AS LICENSE_NO\r\n\t\t,NULL AS TOTAL_DEPTH\r\n\t\t,NULL AS LICENSE_DATE\r\n\t\t,NULL AS TVD\r\n\t\t,NULL AS STATUS\r\n\t\t,NULL AS WELL_STATUS_DTTM\r\n\t\t,NULL AS EXPIRY_DATE\r\n\t\t,NULL AS PRODUCT\r\n\t\t,NULL AS OIL_OR_CONDENSATE\r\n\t\t,NULL AS COMMINGLED\r\n\t\t,NULL AS METHODPROD\r\n\t\t,OPERATOR\r\n\t\t,OPERATED\r\n\t\t,COUNTRY_NAME AS DIVISION\r\n\t\t,NULL AS ELEVATION\r\n\t\t,COALESCE(DISTRICT, COREAREA_NAME) AS DISTRICT\r\
            \n\t\t,AREA\r\n\t\t,FIELD\r\n\t\t,STATEPROV\r\n\t\t,NULL AS USERTXT2\r\n\t\t,NULL AS USERTXT3\r\n\t\t,NULL AS TYPREGULATORY\r\n\t\t,NULL AS LEGALSURFLOC\r\n\t\t,NULL AS WELL_TYPE\r\n\t\t,NULL AS UNITIDPA\r\n\t\t,NULL AS UNITIDREGULATORY\r\n\t\t,NULL AS FIELDCODE\r\n\t\t,NULL AS REPORTING_FACILITY\r\n\t\t,NULL AS RUN_NAME\r\n\t\t,NULL AS NETWORK_NAME\r\n\t\t,NULL AS BATTERY\r\n\t\t,NULL AS FACILITY_NAME\r\n\t\t,NULL AS LAST_PRODUCING_DATE\r\n\t\t,NULL AS NUMBER_OF_DAYS_DOWN\r\n\t\t,NULL AS DOWN_FOR_60_DAYS\r\n\t\t,'MOSAIC' AS SOURCE\r\n\tFROM (\r\n\t\tSELECT DISTINCT CAST(ENTITY_ID AS VARCHAR(100)) AS ENTITY_KEY\r\n\t\t\t,ENTITY_NAME AS UNIT_NAME\r\n\t\t\t,Upper(Left('1' || Replace(Replace(Left(ENTITY_NAME, 17) || Replace(Substring(ENTITY_NAME, 18, Len(ENTITY_NAME)), '/', '0'), '/', ''), '-', ''), 16)) AS UWI\r\n\t\t\t,Trim(USER_DEFINED_13) AS CC_NUM\r\n\t\t\t,LONGITUDE AS LONGITUDE\r\n\t\t\t,LATITUDE AS LATITUDE\r\n\t\t\t,ON_PRODUCTION_DATE AS ON_PROD_DATE\r\n\t\t\t,OPERATOR_NAME AS OPERATOR\r\n\t\t\t,OPERATED\r\n\t\t\t,DISTRICT AS DISTRICT\r\n\t\t\t,Trim(USER_DEFINED_17) AS AREA\r\n\t\t\t,FIELD_NAME AS FIELD\r\n\t\t\t,PROVINCE AS STATEPROV\r\n\t\t\t,Trim(USER_DEFINED_16) AS COREAREA_NAME\r\n\t\t\t,COUNTRY AS COUNTRY_NAME\r\n\t\t\t,CASE \r\n\t\t\t\tWHEN USER_DEFINED_2 = 'OPERATED'\r\n\t\t\t\t\tTHEN 'OP'\r\n\t\t\t\tWHEN USER_DEFINED_2 = 'NON-OPERATED'\r\n\t\t\t\t\tTHEN 'NONOP'\r\n\t\t\t\tELSE NULL\r\n\t\t\t\tEND AS LICENSE_OPERATOR\r\n\t\t\t,Trim(USER_DEFINED_9) AS EXPLOITATION_ENGINEER\r\n\t\t\t,Trim(USER_DEFINED_20) AS PRODUCTION_ENGINEER\r\n\t\t\t,Trim(USER_DEFINED_7) AS CAPITAL_BUDGET_YEAR\r\n\t\t\t,Row_number() OVER (\r\n\t\t\t\tPARTITION BY ENTITY_NAME ORDER BY LAST_MODIFIED_DATE DESC\r\n\t\t\t\t) AS ROW_ORDER\r\n\t\tFROM \"WS_DATA_STORE\".\"ODS_MOSAIC_CDM_ECONOMIC_ENTITY\"\r\n\t\tWHERE 1 = 1\r\n\t\t\tAND DSS_CURRENT_FLAG = 'Y'\r\n\t\t\tAND DSS_DELETE_FLAG != 'Y'\r\n\t\t)\r\n\t\r\n\tUNION ALL\r\n\t\r\n\tSELECT 'CC-' || QB.CC_NUM AS ENTITY_KEY\r\n\t\t,QB.CC_NAME AS UNIT_NAME\r\n\t\t,NULL AS UWI\r\n\t\t,QB.CC_NUM\r\n\t\t,NULL AS LONGITUDE\r\n\t\t,NULL AS LATITUDE\r\n\t\t,NULL AS COMPLETIONIDE\r\n\t\t,NULL AS ON_PROD_DATE\r\n\t\t,NULL AS PV_UNIT_END_DATE\r\n\t\t,NULL AS ZONE\r\n\t\t,NULL AS FORM_AT_TD\r\n\t\t,NULL AS LICENSEE\r\n\t\t,NULL AS LICENSE_NO\r\n\t\t,NULL AS TOTAL_DEPTH\r\n\t\t,NULL AS LICENSE_DATE\r\n\t\t,NULL AS TVD\r\n\t\t,NULL AS STATUS\r\n\t\t,NULL AS WELL_STATUS_DTTM\r\n\t\t,NULL AS EXPIRY_DATE\r\n\t\t,NULL AS PRODUCT\r\n\t\t,NULL AS OIL_OR_CONDENSATE\r\n\t\t,NULL AS COMMINGLED\r\n\t\t,NULL AS METHODPROD\r\n\t\t,NULL AS OPERATOR\r\n\t\t,NULL AS OPERATED\r\n\t\t,NULL AS DIVISION\r\n\t\t,NULL AS ELEVATION\r\n\t\t,NULL AS DISTRICT\r\n\t\t,NULL AS AREA\r\n\t\t,NULL AS FIELD\r\n\t\t,NULL AS STATEPROV\r\n\t\t,NULL AS USERTXT2\r\n\t\t,NULL AS USERTXT3\r\n\t\t,NULL AS TYPREGULATORY\r\n\t\t,NULL AS LEGALSURFLOC\r\n\t\t,NULL AS WELL_TYPE\r\n\t\t,NULL AS UNITIDPA\r\n\t\t,NULL AS UNITIDREGULATORY\r\n\t\t,NULL AS FIELDCODE\r\n\t\t,NULL AS REPORTING_FACILITY\r\n\t\t,NULL AS RUN_NAME\r\n\t\t,NULL AS NETWORK_NAME\r\n\t\t,NULL AS BATTERY\r\n\t\t,NULL AS FACILITY_NAME\r\n\t\t,NULL AS LAST_PRODUCING_DATE\r\n\t\t,NULL AS NUMBER_OF_DAYS_DOWN\r\n\t\t,NULL AS DOWN_FOR_60_DAYS\r\n\t\t,'QBYTE' AS SOURCE\r\n\tFROM (\r\n\t\tSELECT DISTINCT CC_NUM\r\n\t\t\t,CC_NAME\r\n\t\tFROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_CURRENT\" QB_CC\r\n\t\t) QB\r\n\t\r\n\tUNION ALL\r\n\t\r\n\tSELECT COREAREA_NAME || '-' || AREA_NAME || '_input' AS ENTITY_KEY\r\n\t\t,'FORECAST UNIT' AS UNIT_NAME\r\n\t\t,NULL AS UWI\r\n\t\t,CC_NUM\r\n\t\t,NULL AS LONGITUDE\r\n\t\t,NULL AS LATITUDE\r\n\t\t,NULL AS COMPLETIONIDE\r\n\t\t,NULL AS ON_PROD_DATE\r\n\t\t,NULL AS PV_UNIT_END_DATE\r\n\t\t,NULL AS ZONE\r\n\t\t,NULL AS FORM_AT_TD\r\n\t\t,NULL AS LICENSEE\r\n\t\t,NULL AS LICENSE_NO\r\n\t\t,NULL AS TOTAL_DEPTH\r\n\t\t,NULL AS LICENSE_DATE\r\n\t\t,NULL AS TVD\r\n\t\t,NULL AS STATUS\r\n\t\t,NULL AS WELL_STATUS_DTTM\r\n\t\t,NULL AS EXPIRY_DATE\r\n\t\t,NULL AS PRODUCT\r\n\t\t,NULL AS OIL_OR_CONDENSATE\r\n\t\t,NULL AS COMMINGLED\r\n\t\t,NULL AS METHODPROD\r\n\t\t,NULL
            AS OPERATOR\r\n\t\t,NULL AS OPERATED\r\n\t\t,NULL AS DIVISION\r\n\t\t,NULL AS ELEVATION\r\n\t\t,NULL AS DISTRICT\r\n\t\t,NULL AS AREA\r\n\t\t,NULL AS FIELD\r\n\t\t,NULL AS STATEPROV\r\n\t\t,NULL AS USERTXT2\r\n\t\t,NULL AS USERTXT3\r\n\t\t,NULL AS TYPREGULATORY\r\n\t\t,NULL AS LEGALSURFLOC\r\n\t\t,NULL AS WELL_TYPE\r\n\t\t,NULL AS UNITIDPA\r\n\t\t,NULL AS UNITIDREGULATORY\r\n\t\t,NULL AS FIELDCODE\r\n\t\t,NULL AS REPORTING_FACILITY\r\n\t\t,NULL AS RUN_NAME\r\n\t\t,NULL AS NETWORK_NAME\r\n\t\t,NULL AS BATTERY\r\n\t\t,NULL AS FACILITY_NAME\r\n\t\t,NULL AS LAST_PRODUCING_DATE\r\n\t\t,NULL AS NUMBER_OF_DAYS_DOWN\r\n\t\t,NULL AS DOWN_FOR_60_DAYS\r\n\t\t,'FORECAST' AS SOURCE\r\n\tFROM (\r\n\t\tSELECT DISTINCT COREAREA_NAME\r\n\t\t\t,AREA_NAME\r\n\t\t\t,FIRST_VALUE(CC_NUM) OVER (\r\n\t\t\t\tPARTITION BY COREAREA_NAME\r\n\t\t\t\t,AREA_NAME ORDER BY COREAREA_NAME\r\n\t\t\t\t) AS CC_NUM\r\n\t\tFROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_CURRENT\"\r\n\t\t) FCST\r\n\r\n\tUNION ALL\r\n\t\r\n\tSELECT COREAREA_NAME || '-NO AREA_input' AS ENTITY_KEY\r\n\t\t,'FORECAST UNIT' AS UNIT_NAME\r\n\t\t,NULL AS UWI\r\n\t\t,'-1' AS CC_NUM\r\n\t\t,NULL AS LONGITUDE\r\n\t\t,NULL AS LATITUDE\r\n\t\t,NULL AS COMPLETIONIDE\r\n\t\t,NULL AS ON_PROD_DATE\r\n\t\t,NULL AS PV_UNIT_END_DATE\r\n\t\t,NULL AS ZONE\r\n\t\t,NULL AS FORM_AT_TD\r\n\t\t,NULL AS LICENSEE\r\n\t\t,NULL AS LICENSE_NO\r\n\t\t,NULL AS TOTAL_DEPTH\r\n\t\t,NULL AS LICENSE_DATE\r\n\t\t,NULL AS TVD\r\n\t\t,NULL AS STATUS\r\n\t\t,NULL AS WELL_STATUS_DTTM\r\n\t\t,NULL AS EXPIRY_DATE\r\n\t\t,NULL AS PRODUCT\r\n\t\t,NULL AS OIL_OR_CONDENSATE\r\n\t\t,NULL AS COMMINGLED\r\n\t\t,NULL AS METHODPROD\r\n\t\t,NULL AS OPERATOR\r\n\t\t,NULL AS OPERATED\r\n\t\t,COUNTRY_NAME AS DIVISION\r\n\t\t,NULL AS ELEVATION\r\n\t\t,COREAREA_NAME AS DISTRICT\r\n\t\t,'NO AREA' AS AREA\r\n\t\t,NULL AS FIELD\r\n\t\t,PROV_NAME AS STATEPROV\r\n\t\t,NULL AS USERTXT2\r\n\t\t,NULL AS USERTXT3\r\n\t\t,NULL AS TYPREGULATORY\r\n\t\t,NULL AS LEGALSURFLOC\r\n\t\t,NULL AS WELL_TYPE\r\n\t\t,NULL AS UNITIDPA\r\n\t\t,NULL AS UNITIDREGULATORY\r\n\t\t,NULL AS FIELDCODE\r\n\t\t,NULL AS REPORTING_FACILITY\r\n\t\t,NULL AS RUN_NAME\r\n\t\t,NULL AS NETWORK_NAME\r\n\t\t,NULL AS BATTERY\r\n\t\t,NULL AS FACILITY_NAME\r\n\t\t,NULL AS LAST_PRODUCING_DATE\r\n\t\t,NULL AS NUMBER_OF_DAYS_DOWN\r\n\t\t,NULL AS DOWN_FOR_60_DAYS\r\n\t\t,'FRCST COM' AS SOURCE\r\n\tFROM (\r\n\t\tSELECT DISTINCT COUNTRY_NAME, COREAREA_NAME, PROV_NAME\r\n\t\t\t,FIRST_VALUE(CC_NUM) OVER (\r\n\t\t\t\tPARTITION BY COREAREA_NAME\r\n\t\t\t\tORDER BY COREAREA_NAME\r\n\t\t\t\t) AS CC_NUM\r\n\t\tFROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_CURRENT\"\r\nWHERE COUNTRY_NAME = 'CANADA'\r\n\t\t) FCST\r\n\t) SOURCE\r\nLEFT JOIN (\r\n\tSELECT CUR.CC_NUM AS CC_NUM\r\n\t\t,CUR.CC_NAME AS CC_NAME\r\n\t\t,CUR.AREA_NAME AS AREA_NAME\r\n\t\t,CUR.COREAREA_NAME AS COREAREA_NAME\r\n\t\t,CUR.PROV_NAME AS PROV_NAME\r\n\t\t,CUR.COUNTRY_NAME AS COUNTRY_NAME\r\n\t\t,CUR.CC_CORP AS CC_CORP\r\n\t\t,CUR.ROUTE \r\n\t\t,CUR.FOREMAN\r\n\t\t,CUR.PLAY\r\n\t\t,CUR.FACILITY\r\n\t\t,CUR.SALES_POINT\r\n\t\t,CUR.PRODUCTION_ENGINEER\r\n\t\t,CUR.EXPLOITATION_ENGINEER\r\n\t\t,CUR.METER_STATION\r\n\t\t,CUR.BUDGET_YEAR\r\n\t\t,CUR.LICENSEE_OPERATOR\r\n\t\t,CUR.PHYSICAL_OPERATOR\r\n\t\t,CUR.ACQUISITION\r\n\t\t,CUR.BU_CODE\r\n\t\t,CUR.BU_DESC\r\n\t\t,CUR.BU_SF_ROLE\r\n\t\t,PRE.CC_NAME AS PRE_CC_NAME\r\n\t\t,PRE.AREA_NAME AS PRE_AREA_NAME\r\n\t\t,PRE.COREAREA_NAME AS PRE_COREAREA_NAME\r\n\t\t,PRE.PROV_NAME AS PRE_PROV_NAME\r\n\t\t,PRE.COUNTRY_NAME AS PRE_COUNTRY_NAME\r\n\t\t,PRE.CC_CORP AS PRE_CC_CORP\r\n\t\t,PRE.LICENSEE_OPERATOR AS PRE_LICENSEE_OPERATOR\r\n\t\t,PRE.PHYSICAL_OPERATOR AS PRE_PHYSICAL_OPERATOR\r\n\tFROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_CURRENT\" CUR\r\n      JOIN (SELECT MAX(DIM_CC_CORP_HIER_CURRENT_KEY) AS MAX_KEY, CC_NUM FROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_CURRENT\" GROUP BY CC_NUM) K ON CUR.DIM_CC_CORP_HIER_CURRENT_KEY = K.MAX_KEY\r\n\tLEFT JOIN (\r\n      SELECT PRE.*\r\n      FROM \"WS_EDW\".\"DIM_LO_CC_CORP_HIER_PREVIOUS\" PRE \r\n      JOIN (SELECT MAX(DIM_CC_CORP_HIER_PREVIOUS_KEY) AS MAX_KEY, CC_NUM FROM
