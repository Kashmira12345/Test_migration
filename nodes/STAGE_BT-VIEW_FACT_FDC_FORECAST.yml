    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FACT_FDC_FORECAST] AS\r\n\r\nSELECT W.COREAREA_NAME || '-' || W.AREA_NAME || '_input' AS ENTITY_KEY\r\n\t,'WORKING_FORECAST' AS SCENARIO_KEY\r\n\t,P.GROSS_NET_KEY\r\n\t,P.ACTIVITY_DATE_KEY\r\n\t,P.ACTIVITY_DATE\r\n\t,'-1' AS NORMALIZED_DATE_KEY\r\n\t,'-1' AS PRODUCING_DATE_KEY\r\n\t,'-1' AS ON_PROD_DATE_KEY\r\n\t,'-1' AS CC_NUM\r\n\t,SUM(P.OIL_METRIC) AS OIL_METRIC\r\n\t,SUM(P.OIL_IMPERIAL) AS OIL_IMPERIAL\r\n\t,SUM(P.OIL_BOE) AS OIL_BOE\r\n\t,SUM(P.CONDENSATE_METRIC) AS CONDENSATE_METRIC\r\n\t,SUM(P.CONDENSATE_IMPERIAL) AS CONDENSATE_IMPERIAL\r\n\t,SUM(P.CONDENSATE_BOE) AS CONDENSATE_BOE\r\n\t,SUM(P.NGL_METRIC) AS NGL_METRIC\r\n\t,SUM(P.NGL_IMPERIAL) AS NGL_IMPERIAL\r\n\t,SUM(P.NGL_BOE) AS NGL_BOE\r\n\t,SUM(P.GAS_METRIC) AS GAS_METRIC\r\n\t,SUM(P.GAS_IMPERIAL) AS GAS_IMPERIAL\r\n\t,SUM(P.GAS_BOE) AS GAS_BOE\r\n\t,NULL AS RAW_GAS_METRIC\r\n\t,NULL AS RAW_GAS_IMPERIAL\r\n\t,NULL AS RAW_GAS_BOE\r\n\t,NULL AS WATER_METRIC\r\n\t,NULL AS WATER_IMPERIAL\r\n\t,NULL AS WATER_BOE\r\n\t,SUM(P.ETHANE_METRIC) AS ETHANE_METRIC\r\n\t,SUM(P.ETHANE_IMPERIAL) AS ETHANE_IMPERIAL\r\n\t,SUM(P.ETHANE_BOE) AS ETHANE_BOE\r\n\t,SUM(P.PROPANE_METRIC) AS PROPANE_METRIC\r\n\t,SUM(P.PROPANE_IMPERIAL) AS PROPANE_IMPERIAL\r\n\t,SUM(P.PROPANE_BOE) AS PROPANE_BOE\r\n\t,SUM(P.BUTANE_METRIC) AS BUTANE_METRIC\r\n\t,SUM(P.BUTANE_IMPERIAL) AS BUTANE_IMPERIAL\r\n\t,SUM(P.BUTANE_BOE) AS BUTANE_BOE\r\n\t,SUM(P.PENTANE_METRIC) AS PENTANE_METRIC\r\n\t,SUM(P.PENTANE_IMPERIAL) AS PENTANE_IMPERIAL\r\n\t,SUM(P.PENTANE_BOE) AS PENTANE_BOE\r\n\t,NULL AS COMMENT_TYPE\r\n\t,NULL AS COMMENT\r\nFROM \"WS_STAGE_BT\".\"VIEW_FACT_FDC_PRODVIEW_FINAL\" P\r\nJOIN \"WS_EDW\".\"DIM_FDC_WELL\" W ON P.ENTITY_KEY = W.DIM_WELL_KEY AND W.COUNTRY_NAME = 'CANADA'\r\nWHERE P.ACTIVITY_DATE BETWEEN DATE_TRUNC(MONTH, DATEADD(MONTH, -3, GETDATE()))\r\n\t\tAND PREVIOUS_DAY(DATEADD(DAY, -2, GETDATE()), 'Friday')\r\n\tAND P.SCENARIO_KEY = 'pv_sales_alloc_blend'\r\nGROUP BY W.COREAREA_NAME\r\n\t,W.AREA_NAME\r\n\t,P.GROSS_NET_KEY\r\n\t,P.ACTIVITY_DATE_KEY\r\n\t,P.ACTIVITY_DATE"
