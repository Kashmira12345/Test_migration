    sourceMapping:
      - aliases:
          DIM_FDC_ACTIVITY_PERIOD_DATE: 97581cd4-7212-7685-2fd9-00c0933204ba
          ODS_GDC_PDEN_VOL_BY_MONTH: 2ced676c-bf87-de61-7c98-bef8279befca
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FACT_FDC_GDC] AS\r\nSELECT\r\n    F.UWI AS ENTITY_KEY,\r\n    'GDC' AS SCENARIO_KEY,\r\n    G_N.GN AS GROSS_NET_KEY,\r\n    TO_VARCHAR(D.FULL_DATE, 'YYYYMMDD') AS ACTIVITY_DATE_KEY,\r\n    D.FULL_DATE AS ACTIVITY_DATE,\r\n    '-1' AS NORMAILZED_DATE_KEY,\r\n    '-1' AS PRODUCING_DATE_KEY,\r\n    '-1' AS ON_PROD_DATE_KEY,\r\n    W.CC_NUM AS CC_NUM,\r\n    NULL AS HOURS_ON,\r\n    NULL AS HOURS_DOWN,\r\n    NULL AS HCLIQ_METRIC,\r\n    \"'OIL'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS AS OIL_METRIC,\r\n    \"'OIL'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS OIL_IMPERIAL,\r\n    \"'OIL'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS OIL_BOE,\r\n    \"'COND'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS AS CONDENSATE_METRIC,\r\n    \"'COND'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS CONDENSATE_IMPERIAL,\r\n    \"'COND'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_HCLIQ_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS CONDENSATE_BOE,\r\n    NULL AS NGL_METRIC,\r\n    NULL AS NGL_IMPERIAL,\r\n    NULL AS NGL_BOE,\r\n    \"'GAS'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_GAS_WI ELSE 1 END / D.NUM_OF_DAYS AS GAS_METRIC,\r\n    \"'GAS'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_GAS_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.GAS_SI_TO_IMP_CONV_FACTOR, 1) AS GAS_IMPERIAL,\r\n    \"'GAS'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_GAS_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.GAS_BOE_THERMAL, 1) AS GAS_BOE,\r\n    NULL AS GAS_NM3,\r\n    \"'WATER'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_WATER_WI ELSE 1 END / D.NUM_OF_DAYS AS WATER_METRIC,\r\n    \"'WATER'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_WATER_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS WATER_IMPERIAL,\r\n    \"'WATER'\" * CASE WHEN G_N.GN = 2 THEN W.LATEST_WATER_WI ELSE 1 END / D.NUM_OF_DAYS * NVL(CF.LIQUID_BOE_THERMAL, 1) AS WATER_BOE,\r\n    NULL AS SAND_METRIC,\r\n    NULL AS INJECTED_GAS_METRIC,\r\n    NULL AS INJECTED_HCLIQ_METRIC,\r\n    NULL AS INJECTED_SAND_METRIC,\r\n    NULL AS INJECTED_WATER_METRIC,\r\n    NULL AS RECOVERED_GAS_METRIC,\r\n    NULL AS RECOVERED_HCLIQ_METRIC,\r\n    NULL AS RECOVERED_SAND_METRIC,\r\n    NULL AS RECOVERED_WATER_METRIC,\r\n    NULL AS REMAINING_LIFT_GAS_METRIC,\r\n    NULL AS REMAINING_LOAD_HCLIQ_METRIC,\r\n    NULL AS REMAINING_LOAD_WATER_METRIC,\r\n    NULL AS REMAINING_LOAD_SAND_METRIC,\r\n    NULL AS METHANE_METRIC,\r\n    NULL AS METHANE_IMPERIAL,\r\n    NULL AS METHANE_BOE,\r\n    NULL AS ETHANE_METRIC,\r\n    NULL AS ETHANE_IMPERIAL,\r\n    NULL AS ETHANE_BOE,\r\n    NULL AS PROPANE_METRIC,\r\n    NULL AS PROPANE_IMPERIAL,\r\n    NULL AS PROPANE_BOE,\r\n    NULL AS BUTANE_METRIC,\r\n    NULL AS BUTANE_IMPERIAL,\r\n    NULL AS BUTANE_BOE,\r\n    NULL AS PENTANE_METRIC,\r\n    NULL AS PENTANE_IMPERIAL,\r\n    NULL AS PENTANE_BOE,\r\n    NULL AS FLAREGAS_METRIC,\r\n    NULL AS VENTGAS_METRIC,\r\n    NULL AS FUELGAS_METRIC,\r\n    W.LATEST_GAS_WI AS WIGAS,\r\n    W.LATEST_HCLIQ_WI AS WIHCLIQ,\r\n    W.LATEST_WATER_WI AS WIWATER,\r\n    W.LATEST_SAND_WI AS WISAND,\r\n    NULL AS BAT_PRO_GAS_METRIC,\r\n    NULL AS BAT_PRO_GAS_IMPERIAL,\r\n    NULL AS BAT_PRO_GAS_BOE,\r\n    NULL AS INJECTED_LIFT_GAS_METRIC,\r\n    NULL AS INJECTED_LIFT_GAS_IMPERIAL,\r\n    NULL AS INJECTED_LIFT_GAS_BOE\r\nFROM\r\n    (\r\n        SELECT\r\n            BA_NAME,\r\n            UWI,\r\n            TO_DATE(\r\n                YEAR || '-' || MONTH(TO_DATE(MONTH, 'MON')) || '-1'\r\n            ) AS ACTIVITY_PERIOD,\r\n            MONTH,\r\n            YEAR,\r\n            UPPER(PRODUCT_TYPE) AS PRODUCT_TYPE,\r\n            AMOUNT\r\n        FROM\r\n            (\r\n                SELECT\r\n                    PDEN.BA_NAME,\r\n                    PDEN.GSL_UWI AS UWI,CASE\r\n                        PRODUCT_TYPE\r\n                   \
            \     WHEN 'OIL' THEN 'OIL'\r\n                        WHEN 'CND' THEN 'COND'\r\n                        WHEN 'GAS' THEN 'GAS'\r\n                        WHEN 'WTR' THEN 'WATER'\r\n                    END AS PRODUCT_TYPE,\r\n                    YEAR,\r\n                    JAN_VOLUME AS JAN,\r\n                    FEB_VOLUME AS FEB,\r\n                    MAR_VOLUME AS MAR,\r\n                    APR_VOLUME AS APR,\r\n                    MAY_VOLUME AS MAY,\r\n                    JUN_VOLUME AS JUN,\r\n                    JUL_VOLUME AS JUL,\r\n                    AUG_VOLUME AS AUG,\r\n                    SEP_VOLUME AS SEP,\r\n                    OCT_VOLUME AS OCT,\r\n                    NOV_VOLUME AS NOV,\r\n                    DEC_VOLUME AS DEC\r\n                FROM\r\n                    (\r\n                        SELECT\r\n                            BA.BA_NAME,\r\n                            V.GSL_UWI,\r\n                            V.GSL_OLD_UWI,\r\n                            V.PDEN_ID,\r\n                            V.PDEN_TYPE,\r\n                            V.PRODUCT_TYPE,\r\n                            V.YEAR,\r\n                            V.JAN_VOLUME,\r\n                            V.FEB_VOLUME,\r\n                            V.MAR_VOLUME,\r\n                            V.APR_VOLUME,\r\n                            V.MAY_VOLUME,\r\n                            V.JUN_VOLUME,\r\n                            V.JUL_VOLUME,\r\n                            V.AUG_VOLUME,\r\n                            V.SEP_VOLUME,\r\n                            V.OCT_VOLUME,\r\n                            V.NOV_VOLUME,\r\n                            V.DEC_VOLUME\r\n                        FROM\r\n                            WS_DATA_STORE.ODS_GDC_PDEN_VOL_BY_MONTH V\r\n                            LEFT JOIN WS_DATA_STORE.ODS_GDC_PDEN PDEN ON V.PDEN_ID = PDEN.PDEN_ID\r\n                            AND PDEN.DSS_CURRENT_FLAG = 'Y'\r\n                            AND PDEN.DSS_DELETE_FLAG != 'Y'\r\n                            LEFT JOIN WS_DATA_STORE.ODS_GDC_BUSINESS_ASSOCIATE BA ON PDEN.CURRENT_OPERATOR = BA.BUSINESS_ASSOCIATE\r\n                            AND BA.DSS_CURRENT_FLAG = 'Y'\r\n                            AND BA.DSS_DELETE_FLAG != 'Y'\r\n                            JOIN WS_STAGE_BT.STAGE_GDC_ENTITIES STAGE_GDC_ENTITIES ON V.GSL_UWI = STAGE_GDC_ENTITIES.ENTITY_KEY\r\n                        WHERE\r\n                            V.ACTIVITY_TYPE = 'PRODUCTION'\r\n                            AND V.PRODUCT_TYPE IN ('OIL','CND','GAS','WTR')\r\n                            AND V.DSS_CURRENT_FLAG = 'Y'\r\n                            AND V.DSS_DELETE_FLAG != 'Y'\r\n                    ) PDEN\r\n            ) S UNPIVOT(\r\n                AMOUNT FOR MONTH IN (\r\n                    JAN,\r\n                    FEB,\r\n                    MAR,\r\n                    APR,\r\n                    MAY,\r\n                    JUN,\r\n                    JUL,\r\n                    AUG,\r\n                    SEP,\r\n                    OCT,\r\n                    NOV,\r\n                    DEC\r\n                )\r\n            ) AMT\r\n    ) SD PIVOT(\r\n        SUM(AMOUNT) FOR PRODUCT_TYPE IN (\r\n            'WATER',\r\n            'GAS',\r\n            'OIL',\r\n            'COND'\r\n        )\r\n    ) F\r\n    LEFT JOIN WS_STAGE_BT.STAGE_PRODVIEW_WELLS W ON F.UWI = W.UWI\r\n    CROSS JOIN (SELECT 1 AS GN UNION SELECT 2 AS GN) G_N\r\n    JOIN (\r\n        SELECT\r\n            DIM_ACTIVITY_PERIOD_DATE_KEY AS ACTIVITY_DATE_KEY,\r\n            FULL_DATE,\r\n            TO_CHAR(DATE_TRUNC(MONTH, FULL_DATE), 'YYYYMMDD') AS FIRST_DATE_KEY,\r\n            TO_NUMBER(DAY(LAST_DAY(FULL_DATE))) AS NUM_OF_DAYS\r\n        FROM\r\n            WS_EDW.DIM_FDC_ACTIVITY_PERIOD_DATE\r\n    ) D ON TO_CHAR(DATE_TRUNC(MONTH, F.ACTIVITY_PERIOD), 'YYYYMMDD') = D.FIRST_DATE_KEY\r\n    JOIN (\r\n        SELECT\r\n            DISTINCT MAX(\r\n                CASE\r\n                    WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN SI_TO_IMP_CONV_FACTOR\r\
            \n                END\r\n            ) AS GAS_SI_TO_IMP_CONV_FACTOR,\r\n            MAX(\r\n                CASE\r\n                    WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL\r\n                END\r\n            ) AS GAS_BOE_THERMAL,\r\n            MAX(\r\n                CASE\r\n                    WHEN PROD_CODE NOT IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL\r\n                END\r\n            ) AS LIQUID_BOE_THERMAL\r\n        FROM\r\n            WS_STAGE_BT.STAGE_FIN_SAP_PRODUCT_TYPE\r\n    ) CF ON 1 = 1"
        dependencies:
          - locationName: EDW
            nodeName: DIM_FDC_ACTIVITY_PERIOD_DATE
          - locationName: DATA_STORE
            nodeName: ODS_GDC_PDEN_VOL_BY_MONTH
        join:
          joinCondition: |-
            FROM {{ ref_no_link('STAGE_BT','VIEW_FACT_FDC_GDC') }} "VIEW_FACT_FDC_GDC"
        name: VIEW_FACT_FDC_GDC
        noLinkRefs: []
