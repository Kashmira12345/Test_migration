        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FACT_FDC_PRODVIEW_ALLOCATED] AS\n\r\nSELECT ENTITY_KEY\r\n\t,'pv_allocated' AS SCENARIO_KEY\r\n\t,GROSS_NET_KEY\r\n\t,ACTIVITY_DATE_KEY\r\n\t,ACTIVITY_DATE\r\n\t,NORMALIZED_DATE_KEY\r\n\t,'-1' AS PRODUCING_DATE_KEY\r\n\t,ON_PROD_DATE_KEY\r\n\t,CC_NUM\r\n\t,HOURS_ON\r\n\t,HOURS_DOWN\r\n\t,HCLIQ_METRIC\r\n\t-- METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN OIL_METRIC * WIHCLIQ ELSE OIL_METRIC END AS OIL_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN CONDENSATE_METRIC * WIHCLIQ ELSE CONDENSATE_METRIC END AS CONDENSATE_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN NGL_METRIC * WIHCLIQ ELSE NGL_METRIC END AS NGL_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN GAS_METRIC * WIGAS ELSE GAS_METRIC END AS GAS_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN WATER_METRIC * WIWATER ELSE WATER_METRIC END AS WATER_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN SAND_METRIC * WISAND ELSE SAND_METRIC END AS SAND_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_GAS_METRIC * WIGAS ELSE INJECTED_GAS_METRIC END AS INJECTED_GAS_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_HCLIQ_METRIC * WIHCLIQ ELSE INJECTED_HCLIQ_METRIC END AS INJECTED_HCLIQ_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_SAND_METRIC * WISAND ELSE INJECTED_SAND_METRIC END AS INJECTED_SAND_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_WATER_METRIC * WIWATER ELSE INJECTED_WATER_METRIC END AS INJECTED_WATER_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_GAS_METRIC * WIGAS ELSE RECOVERED_GAS_METRIC END AS RECOVERED_GAS_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_HCLIQ_METRIC * WIHCLIQ ELSE RECOVERED_HCLIQ_METRIC END AS RECOVERED_HCLIQ_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_SAND_METRIC * WISAND ELSE RECOVERED_SAND_METRIC END AS RECOVERED_SAND_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_WATER_METRIC * WIWATER ELSE RECOVERED_WATER_METRIC END AS RECOVERED_WATER_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LIFT_GAS_METRIC * WIGAS ELSE REMAINING_LIFT_GAS_METRIC END AS REMAINING_LIFT_GAS_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_HCLIQ_METRIC * WIHCLIQ ELSE REMAINING_LOAD_HCLIQ_METRIC END AS REMAINING_LOAD_HCLIQ_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_SAND_METRIC * WISAND ELSE REMAINING_LOAD_SAND_METRIC END AS REMAINING_LOAD_SAND_METRIC\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_WATER_METRIC * WIWATER ELSE REMAINING_LOAD_WATER_METRIC END AS REMAINING_LOAD_WATER_METRIC\r\n\t,NULL AS METHANE_METRIC\r\n\t,NULL AS ETHANE_METRIC\r\n\t,NULL AS PROPANE_METRIC\r\n\t,NULL AS BUTANE_METRIC\r\n\t,NULL AS PENTANE_METRIC\t\r\n\t-- IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN OIL_IMPERIAL * WIHCLIQ ELSE OIL_IMPERIAL END AS OIL_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN CONDENSATE_IMPERIAL * WIHCLIQ ELSE CONDENSATE_IMPERIAL END AS CONDENSATE_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN NGL_IMPERIAL * WIHCLIQ ELSE NGL_IMPERIAL END AS NGL_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN GAS_IMPERIAL * WIGAS ELSE GAS_IMPERIAL END AS GAS_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN WATER_IMPERIAL * WIWATER ELSE WATER_IMPERIAL END AS WATER_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN SAND_IMPERIAL * WISAND ELSE SAND_IMPERIAL END AS SAND_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_GAS_IMPERIAL * WIGAS ELSE INJECTED_GAS_IMPERIAL END AS INJECTED_GAS_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_HCLIQ_IMPERIAL * WIHCLIQ ELSE INJECTED_HCLIQ_IMPERIAL END AS INJECTED_HCLIQ_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_WATER_IMPERIAL * WIWATER ELSE INJECTED_WATER_IMPERIAL END AS INJECTED_WATER_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_GAS_IMPERIAL * WIGAS ELSE RECOVERED_GAS_IMPERIAL END AS RECOVERED_GAS_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_HCLIQ_IMPERIAL * WIHCLIQ ELSE RECOVERED_HCLIQ_IMPERIAL END AS RECOVERED_HCLIQ_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_SAND_IMPERIAL * WISAND ELSE RECOVERED_SAND_IMPERIAL END AS RECOVERED_SAND_IMPERIAL\r\
            \n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_WATER_IMPERIAL * WIWATER ELSE RECOVERED_WATER_IMPERIAL END AS RECOVERED_WATER_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LIFT_GAS_IMPERIAL * WIGAS ELSE REMAINING_LIFT_GAS_IMPERIAL END AS REMAINING_LIFT_GAS_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_HCLIQ_IMPERIAL * WIHCLIQ ELSE REMAINING_LOAD_HCLIQ_IMPERIAL END AS REMAINING_LOAD_HCLIQ_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_SAND_IMPERIAL * WISAND ELSE REMAINING_LOAD_SAND_IMPERIAL END AS REMAINING_LOAD_SAND_IMPERIAL\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_WATER_IMPERIAL * WIWATER ELSE REMAINING_LOAD_WATER_IMPERIAL END AS REMAINING_LOAD_WATER_IMPERIAL\r\n\t,NULL AS METHANE_IMPERIAL\r\n\t,NULL AS ETHANE_IMPERIAL\r\n\t,NULL AS PROPANE_IMPERIAL\r\n\t,NULL AS BUTANE_IMPERIAL\r\n\t,NULL AS PENTANE_IMPERIAL\t\r\n\t-- BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN OIL_BOE * WIHCLIQ ELSE OIL_BOE END AS OIL_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN CONDENSATE_BOE * WIHCLIQ ELSE CONDENSATE_BOE END AS CONDENSATE_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN NGL_BOE * WIHCLIQ ELSE NGL_BOE END AS NGL_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN GAS_BOE * WIGAS ELSE GAS_BOE END AS GAS_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN WATER_BOE * WIWATER ELSE WATER_BOE END AS WATER_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN SAND_BOE * WISAND ELSE SAND_BOE END AS SAND_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_GAS_BOE * WIGAS ELSE INJECTED_GAS_BOE END AS INJECTED_GAS_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_HCLIQ_BOE * WIHCLIQ ELSE INJECTED_HCLIQ_BOE END AS INJECTED_HCLIQ_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_SAND_BOE * WISAND ELSE INJECTED_SAND_BOE END AS INJECTED_SAND_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN INJECTED_WATER_BOE * WIWATER ELSE INJECTED_WATER_BOE END AS INJECTED_WATER_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_GAS_BOE * WIGAS ELSE RECOVERED_GAS_BOE END AS RECOVERED_GAS_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_HCLIQ_BOE * WIHCLIQ ELSE RECOVERED_HCLIQ_BOE END AS RECOVERED_HCLIQ_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_SAND_BOE * WISAND ELSE RECOVERED_SAND_BOE END AS RECOVERED_SAND_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN RECOVERED_WATER_BOE * WIWATER ELSE RECOVERED_WATER_BOE END AS RECOVERED_WATER_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LIFT_GAS_BOE * WIGAS ELSE REMAINING_LIFT_GAS_BOE END AS REMAINING_LIFT_GAS_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_HCLIQ_BOE * WIHCLIQ ELSE REMAINING_LOAD_HCLIQ_BOE END AS REMAINING_LOAD_HCLIQ_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_SAND_BOE * WISAND ELSE REMAINING_LOAD_SAND_BOE END AS REMAINING_LOAD_SAND_BOE\r\n\t,CASE WHEN GROSS_NET_KEY = 2 THEN REMAINING_LOAD_WATER_BOE * WIWATER ELSE REMAINING_LOAD_WATER_BOE END AS REMAINING_LOAD_WATER_BOE\r\n\t,NULL AS METHANE_BOE\r\n\t,NULL AS ETHANE_BOE\r\n\t,NULL AS PROPANE_BOE\r\n\t,NULL AS BUTANE_BOE\r\n\t,NULL AS PENTANE_BOE\t\r\nFROM (\r\n\tSELECT PV.IDRECUNIT AS IDRECUNIT\r\n\t\t,PV.IDFLOWNET AS IDFLOWNET\r\n\t\t,W.IDREC AS ENTITY_KEY\r\n\t\t,G_N.GN AS GROSS_NET_KEY\r\n\t\t,TO_VARCHAR(PV.DTTM, 'YYYYMMDD') AS ACTIVITY_DATE_KEY\r\n\t\t,PV.DTTM AS ACTIVITY_DATE\r\n\t\t,CASE \r\n\t\t\tWHEN W.ON_PROD_DATE IS NULL\r\n\t\t\t\tTHEN '-1'\r\n\t\t\tWHEN W.ON_PROD_DATE > PV.DTTM\r\n\t\t\t\tTHEN '-1'\r\n\t\t\tELSE DATEDIFF(DAY, W.ON_PROD_DATE, PV.DTTM) + 1\r\n\t\t\tEND AS NORMALIZED_DATE_KEY\r\n\t\t,COALESCE(TO_VARCHAR(W.ON_PROD_DATE, 'YYYYMMDD'), '-1') AS ON_PROD_DATE_KEY\r\n\t\t,COALESCE(W.CC_NUM, '-1') AS CC_NUM\r\n\t\t,PV.DURDOWN * 24 AS HOURS_DOWN\r\n\t\t,PV.DUROP * 24 AS HOURS_ON\r\n\t\t,PV.VOLNEWPRODALLOCHCLIQ AS HCLIQ_METRIC\r\n\t\t,PV.VOLNEWPRODALLOCHCLIQ * NVL(CF.LIQUID_BOE_THERMAL, 1) AS HCLIQ_IMPERIAL\r\n\t\t,PV.VOLNEWPRODALLOCHCLIQ * NVL(CF.LIQUID_BOE_THERMAL, 1) AS HCLIQ_BOE\r\n\t\t,PV.VOLNEWPRODALLOCOIL AS OIL_METRIC\r\n\t\t,PV.VOLNEWPRODALLOCOIL * NVL(CF.LIQUID_BOE_T