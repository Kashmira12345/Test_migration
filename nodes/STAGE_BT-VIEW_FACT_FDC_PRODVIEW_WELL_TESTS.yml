          ODS_PVIEW_PVT_PVUNITEQUIP: b06eea7c-4a04-b0e4-9fa8-903dc01d0d9b
          ODS_PVIEW_PVT_PVUNITTESTSEP: 44da84c4-b381-e7fa-c4b7-3a36a787ff7f
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FACT_FDC_PRODVIEW_WELL_TESTS] AS\r\n\r\nWITH EQUIPMENT AS (\r\n    SELECT \r\n        E.NAME\r\n        ,E.IDRECPARENT\r\n        ,E.TYP\r\n        ,E.MAKE\r\n        ,E.MODEL\r\n        ,E.IMPORTID1 AS JSD\r\n        ,E.IMPORTID2 AS JACK_RATIO\r\n        ,E.IMPORTTYP1 AS BELT\r\n        ,E.EXPORTID2 AS MOTORHP\r\n        ,E.IMPORTTYP2 AS RPM\r\n        ,E.EXPORTID1 AS MSD\r\n        ,E.COM AS CT\r\n        ,E.EXPORTTYP1 AS CM\r\n        ,E.EXPORTTYP2 AS CMOD\r\n        ,E.OTHERID AS CTYP\r\n    FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITEQUIP E\r\n    WHERE E.NAME = 'Surface Equipment'\r\n    AND E.DSS_CURRENT_FLAG = 'Y'\r\n    AND E.DSS_DELETE_FLAG != 'Y'\r\n)\r\n,PUMPS AS (\r\n    SELECT\r\n        RE.IDREC\r\n        ,RE.IDRECPARENT\r\n        ,RE.STROKELENGTH * 39.3700787 AS STROKE_LENGTH\r\n        ,RE.SPM\r\n        ,R.PUMPDIAMETER * 39.3700787 AS PUMP_DIAMETER\r\n        ,P.DTTMSTART AS BH_PUMP_INSTALL_DATE\r\n    FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPPUMPRODENTRY RE\r\n    JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPPUMPROD R ON R.IDREC = RE.IDRECPARENT AND R.DSS_CURRENT_FLAG = 'Y' AND R.DSS_DELETE_FLAG != 'Y'\r\n    JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPPUMP P ON R.IDRECPARENT = P.IDREC AND P.DSS_CURRENT_FLAG = 'Y' AND P.DSS_DELETE_FLAG != 'Y'\r\n    WHERE RE.DSS_CURRENT_FLAG = 'Y'\r\n    AND RE.DSS_DELETE_FLAG != 'Y'\r\n)\r\n,TESTS AS (\r\n    SELECT\r\n        T.RATEFLUIDTOTALCALC AS TOTAL_FLUID_RATE_METRIC\r\n        ,T.DTTM AS TEST_DATE\r\n        ,T.IDRECPARENT AS TEST_PARENT\r\n        ,T.IDREC AS TEST_IDREC\r\n        ,T.RATEHCLIQCALC AS RATE_OIL_METRIC\r\n        ,T.RATEWATERCALC AS RATE_WATER_METRIC\r\n        ,T.RATEPRODGASCALC / 1000 AS RATE_GAS_METRIC\r\n        ,T.BSWTOTALCALC AS TOTAL_BSW\r\n        ,T.GORCALC AS GOR\r\n        ,T.IDRECSEP AS TESTSEP_IDREC\r\n        ,ROW_NUMBER() OVER (PARTITION BY T.IDRECPARENT ORDER BY T.DTTM ASC) AS TEST_NUMBER\r\n        ,ROW_NUMBER() OVER (PARTITION BY T.IDRECPARENT ORDER BY T.DTTM DESC) AS TEST_NUMBER_DESC\r\n    FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPTEST T\r\n    WHERE T.DSS_CURRENT_FLAG = 'Y'\r\n    AND T.DSS_DELETE_FLAG != 'Y'\r\n    AND NVL(T.DONTUSE, 0) != 1\r\n)\r\n, LAST_DT AS (\r\n    SELECT * FROM (\r\n        SELECT \r\n            DT.IDREC AS DT_IDREC\r\n            ,P.IDRECUNIT AS DT_IDRECUNIT\r\n            ,DT.DTTMSTART\r\n            ,DT.DTTMEND\r\n            ,DT.CODEDOWNTM3\r\n            ,ROW_NUMBER() OVER (PARTITION BY P.IDRECUNIT ORDER BY DT.DTTMSTART DESC) AS R\r\n        FROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPDOWNTM DT\r\n        JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY P ON DT.IDREC = P.IDRECDOWNTIME \r\n        AND P.DSS_CURRENT_FLAG = 'Y' AND P.DSS_DELETE_FLAG != 'Y'\r\n        WHERE DT.DSS_CURRENT_FLAG = 'Y' AND DT.DSS_DELETE_FLAG != 'Y'\r\n    )\r\n    WHERE R = 1\r\n)\r\n\r\nSELECT \r\n    U.IDREC AS DIM_WELL_KEY\r\n    ,TO_VARCHAR(P.DTTM, 'YYYYMMDD') AS DIM_ACTIVITY_PERIOD_DATE_KEY\r\n    ,'1' AS DIM_GROSS_NET_KEY\r\n    ,'pv_test' AS DIM_SCENARIO_KEY\r\n    ,P.DTTM AS ACTIVITY_DATE\r\n    ,TO_VARCHAR(C.DTTMONPROD, 'YYYYMMDD') AS DIM_ON_PROD_DATE_KEY\r\n    ,TS.NAME AS SEPARATOR_NAME\r\n    ,E.TYP AS TYPE \r\n    ,E.MAKE AS JACK_MAKE \r\n    ,E.MODEL AS JACK_MODEL \r\n    ,E.JACK_RATIO \r\n    ,E.JSD AS JACK_SHEAVE_DIAM \r\n    ,E.MSD AS MOTOR_SHEAVE_DIAM \r\n    ,E.BELT \r\n    ,E.MOTORHP AS ALL_HP \r\n    ,E.RPM AS ALL_RPM \r\n    ,E.CM AS CONTROLLER_MAKE \r\n    ,E.CMOD AS CONTROLLER_MODEL \r\n    ,E.CTYP AS CONTROLLER_TYPE \r\n    ,PM.BH_PUMP_INSTALL_DATE AS INSTALL_DATE\r\n    ,PM.PUMP_DIAMETER AS PUMP_SIZE\r\n    ,PM.STROKE_LENGTH AS CURRENT_STROKE\r\n    ,PM.SPM AS CURRENT_SPM\r\n    ,T.TEST_DATE\r\n    ,T.RATE_OIL_METRIC\r\n    ,T.RATE_WATER_METRIC\r\n    ,T.TOTAL_FLUID_RATE_METRIC\r\n    ,T.RATE_GAS_METRIC\r\n    ,T.TOTAL_BSW\r\n    ,T.GOR\r\n    ,NVL(T.RATE_OIL_METRIC, 0) * CF.LIQUID_BOE_THERMAL + NVL(T.RATE_GAS_METRIC, 0) / 1000 * CF.GAS_BOE_THERMAL AS TEST_BOE\r\n    ,CASE \r\n        WHEN LOWER(P.IDRECPUMPENTRYTK) = 'pvunitcomppumpespentry'
            THEN 'ESP'\r\n        WHEN LOWER(P.IDRECPUMPENTRYTK) = 'pvunitcomppumprodentry' THEN 'Rod Pump'\r\n        WHEN LOWER(P.IDRECPUMPENTRYTK) = 'pvunitcomppumppcpentry' THEN 'PCP'\r\n        ELSE NULL\r\n        END AS BHP_PUMP_TYPE\r\n    ,P.PUMPEFF\r\n    ,FL.DTTM AS FL_DATE\r\n    ,FL.JOINTSTOFLUID AS JTF\r\n    ,FL.JOINTSINHOLE AS JIH\r\n    ,S.STATUS\r\n    ,DT.CODEDOWNTM3\r\n    ,P.DURDOWN * 24 AS HOURS_DOWN\r\n    ,DT.DTTMSTART AS DT_FIRST_DAY\r\n    ,DT.DTTMEND AS DT_LAST_DAY\r\n    ,PA.PRESTUB AS TUBING_PRESSURE\r\n    ,PA.PRESCAS AS CASING_PRESSURE\r\n    ,T.TEST_NUMBER\r\n    ,CASE WHEN T.TEST_NUMBER_DESC = '1' THEN 'Y' ELSE 'N' END AS LAST_TEST\r\nFROM WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY P\r\nJOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNIT U ON U.IDREC = P.IDRECUNIT AND U.DSS_CURRENT_FLAG = 'Y' AND U.DSS_DELETE_FLAG != 'Y'\r\nJOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVFLOWNETHEADER H ON H.IDFLOWNET = P.IDFLOWNET AND H.DSS_CURRENT_FLAG = 'Y' AND H.DSS_DELETE_FLAG != 'Y'\r\nJOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMP C ON C.IDREC = P.IDRECCOMP AND C.DSS_CURRENT_FLAG = 'Y' AND C.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVFACILITY F ON F.IDREC = P.IDRECFACILITY AND F.DSS_CURRENT_FLAG = 'Y' AND F.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVROUTESETROUTE R ON R.IDREC = U.IDRECROUTESETROUTECALC AND R.DSS_CURRENT_FLAG = 'Y' AND R.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN EQUIPMENT E ON E.IDRECPARENT = P.IDRECUNIT\r\nLEFT JOIN PUMPS PM ON PM.IDREC = P.IDRECPUMPENTRY\r\nRIGHT JOIN TESTS T ON T.TEST_IDREC = P.IDRECTEST AND P.DTTM = T.TEST_DATE\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITTESTSEP TS ON TS.IDREC = T.TESTSEP_IDREC AND TS.DSS_CURRENT_FLAG = 'Y' AND TS.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPFLUIDLEVEL FL ON FL.IDREC = P.IDRECFLUIDLEVEL AND FL.DSS_CURRENT_FLAG = 'Y' AND FL.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPSTATUS S ON S.IDREC = P.IDRECSTATUS AND S.DSS_CURRENT_FLAG = 'Y' AND S.DSS_DELETE_FLAG != 'Y'\r\nLEFT JOIN LAST_DT DT ON P.IDRECUNIT = DT.DT_IDRECUNIT\r\nLEFT JOIN WS_DATA_STORE.ODS_PVIEW_PVT_PVUNITCOMPPARAM PA ON PA.IDREC = P.IDRECPARAM AND PA.DSS_CURRENT_FLAG = 'Y' AND PA.DSS_DELETE_FLAG != 'Y'\r\nJOIN (\r\nSELECT DISTINCT\r\n  MAX(CASE WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN SI_TO_IMP_CONV_FACTOR END) AS GAS_SI_TO_IMP_CONV_FACTOR\r\n  , MAX(CASE WHEN PROD_CODE IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL END) AS GAS_BOE_THERMAL\r\n  , MAX(CASE WHEN PROD_CODE NOT IN ('GAS', 'GCOMP', 'GGATH', 'GPROC') THEN BOE_THERMAL END) AS LIQUID_BOE_THERMAL\r\nFROM WS_STAGE_BT.STAGE_FIN_SAP_PRODUCT_TYPE\r\n) CF ON 1 = 1\r\nWHERE P.DSS_CURRENT_FLAG = 'Y' AND P.DSS_DELETE_FLAG != 'Y'"
        dependencies:
