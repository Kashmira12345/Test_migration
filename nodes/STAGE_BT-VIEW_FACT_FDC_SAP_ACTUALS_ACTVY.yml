    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FACT_FDC_SAP_ACTUALS_ACTVY] AS\n\nWITH PRODUCTS AS (\n    SELECT '20.1' AS GLOP_LINE_NO, 'OIL' AS PRODUCT\n    UNION ALL\n    SELECT '20.2' AS GLOP_LINE_NO, 'CON' AS PRODUCT\n    UNION ALL\n    SELECT '20.3' AS GLOP_LINE_NO, 'NGL' AS PRODUCT\n    UNION ALL\n    SELECT '20.4' AS GLOP_LINE_NO, 'GAS' AS PRODUCT\n),\nVOL AS (\n    SELECT \n        DD.DIM_DATE_KEY AS DIM_ACTVY_PER_DATE_KEY,\n        DD.FULL_DATE AS DIM_ACTVY_PER_DATE,\n        F.DIM_COST_CENTER_KEY,\n        F.DIM_PRODUCT_TYPE_KEY,\n        CASE WHEN F.GROSS_OR_NET_CODE = 'G' THEN 1 ELSE 2 END AS GROSS_NET_KEY,\n        SUM(F.LI_VOL_M3) / DAY(LAST_DAY(DD.FULL_DATE)) * -1  AS VOL,\n        CASE WHEN PROD.PROD_CODE IN ('BUT', 'ETH', 'H20', 'PRO', 'PEN')\n            THEN\n                PROD.PROD_CODE || '_METRIC'\n            ELSE\n                P.PRODUCT || '_METRIC' END AS PRODUCT,\n        CC.CC_NUM AS CC_NUM\n    FROM\n        WS_EDW.FACT_LO_SAP_ACTUALS F\n        LEFT JOIN WS_EDW.DIM_LO_SAP_PRODUCT_TYPE PROD ON F.DIM_PRODUCT_TYPE_KEY = PROD.DIM_PRODUCT_TYPE_KEY\n        JOIN WS_EDW.DIM_LO_SAP_COST_CENTER CC ON F.DIM_COST_CENTER_KEY = CC.DIM_COST_CENTER_KEY\n        JOIN WS_EDW.DIM_LO_SAP_LINE_ITEM LI ON F.DIM_LINE_ITEM_KEY = LI.DIM_LINE_ITEM_KEY \n        JOIN WS_EDW.DIM_LO_SAP_LEDGER L ON F.DIM_LEDGER_KEY = L.DIM_LEDGER_KEY \n            AND L.LEADING_LEDGER_FLAG = 'Y'\n        JOIN PRODUCTS P ON F.GLOP_LINE_NO = P.GLOP_LINE_NO\n        JOIN (\n            SELECT DIM_ACTIVITY_PERIOD_DATE_KEY AS DIM_DATE_KEY\n                , FULL_DATE\n                , TO_CHAR(LAST_DAY(DATE_TRUNC(MONTH, FULL_DATE)), 'YYYYMMDD') AS FIRST_DATE_KEY\n            FROM WS_EDW.DIM_FDC_ACTIVITY_PERIOD_DATE\n        ) DD ON TO_CHAR(F.DIM_ACTVY_PER_DATE, 'YYYYMMDD') = DD.FIRST_DATE_KEY\n    WHERE\n        NVL(F.LI_VOL, 0) != 0\n        AND F.DIM_PRODUCT_TYPE_KEY != 0\n        AND F.DIM_ACTVY_PER_DATE IS NOT NULL\n        AND F.DIM_ACCT_PER_DATE IS NOT NULL\n    GROUP BY\n        DD.DIM_DATE_KEY, DD.FULL_DATE, F.DIM_COST_CENTER_KEY, F.DIM_PRODUCT_TYPE_KEY, F.GROSS_OR_NET_CODE, P.PRODUCT, CC.CC_NUM, PROD.PROD_CODE, F.LI_VOL_UOM\n    \n    UNION ALL\n\n    SELECT \n        DD.DIM_DATE_KEY AS DIM_ACTVY_PER_DATE_KEY,\n        DD.FULL_DATE AS DIM_ACTVY_PER_DATE,\n        F.DIM_COST_CENTER_KEY,\n        F.DIM_PRODUCT_TYPE_KEY,\n        CASE WHEN F.GROSS_OR_NET_CODE = 'G' THEN 1 ELSE 2 END AS GROSS_NET_KEY,\n        SUM(F.LI_VOL_IMPERIAL) / DAY(LAST_DAY(DD.FULL_DATE)) * -1  AS VOL,\n        CASE WHEN PROD.PROD_CODE IN ('BUT', 'ETH', 'H20', 'PRO', 'PEN')\n            THEN\n                PROD.PROD_CODE || '_IMPERIAL'\n            ELSE\n                P.PRODUCT || '_IMPERIAL' END AS PRODUCT,\n        CC.CC_NUM AS CC_NUM\n    FROM\n        WS_EDW.FACT_LO_SAP_ACTUALS F\n        LEFT JOIN WS_EDW.DIM_LO_SAP_PRODUCT_TYPE PROD ON F.DIM_PRODUCT_TYPE_KEY = PROD.DIM_PRODUCT_TYPE_KEY\n        JOIN WS_EDW.DIM_LO_SAP_COST_CENTER CC ON F.DIM_COST_CENTER_KEY = CC.DIM_COST_CENTER_KEY\n        JOIN WS_EDW.DIM_LO_SAP_LINE_ITEM LI ON F.DIM_LINE_ITEM_KEY = LI.DIM_LINE_ITEM_KEY \n        JOIN WS_EDW.DIM_LO_SAP_LEDGER L ON F.DIM_LEDGER_KEY = L.DIM_LEDGER_KEY \n            AND L.LEADING_LEDGER_FLAG = 'Y'\n        JOIN PRODUCTS P ON F.GLOP_LINE_NO = P.GLOP_LINE_NO\n        JOIN (\n            SELECT DIM_ACTIVITY_PERIOD_DATE_KEY AS DIM_DATE_KEY\n                , FULL_DATE\n                , TO_CHAR(LAST_DAY(DATE_TRUNC(MONTH, FULL_DATE)), 'YYYYMMDD') AS FIRST_DATE_KEY\n            FROM WS_EDW.DIM_FDC_ACTIVITY_PERIOD_DATE\n        ) DD ON TO_CHAR(F.DIM_ACTVY_PER_DATE, 'YYYYMMDD') = DD.FIRST_DATE_KEY    \n    WHERE\n        NVL(F.LI_VOL, 0) != 0\n        AND F.DIM_PRODUCT_TYPE_KEY != 0\n        AND F.DIM_ACTVY_PER_DATE IS NOT NULL\n        AND F.DIM_ACCT_PER_DATE IS NOT NULL\n    GROUP BY\n        DD.DIM_DATE_KEY, DD.FULL_DATE, F.DIM_COST_CENTER_KEY, F.DIM_PRODUCT_TYPE_KEY, F.GROSS_OR_NET_CODE, P.PRODUCT, CC.CC_NUM, PROD.PROD_CODE, F.LI_VOL_UOM\n    \n    UNION ALL\n\n    SELECT \n        DD.DIM_DATE_KEY AS DIM_ACTVY_PER_DATE_KEY,\n        DD.FULL_DATE
            AS DIM_ACTVY_PER_DATE,\n        F.DIM_COST_CENTER_KEY,\n        F.DIM_PRODUCT_TYPE_KEY,\n        CASE WHEN F.GROSS_OR_NET_CODE = 'G' THEN 1 ELSE 2 END AS GROSS_NET_KEY,\n        SUM(F.LI_VOL_BOE) / DAY(LAST_DAY(DD.FULL_DATE)) * -1  AS VOL,\n        CASE WHEN PROD.PROD_CODE IN ('BUT', 'ETH', 'H20', 'PRO', 'PEN')\n            THEN\n                PROD.PROD_CODE || '_BOE'\n            ELSE\n                P.PRODUCT || '_BOE' END AS PRODUCT,\n        CC.CC_NUM AS CC_NUM\n    FROM\n        WS_EDW.FACT_LO_SAP_ACTUALS F\n        LEFT JOIN WS_EDW.DIM_LO_SAP_PRODUCT_TYPE PROD ON F.DIM_PRODUCT_TYPE_KEY = PROD.DIM_PRODUCT_TYPE_KEY\n        JOIN WS_EDW.DIM_LO_SAP_COST_CENTER CC ON F.DIM_COST_CENTER_KEY = CC.DIM_COST_CENTER_KEY\n        JOIN WS_EDW.DIM_LO_SAP_LINE_ITEM LI ON F.DIM_LINE_ITEM_KEY = LI.DIM_LINE_ITEM_KEY \n        JOIN WS_EDW.DIM_LO_SAP_LEDGER L ON F.DIM_LEDGER_KEY = L.DIM_LEDGER_KEY \n            AND L.LEADING_LEDGER_FLAG = 'Y'\n        JOIN PRODUCTS P ON F.GLOP_LINE_NO = P.GLOP_LINE_NO\n        JOIN (\n            SELECT DIM_ACTIVITY_PERIOD_DATE_KEY AS DIM_DATE_KEY\n                , FULL_DATE\n                , TO_CHAR(LAST_DAY(DATE_TRUNC(MONTH, FULL_DATE)), 'YYYYMMDD') AS FIRST_DATE_KEY\n            FROM WS_EDW.DIM_FDC_ACTIVITY_PERIOD_DATE\n        ) DD ON TO_CHAR(F.DIM_ACTVY_PER_DATE, 'YYYYMMDD') = DD.FIRST_DATE_KEY    \n    WHERE\n        NVL(F.LI_VOL, 0) != 0\n        AND F.DIM_PRODUCT_TYPE_KEY != 0\n        AND F.DIM_ACTVY_PER_DATE IS NOT NULL\n        AND F.DIM_ACCT_PER_DATE IS NOT NULL\n    GROUP BY\n        DD.DIM_DATE_KEY, DD.FULL_DATE, F.DIM_COST_CENTER_KEY, F.DIM_PRODUCT_TYPE_KEY, F.GROSS_OR_NET_CODE, P.PRODUCT, CC.CC_NUM, PROD.PROD_CODE, F.LI_VOL_UOM\n)\n\nSELECT\n    CASE WHEN PVT.CC_NUM IS NULL THEN '-1' ELSE 'CC-' || PVT.CC_NUM END AS ENTITY_KEY\n    , 'sap_sales_actvy' AS SCENARIO_KEY\n    , GROSS_NET_KEY\n    , DIM_ACTVY_PER_DATE_KEY AS ACTIVITY_DATE_KEY\n    , DIM_ACTVY_PER_DATE AS ACTIVITY_DATE\n    , -1 AS NORMALIZED_DATE_KEY\n    , -1 AS PRODUCING_DATE_KEY\n    , -1 AS ON_PROD_DATE_KEY\n    , PVT.CC_NUM AS CC_NUM\n    , NULL AS HOURS_ON\n    , NULL AS HOURS_DOWN\n    , NULL AS HCLIQ_METRIC\n    , SUM(PVT.\"'OIL_METRIC'\") AS OIL_METRIC\n    , SUM(PVT.\"'OIL_IMPERIAL'\") AS OIL_IMPERIAL\n    , SUM(PVT.\"'OIL_BOE'\") AS OIL_BOE\n    , SUM(PVT.\"'CON_METRIC'\") AS CONDENSATE_METRIC\n    , SUM(PVT.\"'CON_IMPERIAL'\") AS CONDENSATE_IMPERIAL\n    , SUM(PVT.\"'CON_BOE'\") AS CONDENSATE_BOE\n    , NULLIF(NVL(SUM(PVT.\"'NGL_METRIC'\"), 0) + NVL(SUM(PVT.\"'PEN_METRIC'\"), 0) + NVL(SUM(PVT.\"'ETH_METRIC'\"), 0) + NVL(SUM(PVT.\"'BUT_METRIC'\"), 0) + NVL(SUM(PVT.\"'PRO_METRIC'\"), 0), 0) AS NGL_METRIC\r\n    , NULLIF(NVL(SUM(PVT.\"'NGL_IMPERIAL'\"), 0) + NVL(SUM(PVT.\"'PEN_IMPERIAL'\"), 0) + NVL(SUM(PVT.\"'ETH_IMPERIAL'\"), 0) + NVL(SUM(PVT.\"'BUT_IMPERIAL'\"), 0) + NVL(SUM(PVT.\"'PRO_IMPERIAL'\"), 0), 0) AS NGL_IMPERIAL\r\n    , NULLIF(NVL(SUM(PVT.\"'NGL_BOE'\"), 0) + NVL(SUM(PVT.\"'PEN_BOE'\"), 0) + NVL(SUM(PVT.\"'ETH_BOE'\"), 0) + NVL(SUM(PVT.\"'BUT_BOE'\"), 0) + NVL(SUM(PVT.\"'PRO_BOE'\"), 0), 0) AS NGL_BOE\r\n    , SUM(PVT.\"'GAS_METRIC'\") AS GAS_METRIC\n    , SUM(PVT.\"'GAS_IMPERIAL'\") AS GAS_IMPERIAL\n    , SUM(PVT.\"'GAS_BOE'\") AS GAS_BOE\n    , SUM(PVT.\"'GAS_NM3'\") AS GAS_NM3\n    , SUM(PVT.\"'H20_METRIC'\") AS WATER_METRIC\n    , SUM(PVT.\"'H20_IMPERIAL'\") AS WATER_IMPERIAL\n    , SUM(PVT.\"'H20_BOE'\") AS WATER_BOE\n    , NULL AS SAND_METRIC\n    , NULL AS INJECTED_GAS_METRIC\n    , NULL AS INJECTED_HCLIQ_METRIC\n    , NULL AS INJECTED_SAND_METRIC\n    , NULL AS INJECTED_WATER_METRIC\n    , NULL AS RECOVERED_GAS_METRIC\n    , NULL AS RECOVERED_HCLIQ_METRIC\n    , NULL AS RECOVERED_SAND_METRIC\n    , NULL AS RECOVERED_WATER_METRIC\n    , NULL AS REMAINING_LIFT_GAS_METRIC\n    , NULL AS REMAINING_LOAD_HCLIQ_METRIC\n    , NULL AS REMAINING_LOAD_WATER_METRIC\n    , NULL AS REMAINING_LOAD_SAND_METRIC\n    , NULL AS METHANE_METRIC\n    , NULL AS METHANE_IMPERIAL\n    , NULL AS METHANE_BOE\n    , SUM(PVT.\"'ETH_METRIC'\") AS ETHANE_METRIC\n    , SUM(PVT.\"'ETH_IMPERIAL'\") AS ETHANE_IMPERIAL\n\
            \    , SUM(PVT.\"'ETH_BOE'\") AS ETHANE_BOE\n    , SUM(PVT.\"'PRO_METRIC'\") AS PROPANE_METRIC\n    , SUM(PVT.\"'PRO_IMPERIAL'\") AS PROPANE_IMPERIAL\n    , SUM(PVT.\"'PRO_BOE'\") AS PROPANE_BOE\n    , SUM(PVT.\"'BUT_METRIC'\") AS BUTANE_METRIC\n    , SUM(PVT.\"'BUT_IMPERIAL'\") AS BUTANE_IMPERIAL\n    , SUM(PVT.\"'BUT_BOE'\") AS BUTANE_BOE\n    , SUM(PVT.\"'PEN_METRIC'\") AS PENTANE_METRIC\n    , SUM(PVT.\"'PEN_IMPERIAL'\") AS PENTANE_IMPERIAL\n    , SUM(PVT.\"'PEN_BOE'\") AS PENTANE_BOE\n    , NULL AS FLAREGAS_METRIC\n    , NULL AS VENTGAS_METRIC\n    , NULL AS FUELGAS_METRIC\n    , NULL AS WIGAS\n    , NULL AS WIHCLIQ\n    , NULL AS WIWATER\n    , NULL AS WISAND\n    , NULL AS BAT_PRO_GAS_METRIC\n    , NULL AS BAT_PRO_GAS_IMPERIAL\n    , NULL AS BAT_PRO_GAS_BOE\n    , NULL AS INJECTED_LIFT_GAS_METRIC\n    , NULL AS INJECTED_LIFT_GAS_IMPERIAL\n    , NULL AS INJECTED_LIFT_GAS_BOE\nFROM\n    VOL F\n    PIVOT(\n        SUM(VOL) FOR PRODUCT IN (\n            'OIL_IMPERIAL', 'OIL_METRIC', 'OIL_BOE', 'OIL_NM3', 'GAS_IMPERIAL', 'GAS_METRIC', 'GAS_BOE', 'GAS_NM3'\n            , 'CON_IMPERIAL', 'CON_METRIC', 'CON_BOE', 'CON_NM3', 'NGL_IMPERIAL', 'NGL_METRIC', 'NGL_BOE', 'NGL_NM3'\n            , 'H20_IMPERIAL', 'H20_METRIC', 'H20_BOE', 'H20_NM3', 'BUT_IMPERIAL', 'BUT_METRIC', 'BUT_BOE', 'BUT_NM3'\n            , 'ETH_IMPERIAL', 'ETH_METRIC', 'ETH_BOE', 'ETH_NM3', 'PEN_IMPERIAL', 'PEN_METRIC', 'PEN_BOE', 'PEN_NM3'\n            , 'PRO_IMPERIAL', 'PRO_METRIC', 'PRO_BOE', 'PRO_NM3'\n        )\n    ) AS PVT\n    LEFT JOIN WS_EDW.DIM_FDC_WELL W ON 'CC-' || PVT.CC_NUM = W.DIM_WELL_KEY\nGROUP BY\n     GROSS_NET_KEY, DIM_ACTVY_PER_DATE_KEY, DIM_ACTVY_PER_DATE, PVT.CC_NUM, W.COUNTRY_NAME"
