    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[VIEW_FDC_DOWNTIME_CODES] AS\r\n\r\nSELECT DISTINCT NVL(UPPER(TRIM(CODEDOWNTM1)), 'UNKNOWN') || '-' || NVL(UPPER(TRIM(CODEDOWNTM2)), 'UNKNOWN') || '-' || NVL(UPPER(TRIM(CODEDOWNTM3)), 'UNKNOWN') || '-' || NVL(UPPER(TRIM(W.COUNTRY)), 'UNKNOWN') AS SCENARIO_KEY\r\n\t,NVL(UPPER(TRIM(CODEDOWNTM1)), 'UNKNOWN') AS CODE1\r\n\t,CASE \r\n\t\tWHEN UPPER(REPLACE(TRIM(CODEDOWNTM2), ' ', '')) IN ('PLANT/BATTERY/SALESLINE', 'PROCESSINGPLANT/BATTERY/SALES LINE', 'PROCESSINGPLATFORM/SALES') THEN 'PROCESSING PLANT/BATTERY/SALES LINE'\r\n\t\tWHEN UPPER(REPLACE(TRIM(CODEDOWNTM2), ' ', '')) = 'SURFACELEASE/GATHERINGSYSTEM' THEN 'SURFACE LEASE/GATHERING SYSTEM'\r\n\t\tELSE NVL(UPPER(TRIM(CODEDOWNTM2)), 'UNKNOWN') END AS CODE2\r\n\t,NVL(UPPER(TRIM(CODEDOWNTM3)), 'UNKNOWN') AS CODE3\r\n\t,NVL(UPPER(TRIM(W.COUNTRY)), 'UNKNOWN') AS DIVISION\r\nFROM [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY] P\r\nLEFT JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPDOWNTM] DT ON DT.IDREC = P.IDRECDOWNTIME AND DT.DSS_CURRENT_FLAG = 'Y' AND DT.DSS_DELETE_FLAG != 'Y'\r\nJOIN [TABLEOWNER].[STAGE_PRODVIEW_WELLS] W ON P.IDFLOWNET = W.IDFLOWNET\r\nAND P.IDRECUNIT = W.ENTITY_KEY\r\nWHERE W.COUNTRY IS NOT NULL\r\nAND P.DSS_CURRENT_FLAG = 'Y' AND P.DSS_DELETE_FLAG != 'Y'\r\nAND YEAR(P.DTTM) > $PFDC_DOWNTIME_CODES_YEAR$"
        dependencies: []
