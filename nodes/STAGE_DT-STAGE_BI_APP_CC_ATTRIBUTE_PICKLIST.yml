    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_BI_APP_CC_ATTRIBUTE_PICKLIST] AS\r\n\r\nselect\r\n    distinct attribute,\r\n    attribute_key,\r\n    value,\r\n    corearea_name,\r\n    area_name,\r\n    CAST(current_timestamp() AS timestamp_ntz) as DSS_LOAD_DATE\r\nfrom\r\n    (\r\n        select\r\n            distinct 'BATTERY' as attribute,\r\n            u.usertxt2 as attribute_key,\r\n            u.usertxt2 as value,\r\n            u.costcenterida as cc_num\r\n        from\r\n            ds_prodview.pvt_pvunit u\r\n        where u.usertxt2 is not null\r\n            --\r\n        union all\r\n            --\r\n        select\r\n            distinct 'MANUAL_FOREMAN' as attribute,\r\n            'MANUAL_FOREMAN' as attribute_key,\r\n            MANUAL_FOREMAN as value,\r\n            first_value(cc_num) over (\r\n                partition by area_name\r\n                order by\r\n                    cc_num\r\n            ) as cc_num\r\n        from\r\n            [TABLEOWNER].[DIM_LO_COST_CENTER_HIER]\r\n        where\r\n            MANUAL_FOREMAN is not null\r\n    ) v\r\n    join [TABLEOWNER].[DIM_LO_COST_CENTER_HIER] cc on v.cc_num = cc.cc_num"
