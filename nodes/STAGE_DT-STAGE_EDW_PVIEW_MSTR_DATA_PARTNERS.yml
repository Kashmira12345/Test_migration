          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_EDW_PVIEW_MSTR_DATA_PARTNERS] \r\nAS\r\n(SELECT DISTINCT\r\n   PVT_PVUNITCOMP.IDFLOWNET \"PVT_PVUNITCOMP_idflownet\",\r\n   VIEW_CSLAND_PVIEW_PARTNERS.PARTNER_NAME \"PVT_PVPARTNER_partnername\",\r\n   VIEW_CSLAND_PVIEW_PARTNERS.PARTNER_BA \"PVT_PVPARTNER_partnerida\",\r\n   CASE WHEN CHARINDEX('VERMILION',VIEW_CSLAND_PVIEW_PARTNERS.PARTNER_NAME) = 0 THEN 'False' ELSE 'True' END \"PVT_PVPARTNER_includeinnet\"\r\nFROM [TABLEOWNER].[VIEW_CSLAND_PVIEW_PARTNERS] VIEW_CSLAND_PVIEW_PARTNERS\r\n   INNER JOIN DS_PRODVIEW.PVT_PVUNITCOMP PVT_PVUNITCOMP ON \r\n      VIEW_CSLAND_PVIEW_PARTNERS.WELL_UWI =  PVT_PVUNITCOMP.WELLIDREGULATORY)\r\nUNION\r\n(SELECT 'Partner' \"PVT_PVUNITCOMP_idflownet\",NULL,NULL,NULL)\r\nORDER BY DECODE(\"PVT_PVUNITCOMP_idflownet\",'Partner',0,1) ASC"
