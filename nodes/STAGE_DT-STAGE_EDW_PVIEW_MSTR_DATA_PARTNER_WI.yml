        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_EDW_PVIEW_MSTR_DATA_PARTNER_WI] \r\nAS\r\n(SELECT\r\n   PVT_PVUNIT.IDREC \"PVT_PVUNIT_idrec\",\r\n   PVT_PVUNIT.NAME \"PVT_PVUNIT_name\",\r\n   TO_CHAR(VIEW_CSLAND_PVIEW_PARTNERS.EFFECTIVE_DATE,'YYYYMMDD') \"PVT_PVUNITAGREEMENT_dttmstart\",\r\n   VIEW_CSLAND_PVIEW_PARTNERS.PARTNER_NAME \"PVT_PVPARTNER_partnername\",\r\n   TO_CHAR(VIEW_CSLAND_PVIEW_PARTNERS.PARTNER_PERCENT) \"PVT_PVUNITAGREEMENTPARTNER_interest\",\r\n   'CS file: ' || VIEW_CSLAND_PVIEW_PARTNERS.WELL_FILE_NUMBER \"PVT_PVUNITAGREEMENTPARTNER_com\"\r\nFROM [TABLEOWNER].[VIEW_CSLAND_PVIEW_PARTNERS] VIEW_CSLAND_PVIEW_PARTNERS\r\n   INNER JOIN DS_PRODVIEW.PVT_PVUNITCOMP PVT_PVUNITCOMP ON \r\n      VIEW_CSLAND_PVIEW_PARTNERS.WELL_UWI =  PVT_PVUNITCOMP.WELLIDREGULATORY\r\n   INNER JOIN DS_PRODVIEW.PVT_PVUNIT PVT_PVUNIT ON \r\n      PVT_PVUNITCOMP.IDRECPARENT = PVT_PVUNIT.IDREC)\r\nUNION\r\n(SELECT 'Partner Agreement' \"PVT_PVUNIT_idrec\",NULL,NULL,NULL,NULL,NULL)\r\nORDER BY DECODE(\"PVT_PVUNIT_idrec\",'Partner Agreement',0,1) ASC\t  "
