      - aliases:
          DIM_LO_SAP_CC_CORP_HIER_CURRENT: 708fd649-6097-9913-de66-f7bca879c8c8
          DIM_LO_SAP_COST_CENTER: 92422852-c141-a115-6f61-583208be58f4
          ODS_GDC_BUSINESS_ASSOCIATE: e0d4d730-75f3-5cc2-7af7-dd7d738a3240
          ODS_GDC_FIELD: 80fbb76a-26d4-6f34-7cc8-a0400e7a5477
