    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY: a88a5390-bf3b-3ee4-889a-d0fd0c7466a6
          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
          ODS_PVIEW_PVT_PVUNITCOMPPARAM: 0bda6665-d7cf-a7f9-35c8-19a99ec575b3
        customSQL:
          customSQL: "CREATE VIEW [TABLEOWNER].[STAGE_PVIEW_MOSAIC_CDM_VOLS] as \n\nWITH GasVolumes AS(\n    SELECT p.dttm,\n        p.idflownet,\n        p.volnewprodallocgas,\n        p.idrec,\n        CASE\n            WHEN p.idflownet = '966E2E4C11274A8E88B00B7D5E37FA4A' THEN (p.volnewprodallocgas * 1.0494811) / 1000 \n            WHEN p.idflownet = 'D31DB03FC64C4413B39FEBBED5004D42' THEN (p.volnewprodallocgas * 1.0494811) / 1000 \n            WHEN p.idflownet = 'E6FCADB21222494393E582D914245BBF' THEN (p.volnewprodallocgas * 1.0494811) / 1000 \n            WHEN p.idflownet = '13520ED8659449F38B5085DA7F464CDB' THEN (p.volnewprodallocgas * 1.0494811) / 1000 \r\n    \t\tWHEN upper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL') THEN p.volprodgathgas / 1000 \n            ELSE p.volnewprodallocgas / 1000\n        END AS gas,\n        CASE\n            WHEN p.idflownet = '966E2E4C11274A8E88B00B7D5E37FA4A' THEN (p.volinjectgas * 1.0494811) / 1000\n            ELSE p.volinjectgas / 1000\n        END AS injgas\n    FROM DS_PRODVIEW.PVT_pvunitallocmonthday p\n    INNER JOIN DS_PRODVIEW.PVT_pvunit u on p.idrecunit = u.idrec\n),\nsaskGasVolumes AS(\n    select fd.balfactgas, f.idrec as idrecfacility, fd.dttm\n    from DS_PRODVIEW.pvt_pvfacilitymonthdaycalc fd\n    join DS_PRODVIEW.pvt_pvfacilitymonthcalc fm on fd.idrecparent = fm.idrec\n    join DS_PRODVIEW.pvt_pvfacility f on fm.idrecparent = f.idrec\n),\nsaskFacilities AS (\n    SELECT DISTINCT f.idrec\n    FROM DS_PRODVIEW.PVT_pvfacility f\n    WHERE typ2 = '322'\n    AND typregulatory = 'Crude Oil Multiwell Proration Battery'\n),\nab_bc_volumes AS (\n\tselect\n\t\td.idrec\n\t\t, d.dttm as production_date\n\t\t, d.idflownet\n\t\t, d.idrecunit\n\t\t, d.idrecparam\n\t\t, d.durop * 24 AS hours\n\t\t, d.durop * 24 AS hours_inj\n\t\t, d.volprodgathgas / 1000 as gas \n\t\t, d.volnewprodallocoil as oil\n\t\t, d.volnewprodallocwater AS water\n\t\t, NULL as ngl\n\t\t, d.volnewprodalloccond as cond\n\t\t, d.volinjectgas / 1000 as inj_gas\n\t\t, d.volinjectwater as inj_water\n\tfrom\n\t\tDS_PRODVIEW.PVT_pvunitallocmonthday d\n\t\tjoin DS_PRODVIEW.PVT_pvunit u on d.idrecunit = u.idrec\n\twhere\n\t\tupper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL')\n), \nab_bc_ngls as (\n\tselect\n\t\tp.idflownet\n\t\t, p.idrecunit\n\t\t, p.dttm as production_date\n\t\t, sum(coalesce(p.volc1liq, 0)) as methane\n\t\t, sum(coalesce(p.volc2liq, 0)) as ethane\n\t\t, sum(coalesce(p.volc3liq, 0)) as propane\n\t\t, sum(coalesce(p.volic4liq, 0) + coalesce(p.volnc4liq, 0)) as butane\n\t\t, sum(coalesce(p.volc6liq, 0) + coalesce(p.volc7liq, 0)) as pentane\n\t\t, sum(coalesce(p.volic5liq, 0) + coalesce(p.volnc5liq, 0)) as field_condensate\n\tfrom\n\t\tDS_PRODVIEW.PVT_pvunitdispmonthday p\n\t\tjoin DS_PRODVIEW.PVT_pvunit u on p.idrecunit = u.idrec\n\t\tleft join DS_PRODVIEW.PVT_pvunitnode n on p.idrecdispunitnode = n.idrec\n\twhere\n\t\tlower(n.typdisphcliq) = 'ngl'\n\t\tand upper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL','BRITISH COLUMBIA')\n\tgroup by\n\t\tp.idflownet\n\t\t, p.idrecunit\n\t\t, p.dttm\n)\n\nSELECT \n    CAST(w.wellidregulatory as varchar(50)) as well_name,\n    d.dttm as production_date,\n    CAST('D' as varchar(1)) as period_type,\n    CAST((d.durop * 24) as float) as hours,\n    CAST((d.durop * 24) as float) as hours_inj,\n    CAST(d.volnewprodallocoil as float) as oil,\n    CAST(CASE\n           WHEN d.idrecfacility IN (saskFacilities.idrec) THEN saskGasVolumes.balfactgas * d.volprodgathgas / 1000\n           ELSE GasVolumes.gas\n        END as float) AS gas,\n    CAST(GasVolumes.injgas as float) as gas_inj,\n    CAST(null as float) as gas_cost,\n    CAST(d.volnewprodallocwater as float) as water,\n    CAST(d.volinjectwater as float) as water_inj,\n    CAST(null as float) as water_cost,\n    CAST(abbcvol.cond as float) as field_condensate,\n    CAST(abbcngl.ethane as float) as ethane,\n    CAST(null as float) as ethane_inj,\n    CAST(abbcngl.propane as float) as propane,\n    CAST(null as float) as propane_inj,\n  \
            \  CAST(abbcngl.butane as float) as butane,\n    CAST(null as float) as butane_inj,\n    CAST(\n       CASE\n\t      WHEN abbcngl.production_date is not null \n             THEN abbcngl.field_condensate\n\t      ELSE  d.volnewprodalloccond \n       END\n    as float) as pentane_plus,\n    CAST(null as float) as pentane_plus_inj,\n    CAST(null as float) as sulphur,\n    CAST(null as float) as fluid,\n    CAST(\n       CASE\n       WHEN u.division = 'UNITED STATES' \n          THEN d.volnewprodallocngl \n       ELSE null \n    END    \n    as float) as ngl,\n    CAST(null as float) as helium,\n    CAST(null as float) as helium_inj,\n    CAST(null as float) as helium_cost,\n    CAST(null as float) as carbon_dioxide,\n    CAST(null as float) as carbon_dioxide_inj,\n    CAST(null as float) as carbon_dioxide_cost,\n    CAST(null as float) as sand,\n    CAST(null as float) as sand_inj,\n    CAST(null as float) as steam_inj,\n    CAST(null as float) as polymer_inj,\n    CAST(null as float) as solvent_inj,\n    CAST(null as float) as alkali_inj,\n    CAST(null as float) as diluent_inj,\n    CAST(null as float) as diluent_cost,\n    CAST(p.preswh as float) as fwhp,\n    CAST(p.presbh as float) as fbhp,\n    CAST(p.prescas as float) as casing_pressure,\n    CAST(p.prestub as float) as tubing_pressure,\n    CAST(p.presline as float) as line_pressure,\n    CAST(null as float) as performance_index,\n    CAST(p.szchoke as float) as choke_size,\n    CAST(w.idrec as varchar(32)) well_idrec,\n    CAST(d.idrec as varchar(32)) day_idrec,\n    CAST(current_timestamp() as timestamp_ntz) as DSS_LOAD_DATE\nFROM DS_PRODVIEW.PVT_pvunitcomp AS w\n    INNER JOIN DS_PRODVIEW.PVT_pvunitallocmonth m ON w.idrecparent = m.idrecparent\n    INNER JOIN DS_PRODVIEW.PVT_pvunitallocmonthday d ON d.idrecparent = m.idrec\n\tINNER JOIN DS_PRODVIEW.PVT_pvunit u on d.idrecunit = u.idrec    \n    LEFT JOIN DS_PRODVIEW.PVT_pvUnitCompParam p ON d.idrecparam = p.idrec\n    INNER JOIN GasVolumes ON GasVolumes.idrec = d.idrec\n    LEFT JOIN saskGasVolumes ON (saskGasVolumes.idrecfacility = d.idrecfacility AND saskGasVolumes.dttm = d.dttm)\n    LEFT JOIN saskFacilities ON saskFacilities.idrec = d.idrecfacility\n\tLEFT OUTER JOIN ab_bc_volumes abbcvol ON abbcvol.idrecunit = d.idrecunit AND abbcvol.production_date = d.dttm\n\tLEFT OUTER JOIN ab_bc_ngls abbcngl ON abbcngl.idrecunit = d.idrecunit AND abbcngl.production_date = d.dttm\nwhere m.dttmstart >= DATE_TRUNC('Month', ADD_MONTHS(CURRENT_DATE(), -10))\n    and w.wellidregulatory is not NULL;"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPPARAM
        join:
          joinCondition: |-
            FROM {{ ref_no_link('STAGE_DT','STAGE_PVIEW_MOSAIC_CDM_VOLS') }} "STAGE_PVIEW_MOSAIC_CDM_VOLS"
        name: STAGE_PVIEW_MOSAIC_CDM_VOLS
        noLinkRefs: []
