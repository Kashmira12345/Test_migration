    sourceMapping:
      - aliases:
          ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY: a88a5390-bf3b-3ee4-889a-d0fd0c7466a6
          ODS_PVIEW_PVT_PVUNITCOMP: b4c98ea3-3296-9dcd-35cb-4170801715d6
          ODS_PVIEW_PVT_PVUNITCOMPPARAM: 0bda6665-d7cf-a7f9-35c8-19a99ec575b3
        customSQL:
          customSQL: "CREATE VIEW [TABLEOWNER].[STAGE_PVIEW_MOSAIC_CDM_VOLS_ADHOC] as \r\nWITH \r\n-- date filter\r\ndates AS(\r\n    select '2025-01-01' as start_date, '2025-03-31' as end_date), \r\n--\r\nGasVolumes AS(\r\n\tSELECT p.dttm,\r\n\t\tp.idflownet,\r\n\t\tp.volnewprodallocgas,\r\n\t\tp.idrec,\r\n\t\tCASE\r\n              WHEN p.idflownet = '966E2E4C11274A8E88B00B7D5E37FA4A' THEN (p.volnewprodallocgas * 1.0494811) / 1000\r\n              WHEN p.idflownet = 'D31DB03FC64C4413B39FEBBED5004D42' THEN (p.volnewprodallocgas * 1.0494811) / 1000\r\n              WHEN p.idflownet = 'E6FCADB21222494393E582D914245BBF' THEN (p.volnewprodallocgas * 1.0494811) / 1000\r\n              WHEN p.idflownet = '13520ED8659449F38B5085DA7F464CDB' THEN (p.volnewprodallocgas * 1.0494811) / 1000\r\n\t\t  WHEN upper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL') THEN p.volprodgathgas / 1000\r\n\t\t  ELSE p.volnewprodallocgas / 1000\r\n\t\tEND AS gas,\r\n\t\tCASE\r\n\t\t\tWHEN p.idflownet = '966E2E4C11274A8E88B00B7D5E37FA4A' THEN (p.volinjectgas * 1.0494811) / 1000\r\n\t\t\tELSE p.volinjectgas / 1000\r\n\t\tEND AS injgas\r\n\tFROM DS_PRODVIEW.PVT_pvunitallocmonthday p\r\n\t   INNER JOIN DS_PRODVIEW.PVT_pvunit u on p.idrecunit = u.idrec\r\n\tWHERE\r\n\t\tp.dttm between (select start_date from dates) and (select end_date from dates)\r\n),\r\n-- Sask gas volumes are done by a stored procedure and written to other measurement points for every well\r\nsaskGasVolumes AS(\r\n    select fd.balfactgas, f.idrec as idrecfacility, fd.dttm\r\n    from DS_PRODVIEW.pvt_pvfacilitymonthdaycalc fd\r\n    join DS_PRODVIEW.pvt_pvfacilitymonthcalc fm on fd.idrecparent = fm.idrec\r\n    join DS_PRODVIEW.pvt_pvfacility f on fm.idrecparent = f.idrec\r\n),\r\nsaskFacilities AS (\r\n\tSELECT DISTINCT f.idrec\r\n\tFROM DS_PRODVIEW.PVT_pvfacility f\r\n\tWHERE typ2 = '322'\r\n\t\tAND typregulatory = 'Crude Oil Multiwell Proration Battery'\r\n),\r\nab_bc_volumes AS (\r\n\tselect\r\n\t\td.idrec\r\n\t\t, d.dttm as production_date\r\n\t\t, d.idflownet\r\n\t\t, d.idrecunit\r\n\t\t, d.idrecparam\r\n\t\t, d.durop * 24 AS hours\r\n\t\t, d.durop * 24 AS hours_inj\r\n\t\t, d.volprodgathgas / 1000 as gas\r\n\t\t, d.volnewprodallocoil as oil\r\n\t\t, d.volnewprodallocwater AS water\r\n\t\t, NULL as ngl\r\n\t\t, d.volnewprodalloccond as cond\r\n\t\t, d.volinjectgas / 1000 as inj_gas\r\n\t\t, d.volinjectwater as inj_water\r\n\tfrom\r\n\t\tDS_PRODVIEW.PVT_pvunitallocmonthday d\r\n\t\tjoin DS_PRODVIEW.PVT_pvunit u on d.idrecunit = u.idrec\r\n\twhere\r\n\t\tupper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL')\r\n            and d.dttm between (select start_date from dates) and (select end_date from dates)\r\n), \r\nab_bc_ngls as (\r\n\tselect\r\n\t\tp.idflownet\r\n\t\t, p.idrecunit\r\n\t\t, p.dttm as production_date\r\n\t\t, sum(coalesce(p.volc1liq, 0)) as methane\r\n\t\t, sum(coalesce(p.volc2liq, 0)) as ethane\r\n\t\t, sum(coalesce(p.volc3liq, 0)) as propane\r\n\t\t, sum(coalesce(p.volic4liq, 0) + coalesce(p.volnc4liq, 0)) as butane\r\n\t\t, sum(coalesce(p.volc6liq, 0) + coalesce(p.volc7liq, 0)) as pentane\r\n\t\t, sum(coalesce(p.volic5liq, 0) + coalesce(p.volnc5liq, 0)) as field_condensate\r\n\tfrom\r\n\t\tDS_PRODVIEW.PVT_pvunitdispmonthday p\r\n\t\tjoin DS_PRODVIEW.PVT_pvunit u on p.idrecunit = u.idrec\r\n\t\tleft join DS_PRODVIEW.PVT_pvunitnode n on p.idrecdispunitnode = n.idrec\r\n\twhere\r\n\t\tlower(n.typdisphcliq) = 'ngl'\r\n\t\tand upper(u.district) in ('DEEP BASIN NORTH','DEEP BASIN SOUTH','ALBERTA GENERAL','BRITISH COLUMBIA')\r\n            and p.dttm between (select start_date from dates) and (select end_date from dates)\r\n\tgroup by\r\n\t\tp.idflownet\r\n\t\t, p.idrecunit\r\n\t\t, p.dttm\r\n)\r\n-- Main Query\r\nSELECT \r\n    CAST(w.wellidregulatory as varchar(50)) as well_name,\r\n    d.dttm as production_date,\r\n    CAST('D' as varchar(1)) as period_type,\r\n    CAST((d.durop * 24) as float) as hours,\r\n    CAST((d.durop * 24) as float) as hours_inj,\r\n    CAST(d.volnewprodallocoil as float) as oil,\r\n    CAST(CASE\r\
            \n           WHEN d.idrecfacility IN (saskFacilities.idrec) THEN saskGasVolumes.balfactgas * d.volprodgathgas / 1000\r\n           ELSE GasVolumes.gas\r\n        END as float) AS gas,\r\n    CAST(GasVolumes.injgas as float) as gas_inj,\r\n    CAST(null as float) as gas_cost,\r\n    CAST(d.volnewprodallocwater as float) as water,\r\n    CAST(d.volinjectwater as float) as water_inj,\r\n    CAST(null as float) as water_cost,\r\n    CAST(abbcvol.cond as float) as field_condensate,\r\n    CAST(abbcngl.ethane as float) as ethane,\r\n    CAST(null as float) as ethane_inj,\r\n    CAST(abbcngl.propane as float) as propane,\r\n    CAST(null as float) as propane_inj,\r\n    CAST(abbcngl.butane as float) as butane,\r\n    CAST(null as float) as butane_inj,\r\n    CAST(\r\n       CASE\r\n\t      WHEN abbcngl.production_date is not null \r\n             THEN abbcngl.field_condensate\r\n\t      ELSE  d.volnewprodalloccond \r\n       END\r\n    as float) as pentane_plus,\r\n    CAST(null as float) as pentane_plus_inj,\r\n    CAST(null as float) as sulphur,\r\n    CAST(null as float) as fluid,\r\n    CAST(\r\n       CASE\r\n       WHEN u.division = 'UNITED STATES' \r\n          THEN d.volnewprodallocngl \r\n       ELSE null \r\n    END    \r\n    as float) as ngl,\r\n    CAST(null as float) as helium,\r\n    CAST(null as float) as helium_inj,\r\n    CAST(null as float) as helium_cost,\r\n    CAST(null as float) as carbon_dioxide,\r\n    CAST(null as float) as carbon_dioxide_inj,\r\n    CAST(null as float) as carbon_dioxide_cost,\r\n    CAST(null as float) as sand,\r\n    CAST(null as float) as sand_inj,\r\n    CAST(null as float) as steam_inj,\r\n    CAST(null as float) as polymer_inj,\r\n    CAST(null as float) as solvent_inj,\r\n    CAST(null as float) as alkali_inj,\r\n    CAST(null as float) as diluent_inj,\r\n    CAST(null as float) as diluent_cost,\r\n    CAST(p.preswh as float) as fwhp,\r\n    CAST(p.presbh as float) as fbhp,\r\n    CAST(p.prescas as float) as casing_pressure,\r\n    CAST(p.prestub as float) as tubing_pressure,\r\n    CAST(p.presline as float) as line_pressure,\r\n    CAST(null as float) as performance_index,\r\n    CAST(p.szchoke as float) as choke_size,\r\n    CAST(w.idrec as varchar(32)) well_idrec,\r\n    CAST(d.idrec as varchar(32)) day_idrec,\r\n    CAST(current_timestamp() as timestamp_ntz) as DSS_LOAD_DATE\r\nFROM DS_PRODVIEW.PVT_pvunitcomp AS w\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitallocmonth m ON w.idrecparent = m.idrecparent\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunitallocmonthday d ON d.idrecparent = m.idrec\r\n    INNER JOIN DS_PRODVIEW.PVT_pvunit u on d.idrecunit = u.idrec    \r\n    LEFT JOIN DS_PRODVIEW.PVT_pvUnitCompParam p ON d.idrecparam = p.idrec\r\n    INNER JOIN GasVolumes ON GasVolumes.idrec = d.idrec\r\n    LEFT JOIN saskGasVolumes ON (saskGasVolumes.idrecfacility = d.idrecfacility AND saskGasVolumes.dttm = d.dttm)\r\n    LEFT JOIN saskFacilities ON saskFacilities.idrec = d.idrecfacility\r\n    LEFT OUTER JOIN ab_bc_volumes abbcvol ON abbcvol.idrecunit = d.idrecunit AND abbcvol.production_date = d.dttm\r\n    LEFT OUTER JOIN ab_bc_ngls abbcngl ON abbcngl.idrecunit = d.idrecunit AND abbcngl.production_date = d.dttm\r\nwhere d.dttm between (select start_date from dates) and (select end_date from dates)\r\n    and w.wellidregulatory is not NULL"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITALLOCMONTHDAY
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMP
          - locationName: DATA_STORE
            nodeName: ODS_PVIEW_PVT_PVUNITCOMPPARAM
        join:
          joinCondition: |-
            FROM {{ ref_no_link('STAGE_DT','STAGE_PVIEW_MOSAIC_CDM_VOLS_ADHOC') }} "STAGE_PVIEW_MOSAIC_CDM_VOLS_ADHOC"
        name: STAGE_PVIEW_MOSAIC_CDM_VOLS_ADHOC
        noLinkRefs: []
