    sourceMapping:
      - aliases:
          VIEW_WVIEW_WBS_INVOICE_ACTUALS: a1bfdd74-2764-00fd-1109-7d28b5b3452b
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW [TABLEOWNER].[STAGE_WVIEW_WELL_INVOICE_ACTUALS_POST_DATA_CTE] AS\r\nSELECT\n    WELLHEADER_IDWELL as \"idwell\",\n    JOBAFE_IDREC as \"idrecparent\",\n    GL_ACCOUNT_DESC as \"des\",\n    GL_ACCOUNT as \"code3\",\n    sum(CAD_AMT_FLPD) as \"amount\",\n    INVOICE_DATE as \"finalinvoicedttm\",\n    INVOICE_NUM as \"invoicerefno\",\n    BUSINESS_ASSOCIATE_NAME as \"vendor\",\n    BUSINESS_ASSOCIATE_ID as \"vendorcode\"\nFROM\n    WS_EDW.VIEW_WVIEW_WBS_INVOICE_ACTUALS VWWIA\n    LEFT JOIN MAT_LOAD.LOAD_WVIEW_WVJOBAFEFINALINVOICECOST_RTN load on \n            VWWIA.WELLHEADER_IDWELL = load.idwell \n            and VWWIA.GL_ACCOUNT = load.code3\n            and VWWIA.INVOICE_NUM = load.invoicerefno\n            and coalesce(BUSINESS_ASSOCIATE_ID, 'UNKNOWN') = load.vendorcode\n            and VWWIA.JOBAFE_IDREC = load.idrecparent   \nWHERE  \n    VWWIA.INVOICE_NUM IS NOT NULL\n    AND load.idrec is null \nGROUP BY\n    VWWIA.WELLHEADER_IDWELL,\n    VWWIA.JOBAFE_IDREC,\n    VWWIA.GL_ACCOUNT_DESC,\n    VWWIA.GL_ACCOUNT,\n    VWWIA.INVOICE_DATE,\n    VWWIA.INVOICE_NUM,\n    VWWIA.BUSINESS_ASSOCIATE_NAME,\n    VWWIA.BUSINESS_ASSOCIATE_ID\nUNION\nSELECT\n    WELLHEADER_IDWELL as \"idwell\",\n    JOBAFE_IDREC as \"idrecparent\",\n    GL_ACCOUNT_DESC as \"des\",\n    GL_ACCOUNT as \"code3\",\n    sum(CAD_AMT_FLPD) as \"amount\",\n    INVOICE_DATE as \"finalinvoicedttm\",\n    INVOICE_NUM as \"invoicerefno\",\n    BUSINESS_ASSOCIATE_NAME as \"vendor\",\n    BUSINESS_ASSOCIATE_ID as \"vendorcode\"\nFROM\n    WS_EDW.VIEW_WVIEW_WBS_INVOICE_ACTUALS VWWIA\n    LEFT JOIN MAT_LOAD.LOAD_WVIEW_WVJOBAFEFINALINVOICECOST_RTN load on \n            VWWIA.WELLHEADER_IDWELL = load.idwell \n            and VWWIA.GL_ACCOUNT = load.code3\n            and VWWIA.JOBAFE_IDREC = load.idrecparent   \n            and coalesce(load.invoicerefno, 'UNKNOWN') = 'UNKNOWN'\nWHERE  \n    INVOICE_NUM IS NULL\n    AND load.idrec is null \nGROUP BY\n    VWWIA.WELLHEADER_IDWELL,\n    VWWIA.JOBAFE_IDREC,\n    VWWIA.GL_ACCOUNT_DESC,\n    VWWIA.GL_ACCOUNT,\n    VWWIA.INVOICE_DATE,\n    VWWIA.INVOICE_NUM,\n    VWWIA.BUSINESS_ASSOCIATE_NAME,\n    VWWIA.BUSINESS_ASSOCIATE_ID\n;    "
