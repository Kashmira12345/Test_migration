          VIEW_WVIEW_WBS_INVOICE_ACTUALS: a1bfdd74-2764-00fd-1109-7d28b5b3452b
        customSQL:
          customSQL: "CREATE OR REPLACE VIEW WS_STAGE_DT.STAGE_WVIEW_WELL_INVOICE_ACTUALS_PUT_DATA_CTE AS\nSELECT\n    WELLHEADER_IDWELL as \"idwell\",\n    load.idrec as \"idrec\",\n    sum(wvInvoiceCost.amount) as \"idrec_amount\",\n    sum(CAD_AMT_FLPD) as \"amount\"  \nFROM\n    WS_EDW.VIEW_WVIEW_WBS_INVOICE_ACTUALS VWWIA\n    LEFT JOIN MAT_LOAD.LOAD_WVIEW_WVJOBAFEFINALINVOICECOST_RTN load on \n        VWWIA.WELLHEADER_IDWELL = load.idwell \n        and VWWIA.GL_ACCOUNT = load.code3\n        and VWWIA.JOBAFE_IDREC = load.idrecparent   \n        and coalesce(VWWIA.BUSINESS_ASSOCIATE_ID, 'UNKNOWN') = coalesce(load.vendorcode, 'UNKNOWN') \n        and coalesce(VWWIA.INVOICE_NUM, 'UNKNOWN') = coalesce(load.invoicerefno, 'UNKNOWN')\n    LEFT JOIN DS_WELLVIEW.WVT_WVJOBAFEFINALINVOICECOST wvInvoiceCost ON\n        load.idrec = wvInvoiceCost.idrec\nWHERE  \n    VWWIA.GL_ACCOUNT <> '600020'\n    AND load.idrec is not null \nGROUP BY\n    VWWIA.WELLHEADER_IDWELL,\n    load.idrec\n;"
        dependencies:
          - locationName: DATA_STORE
            nodeName: ODS_WVIEW_WVT_WVJOBAFEFINALINVOICECOST
          - locationName: EDW
            nodeName: VIEW_WVIEW_WBS_INVOICE_ACTUALS
