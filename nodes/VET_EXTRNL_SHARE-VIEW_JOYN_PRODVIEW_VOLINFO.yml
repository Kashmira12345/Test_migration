            FROM {{ ref_no_link('VET_EXTRNL_SHARE','VIEW_JOYN_PRODVIEW_VOLINFO') }} "VIEW_JOYN_PRODVIEW_VOLINFO"
        name: VIEW_JOYN_PRODVIEW_VOLINFO
        noLinkRefs: []
