    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE SECURE VIEW [TABLEOWNER].[VIEW_JOYN_PRODVIEW_VOLINFO] AS\r\nWITH \r\nlast_prod AS (\r\n    SELECT MAX(d.dttm) AS lp_date,\r\n        MAX(u.idrec) AS idrec\r\n    FROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitallocmonthday] d\r\n        INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunit] u ON u.idrec = d.idrecunit\r\n        AND u.DSS_CURRENT_FLAG = 'Y' AND u.DSS_DELETE_FLAG != 'Y'\r\n        INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvflownetheader] h ON h.idflownet = d.idflownet\r\n        AND h.DSS_CURRENT_FLAG = 'Y' AND h.DSS_DELETE_FLAG != 'Y'\r\n    WHERE (\r\n            d.volprodgathgas + d.volprodgathwater + d.volprodgathhcliq\r\n        ) > 0\r\n        AND h.usertxt1 = 'CANADA'\r\n        AND d.DSS_CURRENT_FLAG = 'Y' AND d.DSS_DELETE_FLAG != 'Y'\r\n    GROUP BY u.idrec\r\n),\r\nAvgs AS (\r\n    SELECT AVG(a.volprodgathhcliq) Gath_Avg_Oil,\r\n    CASE\r\n        WHEN m.flowdirection = 'injection' THEN AVG(a.volinjectwater)\r\n        ELSE AVG(a.volprodgathwater)\r\n    END AS Gath_Avg_Water,\r\n    AVG(a.volprodgathgas) / 1000 Gath_Avg_Gas,\r\n    AVG(a.volprodgathhcliq) * 6.29 AS Gath_Avg_Oil_BOE,\r\n    AVG(a.volprodgathgas) / 1000 * 5.88 AS Gath_Avg_Gas_BOE,\r\n    (AVG(a.volprodgathhcliq) * 6.29) + (AVG(a.volprodgathgas) / 1000 * 5.88) AS Gath_Avg_BOE,\r\n    AVG(a.volprodallocoil) Alloc_Avg_Oil,\r\n    CASE\r\n        WHEN m.flowdirection = 'injection' THEN AVG(a.volinjectwater)\r\n        ELSE AVG(a.volprodallocwater)\r\n    END AS Alloc_Avg_Water,\r\n    AVG(a.volprodallocgas) / 1000 Alloc_Avg_Gas,\r\n    AVG(a.volprodallocoil) * 6.29 AS Alloc_Avg_Oil_BOE,\r\n    AVG(a.volprodallocgas) / 1000 * 5.88 AS Alloc_Avg_Gas_BOE,\r\n    (AVG(a.volprodallocoil) * 6.29) + (AVG(a.volprodallocgas) / 1000 * 5.88) AS Alloc_Avg_BOE,\r\n    a.idrecunit AS avgidrec\r\n    FROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitallocmonthday] a\r\n        INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVUNITCOMPMEASMETH] m ON m.idrec = a.idrecmeasmeth\r\n        AND m.DSS_CURRENT_FLAG = 'Y' AND m.DSS_DELETE_FLAG != 'Y'\r\n    WHERE a.dttm >= ADD_MONTHS(CURRENT_DATE(), -6)\r\n        AND a.DSS_CURRENT_FLAG = 'Y' AND a.DSS_DELETE_FLAG != 'Y'\r\n    GROUP BY a.idrecunit,\r\n        m.flowdirection\r\n)\r\nSELECT\r\n    u.idrec AS Well_IDREC,\r\n    CAST(lp.lp_date AS date) AS Last_Prod_Date,\r\n    c.wellname AS UWI,\r\n    CAST(a.dttm AS date) AS Curr_Prod_Date,\r\n    a.durdown * 24 AS Downtime_Hours,\r\n    a.durop * 24 AS Operating_Hours,\r\n    a.wihcliq * 100 AS WI,\r\n    CASE\r\n        WHEN m.flowdirection = 'production' THEN a.volprodgathwater\r\n        WHEN m.flowdirection = 'injection' THEN a.volinjectwater\r\n        ELSE a.volprodgathwater\r\n    END AS Gath_Water_M3,\r\n    a.volprodgathhcliq AS Gath_Oil_M3,\r\n    a.volprodgathgas / 1000 AS Gath_Gas_E3M3,\r\n    a.volprodgathhcliq * 6.29 AS Gath_Oil_BOE,\r\n    a.volprodgathgas / 1000 * 5.88 AS Gath_Gas_BOE,\r\n    (a.volprodgathhcliq * 6.29) + (a.volprodgathgas / 1000 * 5.88) AS Gath_BOE,\r\n    av.Gath_Avg_Oil,\r\n    av.Gath_Avg_Water,\r\n    av.Gath_Avg_Gas,\r\n    av.Gath_Avg_Oil_BOE,\r\n    av.Gath_Avg_Gas_BOE,\r\n    av.Gath_Avg_BOE,\r\n    av.Alloc_Avg_Oil,\r\n    av.Alloc_Avg_Water,\r\n    av.Alloc_Avg_Gas,\r\n    av.Alloc_Avg_Oil_BOE,\r\n    av.Alloc_Avg_Gas_BOE,\r\n    av.Alloc_Avg_BOE,\r\n    fl.jointstofluid AS JTF,\r\n    fl.jointsinhole AS JIH\r\nFROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitallocmonthday] a\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcomp] c ON c.idrec = a.idreccomp AND c.DSS_CURRENT_FLAG='Y' AND c.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunit] u ON u.idrec = a.idrecunit AND u.DSS_CURRENT_FLAG='Y' AND u.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvroutesetroute] r ON r.idrec = u.idrecroutesetroutecalc AND r.DSS_CURRENT_FLAG='Y' AND r.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVFACILITY] f ON f.idrec = a.idrecfacility AND f.DSS_CURRENT_FLAG='Y' AND f.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] h ON h.idflownet = u.idflownet AND h.DSS_CURRENT_FLAG='Y'
            AND h.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcompmeasmeth] m ON m.idrec = a.idrecmeasmeth AND m.DSS_CURRENT_FLAG='Y' AND m.DSS_DELETE_FLAG!='Y'\r\nLEFT JOIN last_prod lp ON lp.idrec = u.idrec\r\nLEFT JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcompfluidlevel] fl ON fl.idrec = a.idrecfluidlevel AND fl.DSS_CURRENT_FLAG='Y' AND fl.DSS_DELETE_FLAG!='Y'\r\nINNER JOIN AVGS av ON av.avgidrec = a.idrecunit\r\nWHERE a.dttm >= DATEADD(day, -31, CAST(getdate() AS date))\r\n    AND a.dttm <= DATEADD(day, -2, CAST(getdate() AS date))\r\n    AND h.usertxt2 = 'SOUTHEAST SASKATCHEWAN'\r\n    AND a.DSS_CURRENT_FLAG = 'Y' AND a.DSS_DELETE_FLAG != 'Y'\r\n\r\n"
        dependencies:
          - locationName: ''
            nodeName: ''
