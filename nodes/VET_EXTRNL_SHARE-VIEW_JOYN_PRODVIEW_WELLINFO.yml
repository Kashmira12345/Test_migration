    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: "CREATE OR REPLACE SECURE VIEW [TABLEOWNER].[VIEW_JOYN_PRODVIEW_WELLINFO] AS\r\nWITH surf_equip AS (\r\nSELECT e.make,\r\n    e.model,\r\n    e.typ,\r\n    e.exportid2 HP,\r\n    e.idrecparent\r\nFROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitequip] e\r\nWHERE e.typ IN ('ESP', 'JACK', 'PCP')\r\n    AND e.DSS_CURRENT_FLAG = 'Y'\r\n    AND e.DSS_DELETE_FLAG != 'Y'\r\n),\r\nlast_prod AS (\r\nSELECT MAX(d.dttm) AS lp_date,\r\n    MAX(u.idrec) AS idrec\r\nFROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitallocmonthday] d\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunit] u ON u.idrec = d.idrecunit\r\n    AND u.DSS_CURRENT_FLAG = 'Y'\r\n    AND u.DSS_DELETE_FLAG != 'Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvflownetheader] h ON h.idflownet = d.idflownet\r\n    AND h.DSS_CURRENT_FLAG = 'Y'\r\n    AND h.DSS_DELETE_FLAG != 'Y'\r\nWHERE (\r\n        d.volprodgathgas + d.volprodgathwater + d.volprodgathhcliq\r\n    ) > 0\r\n    AND h.usertxt1 = 'CANADA'\r\n    AND d.DSS_CURRENT_FLAG = 'Y'\r\n    AND d.DSS_DELETE_FLAG != 'Y'\r\nGROUP BY u.idrec\r\n)\r\nSELECT DISTINCT\r\n    u.idrec Well_IDREC\r\n    , CAST(lp.lp_date AS date) AS Last_Prod_Date\r\n    , c.wellname AS UWI\r\n    , c.completionname AS Well_Name\r\n    , u.costcenterida AS Cost_Center\r\n    , u.area AS Core_Area\r\n    , u.field AS Area\r\n    , u.district AS Province\r\n    , r.usertxt1 AS Foreman\r\n    , r.name AS Run_Name\r\n    , f.name AS Facility\r\n    , u.latitude AS latitude\r\n    , u.longitude AS longitude\r\n    , u.legalsurfloc AS Surface_Location\r\n    , CASE WHEN m.flowdirection = 'production' AND m.methodhcliq = 'unit balance with wellhead cut' THEN 'SWB'\r\n            WHEN m.flowdirection = 'production' THEN 'Producing'\r\n            WHEN m.flowdirection = 'injection' THEN 'Injecting' ELSE NULL END AS Well_Type\r\n    , se.typ AS Surface_Equipment_Type\r\n    , se.model AS Surface_Equipment_Model\r\n    , se.make AS Surface_Equipment_Make\r\n    , se.HP AS Surface_Equipment_HP\r\n    , CASE WHEN a.idrecpumpentrytk = 'pvunitcomppumppcpentry' THEN 'PCP'\r\n            WHEN a.idrecpumpentrytk = 'pvunitcomppumpespentry' THEN 'ESP'\r\n            WHEN a.idrecpumpentrytk = 'pvunitcomppumprodentry' THEN 'Rod Pump' \r\n            WHEN a.idrecpumpentrytk = 'pvunitcomppumpjetentry' THEN 'Jet Pump' ELSE NULL END AS Pump_Type\r\n    , fl.jointstofluid AS JTF\r\n    , fl.jointsinhole AS JIH\r\nFROM [TABLEOWNER].[ODS_PVIEW_PVT_pvunitallocmonthday] a\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcomp] c ON c.idrec = a.idreccomp AND c.DSS_CURRENT_FLAG='Y' AND c.DSS_DELETE_FLAG!='Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunit] u ON u.idrec = a.idrecunit AND u.DSS_CURRENT_FLAG='Y' AND u.DSS_DELETE_FLAG!='Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvroutesetroute] r ON r.idrec = u.idrecroutesetroutecalc AND r.DSS_CURRENT_FLAG='Y' AND r.DSS_DELETE_FLAG!='Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVFACILITY] f ON f.idrec = a.idrecfacility AND f.DSS_CURRENT_FLAG='Y' AND f.DSS_DELETE_FLAG!='Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_PVFLOWNETHEADER] h ON h.idflownet = u.idflownet AND h.DSS_CURRENT_FLAG='Y' AND h.DSS_DELETE_FLAG!='Y'\r\n    INNER JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcompmeasmeth] m ON m.idrec = a.idrecmeasmeth AND m.DSS_CURRENT_FLAG='Y' AND m.DSS_DELETE_FLAG!='Y'\r\n    LEFT JOIN surf_equip se ON se.idrecparent = u.idrec\r\n    LEFT JOIN last_prod lp ON lp.idrec = u.idrec\r\n    LEFT JOIN [TABLEOWNER].[ODS_PVIEW_PVT_pvunitcompfluidlevel] fl ON fl.idrec = a.idrecfluidlevel AND fl.DSS_CURRENT_FLAG='Y' AND fl.DSS_DELETE_FLAG!='Y'\r\nWHERE \r\n    h.usertxt2 = 'SOUTHEAST SASKATCHEWAN'\r\n    AND a.DSS_CURRENT_FLAG='Y' AND a.DSS_DELETE_FLAG!='Y' "
        dependencies:
          - locationName: ''
            nodeName: ''
        join:
          joinCondition: |-
            FROM {{ ref_no_link('VET_EXTRNL_SHARE','VIEW_JOYN_PRODVIEW_WELLINFO') }} "VIEW_JOYN_PRODVIEW_WELLINFO"
